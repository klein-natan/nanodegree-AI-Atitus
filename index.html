<template class="pagina" data-id="llm-do-zero/aula-10-como-funciona-um-llm" data-titulo="Aula 10 — Como Funciona um LLM" data-descricao="O embedding, a atenção, o bloco transformer e o modelo inteiro">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>
<p>Você vai entender o caminho inteiro dentro de um modelo de linguagem: o
token vira um vetor que carrega sentido, a atenção deixa cada posição olhar
para trás, e um bloco repetido quatro vezes transforma isso numa previsão.
No fim, você monta o seu próprio LLM em Keras, com 809.728 pesos, e vê ele
escrever com os pesos treinados do professor.</p>
</div></div>
<h2 id="onde-estamos">Onde estamos<a class="ancora" href="#onde-estamos" aria-label="Link para esta secao">#</a></h2>
<figure><img src="docs/assets/aula-10/mapa.png" alt="Três quadros lado a lado, um por aula: do texto para números, como funciona por dentro, treinar e usar. O segundo está aceso"><figcaption>A Aula 9 entregou uma fila de números. Esta aula abre a máquina que recebe esses números.</figcaption></figure>

<p>A Aula 9 terminou com o texto virando uma fila de números. Esta aula abre
o modelo que recebe essa fila. São três partes, e cada uma vira um
exercício: o token vira um vetor, a atenção deixa cada posição consultar
as anteriores, e o bloco transformer, repetido, faz a previsão.</p>
<h2 id="o-token-vira-vetor">O token vira vetor<a class="ancora" href="#o-token-vira-vetor" aria-label="Link para esta secao">#</a></h2>
<p>O número de um token não é uma quantidade. O token 600 não vale oito vezes
o token 79: os números são só a ordem em que o BPE criou cada peça. O
número é um <strong>endereço</strong>.</p>
<p>O modelo guarda uma tabela com uma linha por token (1.024 linhas) e 128
colunas. Cada token é trocado pela sua linha, uma lista de 128 números
chamada <strong>embedding</strong>. No Keras, a tabela inteira é uma camada:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Embedding</span><span class="p">(</span><span class="mi">1024</span><span class="p">,</span> <span class="mi">128</span><span class="p">)</span>   <span class="c1"># 1.024 tokens, 128 números cada</span>
</code></pre></div>
<p>São 131.072 pesos, que o treino ajusta como quaisquer outros. Um lote de
32 janelas de 128 tokens entra com formato <code>[32, 128]</code> e sai com formato
<code>[32, 128, 128]</code>: cada token virou um vetor.</p>
<h2 id="o-que-esses-numeros-querem-dizer">O que esses números querem dizer<a class="ancora" href="#o-que-esses-numeros-querem-dizer" aria-label="Link para esta secao">#</a></h2>
<p>No começo do treino, a tabela é sorteada, e os vetores não significam
nada. O treino mexe em cada número dela para a previsão melhorar. No fim,
tokens que aparecem em lugares parecidos do texto acabam com vetores
parecidos. Ninguém ensina gramática ao modelo: ele descobre sozinho que
<code>·dous</code> e <code>·tres</code> fazem o mesmo papel, porque aparecem nos mesmos lugares.</p>
<figure><video src="docs/assets/aula-10/embeddings.mp4" poster="docs/assets/aula-10/embeddings.jpg" controls preload="none" playsinline aria-label="Animação em 3D dos embeddings: os pontos começam misturados e, depois do treino, as palavras de cada grupo se juntam"></video><figcaption>Os embeddings do modelo treinado, espremidos de 128 para 3 números. No começo as cores se misturam; depois do treino, cada grupo se junta.</figcaption></figure>

<p>Os 128 números não cabem num desenho, então a animação espreme os 128 em
3, com a mesma PCA da Aula 3. Alguma coisa se perde no aperto, e mesmo
assim os grupos aparecem: números com números, pessoas com pessoas,
verbos com verbos, partes do corpo com partes do corpo.</p>
<figure><img src="docs/assets/aula-10/embedding_3d.png" alt="Dois gráficos 3D do mesmo espaço, vistos de ângulos diferentes, com cinco grupos de palavras coloridos: números, pessoas, verbos, corpo e conectivos, cada grupo formando uma nuvem própria"><figcaption>O mesmo espaço, de dois lados. As palavras de cada cor ficam juntas.</figcaption></figure>

<h2 id="parecido-quer-dizer-apontar-para-o-mesmo-lado">Parecido quer dizer apontar para o mesmo lado<a class="ancora" href="#parecido-quer-dizer-apontar-para-o-mesmo-lado" aria-label="Link para esta secao">#</a></h2>
<p>Para medir se dois vetores são parecidos, o modelo olha se eles apontam
para o mesmo lado. A medida se chama <strong>similaridade do cosseno</strong>:</p>
<div class="formula" title="\text{similaridade}(a, b) = \frac{a \cdot b}{\lVert a \rVert \, \lVert b \rVert}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>similaridade</mtext><mo stretchy="false">&#x00028;</mo><mi>a</mi><mo>&#x0002C;</mo><mi>b</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0003D;</mo><mfrac><mrow><mi>a</mi><mo>&#x000B7;</mo><mi>b</mi></mrow><mrow><mo>&#x02016;</mo><mi>a</mi><mo>&#x02016;</mo><mspace width="0.167em" /><mo>&#x02016;</mo><mi>b</mi><mo>&#x02016;</mo></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>a · b</code></td>
  <td>o produto escalar: multiplique casa com casa e some</td>
</tr>
<tr>
  <td><code>‖a‖</code></td>
  <td>o tamanho do vetor <code>a</code></td>
</tr>
<tr>
  <td>o resultado</td>
  <td>1 se apontam para o mesmo lado, 0 se são perpendiculares</td>
</tr>
</tbody>
</table></div>
<p>Exemplo com dois números por vetor. <code>a = (3, 4)</code> e <code>b = (6, 8)</code>: o produto
é <code>18 + 32 = 50</code>, os tamanhos são 5 e 10, e a similaridade é
<code>50 / 50 = 1</code>. Mesmo lado, só que <code>b</code> é maior. Com <code>c = (4, −3)</code>, o produto
com <code>a</code> é <code>12 − 12 = 0</code>: perpendiculares, nada em comum.</p>
<p>No modelo treinado do curso, os vizinhos mais próximos de alguns tokens
são estes:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Token</th>
  <th>Os mais parecidos (similaridade)</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>·elle</code></td>
  <td><code>·ella</code> (0,71), <code>·isso</code>, <code>·Helena</code>, <code>·Rubião</code></td>
</tr>
<tr>
  <td><code>·dous</code></td>
  <td><code>·duas</code> (0,55), <code>·tres</code> (0,55), <code>·outros</code>, <code>·alguns</code></td>
</tr>
<tr>
  <td><code>·era</code></td>
  <td><code>·Era</code> (0,77), <code>·fosse</code>, <code>·foi</code>, <code>·eram</code></td>
</tr>
<tr>
  <td><code>·olhos</code></td>
  <td><code>·mão</code> (0,54), <code>·cabeça</code>, <code>·mãos</code></td>
</tr>
<tr>
  <td><code>·quando</code></td>
  <td><code>·porque</code> (0,57), <code>·onde</code>, <code>·que</code></td>
</tr>
</tbody>
</table></div>
<p>Repare que os vizinhos não são sinônimos: são palavras que <strong>fazem o mesmo
papel</strong> na frase. É exatamente o que um modelo que prevê a próxima palavra
precisa saber.</p>
<h2 id="o-exemplo-de-treino">O exemplo de treino<a class="ancora" href="#o-exemplo-de-treino" aria-label="Link para esta secao">#</a></h2>
<p>O modelo aprende prevendo o próximo token. Então o exemplo de treino é a
própria frase, andada uma casa:</p>
<figure><img src="docs/assets/aula-09/janela.png" alt="Duas fileiras de oito tokens: em cima a entrada, embaixo o alvo, que é a mesma sequência começando um token depois, com uma seta ligando cada entrada ao seu alvo"><figcaption>Entrada e alvo são o mesmo texto, com uma casa de diferença.</figcaption></figure>

<p>Repare no detalhe que faz a coisa toda ser barata: nove tokens de texto
não dão <strong>um</strong> exemplo de treino. Dão oito. O modelo prevê o token 2
olhando o 1, prevê o 3 olhando o 1 e o 2, e assim por diante, tudo na
mesma passada.</p>
<p>Um <strong>lote</strong> junta 32 janelas de 128 tokens, sorteadas do texto de treino:
4.096 previsões de uma vez. O tamanho da janela tem nome, <strong>janela de
contexto</strong>: é o quanto o modelo consegue olhar para trás. A nossa tem 128
tokens, uns 300 caracteres. Os modelos comerciais estão na casa das
centenas de milhares.</p>
<figure><video src="docs/assets/aula-09/janela.mp4" poster="docs/assets/aula-09/janela.jpg" controls preload="none" playsinline aria-label="Animação da janela de treino, da janela de contexto e do lote"></video><figcaption>Cada posição prevê a seguinte, a janela anda pelo texto, e várias janelas formam um lote.</figcaption></figure>

<p>Os primeiros 90% dos tokens são para treinar. Os últimos 10% ficam
guardados, e o modelo nunca treina neles: é o conjunto de validação, que
diz se o modelo aprendeu português ou decorou o livro.</p>
<h2 id="a-perda">A perda<a class="ancora" href="#a-perda" aria-label="Link para esta secao">#</a></h2>
<p>Para cada previsão, a perda olha a chance que o modelo deu ao token que de
fato veio. É a mesma entropia cruzada das Aulas 3 e 8, e o Keras calcula
por você:</p>
<div class="formula" title="\text{perda} = -\frac{1}{n}\sum_{i=1}^{n} \log P(\text{token certo}_i)"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>perda</mtext><mo>&#x0003D;</mo><mo>&#x02212;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mi>log</mi><mi>P</mi><mo stretchy="false">&#x00028;</mo><msub><mtext>token&#x000A0;certo</mtext><mi>i</mi></msub><mo stretchy="false">&#x00029;</mo></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>n</code></td>
  <td>quantas previsões o modelo fez</td>
</tr>
<tr>
  <td><code>P(token certo)</code></td>
  <td>a chance que o modelo deu ao token que de fato veio</td>
</tr>
<tr>
  <td><code>log</code></td>
  <td>o logaritmo natural, que castiga com força a chance baixa na resposta certa</td>
</tr>
</tbody>
</table></div>
<p>Exemplo com três previsões. O modelo deu 50%, 25% e 10% ao token certo.
Os logaritmos, com o sinal trocado, são 0,69, 1,39 e 2,30. A média é
(0,69 + 1,39 + 2,30) / 3 = 1,46.</p>
<figure><img src="docs/assets/aula-09/log_perda.png" alt="Curva decrescente da perda em função da chance dada ao token certo: vale 0 quando a chance é 1, 0,69 em 0,5, 1,39 em 0,25, 2,30 em 0,1, e sobe até 6,93 quando a chance é 1 em 1024, disparando perto de zero"><figcaption>Certeza no token certo custa zero. Chance quase nula custa caro.</figcaption></figure>

<p>Um modelo que chuta igual entre 1.024 tokens dá 1/1024 a cada um, e a
perda dele é <code>ln(1024) = 6,93</code>. É dali que todo treino começa.</p>
<h2 id="a-atencao-o-problema">A atenção: o problema<a class="ancora" href="#a-atencao-o-problema" aria-label="Link para esta secao">#</a></h2>
<p>Leia esta frase e complete a última palavra:</p>
<figure><img src="docs/assets/aula-10/olhar_para_tras.png" alt="Uma frase de 25 palavras em duas linhas, sobre a casa de Capitú e uma janela, com quatro palavras destacadas e setas ligando a lacuna no fim a cada uma delas"><figcaption>Para completar a última palavra, o modelo precisa voltar mais de vinte palavras.</figcaption></figure>

<p>Você completou sem esforço, porque leu a frase inteira e reteve as quatro
palavras que importam. O modelo precisa fazer o mesmo. Olhar só as últimas
palavras perde o que está longe. Somar todas por igual afoga &quot;Capitú&quot; no
meio de &quot;de&quot;, &quot;uma&quot; e &quot;para&quot;.</p>
<p>A resposta é deixar cada posição <strong>escolher</strong> para onde olhar, com pesos
que o treino ajusta. Isso se chama <strong>atenção</strong> (<em>attention</em>), e é a única
peça de um transformer em que uma posição vê as outras.</p>
<h2 id="os-tres-papeis">Os três papéis<a class="ancora" href="#os-tres-papeis" aria-label="Link para esta secao">#</a></h2>
<p>Cada token ganha três vetores, obtidos multiplicando o embedding dele por
três tabelas de pesos:</p>
<figure><img src="docs/assets/aula-10/qkv.png" alt="Três blocos lado a lado: Pergunta (Q), Etiqueta (K) e Conteúdo (V), cada um com uma frase explicando o papel"><figcaption>A mesma palavra, vista de três jeitos. O treino ajusta as três tabelas de pesos.</figcaption></figure>

<p>Pense numa biblioteca. Você chega com uma <strong>pergunta</strong> (o Q da posição
atual). Cada livro tem uma <strong>etiqueta</strong> na lombada (o K de cada posição
anterior). Você compara a sua pergunta com todas as etiquetas e lê o
<strong>conteúdo</strong> (o V) dos livros que combinam mais. A diferença para a
biblioteca de verdade: você não escolhe um livro só. Você lê todos, em
proporções diferentes.</p>
<div class="formula" title="q = x\,W_Q \qquad k = x\,W_K \qquad v = x\,W_V"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>q</mi><mo>&#x0003D;</mo><mi>x</mi><mspace width="0.167em" /><msub><mi>W</mi><mi>Q</mi></msub><mspace width="2em" /><mi>k</mi><mo>&#x0003D;</mo><mi>x</mi><mspace width="0.167em" /><msub><mi>W</mi><mi>K</mi></msub><mspace width="2em" /><mi>v</mi><mo>&#x0003D;</mo><mi>x</mi><mspace width="0.167em" /><msub><mi>W</mi><mi>V</mi></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>x</code></td>
  <td>o vetor do token, que sai do embedding</td>
</tr>
<tr>
  <td><code>W_Q</code>, <code>W_K</code>, <code>W_V</code></td>
  <td>as três tabelas de pesos que o treino ajusta</td>
</tr>
<tr>
  <td><code>q</code>, <code>k</code>, <code>v</code></td>
  <td>a pergunta, a etiqueta e o conteúdo do token</td>
</tr>
</tbody>
</table></div>
<p>Por que três tabelas, e não o embedding direto? Porque &quot;parecido&quot; no
embedding quer dizer &quot;faz o mesmo papel&quot;. Um verbo não precisa procurar
outros verbos: precisa procurar o <strong>sujeito</strong> dele. As tabelas deixam o
treino decidir que tipo de relação cada pergunta procura.</p>
<h2 id="a-conta">A conta<a class="ancora" href="#a-conta" aria-label="Link para esta secao">#</a></h2>
<div class="formula" title="\text{Atenção}(Q, K, V) = \text{softmax}\!\left(\frac{Q K^{\top}}{\sqrt{d}}\right) V"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>Atenção</mtext><mo stretchy="false">&#x00028;</mo><mi>Q</mi><mo>&#x0002C;</mo><mi>K</mi><mo>&#x0002C;</mo><mi>V</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0003D;</mo><mtext>softmax</mtext><mspace width="negativethinmathspace" /><mrow><mo stretchy="true" fence="true" form="prefix">&#x00028;</mo><mfrac><mrow><mi>Q</mi><msup><mi>K</mi><mrow><mo>&#x022A4;</mo></mrow></msup></mrow><mrow><msqrt><mrow><mi>d</mi></mrow></msqrt></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">&#x00029;</mo></mrow><mi>V</mi></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>Q Kᵀ</code></td>
  <td>todos os produtos escalares de todas as perguntas com todas as etiquetas</td>
</tr>
<tr>
  <td><code>√d</code></td>
  <td>a raiz do tamanho dos vetores, que segura o tamanho dos números</td>
</tr>
<tr>
  <td><code>softmax</code></td>
  <td>transforma cada linha de números em pesos que somam 100%</td>
</tr>
<tr>
  <td><code>V</code></td>
  <td>os conteúdos, misturados com esses pesos</td>
</tr>
</tbody>
</table></div>
<p>Exemplo com três tokens, &quot;o gato dorme&quot;, e vetores de 4 números. A
pergunta de <code>dorme</code> comparada com as etiquetas dos três tokens dá 0, 4 e 2.
Dividindo pela raiz de 4: 0, 2 e 1. A softmax transforma isso em <strong>9%, 67%
e 24%</strong>. A saída de <code>dorme</code> é a mistura dos três conteúdos com esses
pesos: dois terços de <code>gato</code>. O token deixou de ser só ele mesmo e virou
ele mesmo <strong>mais o contexto</strong>.</p>
<p>A divisão pela raiz de <code>d</code> existe porque vetores maiores dão produtos
maiores, e números grandes fazem a softmax virar tudo ou nada: a softmax
de (0, 20, 10) é praticamente (0%, 100%, 0%). Com os pesos colados no zero
e no um, o treino para de aprender.</p>
<h2 id="a-mascara-nao-vale-olhar-a-resposta">A máscara: não vale olhar a resposta<a class="ancora" href="#a-mascara-nao-vale-olhar-a-resposta" aria-label="Link para esta secao">#</a></h2>
<p>Se cada posição olha todas as outras, a posição 3 olha a posição 4, que é
justamente o token que ela deveria prever.</p>
<figure><img src="docs/assets/aula-10/mascara.png" alt="Duas matrizes de atenção lado a lado, em porcentagem: à esquerda todos os pesos preenchidos, à direita só o triângulo inferior, com o resto em branco"><figcaption>À esquerda o modelo cola. À direita, cada linha só enxerga o que veio antes dela.</figcaption></figure>

<p>A correção é a <strong>máscara causal</strong>: antes da softmax, todos os produtos
que apontam para o futuro viram menos infinito. A softmax eleva <code>e</code> a
cada número, e <code>e</code> elevado a menos infinito é zero:</p>
<div class="formula" title="\text{softmax}(1,\; 2,\; -\infty) = (27\%,\; 73\%,\; 0\%)"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>softmax</mtext><mo stretchy="false">&#x00028;</mo><mn>1</mn><mo>&#x0002C;</mo><mspace width="0.278em" /><mn>2</mn><mo>&#x0002C;</mo><mspace width="0.278em" /><mo>&#x02212;</mo><mo>&#x0221E;</mo><mo stretchy="false">&#x00029;</mo><mo>&#x0003D;</mo><mo stretchy="false">&#x00028;</mo><mn>27</mn><mi>&#x00025;</mi><mo>&#x0002C;</mo><mspace width="0.278em" /><mn>73</mn><mi>&#x00025;</mi><mo>&#x0002C;</mo><mspace width="0.278em" /><mn>0</mn><mi>&#x00025;</mi><mo stretchy="false">&#x00029;</mo></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>1</code>, <code>2</code></td>
  <td>os produtos com duas posições do passado</td>
</tr>
<tr>
  <td><code>−∞</code></td>
  <td>o produto com uma posição do futuro, apagado pela máscara</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: <code>e¹ = 2,72</code>, <code>e² = 7,39</code> e <code>e^(−∞) = 0</code>. A soma é 10,11.
Divididos por ela: 27%, 73% e 0%. O futuro some da mistura.</p>
<figure><video src="docs/assets/aula-10/mascara.mp4" poster="docs/assets/aula-10/mascara.jpg" controls preload="none" playsinline aria-label="Animação da máscara causal numa matriz de atenção"></video><figcaption>O futuro vira −∞, a softmax transforma em 0%, e cada linha só olha para trás.</figcaption></figure>

<h2 id="quatro-cabecas-quatro-olhares">Quatro cabeças, quatro olhares<a class="ancora" href="#quatro-cabecas-quatro-olhares" aria-label="Link para esta secao">#</a></h2>
<p>Uma atenção só tem um jeito de perguntar. O modelo roda quatro em
paralelo, cada uma com as suas três tabelas, e junta os resultados. Cada
uma se chama <strong>cabeça</strong> (<em>head</em>). Como o vetor tem 128 números, cada
cabeça trabalha com 32, e as quatro saídas lado a lado voltam a ser 128.</p>
<p>No Keras, tudo isso (as tabelas Q, K e V das quatro cabeças, a conta, a
máscara e a mistura final) é uma camada pronta:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">atencao</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">MultiHeadAttention</span><span class="p">(</span><span class="n">num_heads</span><span class="o">=</span><span class="mi">4</span><span class="p">,</span> <span class="n">key_dim</span><span class="o">=</span><span class="mi">32</span><span class="p">)</span>
<span class="n">saida</span> <span class="o">=</span> <span class="n">atencao</span><span class="p">(</span><span class="n">x</span><span class="p">,</span> <span class="n">x</span><span class="p">,</span> <span class="n">use_causal_mask</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
</code></pre></div>
<p>O <code>x</code> aparece duas vezes porque as perguntas e as etiquetas saem do mesmo
texto. O <code>use_causal_mask=True</code> liga a máscara.</p>
<figure><img src="docs/assets/aula-10/mapa_atencao.png" alt="Dois mapas de atenção grandes, com os tokens da frase nos dois eixos, mostrando padrões diferentes e todo o canto superior direito em branco"><figcaption>Cada linha é uma posição prevendo. Cada coluna é para onde ela olhou.</figcaption></figure>

<p>Duas coisas para reparar no modelo treinado. O canto de cima à direita é
todo branco: é a máscara funcionando. E cada cabeça olha para lugares
diferentes. Na camada 1, a cabeça 2 olha quase só para o token anterior.
Na camada 4, os pedaços de &quot;janela&quot; (<code>·j</code>, <code>an</code>, <code>el</code>, <code>a</code>) olham para o
<code>·uma</code> que veio antes deles: é o modelo juntando a palavra cortada pelo
BPE com o artigo dela.</p>
<figure><img src="docs/assets/aula-10/cabecas.png" alt="Oito mapas de atenção em duas linhas: quatro cabeças da camada 1 e quatro da camada 4, cada uma com um padrão diferente"><figcaption>As oito cabeças, na mesma frase. Nenhuma faz o que a outra faz.</figcaption></figure>

<p>Ninguém programou essa divisão de trabalho: ela sai do treino.</p>
<h2 id="a-posicao">A posição<a class="ancora" href="#a-posicao" aria-label="Link para esta secao">#</a></h2>
<p>Falta uma coisa. Nada na conta da atenção diz <strong>onde</strong> cada token está:
embaralhe a frase e cada token recebe a mesma mistura. &quot;O gato mordeu o
cachorro&quot; e &quot;o cachorro mordeu o gato&quot; seriam a mesma coisa.</p>
<p>A solução é uma segunda tabela, com uma linha por <strong>posição</strong> da janela
(128 linhas de 128 números). Cada token entra no modelo como a soma de
dois vetores: o do token e o da posição em que ele está.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">x</span> <span class="o">=</span> <span class="n">embedding_do_token</span><span class="p">(</span><span class="n">ids</span><span class="p">)</span> <span class="o">+</span> <span class="n">embedding_da_posicao</span><span class="p">(</span><span class="n">posicoes</span><span class="p">)</span>
</code></pre></div>
<p>A tabela das posições também é aprendida no treino. Depois dela, <code>gato</code>
na posição 2 e <code>gato</code> na posição 5 são vetores diferentes, e a atenção
consegue saber quem veio antes de quem.</p>
<h2 id="o-preco-da-janela">O preço da janela<a class="ancora" href="#o-preco-da-janela" aria-label="Link para esta secao">#</a></h2>
<p>Para uma janela de <code>n</code> tokens, cada cabeça calcula <code>n × n</code> produtos.
Dobrar a janela quadruplica a conta: são 16.384 produtos para os nossos
128 tokens, 1 milhão para 1.000 tokens e 10 bilhões para 100.000. É por
isso que janela grande é caro, e por que cada modelo novo anuncia a dele.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Esquecer a máscara. O modelo treina lindamente, a perda cai para quase
zero, e você comemora. Na hora de gerar texto, ele não tem mais o futuro
para copiar, e a saída vira lixo. Um teste pega o erro na hora: troque
<strong>só a última palavra</strong> da frase. Se a saída de alguma posição anterior
mudar, ela estava olhando o futuro.</p>
</div></div>
<h2 id="o-bloco-transformer">O bloco transformer<a class="ancora" href="#o-bloco-transformer" aria-label="Link para esta secao">#</a></h2>
<p>Um <strong>transformer</strong> é um bloco repetido várias vezes. Cada bloco tem duas
metades, e as duas seguem o mesmo desenho: normaliza, faz alguma coisa,
soma de volta.</p>
<figure><img src="docs/assets/aula-10/bloco.png" alt="Diagrama do bloco: entra, norma, atenção, soma; depois norma, camada densa, soma, e sai. Dois arcos vermelhos marcam os atalhos que levam a entrada até as somas"><figcaption>Um bloco. A primeira metade mistura as posições, a segunda pensa sobre cada posição sozinha.</figcaption></figure>

<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="k">def</span><span class="w"> </span><span class="nf">bloco</span><span class="p">(</span><span class="n">x</span><span class="p">,</span> <span class="n">i</span><span class="p">):</span>
    <span class="c1"># 1ª metade: as posições conversam</span>
    <span class="n">h</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">LayerNormalization</span><span class="p">()(</span><span class="n">x</span><span class="p">)</span>
    <span class="n">h</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">MultiHeadAttention</span><span class="p">(</span><span class="n">num_heads</span><span class="o">=</span><span class="mi">4</span><span class="p">,</span> <span class="n">key_dim</span><span class="o">=</span><span class="mi">32</span><span class="p">)(</span><span class="n">h</span><span class="p">,</span> <span class="n">h</span><span class="p">,</span> <span class="n">use_causal_mask</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
    <span class="n">x</span> <span class="o">=</span> <span class="n">x</span> <span class="o">+</span> <span class="n">h</span>                                        <span class="c1"># atalho</span>
    <span class="c1"># 2ª metade: cada posição pensa sozinha</span>
    <span class="n">h</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">LayerNormalization</span><span class="p">()(</span><span class="n">x</span><span class="p">)</span>
    <span class="n">h</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">256</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"gelu"</span><span class="p">)(</span><span class="n">h</span><span class="p">)</span>
    <span class="n">h</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">128</span><span class="p">)(</span><span class="n">h</span><span class="p">)</span>
    <span class="k">return</span> <span class="n">x</span> <span class="o">+</span> <span class="n">h</span>                                     <span class="c1"># atalho</span>
</code></pre></div>
<h2 id="as-duas-metades">As duas metades<a class="ancora" href="#as-duas-metades" aria-label="Link para esta secao">#</a></h2>
<p>A <strong>primeira metade é a atenção</strong>: é onde as posições conversam entre si.</p>
<p>A <strong>segunda metade é uma camada densa</strong>, como as da Aula 7, aplicada a cada
posição <strong>separadamente</strong>. Ela abre o vetor de 128 para 256 números, passa
por uma ativação e volta para 128. Não olha para os vizinhos: pega o
vetor que a atenção montou e pensa sobre ele sozinha.</p>
<blockquote>
<p>A atenção <strong>junta</strong> informação de outras posições. A camada densa
<strong>pensa</strong> sobre essa mistura, uma posição de cada vez.</p>
</blockquote>
<p>A ativação é a <strong>GELU</strong>, uma ReLU com a dobra arredondada: perto de zero,
em vez de cortar seco, ela deixa passar um pouco. É a de quase todo
modelo de linguagem desde o GPT-2.</p>
<h2 id="o-atalho">O atalho<a class="ancora" href="#o-atalho" aria-label="Link para esta secao">#</a></h2>
<p>Repare no <code>x +</code> das duas metades: é o <strong>atalho</strong> (conexão residual). A
entrada atravessa o bloco por fora, e o bloco soma a ela o que calculou.
Cada bloco não reescreve o vetor do token: ele <strong>acrescenta</strong> alguma coisa
ao que já estava lá.</p>
<p>O atalho também é um caminho direto para o gradiente da Aula 1. Sem ele,
o gradiente precisa atravessar todos os blocos para chegar ao primeiro, e
vai encolhendo no caminho. Foi esse problema que travou as redes
profundas por anos, até a ideia do atalho, em 2015.</p>
<h2 id="a-normalizacao">A normalização<a class="ancora" href="#a-normalizacao" aria-label="Link para esta secao">#</a></h2>
<p>A <code>LayerNormalization</code> faz o de sempre desde a Aula 7: mantém os números
de cada vetor num tamanho parecido, para o treino não desandar. Ela
subtrai a média dos números do vetor e divide pelo desvio padrão:</p>
<div class="formula" title="\hat{x}_i = \frac{x_i - \mu}{\sigma}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mover accent="true"><mrow><mi>x</mi></mrow><mo>&#x0005E;</mo></mover><mi>i</mi></msub><mo>&#x0003D;</mo><mfrac><mrow><msub><mi>x</mi><mi>i</mi></msub><mo>&#x02212;</mo><mi>&#x003BC;</mi></mrow><mrow><mi>&#x003C3;</mi></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>xᵢ</code></td>
  <td>um dos números do vetor que entra</td>
</tr>
<tr>
  <td><code>μ</code></td>
  <td>a média dos números do vetor</td>
</tr>
<tr>
  <td><code>σ</code></td>
  <td>o desvio padrão dos números do vetor</td>
</tr>
</tbody>
</table></div>
<p>Exemplo com <code>x = (3, 5)</code>. A média é 4 e o desvio padrão é 1. O vetor
normalizado é <code>((3 − 4) / 1, (5 − 4) / 1) = (−1, 1)</code>. Depois disso, cada
número ainda é multiplicado e somado por pesos que o treino ajusta.</p>
<h2 id="o-modelo-inteiro">O modelo inteiro<a class="ancora" href="#o-modelo-inteiro" aria-label="Link para esta secao">#</a></h2>
<p>Com o bloco pronto, o modelo é o embedding, quatro blocos, uma última
normalização e a camada de saída:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">entrada</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">Input</span><span class="p">(</span><span class="n">shape</span><span class="o">=</span><span class="p">(</span><span class="kc">None</span><span class="p">,),</span> <span class="n">dtype</span><span class="o">=</span><span class="s2">"int32"</span><span class="p">)</span>
<span class="n">x</span> <span class="o">=</span> <span class="n">TokenEPosicao</span><span class="p">()(</span><span class="n">entrada</span><span class="p">)</span>              <span class="c1"># embedding do token + da posição</span>
<span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="mi">4</span><span class="p">):</span>
    <span class="n">x</span> <span class="o">=</span> <span class="n">bloco</span><span class="p">(</span><span class="n">x</span><span class="p">,</span> <span class="n">i</span><span class="p">)</span>
<span class="n">x</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">LayerNormalization</span><span class="p">()(</span><span class="n">x</span><span class="p">)</span>
<span class="n">saida</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">1024</span><span class="p">)(</span><span class="n">x</span><span class="p">)</span>       <span class="c1"># uma pontuação para cada token</span>
<span class="n">modelo</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">Model</span><span class="p">(</span><span class="n">entrada</span><span class="p">,</span> <span class="n">saida</span><span class="p">)</span>
</code></pre></div>
<p>A saída tem 1.024 números para <strong>cada</strong> posição, um por token do
vocabulário. São pontuações cruas, os <strong>logits</strong>; a softmax transforma
em chances. O formato de entrada <code>(None,)</code> quer dizer que o texto pode
ter qualquer tamanho até 128 tokens.</p>

<h2 id="o-passo-zero-e-a-perplexidade">O passo zero e a perplexidade<a class="ancora" href="#o-passo-zero-e-a-perplexidade" aria-label="Link para esta secao">#</a></h2>
<p>Antes de qualquer treino, o modelo recém-montado chuta igual entre os
1.024 tokens, e a perda dele tem que dar perto de <code>ln(1024) = 6,93</code>. Se
der muito diferente, tem erro de montagem. É o primeiro teste de qualquer
modelo de linguagem.</p>
<p>A perda tem uma tradução mais fácil de ler. Tire a exponencial e ela vira
a <strong>perplexidade</strong>:</p>
<div class="formula" title="\text{perplexidade} = e^{\text{perda}}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>perplexidade</mtext><mo>&#x0003D;</mo><msup><mi>e</mi><mrow><mtext>perda</mtext></mrow></msup></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>perda</code></td>
  <td>a entropia cruzada média na validação</td>
</tr>
<tr>
  <td><code>e</code></td>
  <td>o número de Euler, 2,718</td>
</tr>
</tbody>
</table></div>
<p>A perplexidade é &quot;entre quantos tokens o modelo está efetivamente na
dúvida&quot;. Exemplo: perda 6,93 dá <code>e^6,93 = 1.024</code>, o chute ao acaso. O
modelo do professor tem perda 3,39 na validação, e perplexidade 29,5: ele
eliminou quase todos os candidatos antes de escolher.</p>
<p>Os pesos treinados do professor carregam em qualquer modelo montado
exatamente assim, peça por peça. É o que o Exercício 3 faz: você monta o
modelo, ele chuta (6,93), você carrega os pesos do professor e ele passa a
escrever. Na Aula 11, você treina os seus.</p>

<h3 id="microaula-2-a-atencao">Microaula 2: a atenção<a class="ancora" href="#microaula-2-a-atencao" aria-label="Link para esta secao">#</a></h3>
<div class="pilha" data-titulo="Microaula 2 · A atenção"><div class="pilha-topo"><span class="pilha-titulo">Microaula 2 · A atenção</span><span class="pilha-progresso"></span></div><div class="pilha-cartas"><div class="quiz" data-numero="1"><p class="quiz-numero">Questão 1</p><p class="quiz-enunciado">Para que serve a atenção dentro do modelo?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Para escolher a próxima palavra no fim.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">B</span><span class="quiz-texto">Para cada posição escolher, com pesos aprendidos, de quais posições anteriores ela vai juntar informação.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Para normalizar os vetores.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Para transformar o texto em tokens.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">É a única peça do transformer em que uma posição vê as outras. Os pesos de quem olha para quem saem do treino.</p></div></div>
<div class="quiz" data-numero="2"><p class="quiz-numero">Questão 2</p><p class="quiz-enunciado">Na analogia da biblioteca, o que é o K (a etiqueta)?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">A pergunta que a posição atual está fazendo.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">B</span><span class="quiz-texto">O que cada posição anterior tem a oferecer, para ser comparado com a pergunta.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">O texto que é entregue depois da escolha.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">A resposta final do modelo.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Q pergunta, K é a etiqueta na lombada de cada livro, V é o conteúdo que você lê. A pergunta é comparada com as etiquetas.</p></div></div>
<div class="quiz" data-numero="3"><p class="quiz-numero">Questão 3</p><p class="quiz-enunciado">Os produtos de uma pergunta com três etiquetas, já divididos por √d, são (1, 2, −∞). Qual é o peso da terceira posição depois da softmax?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">33%</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">73%</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">0%</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">100%</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">e elevado a −∞ é zero. É assim que a máscara causal apaga o futuro: a posição some da mistura, e as outras duas dividem os 100% (27% e 73%).</p></div></div>
<div class="quiz" data-numero="4"><p class="quiz-numero">Questão 4</p><p class="quiz-enunciado">O que <code>keras.layers.MultiHeadAttention(num_heads=4, key_dim=32)</code> faz com vetores de 128 números?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Usa só 32 dos 128 números e joga o resto fora.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">B</span><span class="quiz-texto">Roda quatro atenções em paralelo, de 32 números cada, e junta as quatro saídas de volta em 128.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Repete a mesma atenção quatro vezes seguidas.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Divide a frase em quatro pedaços.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Cada cabeça tem as suas tabelas Q, K e V e aprende a olhar para outra coisa. As quatro saídas, lado a lado, voltam a ter 128 números.</p></div></div>

<h3 id="microaula-3-o-bloco-e-o-modelo-inteiro">Microaula 3: o bloco e o modelo inteiro<a class="ancora" href="#microaula-3-o-bloco-e-o-modelo-inteiro" aria-label="Link para esta secao">#</a></h3>
<div class="pilha" data-titulo="Microaula 3 · O bloco e o modelo inteiro"><div class="pilha-topo"><span class="pilha-titulo">Microaula 3 · O bloco e o modelo inteiro</span><span class="pilha-progresso"></span></div><div class="pilha-cartas"><div class="quiz" data-numero="1"><p class="quiz-numero">Questão 1</p><p class="quiz-enunciado">Num bloco transformer, qual é a divisão de trabalho entre a atenção e a camada densa?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">A</span><span class="quiz-texto">A atenção junta informação de outras posições; a camada densa pensa sobre essa mistura, uma posição de cada vez.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">A atenção pensa sobre cada posição; a camada densa mistura as posições.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">As duas fazem a mesma coisa, duas vezes.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">A camada densa escolhe a próxima palavra; a atenção normaliza.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">A atenção é a única peça em que as posições conversam. A camada densa é aplicada a cada posição separadamente.</p></div></div>
<div class="quiz" data-numero="2"><p class="quiz-numero">Questão 2</p><p class="quiz-enunciado">O que o atalho (<code>x + h</code>) faz?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Pula o bloco inteiro quando ele não é necessário.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">B</span><span class="quiz-texto">Soma o que o bloco calculou à entrada, que atravessa o bloco por fora.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Multiplica a entrada pela saída.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Deixa o modelo mais rápido, sem mudar o resultado.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Cada bloco acrescenta alguma coisa ao vetor em vez de reescrever. E o atalho dá ao gradiente um caminho direto até os primeiros blocos.</p></div></div>
<div class="quiz" data-numero="3"><p class="quiz-numero">Questão 3</p><p class="quiz-enunciado">A LayerNormalization recebe o vetor (3, 5). O que sai, antes dos pesos ajustáveis?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">(3, 5)</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">(0, 1)</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">(−1, 1)</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">(0,375, 0,625)</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Média 4, desvio padrão 1: (3 − 4) / 1 = −1 e (5 − 4) / 1 = 1.</p></div></div>
<div class="quiz" data-numero="4"><p class="quiz-numero">Questão 4</p><p class="quiz-enunciado">O modelo recém-montado, antes de qualquer treino, tem perda de 6,93 no lote. O que isso indica?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Que a montagem está errada.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Que o modelo já aprendeu bastante.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">Que ele chuta igual entre os 1.024 tokens, como devia: ln(1024) = 6,93.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Que o lote estava vazio.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">É o teste do passo zero. Um modelo que não sabe nada dá 1/1024 a cada token, e a perda é ln(1024). Muito diferente disso, tem erro de montagem.</p></div></div>

</div><div class="pilha-fim" hidden><p class="pilha-nota"></p><p class="pilha-dica"></p><button class="pilha-refazer" type="button">Refazer o quiz</button></div></div>

<template class="pagina" data-id="llm-do-zero/aula-11-treinar-e-usar" data-titulo="Aula 11 — Treinar e Usar um LLM" data-descricao="O treino no processador, a geração de texto, o ajuste fino e o que o modelo não sabe fazer">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>
<p>Você vai treinar o seu modelo de linguagem por 35 minutos no processador
do Colab, escrever a função que transforma a saída dele em texto, com os
dois botões de toda ferramenta de IA (temperatura e top-k), e ajustar o
modelo para escrever sobre outro assunto. E vai conseguir explicar por que
um modelo de linguagem inventa fatos.</p>
</div></div>
<h2 id="onde-estamos">Onde estamos<a class="ancora" href="#onde-estamos" aria-label="Link para esta secao">#</a></h2>
<figure><img src="docs/assets/aula-11/mapa.png" alt="Três quadros lado a lado, um por aula: do texto para números, como funciona por dentro, treinar e usar. O terceiro está aceso"><figcaption>O modelo está montado. Falta treinar, ouvir ele escrever, e saber do que ele não é capaz.</figcaption></figure>

<p>Na Aula 10 você montou o modelo inteiro e viu que ele chuta: perda 6,93,
perplexidade 1.024. Com os pesos do professor, o mesmo modelo escrevia
português. Esta aula faz a ponte entre os dois: o treino. Depois, usa o
modelo treinado para gerar texto e mostra o que ele não sabe fazer.</p>
<h2 id="o-ciclo-de-treino">O ciclo de treino<a class="ancora" href="#o-ciclo-de-treino" aria-label="Link para esta secao">#</a></h2>
<p>Treinar é repetir um ciclo de cinco passos: sortear um lote, passar pelo
modelo, medir a perda, calcular o gradiente (para que lado mexer cada peso
para a perda cair) e dar um passo pequeno nessa direção. É o gradiente
descendente da Aula 1, com 809.728 pesos em vez de dois.</p>
<figure><video src="docs/assets/aula-11/treino.mp4" poster="docs/assets/aula-11/treino.jpg" controls preload="none" playsinline aria-label="Animação do loop de treino com a curva da perda caindo"></video><figcaption>Cinco passos por volta, milhares de voltas. A curva e as amostras são do treino de referência.</figcaption></figure>

<p>No Keras, como nas Aulas 7 e 8, o <code>compile</code> escolhe o otimizador e a
perda, e o <code>fit</code> repete o ciclo:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">modelo</span><span class="o">.</span><span class="n">compile</span><span class="p">(</span>
    <span class="n">optimizer</span><span class="o">=</span><span class="n">keras</span><span class="o">.</span><span class="n">optimizers</span><span class="o">.</span><span class="n">AdamW</span><span class="p">(</span><span class="n">learning_rate</span><span class="o">=</span><span class="mf">1e-3</span><span class="p">,</span> <span class="n">weight_decay</span><span class="o">=</span><span class="mf">0.1</span><span class="p">,</span>
                                     <span class="n">beta_2</span><span class="o">=</span><span class="mf">0.95</span><span class="p">,</span> <span class="n">global_clipnorm</span><span class="o">=</span><span class="mf">1.0</span><span class="p">),</span>
    <span class="n">loss</span><span class="o">=</span><span class="n">keras</span><span class="o">.</span><span class="n">losses</span><span class="o">.</span><span class="n">SparseCategoricalCrossentropy</span><span class="p">(</span><span class="n">from_logits</span><span class="o">=</span><span class="kc">True</span><span class="p">))</span>
<span class="n">salvar_o_melhor</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">callbacks</span><span class="o">.</span><span class="n">ModelCheckpoint</span><span class="p">(</span>
    <span class="s2">"meu_llm.weights.h5"</span><span class="p">,</span> <span class="n">monitor</span><span class="o">=</span><span class="s2">"val_loss"</span><span class="p">,</span> <span class="n">save_best_only</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span>
    <span class="n">save_weights_only</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
<span class="n">modelo</span><span class="o">.</span><span class="n">fit</span><span class="p">(</span><span class="n">lotes</span><span class="p">(</span><span class="n">dados_treino</span><span class="p">),</span> <span class="n">steps_per_epoch</span><span class="o">=</span><span class="mi">200</span><span class="p">,</span> <span class="n">epochs</span><span class="o">=</span><span class="mi">100_000</span><span class="p">,</span>
           <span class="n">validation_data</span><span class="o">=</span><span class="n">lotes</span><span class="p">(</span><span class="n">dados_validacao</span><span class="p">),</span> <span class="n">validation_steps</span><span class="o">=</span><span class="mi">10</span><span class="p">,</span>
           <span class="n">callbacks</span><span class="o">=</span><span class="p">[</span><span class="n">Relogio</span><span class="p">(</span><span class="n">minutos</span><span class="o">=</span><span class="mi">35</span><span class="p">),</span> <span class="n">salvar_o_melhor</span><span class="p">])</span>
</code></pre></div>
<p>O <code>from_logits=True</code> avisa que o modelo devolve pontuações cruas; a
softmax fica por conta da perda. O resto são quatro escolhas que todo
treino de modelo de linguagem faz.</p>
<h2 id="escolha-1-o-otimizador-adamw">Escolha 1: o otimizador AdamW<a class="ancora" href="#escolha-1-o-otimizador-adamw" aria-label="Link para esta secao">#</a></h2>
<p>O <strong>AdamW</strong> é o gradiente descendente com duas melhorias. Ele guarda uma
média dos gradientes recentes, o que suaviza o caminho, e dá passos
maiores nas direções em que o gradiente é pequeno mas constante. O &quot;W&quot; é
um empurrão leve de todos os pesos em direção ao zero (<em>weight decay</em>),
que ajuda o modelo a não decorar.</p>
<h2 id="escolha-2-cortar-o-gradiente">Escolha 2: cortar o gradiente<a class="ancora" href="#escolha-2-cortar-o-gradiente" aria-label="Link para esta secao">#</a></h2>
<p>De vez em quando um lote sai muito fora do normal, e o gradiente fica
enorme. Um passo desses joga os pesos para longe e estraga o que já foi
aprendido. O <code>global_clipnorm=1.0</code> limita o tamanho do gradiente inteiro:
se ele passar de 1, todos os números são divididos pelo mesmo fator. A
direção do passo não muda, só o tamanho. Exemplo: um gradiente de tamanho
5 é dividido por 5, e o passo sai cinco vezes menor, na mesma direção.</p>
<h2 id="escolha-3-o-tamanho-do-passo-segue-o-relogio">Escolha 3: o tamanho do passo segue o relógio<a class="ancora" href="#escolha-3-o-tamanho-do-passo-segue-o-relogio" aria-label="Link para esta secao">#</a></h2>
<figure><img src="docs/assets/aula-11/taxa.png" alt="Curva do tamanho do passo ao longo de 35 minutos: sobe em linha reta no primeiro minuto e depois desce suavemente como um cosseno até um décimo do máximo"><figcaption>Aquecimento e resfriamento. É o padrão em qualquer treino de modelo de linguagem.</figcaption></figure>

<p>No começo os pesos são aleatórios, e passo grande na direção errada só faz
estrago: por isso o <strong>aquecimento</strong>, com a taxa subindo do zero no
primeiro minuto. No fim, o modelo está perto de um bom lugar e passo
grande faz ele passar do ponto: por isso o <strong>resfriamento</strong>, com a taxa
descendo até um décimo do máximo.</p>
<p>O nosso treino dura um <strong>tempo fixo</strong>, 35 minutos, e não um número fixo
de passos. Quem cuida disso é o <code>Relogio</code>, um <em>callback</em>: uma função que
o <code>fit</code> chama a cada passo. Ele ajusta a taxa pela fração do tempo que já
passou e para o treino quando o tempo acaba. Assim o treino termina na
hora certa em qualquer Colab, rápido ou lento.</p>
<h2 id="escolha-4-conferir-e-salvar-o-melhor">Escolha 4: conferir e salvar o melhor<a class="ancora" href="#escolha-4-conferir-e-salvar-o-melhor" aria-label="Link para esta secao">#</a></h2>
<p>A cada 200 passos, o <code>fit</code> mede a perda em lotes de validação (o
<code>val_loss</code>), e o <code>ModelCheckpoint</code> salva o modelo em
<code>meu_llm.weights.h5</code> <strong>se a validação for a melhor até ali</strong>. Se o Colab
cair no meio, o melhor modelo já está salvo; e o arquivo guarda o modelo
que melhor generaliza, e não o último.</p>
<h2 id="o-treino-de-verdade">O treino de verdade<a class="ancora" href="#o-treino-de-verdade" aria-label="Link para esta secao">#</a></h2>
<p>Quantos passos cabem em 35 minutos depende da máquina: um Colab rápido dá
mais passos, um lento dá menos, e os dois terminam na hora. No teste deste
curso, com duas linhas de execução (as mesmas do Colab gratuito) e o
processador dividido com outro programa, foram uns 4.400 passos e perda
de validação 3,52, perplexidade 34. O modelo de referência, treinado por
60 minutos num processador maior (9.695 passos), mostra a curva inteira:</p>
<figure><img src="docs/assets/aula-11/curva_treino.png" alt="Dois gráficos: à esquerda a perda de treino e validação caindo de 6,9 até perto de 3, à direita a mesma curva em perplexidade, com uma linha marcando os 1.024 do chute ao acaso"><figcaption>A queda grande acontece nos primeiros mil passos. Depois, cada ponto a menos custa mais.</figcaption></figure>

<p>A perda despenca no começo e depois vai ficando cada vez mais difícil
melhorar. Essa curva explica por que treinar modelos grandes é caro: cada
ponto a menos custa mais que o anterior, e não existe atalho.</p>
<p>E veja o que sai do modelo em cada momento:</p>
<figure><img src="docs/assets/aula-11/amostras.png" alt="Quatro caixas com o texto gerado no início do treino, depois de 200 passos, de 1.000 passos e no fim, cada uma mais parecida com português que a anterior"><figcaption>O mesmo início, gerado em quatro momentos. Nada mudou além do valor dos 809.728 pesos.</figcaption></figure>

<p>No passo 0 é ruído. Em 200 passos já existem palavras curtas e vírgulas
em lugares plausíveis. Em 1.000 aparecem frases inteiras, erradas mas
gramaticais. No fim, ele escreve com a grafia de 1899, porque foi isso que
leu. A ordem é sempre a mesma: primeiro a forma, depois as palavras, e o
sentido por último.</p>
<h2 id="quanto-custa-treinar">Quanto custa treinar<a class="ancora" href="#quanto-custa-treinar" aria-label="Link para esta secao">#</a></h2>
<p>Existe uma regra de bolso que bate bem com a realidade. Cada token que o
modelo lê no treino custa umas seis contas por peso: duas para ir e
quatro para voltar com o gradiente.</p>
<div class="formula" title="\text{operações} \approx 6 \cdot N \cdot T"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>operações</mtext><mo>&#x02248;</mo><mn>6</mn><mo>&#x000B7;</mo><mi>N</mi><mo>&#x000B7;</mo><mi>T</mi></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>N</code></td>
  <td>quantos pesos o modelo tem</td>
</tr>
<tr>
  <td><code>T</code></td>
  <td>quantos tokens ele leu no treino</td>
</tr>
</tbody>
</table></div>
<p>Exemplo com o modelo de referência: 809.728 pesos e 9.695 passos de
4.096 tokens, ou uns 40 milhões de tokens. A conta dá
6 × 809.728 × 40 milhões ≈ 2 × 10¹⁴ operações. O GPT-3, de 2020,
tem 175 bilhões de pesos e leu 300 bilhões de tokens:
6 × 175 bilhões × 300 bilhões ≈ 3 × 10²³. Bilhões de vezes mais.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Julgar o modelo pela perda de treino. No modelo de referência, ela estava
em 2,82 no melhor ponto, enquanto a de validação parou em 3,36. Essa
diferença é o modelo decorando trechos do corpus. Enquanto as duas caem
juntas, tudo bem. Quando a de validação para ou sobe, o que vem depois é
decoreba. É por isso que o treino salva pela validação.</p>
</div></div>
<h2 id="o-modelo-nao-devolve-uma-palavra">O modelo não devolve uma palavra<a class="ancora" href="#o-modelo-nao-devolve-uma-palavra" aria-label="Link para esta secao">#</a></h2>
<p>Dê ao modelo treinado o começo &quot;Não sei se a senhora&quot; e olhe o que ele
produz para a última posição:</p>
<figure><img src="docs/assets/aula-11/distribuicao.png" alt="À esquerda, as dez continuações mais prováveis com suas porcentagens e uma barra grande para as outras 1.014; à direita, a curva de probabilidade acumulada mostrando quantos tokens somam 90%"><figcaption>Uma passada do modelo devolve 1.024 números para a última posição, um por token do vocabulário.</figcaption></figure>

<p>O favorito é a vírgula, com só 8,7%. As dez melhores continuações juntas
dão 41%, e são precisos 125 tokens para somar 90% da probabilidade.</p>
<p>Escolher <strong>qual</strong> desses 1.024 vai para a tela é um problema separado,
que nada tem a ver com o treino. Ele tem nome: <strong>amostragem</strong>
(<em>sampling</em>).</p>
<h2 id="gerar-e-repetir-um-passo">Gerar é repetir um passo<a class="ancora" href="#gerar-e-repetir-um-passo" aria-label="Link para esta secao">#</a></h2>
<p>O modelo devolve uma previsão para cada posição do texto. Para gerar, só
interessa a da <strong>última</strong> posição: é ela que viu o texto inteiro. O resto
é um loop:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">indices</span> <span class="o">=</span> <span class="n">codificar</span><span class="p">(</span><span class="s2">"A casa de"</span><span class="p">)</span>
<span class="k">for</span> <span class="n">_</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="mi">100</span><span class="p">):</span>
    <span class="n">logits</span> <span class="o">=</span> <span class="n">modelo</span><span class="p">(</span><span class="n">np</span><span class="o">.</span><span class="n">array</span><span class="p">([</span><span class="n">indices</span><span class="p">[</span><span class="o">-</span><span class="mi">128</span><span class="p">:]]))</span>                    <span class="c1"># 1. passa o texto</span>
    <span class="n">ultimos</span> <span class="o">=</span> <span class="n">logits</span><span class="p">[:,</span> <span class="o">-</span><span class="mi">1</span><span class="p">]</span>                                        <span class="c1"># 2. só a última posição</span>
    <span class="n">sorteado</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">random</span><span class="o">.</span><span class="n">categorical</span><span class="p">(</span><span class="n">ultimos</span> <span class="o">/</span> <span class="n">temperatura</span><span class="p">,</span> <span class="mi">1</span><span class="p">)</span>  <span class="c1"># 3. sorteia um token</span>
    <span class="n">indices</span><span class="o">.</span><span class="n">append</span><span class="p">(</span><span class="nb">int</span><span class="p">(</span><span class="n">sorteado</span><span class="p">[</span><span class="mi">0</span><span class="p">,</span> <span class="mi">0</span><span class="p">]))</span>                            <span class="c1"># 4. cola no fim</span>
</code></pre></div>
<p>O <code>[-128:]</code> corta o texto no tamanho da janela de contexto. Isso se chama
<strong>geração autorregressiva</strong>: o token sorteado vira entrada do passo
seguinte. Se ele foi ruim, o modelo não tem como voltar atrás, e passa a
continuar, com coerência, a partir do erro.</p>
<figure><video src="docs/assets/aula-11/geracao.mp4" poster="docs/assets/aula-11/geracao.jpg" controls preload="none" playsinline aria-label="Animação da geração de texto, um token sorteado de cada vez"></video><figcaption>Oito passos reais do modelo, sorteando com temperatura 0,8 e top-k 40.</figcaption></figure>

<h2 id="duas-escolhas-ruins">Duas escolhas ruins<a class="ancora" href="#duas-escolhas-ruins" aria-label="Link para esta secao">#</a></h2>
<p><strong>Sempre o mais provável.</strong> Chama-se decodificação gulosa (<em>greedy</em>). É
determinística e parece segura, e o texto entra em loop, repetindo a
mesma frase: um texto que só escolhe o topo acaba num lugar de onde o
topo aponta de volta para si.</p>
<p><strong>Sortear direto da distribuição.</strong> O oposto: cada token com exatamente a
chance que o modelo deu. O problema está na cauda. No exemplo de cima, os
tokens fora dos 40 melhores somam 31% da probabilidade. Um a um eles são
improváveis; juntos, viram uma chance real de o modelo escolher algo que
ele mesmo considera ruim.</p>
<p>A saída é ficar no meio, com dois botões.</p>
<h2 id="botao-1-a-temperatura">Botão 1: a temperatura<a class="ancora" href="#botao-1-a-temperatura" aria-label="Link para esta secao">#</a></h2>
<p>Antes do sorteio, divida todas as pontuações por <code>T</code>:</p>
<div class="formula" title="P_j = \frac{e^{z_j / T}}{\sum_{k} e^{z_k / T}}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>P</mi><mi>j</mi></msub><mo>&#x0003D;</mo><mfrac><mrow><msup><mi>e</mi><mrow><msub><mi>z</mi><mi>j</mi></msub><mo>&#x0002F;</mo><mi>T</mi></mrow></msup></mrow><mrow><msub><mo>&#x02211;</mo><mrow><mi>k</mi></mrow></msub><msup><mi>e</mi><mrow><msub><mi>z</mi><mi>k</mi></msub><mo>&#x0002F;</mo><mi>T</mi></mrow></msup></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>zⱼ</code></td>
  <td>a pontuação crua (o <em>logit</em>) que o modelo deu ao token <code>j</code></td>
</tr>
<tr>
  <td><code>T</code></td>
  <td>a temperatura, um número positivo que você escolhe</td>
</tr>
<tr>
  <td><code>Pⱼ</code></td>
  <td>a chance final desse token</td>
</tr>
</tbody>
</table></div>
<p>Exemplo com três logits: 4, 2 e 0.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Temperatura</th>
  <th>Os logits viram</th>
  <th>As chances ficam</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>T = 0,5</code></td>
  <td>8, 4, 0</td>
  <td>98%, 2%, 0%</td>
</tr>
<tr>
  <td><code>T = 1</code></td>
  <td>4, 2, 0</td>
  <td>87%, 12%, 2%</td>
</tr>
<tr>
  <td><code>T = 2</code></td>
  <td>2, 1, 0</td>
  <td>67%, 24%, 9%</td>
</tr>
</tbody>
</table></div>
<p>A temperatura não muda a ordem dos candidatos, só a distância entre eles.</p>
<figure><img src="docs/assets/aula-11/temperatura.png" alt="Três gráficos de barras dos mesmos seis tokens mais uma barra cinza para os outros 1.018, com temperaturas 0,3, 1 e 1,5: a barra cinza cresce com a temperatura"><figcaption>A mesma saída do modelo, com três temperaturas. Nada no modelo mudou.</figcaption></figure>

<figure><video src="docs/assets/aula-11/temperatura.mp4" poster="docs/assets/aula-11/temperatura.jpg" controls preload="none" playsinline aria-label="Animação das chances mudando com a temperatura"></video><figcaption>A temperatura vai de 1 para 0,3, depois para 1,5 e 0,8. A ordem das barras nunca muda.</figcaption></figure>

<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Temperatura</th>
  <th>O que acontece</th>
</tr>
</thead>
<tbody>
<tr>
  <td>perto de 0</td>
  <td>vira a escolha gulosa: sempre o mesmo texto</td>
</tr>
<tr>
  <td>0,7 a 0,9</td>
  <td>o padrão da maioria das ferramentas</td>
</tr>
<tr>
  <td>acima de 1,2</td>
  <td>o modelo passa a considerar tokens que ele mesmo acha improváveis</td>
</tr>
</tbody>
</table></div>
<h2 id="botao-2-cortar-a-cauda">Botão 2: cortar a cauda<a class="ancora" href="#botao-2-cortar-a-cauda" aria-label="Link para esta secao">#</a></h2>
<p>A temperatura reescala tudo, inclusive o lixo. O <strong>top-k</strong> elimina
candidatos antes do sorteio: fique com os <code>k</code> mais prováveis e esqueça o
resto. No Keras, <code>ops.top_k</code> devolve as <code>k</code> maiores pontuações e de quais
tokens elas são:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">melhores</span><span class="p">,</span> <span class="n">candidatos</span> <span class="o">=</span> <span class="n">ops</span><span class="o">.</span><span class="n">top_k</span><span class="p">(</span><span class="n">ultimos</span><span class="p">,</span> <span class="mi">40</span><span class="p">)</span>          <span class="c1"># as 40 maiores</span>
<span class="n">sorteado</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">random</span><span class="o">.</span><span class="n">categorical</span><span class="p">(</span><span class="n">melhores</span><span class="p">[</span><span class="kc">None</span><span class="p">]</span> <span class="o">/</span> <span class="n">temperatura</span><span class="p">,</span> <span class="mi">1</span><span class="p">)</span>
<span class="n">proximo</span> <span class="o">=</span> <span class="n">candidatos</span><span class="p">[</span><span class="nb">int</span><span class="p">(</span><span class="n">sorteado</span><span class="p">[</span><span class="mi">0</span><span class="p">,</span> <span class="mi">0</span><span class="p">])]</span>
</code></pre></div>
<p>O top-k corta sempre o mesmo tanto, mesmo quando o modelo está seguro. A
versão que se adapta à dúvida é o <strong>top-p</strong> (ou núcleo): fique com os
mais prováveis até a soma das chances passar de <code>p</code>. Com <code>p = 0,9</code>:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Começo</th>
  <th>O favorito</th>
  <th>Candidatos que sobram</th>
</tr>
</thead>
<tbody>
<tr>
  <td>&quot;Não sei se a senhora&quot;</td>
  <td><code>,</code>, com 8,7%</td>
  <td>125</td>
</tr>
<tr>
  <td>&quot;Quincas Bor&quot;</td>
  <td><code>ba</code>, com 98,0%</td>
  <td>1</td>
</tr>
</tbody>
</table></div>
<p>No primeiro caso o modelo está em dúvida, e o top-p deixa muita opção. No
segundo, só existe uma continuação razoável (&quot;Quincas Borba&quot;), e o top-p
deixa só ela.</p>
<h2 id="os-quatro-textos">Os quatro textos<a class="ancora" href="#os-quatro-textos" aria-label="Link para esta secao">#</a></h2>
<p>Mesmo modelo, mesmo início, quatro jeitos de escolher:</p>
<figure><img src="docs/assets/aula-11/textos.png" alt="Quatro caixas com texto gerado: a escolha gulosa, a temperatura 0,3, a 0,8 e a 1,5"><figcaption>Nenhum peso mudou entre as quatro caixas. Só a regra de escolha.</figcaption></figure>

<p>Leia com atenção. A escolha gulosa entra em loop logo: &quot;a principio, a
principio, a principio&quot;, e depois &quot;ora, ora, ora&quot;. A temperatura 0,3
começa igual e vai pelo mesmo caminho. Na 1,5 aparecem palavras que não
existem (&quot;Naqueencia&quot;, &quot;collegeiro&quot;). A 0,8 é a que lê melhor, e é por
isso que ela é o padrão em quase toda ferramenta.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Subir a temperatura achando que isso deixa o modelo mais criativo. O que
sobe é a chance de ele escolher um token que ele mesmo considera
improvável, e a partir dali o texto tem que se justificar sozinho. Se você
quer outra resposta, mude o começo, não a temperatura.</p>
</div></div>
<h2 id="ele-copia-ou-inventa">Ele copia ou inventa?<a class="ancora" href="#ele-copia-ou-inventa" aria-label="Link para esta secao">#</a></h2>
<p>É a pergunta que a turma sempre faz, e dá para medir. Gere um texto com o
modelo e procure, para cada palavra, o maior trecho a partir dela que
aparece <strong>literalmente</strong> no corpus de Machado:</p>
<figure><img src="docs/assets/aula-11/copia.png" alt="Gráfico de barras: das 99 palavras geradas, 8 não começam nenhum trecho igual ao corpus, 25 começam trechos de uma palavra, 32 de duas, 24 de três, 9 de quatro e 1 de cinco"><figcaption>O trecho copiado mais longo tem 5 palavras. Tudo o mais o modelo montou.</figcaption></figure>

<p>A média é de duas palavras. O modelo não guarda o texto: ele guarda uma estatística sobre o texto,
em 809.728 números. Reconstruir uma frase inteira de Machado a partir
disso é impossível, e produzir uma frase nova que soa como Machado é
exatamente o que ele faz.</p>
<h2 id="por-que-o-modelo-alucina">Por que o modelo alucina<a class="ancora" href="#por-que-o-modelo-alucina" aria-label="Link para esta secao">#</a></h2>
<p>O nosso modelo escreve frases confiantes sobre coisas que nunca
existiram, e não há nada de errado com ele. Ele está fazendo exatamente o
que o treino pediu.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>O que ele tem</th>
  <th>O que ele não tem</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Uma estimativa de qual token é provável</td>
  <td>Qualquer noção de verdadeiro e falso</td>
</tr>
<tr>
  <td>809.728 pesos ajustados por gradiente</td>
  <td>Um lugar para consultar um fato</td>
</tr>
<tr>
  <td>Uma janela de 128 tokens</td>
  <td>Memória do que disse antes disso</td>
</tr>
<tr>
  <td>A estatística do corpus</td>
  <td>Uma marcação do que veio de onde</td>
</tr>
</tbody>
</table></div>
<p>&quot;Alucinação&quot; é um nome ruim, porque sugere defeito. Uma frase falsa e
fluente e uma frase verdadeira e fluente têm exatamente a mesma natureza
para o modelo: as duas são sequências prováveis. A Aula 13 mostra o
remédio mais usado: dar ao modelo um lugar para consultar, colando trechos
de um documento no começo do texto.</p>
<h2 id="o-modelo-e-o-corpus">O modelo é o corpus<a class="ancora" href="#o-modelo-e-o-corpus" aria-label="Link para esta secao">#</a></h2>
<p>O nosso escreve &quot;elle&quot;, &quot;cousa&quot;, &quot;mettia&quot;, &quot;pharmacia&quot;. Ele escreve a
grafia de 1899 porque leu 3,7 milhões de caracteres de 1899, e nada mais.
Um modelo treinado em fóruns escreve como fórum. Um modelo treinado em
textos que carregam um preconceito reproduz esse preconceito, com a mesma
fluência com que reproduz a gramática. Não existe modelo neutro. Existe
corpus.</p>
<h2 id="ajuste-fino-o-mesmo-treino-outro-texto">Ajuste fino: o mesmo treino, outro texto<a class="ancora" href="#ajuste-fino-o-mesmo-treino-outro-texto" aria-label="Link para esta secao">#</a></h2>
<p>Dá para provar isso em dois minutos. Pegue uma cópia do modelo pronto e
continue o treino por 200 passos, com outro texto: as páginas deste
curso, em português de hoje. Isso se chama <strong>ajuste fino</strong>
(<em>fine-tuning</em>). O passo é menor (<code>3e-4</code>), para mexer pouco no que o
modelo já sabe:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">ajustado</span> <span class="o">=</span> <span class="n">montar_modelo</span><span class="p">()</span>
<span class="n">ajustado</span><span class="o">.</span><span class="n">set_weights</span><span class="p">(</span><span class="n">modelo</span><span class="o">.</span><span class="n">get_weights</span><span class="p">())</span>              <span class="c1"># uma cópia</span>
<span class="n">ajustado</span><span class="o">.</span><span class="n">compile</span><span class="p">(</span><span class="n">optimizer</span><span class="o">=</span><span class="n">keras</span><span class="o">.</span><span class="n">optimizers</span><span class="o">.</span><span class="n">AdamW</span><span class="p">(</span><span class="n">learning_rate</span><span class="o">=</span><span class="mf">3e-4</span><span class="p">),</span>
                 <span class="n">loss</span><span class="o">=</span><span class="n">keras</span><span class="o">.</span><span class="n">losses</span><span class="o">.</span><span class="n">SparseCategoricalCrossentropy</span><span class="p">(</span><span class="n">from_logits</span><span class="o">=</span><span class="kc">True</span><span class="p">))</span>
<span class="n">ajustado</span><span class="o">.</span><span class="n">fit</span><span class="p">(</span><span class="n">lotes</span><span class="p">(</span><span class="n">curso_treino</span><span class="p">),</span> <span class="n">steps_per_epoch</span><span class="o">=</span><span class="mi">50</span><span class="p">,</span> <span class="n">epochs</span><span class="o">=</span><span class="mi">4</span><span class="p">)</span>
</code></pre></div>
<figure><img src="docs/assets/aula-11/ajuste_fino.png" alt="Duas caixas de texto começando com O modelo: a do modelo original continua no estilo de Machado; a do modelo ajustado fala do assunto do curso"><figcaption>200 passos de treino, nenhuma peça da arquitetura mudou.</figcaption></figure>

<p>Dá para medir a mudança com a perda de uma frase só: perda baixa quer
dizer que o modelo acha a frase provável.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Frase</th>
  <th>Modelo de Machado</th>
  <th>Modelo ajustado</th>
</tr>
</thead>
<tbody>
<tr>
  <td>&quot;Não sei se a senhora sabe que elle não veio hontem.&quot;</td>
  <td><strong>3,40</strong></td>
  <td>3,16</td>
</tr>
<tr>
  <td>&quot;O modelo de linguagem prevê o próximo token do texto.&quot;</td>
  <td>4,56</td>
  <td><strong>1,72</strong></td>
</tr>
</tbody>
</table></div>
<p>Cada modelo acha mais provável a frase do seu próprio corpus, e a frase de
hoje caiu de 4,56 para 1,72 com 200 passos. O modelo ajustado aprendeu o
assunto e até o formato das páginas do curso: no texto dele aparecem
&quot;modelo&quot;, &quot;dados&quot;, &quot;Aula&quot; e os asteriscos do negrito. É assim que
um modelo de uso geral vira um modelo de uma área: jurídico, médico, de
atendimento. E é assim, também, que um modelo que continua texto vira um
assistente.</p>
<h2 id="o-que-muda-quando-o-modelo-e-grande">O que muda quando o modelo é grande<a class="ancora" href="#o-que-muda-quando-o-modelo-e-grande" aria-label="Link para esta secao">#</a></h2>

dinheiro. Repare também no Llama 3 8B, de 2024: vinte vezes menor que o
GPT-3 e com cinquenta vezes mais texto. Nos últimos anos, a alavanca
principal passou a ser o texto, e não o tamanho.</p>
<h2 id="do-modelo-ao-assistente">Do modelo ao assistente<a class="ancora" href="#do-modelo-ao-assistente" aria-label="Link para esta secao">#</a></h2>
<p>O nosso modelo continua texto. Ele não responde perguntas, e isso não é
questão de tamanho: é questão de treino. Entre ele e um assistente existem
duas etapas a mais, e as duas são ajuste fino:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Etapa</th>
  <th>O que faz</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Pré-treino</td>
  <td>o que fizemos: prever o próximo token, em muito texto</td>
</tr>
<tr>
  <td>Ajuste por instrução</td>
  <td>ajuste fino em milhares de conversas com boas respostas</td>
</tr>
<tr>
  <td>Ajuste por preferência</td>
  <td>treinar com pessoas escolhendo a melhor de duas respostas</td>
</tr>
</tbody>
</table></div>
<p>O texto da segunda etapa tem uma forma fixa, com marcadores de quem fala:</p>
<div class="bloco-codigo" data-lingua=""><button class="copiar" type="button">copiar</button><pre class="realce"><code>&lt;|usuario|&gt;Quem escreveu Dom Casmurro?
&lt;|assistente|&gt;Machado de Assis, em 1899.
</code></pre></div>
<p>Depois de ler milhares de textos nesse formato, o modelo aprende que,
depois de <code>&lt;|assistente|&gt;</code>, vem uma resposta à pergunta de cima. É o mesmo
ajuste fino do Exercício 3, com outro texto.</p>
<p>E existe uma quarta alavanca, que não mexe em nenhum peso: <strong>deixar o
modelo escrever mais antes de responder</strong>. Pedir o raciocínio passo a
passo, gerar várias respostas e escolher a melhor, revisar a própria
resposta. Cada token escrito entra de volta como contexto do próximo, então
pensar em voz alta é dar a si mesmo mais material. É por isso que os
modelos de raciocínio de hoje mostram um &quot;pensando&quot; antes de falar: é o
mesmo transformer, gerando muito mais antes de mostrar o resultado.</p>

<h3 id="microaula-2-do-numero-a-palavra">Microaula 2: do número à palavra<a class="ancora" href="#microaula-2-do-numero-a-palavra" aria-label="Link para esta secao">#</a></h3>
<div class="pilha" data-titulo="Microaula 2 · Do número à palavra"><div class="pilha-topo"><span class="pilha-titulo">Microaula 2 · Do número à palavra</span><span class="pilha-progresso"></span></div><div class="pilha-cartas"><div class="quiz" data-numero="1"><p class="quiz-numero">Questão 1</p><p class="quiz-enunciado">O modelo devolve logits para todas as posições do texto. Qual delas interessa para continuar o texto?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">A primeira, que começou tudo.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">A do meio.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">A última, que viu o texto inteiro.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Todas, somadas.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">É a última posição que prevê o próximo token. Por isso o código de gerar pega logits[:, -1].</p></div></div>
