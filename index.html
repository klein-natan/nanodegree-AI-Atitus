<details class="expansivel"><summary>Exemplo</summary><div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">frase</span> <span class="o">=</span> <span class="s2">"Hoje eu vou ao cinema com meus amigos."</span>
</code></pre></div>
<p>Se aparecer <code>�</code>, é uma letra acentuada que o BPE guardou em dois bytes
separados: cada byte sozinho não é uma letra.</p>
</details>
<p><strong>1.b Palpite: quem fica perto de quem?</strong></p>
<details class="expansivel"><summary>Dica 1: a ideia</summary><p>Não existe palpite errado aqui: o ponto é comparar o que você achou com o
que o modelo achou. Pense em que palavra aparece nos mesmos lugares que
&quot;elle&quot; nos livros de Machado.</p>
</details>
<details class="expansivel"><summary>Se a palavra &quot;vira mais de um token&quot;</summary><p>Só palavras comuns ganharam um token próprio no BPE. Escolha uma mais
comum (artigos, pronomes, verbos como &quot;era&quot; e &quot;foi&quot;, nomes dos
personagens).</p>
</details>
<p><strong>1.c Um grupo seu no mapa 3D</strong></p>
<details class="expansivel"><summary>Dica 1: a ideia</summary><p>Quatro palavras do mesmo tipo, cada uma entre aspas: tempo (&quot;dia&quot;,
&quot;noite&quot;), lugares (&quot;casa&quot;, &quot;rua&quot;, &quot;porta&quot;), família (&quot;mãe&quot;, &quot;pae&quot;,
&quot;filha&quot;, &quot;marido&quot;).</p>
</details>
<details class="expansivel"><summary>Exemplo</summary><div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">meu_grupo</span> <span class="o">=</span> <span class="p">[</span><span class="s2">"dia"</span><span class="p">,</span> <span class="s2">"noite"</span><span class="p">,</span> <span class="s2">"dias"</span><span class="p">,</span> <span class="s2">"annos"</span><span class="p">]</span>
</code></pre></div>
</details>
<h3 id="exercicio-10-2">Exercício 10.2<a class="ancora" href="#exercicio-10-2" aria-label="Link para esta secao">#</a></h3>

<span class="n">palavra</span> <span class="o">=</span> <span class="s2">"carta"</span>
</code></pre></div>

<p>A célula de preparação traz o tokenizador, o lote, o <code>montar_modelo</code> da

<h3 id="exercicio-11-1">Exercício 11.1<a class="ancora" href="#exercicio-11-1" aria-label="Link para esta secao">#</a></h3>
<p>A função de treino pelo relógio, testada por um minuto.</p>
<p><strong>1.b A função de treino</strong></p>
<details class="expansivel"><summary>Dica 1: a ideia</summary><p>Duas lacunas. A validação é medida em lotes do texto guardado para isso,
que o modelo nunca vê no treino. E o &quot;melhor&quot; modelo é o de menor perda
na validação, que o Keras chama de <code>val_loss</code>.</p>
</details>
<details class="expansivel"><summary>Dica 2: no código</summary><p>A preparação separou o texto em <code>dados_treino</code> e <code>dados_validacao</code>. O
<code>lotes(...)</code> recebe um dos dois.</p>
</details>
<details class="expansivel"><summary>Resposta</summary><div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">salvar_o_melhor</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">callbacks</span><span class="o">.</span><span class="n">ModelCheckpoint</span><span class="p">(</span>
    <span class="s2">"meu_llm.weights.h5"</span><span class="p">,</span> <span class="n">monitor</span><span class="o">=</span><span class="s2">"val_loss"</span><span class="p">,</span> <span class="n">save_best_only</span><span class="o">=</span><span class="kc">True</span><span class="p">,</span> <span class="n">save_weights_only</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
<span class="o">...</span>
<span class="n">validation_data</span><span class="o">=</span><span class="n">lotes</span><span class="p">(</span><span class="n">dados_validacao</span><span class="p">),</span> <span class="n">validation_steps</span><span class="o">=</span><span class="mi">10</span><span class="p">,</span>
</code></pre></div>
</details>
<p>Se o teste de 1 minuto deu ❌ com a perda acima de 6, confira se a célula
do <code>Relogio</code> (a 1.a) rodou: sem ela, a função de treino nem existe.</p>
<h3 id="exercicio-11-2">Exercício 11.2<a class="ancora" href="#exercicio-11-2" aria-label="Link para esta secao">#</a></h3>

<p><strong>2.a A última posição</strong></p>

<details class="expansivel"><summary>Resposta</summary><div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">ultimos</span> <span class="o">=</span> <span class="n">logits</span><span class="p">[</span><span class="mi">0</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">]</span>
</code></pre></div>
</details>
<p><strong>2.b A temperatura</strong></p>
<details class="expansivel"><summary>Dica 1: a ideia</summary><p>A temperatura divide as pontuações antes do sorteio. O nome dela, dentro
da função, é o do parâmetro.</p>
</details>
<details class="expansivel"><summary>Resposta</summary><div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">sorteado</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">random</span><span class="o">.</span><span class="n">categorical</span><span class="p">(</span><span class="n">ultimos</span> <span class="o">/</span> <span class="n">temperatura</span><span class="p">,</span> <span class="mi">1</span><span class="p">)</span>
</code></pre></div>
</details>
<p><strong>2.c O top-k</strong></p>

O número que a função recebeu como parâmetro.</p>
</details>
<details class="expansivel"><summary>Resposta</summary><div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">melhores</span><span class="p">,</span> <span class="n">candidatos</span> <span class="o">=</span> <span class="n">ops</span><span class="o">.</span><span class="n">top_k</span><span class="p">(</span><span class="n">ultimos</span><span class="p">,</span> <span class="n">k</span><span class="p">)</span>
</code></pre></div>
</details>
<p><strong>2.d O treino de verdade</strong></p>
<p>Não há lacuna. Se a célula terminou em menos de 35 minutos sem você

<template class="pagina" data-id="ia-generativa/aula-12-modelos-de-fundacao" data-titulo="Aula 12 — Modelos de Fundação" data-descricao="Rodar um modelo pronto, e aprender a falar com ele">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>

<h2 id="de-810-mil-para-494-milhoes">De 810 mil para 494 milhões<a class="ancora" href="#de-810-mil-para-494-milhoes" aria-label="Link para esta secao">#</a></h2>
<p>Na Aula 11 você treinou um modelo de 809.728 pesos, em 35 minutos de
processador. Ele continua texto e escreve com a grafia de 1899. É um
modelo de verdade, e é pequeno.</p>
<figure><img src="docs/assets/aula-12/escalas.png" alt="Gráfico de barras em escala logarítmica com quatro modelos: o da Aula 11 com 8e5 pesos, o Qwen de 5e8, um aberto de 8e9 e um comercial de 1e12"><figcaption>Cada barra é cerca de mil vezes a anterior. A arquitetura é a mesma nas quatro.</figcaption></figure>

<p>O modelo de hoje tem 610 vezes o tamanho do seu. Ele se chama
<strong>Qwen2.5-0.5B-Instruct</strong>, é aberto, e cabe em uma pasta de 1 gigabyte.</p>
<p>Ele já tem sucessor: a família Qwen3 saiu em 2025, com um modelo de 0,6
bilhão no mesmo papel, e outros vão sair depois dela. O curso fica na
versão 2.5 porque medimos todos os números desta página nela. Trocar
de modelo é mudar uma linha, e o resto do código continua igual. Essa é
uma das graças de usar a biblioteca padrão.</p>
<p>Um <strong>modelo de fundação</strong> (<em>foundation model</em>) é um modelo grande, treinado
uma vez em muito texto, que serve de base para muitas tarefas diferentes
sem precisar de treino novo. &quot;Fundação&quot; no sentido de alicerce: você
constrói em cima.</p>
<h2 id="as-tres-etapas">As três etapas<a class="ancora" href="#as-tres-etapas" aria-label="Link para esta secao">#</a></h2>
<p>O que separa um continuador de texto de um assistente são duas etapas de
treino a mais, e nenhuma delas usa técnica nova.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Etapa</th>
  <th>O que faz</th>
  <th>Onde você viu</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Pré-treino</td>
  <td>prever o próximo token, em trilhões de tokens</td>
  <td>Aula 11</td>
</tr>
<tr>
  <td>Ajuste por instrução</td>
  <td>treinar em pares de pergunta e resposta boa</td>
  <td>é a mesma perda</td>
</tr>
<tr>
  <td>Ajuste por preferência</td>
  <td>treinar com pessoas comparando duas respostas</td>
  <td>é o mesmo gradiente</td>
</tr>
</tbody>
</table></div>
<p>O <code>-Instruct</code> no nome do modelo quer dizer exatamente isso: ele passou
pelas três. A versão sem o sufixo passou só pela primeira, e se comporta
como o seu modelo da Aula 11.</p>
<h2 id="rodar-tres-linhas">Rodar: três linhas<a class="ancora" href="#rodar-tres-linhas" aria-label="Link para esta secao">#</a></h2>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="kn">from</span><span class="w"> </span><span class="nn">transformers</span><span class="w"> </span><span class="kn">import</span> <span class="n">AutoModelForCausalLM</span><span class="p">,</span> <span class="n">AutoTokenizer</span>

<span class="n">tokenizador</span> <span class="o">=</span> <span class="n">AutoTokenizer</span><span class="o">.</span><span class="n">from_pretrained</span><span class="p">(</span><span class="s2">"Qwen/Qwen2.5-0.5B-Instruct"</span><span class="p">)</span>
<span class="n">modelo</span> <span class="o">=</span> <span class="n">AutoModelForCausalLM</span><span class="o">.</span><span class="n">from_pretrained</span><span class="p">(</span><span class="s2">"Qwen/Qwen2.5-0.5B-Instruct"</span><span class="p">)</span>
</code></pre></div>
<p>A biblioteca <code>transformers</code> já vem no Colab. Na primeira vez ela baixa 1
gigabyte do Hugging Face, que é o repositório público onde quase todo
modelo aberto mora. Não há cadastro, chave nem cobrança.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Sobre a paciência</strong></p>
<p>No processador, esse modelo gera cerca de 1 a 4 tokens por segundo. Uma
resposta de 100 tokens leva de meio minuto a um minuto e meio. Ligar a GPU
T4 gratuita do Colab (Ambiente de execução, Alterar o tipo de ambiente de
execução) deixa isso dezenas de vezes mais rápido. Sem GPU funciona igual,
só devagar.</p>
</div></div>
<h2 id="nao-existe-conversa">Não existe conversa<a class="ancora" href="#nao-existe-conversa" aria-label="Link para esta secao">#</a></h2>
<p>Este é o ponto que muda a forma de pensar. Quando você manda uma mensagem
para um modelo, não existe conversa nenhuma. Existe um texto só, com
marcadores, e o modelo continua esse texto exatamente como na Aula 11.</p>
<figure><img src="docs/assets/aula-12/molde.png" alt="O texto cru que entra no modelo, com as marcas im_start e im_end separando o papel system, o papel user e o começo da resposta do assistant"><figcaption>O que sai do molde de conversa é isto: um texto com marcadores de papel.</figcaption></figure>

<p>Os &quot;papéis&quot; (<code>system</code>, <code>user</code>, <code>assistant</code>) são <strong>tokens especiais</strong> que o
modelo aprendeu no ajuste por instrução. Nada mais. O molde termina em
<code>&lt;|im_start|&gt;assistant</code>, e o modelo faz a única coisa que sabe: continua.</p>
<p>É por isso que a chamada é assim:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">mensagens</span> <span class="o">=</span> <span class="p">[</span>
    <span class="p">{</span><span class="s2">"role"</span><span class="p">:</span> <span class="s2">"system"</span><span class="p">,</span> <span class="s2">"content"</span><span class="p">:</span> <span class="s2">"Você é professor de estatística."</span><span class="p">},</span>
    <span class="p">{</span><span class="s2">"role"</span><span class="p">:</span> <span class="s2">"user"</span><span class="p">,</span> <span class="s2">"content"</span><span class="p">:</span> <span class="s2">"Explique o que é uma regressão logística."</span><span class="p">},</span>
<span class="p">]</span>
<span class="n">texto</span> <span class="o">=</span> <span class="n">tokenizador</span><span class="o">.</span><span class="n">apply_chat_template</span><span class="p">(</span><span class="n">mensagens</span><span class="p">,</span> <span class="n">tokenize</span><span class="o">=</span><span class="kc">False</span><span class="p">,</span>
                                        <span class="n">add_generation_prompt</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
</code></pre></div>
<p>Cada modelo tem o seu molde, com marcadores diferentes. O
<code>apply_chat_template</code> usa o molde certo para o modelo que você carregou.</p>
<h2 id="o-prompt-e-o-unico-controle-que-voce-tem">O prompt é o único controle que você tem<a class="ancora" href="#o-prompt-e-o-unico-controle-que-voce-tem" aria-label="Link para esta secao">#</a></h2>
<p>Você não vai treinar esse modelo. O que você controla é o texto que entra
antes da pergunta. Três peças, nesta ordem:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Peça</th>
  <th>O que faz</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Papel</td>
  <td>quem o modelo deve ser, e para quem ele fala</td>
</tr>
<tr>
  <td>Contexto</td>
  <td>o que ele precisa saber e não sabe</td>
</tr>
<tr>
  <td>Tarefa e formato</td>
  <td>o que fazer, e em que forma entregar</td>
</tr>
</tbody>
</table></div>
<p>Veja a diferença na mesma pergunta:</p>
<figure><img src="docs/assets/aula-12/prompts.png" alt="Três respostas do modelo para a mesma pergunta: sem instrução, com papel definido, e com papel mais formato pedido"><figcaption>Nenhum peso mudou entre as três. O que mudou foi o texto que entrou antes.</figcaption></figure>

<p>Duas coisas para reparar, e as duas são honestas.</p>
<p><strong>A primeira</strong>: definir o papel encurtou a resposta e trocou o jargão por
exemplo concreto. Funcionou.</p>
<p><strong>A segunda</strong>: o terceiro prompt pedia &quot;exatamente três itens, cada um com
no máximo quinze palavras&quot;. O modelo não obedeceu. Um modelo de 0,5
bilhão de pesos segue instruções de conteúdo razoavelmente bem, e
instruções de formato mal. Modelos maiores obedecem; esse não.</p>
<h2 id="poucos-exemplos-valem-mais-que-muita-explicacao">Poucos exemplos valem mais que muita explicação<a class="ancora" href="#poucos-exemplos-valem-mais-que-muita-explicacao" aria-label="Link para esta secao">#</a></h2>
<p>Quando o formato importa, mostrar funciona melhor que mandar. Coloque dois
ou três exemplos no próprio prompt:</p>
<div class="bloco-codigo" data-lingua=""><button class="copiar" type="button">copiar</button><pre class="realce"><code>Classifique o comentário como POSITIVO ou NEGATIVO.

Comentário: o café estava frio.
Resposta: NEGATIVO

Comentário: atendimento rápido e simpático.
Resposta: POSITIVO

Comentário: esperei quarenta minutos.
Resposta:
</code></pre></div>
<p>Isso se chama <strong>few-shot</strong> (poucos exemplos), e o nome contrasta com
<strong>zero-shot</strong>, que é pedir sem exemplo nenhum. Repare que nada foi
treinado: os exemplos são só texto, e a única coisa que eles fazem é
tornar o padrão óbvio para a continuação.</p>
<h2 id="os-parametros-ja-conhecidos">Os parâmetros: já conhecidos<a class="ancora" href="#os-parametros-ja-conhecidos" aria-label="Link para esta secao">#</a></h2>
<p>Tudo o que a Aula 11 ensinou continua valendo, com os mesmos nomes.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Parâmetro</th>
  <th>O que faz</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>temperature</code></td>
  <td>divide os logits: baixa concentra, alta espalha</td>
</tr>
<tr>
  <td><code>top_p</code></td>
  <td>fica com os mais prováveis até somarem p</td>
</tr>
<tr>
  <td><code>max_new_tokens</code></td>
  <td>quantos tokens gerar antes de parar</td>
</tr>
<tr>
  <td><code>do_sample=False</code></td>
  <td>desliga o sorteio: sempre o mais provável</td>
</tr>
</tbody>
</table></div>
<figure><img src="docs/assets/aula-12/temperaturas.png" alt="Duas caixas com três nomes de cafeteria cada: com temperatura 0,2 dois nomes se repetem, com temperatura 1,2 os três são diferentes"><figcaption>Três chamadas iguais em cada linha. A temperatura decide se elas dão a mesma resposta.</figcaption></figure>

<p>Uma regra prática: para extrair informação de um texto, use
<code>do_sample=False</code> e tenha respostas reproduzíveis. Para gerar variação,
suba a temperatura e aceite que cada chamada devolve outra coisa.</p>
<h2 id="ele-nao-sabe-dizer-quot-nao-sei-quot">Ele não sabe dizer &quot;não sei&quot;<a class="ancora" href="#ele-nao-sabe-dizer-quot-nao-sei-quot" aria-label="Link para esta secao">#</a></h2>
<p>Agora a parte que importa no trabalho. Pergunte um fato que dá para
conferir:</p>
<figure><img src="docs/assets/aula-12/alucinacao.png" alt="Três respostas do modelo à pergunta sobre quantos capítulos tem Dom Casmurro: dez, três e três"><figcaption>Dom Casmurro tem 148 capítulos. Dá para contar em <code>data/machado.txt</code>.</figcaption></figure>

<p>Ele respondeu 10, depois 3, depois 3. Nenhuma vez respondeu &quot;não sei&quot;, e
nenhuma vez hesitou. Não é aleatoriedade: é o que a Aula 11 já explicou.
O modelo estima qual token é provável, e &quot;10&quot; é um número provável depois
de &quot;Dom Casmurro tem&quot;. Verdadeiro e falso não são categorias que existam
ali dentro.</p>
<p>Volte à figura dos três prompts e leia de novo a segunda resposta. Ele diz
que a função logit &quot;é a inversa da função logarítmica&quot;. Você sabe da Aula
3 que ela é a inversa da sigmoide, e conseguiu ver o erro na hora.</p>
<p>Guarde essa sensação. <strong>Você só pega o erro em assunto que já conhece.</strong></p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Pedir conta a um modelo de linguagem. Ele prevê tokens, e o token que vem
depois de &quot;17 × 24 =&quot; é o que costuma vir em textos parecidos, não o
resultado da multiplicação. Modelos grandes acertam contas pequenas de
tanto terem visto, e erram as grandes com a mesma confiança. Se precisa de
conta, use uma calculadora, e deixe o modelo escrever o texto em volta.</p>
</div></div>
<h2 id="aberto-ou-por-api">Aberto ou por API<a class="ancora" href="#aberto-ou-por-api" aria-label="Link para esta secao">#</a></h2>
<p>Existem dois caminhos para usar um modelo de fundação, e a escolha é de
projeto, não de gosto.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th></th>
  <th>Modelo aberto (o de hoje)</th>
  <th>Modelo por API</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Onde roda</td>
  <td>na sua máquina ou no seu servidor</td>
  <td>no servidor de outra empresa</td>
</tr>
<tr>
  <td>Custo</td>
  <td>processamento seu, e nada por pergunta</td>
  <td>por token, e cresce com o uso</td>
</tr>
<tr>
  <td>Privacidade</td>
  <td>o dado não sai de casa</td>
  <td>o dado sai de casa</td>
</tr>
<tr>
  <td>Qualidade</td>
  <td>boa nos grandes, limitada nos pequenos</td>
  <td>hoje, a melhor disponível</td>
</tr>
<tr>
  <td>Controle</td>
  <td>você escolhe a versão, e ela não muda</td>
  <td>a versão muda quando a empresa quiser</td>
</tr>
</tbody>
</table></div>
<p>O critério que decide na prática costuma ser um só: se o dado não pode
sair da empresa, o modelo aberto deixa de ser opção e passa a ser
requisito.</p>

<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>
<p>Você vai construir um assistente que responde perguntas sobre este curso,
usando dois modelos abertos e nenhuma chave de API. E vai medir se ele

</div></div>
<h2 id="o-problema">O problema<a class="ancora" href="#o-problema" aria-label="Link para esta secao">#</a></h2>
<p>Pergunte ao modelo da Aula 12 o que significa a sigla BPE. Ele responde,
com toda a segurança do mundo, que é o <em>Bilingual Processing Engine</em>, uma
ferramenta da Microsoft.</p>
<p>Isso não existe. E a resposta certa, &quot;codificação por pares de bytes&quot;,
está escrita na página da Aula 9 deste curso, que ele nunca leu.</p>
<p>O problema não é o modelo estar errado. É ele nunca ter visto o seu
documento. E isso vale para todo documento que importa no trabalho:
o manual interno, o contrato, a norma da empresa, o histórico do cliente.</p>
<p><strong>Por que não treinar o modelo com o seu documento?</strong> Porque custa caro,
demora, precisa de muito mais texto do que você tem, e vira obsoleto no
dia em que o documento muda. Treinar não é a resposta.</p>
<h2 id="rag-buscar-antes-de-responder">RAG: buscar antes de responder<a class="ancora" href="#rag-buscar-antes-de-responder" aria-label="Link para esta secao">#</a></h2>
<p>A resposta é bem mais simples. Antes de mandar a pergunta ao modelo,
procure no seu documento os trechos que falam do assunto, e cole eles no
prompt.</p>
<figure><img src="docs/assets/aula-13/arquitetura.png" alt="Quatro caixas em sequência: a pergunta do usuário, a busca dos trechos parecidos, a colagem dos trechos no prompt e a resposta do modelo, com uma seta vindo dos documentos para a busca"><figcaption>Quatro etapas. Só a última usa o modelo de linguagem.</figcaption></figure>

<p>Isso se chama <strong>RAG</strong> (<em>retrieval-augmented generation</em>, geração aumentada
por busca). O nome é feio e a ideia é simples: o modelo continua sendo o
mesmo, com os mesmos pesos. O que muda é o texto que entra antes da
pergunta.</p>
<p>Repare no que isso resolve de imediato:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Problema</th>
  <th>Como o RAG resolve</th>
</tr>
</thead>
<tbody>
<tr>
  <td>O modelo não conhece o seu documento</td>
  <td>você coloca o trecho no prompt</td>
</tr>
<tr>
  <td>O documento mudou ontem</td>
  <td>você busca no documento de hoje</td>
</tr>
<tr>
  <td>Você precisa saber de onde veio a resposta</td>
  <td>você sabe qual trecho usou</td>
</tr>
<tr>
  <td>O dado é sigiloso</td>
  <td>com modelo aberto, nada sai da sua máquina</td>
</tr>
</tbody>
</table></div>
<h2 id="dividir-o-documento-em-pedacos">Dividir o documento em pedaços<a class="ancora" href="#dividir-o-documento-em-pedacos" aria-label="Link para esta secao">#</a></h2>
<p>O primeiro passo é prático. Você não coloca o documento inteiro no prompt:
não cabe na janela de contexto, e mesmo se coubesse, encheria de texto
irrelevante.</p>
<figure><img src="docs/assets/aula-13/pedacos.png" alt="Histograma dos 244 pedaços do curso, com mediana de 737 caracteres, ao lado de um exemplo de trecho"><figcaption>Uma seção por pedaço; o título acompanha o texto na busca.</figcaption></figure>

<p>O tamanho do pedaço é a primeira decisão do projeto, e ela tem um
compromisso claro:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Pedaço</th>
  <th>O que acontece</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Grande demais</td>
  <td>vários assuntos no mesmo vetor, e a busca fica imprecisa</td>
</tr>
<tr>
  <td>Pequeno demais</td>
  <td>a frase perde o contexto e vira ambígua</td>
</tr>
<tr>
  <td>Do tamanho de uma seção</td>
  <td>costuma funcionar, e é o que usamos aqui</td>
</tr>
</tbody>
</table></div>
<p>Aqui foram 244 pedaços, um por seção das páginas do curso, com mediana de
737 caracteres.</p>
<h2 id="transformar-texto-em-vetor">Transformar texto em vetor<a class="ancora" href="#transformar-texto-em-vetor" aria-label="Link para esta secao">#</a></h2>
<p>Agora a parte interessante. Para achar os pedaços que falam de um assunto,
você precisa comparar significado, e não palavras. A pergunta &quot;o que é a
máscara causal?&quot; tem que encontrar um trecho que talvez nem repita essas
palavras.</p>
<p>A solução usa a mesma ideia da Aula 10. Passe o texto por um modelo, pegue
os vetores de todos os tokens e tire a média:</p>
<div class="formula" title="v = \frac{1}{n}\sum_{i=1}^{n} h_i"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>v</mi><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><msub><mi>h</mi><mi>i</mi></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>hᵢ</code></td>
  <td>o vetor que o modelo produziu para o token <code>i</code></td>
</tr>
<tr>
  <td><code>n</code></td>
  <td>quantos tokens o texto tem</td>
</tr>
<tr>
  <td><code>v</code></td>
  <td>o vetor da frase inteira</td>
</tr>
</tbody>
</table></div>
<p>O resultado é o <strong>embedding de frase</strong> (<em>sentence embedding</em>). Aqui ele
tem 384 números, e o modelo que o produz é o <code>multilingual-e5-small</code>, com
118 milhões de pesos, treinado para que frases parecidas caiam perto.</p>
<p>Depois de normalizar os vetores para tamanho 1, comparar dois textos é o
produto escalar da Aula 10:</p>
<figure><img src="docs/assets/aula-13/parecenca.png" alt="Matriz 6 por 6 com a similaridade entre seis frases: os pares que falam do mesmo assunto têm valores altos, mesmo sem palavras em comum"><figcaption>"O gato dormiu no sofá" e "o cachorro cochilou no tapete" não têm palavra em comum, e ficam perto.</figcaption></figure>

<p>Esse número tem nome: <strong>similaridade do cosseno</strong>. Com vetores de tamanho
1, ela é exatamente o produto escalar, e vai de −1 (opostos) a 1
(idênticos).</p>
<h2 id="a-busca">A busca<a class="ancora" href="#a-busca" aria-label="Link para esta secao">#</a></h2>
<p>Com todos os 244 pedaços virados em vetor, buscar é uma multiplicação de
matriz e uma ordenação:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">vetor_pergunta</span> <span class="o">=</span> <span class="n">calcular_embeddings</span><span class="p">([</span><span class="s2">"O que é a máscara causal?"</span><span class="p">],</span> <span class="s2">"query: "</span><span class="p">)[</span><span class="mi">0</span><span class="p">]</span>
<span class="n">notas</span> <span class="o">=</span> <span class="n">vetores</span> <span class="o">@</span> <span class="n">vetor_pergunta</span>
<span class="n">melhores</span> <span class="o">=</span> <span class="n">np</span><span class="o">.</span><span class="n">argsort</span><span class="p">(</span><span class="n">notas</span><span class="p">)[::</span><span class="o">-</span><span class="mi">1</span><span class="p">][:</span><span class="mi">3</span><span class="p">]</span>     <span class="c1"># os três maiores</span>
</code></pre></div>
<figure><img src="docs/assets/aula-13/busca.png" alt="Gráfico de barras com os quatro pedaços mais parecidos com a pergunta sobre a máscara causal, com o primeiro sendo a seção certa da Aula 10"><figcaption>O primeiro é a seção certa. Os três melhores entram no prompt: os dois de apoio ajudam quando o primeiro erra.</figcaption></figure>

<p>Num projeto grande, com milhões de pedaços, essa multiplicação vira lenta
e você guarda os vetores numa <strong>base vetorial</strong>, que é um banco de dados
especializado em achar vizinhos rápido. Com 244 pedaços, uma matriz
resolve.</p>
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>Por que não buscar por palavra</strong></p>
<p>Buscar por palavra funciona, é barato, e falha exatamente onde dói: quando
a pergunta usa palavras diferentes das do documento. Na prática, sistemas
sérios fazem os dois e juntam os resultados. Isso se chama busca híbrida.</p>
</div></div>
<h2 id="montar-o-prompt">Montar o prompt<a class="ancora" href="#montar-o-prompt" aria-label="Link para esta secao">#</a></h2>
<p>O prompt aumentado é literalmente uma colagem:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">contexto</span> <span class="o">=</span> <span class="s2">"</span><span class="se">\n\n</span><span class="s2">"</span><span class="o">.</span><span class="n">join</span><span class="p">(</span><span class="n">pedacos</span><span class="p">[</span><span class="n">i</span><span class="p">][:</span><span class="mi">900</span><span class="p">]</span> <span class="k">for</span> <span class="n">i</span> <span class="ow">in</span> <span class="n">melhores</span><span class="o">.</span><span class="n">indices</span><span class="p">)</span>
<span class="n">prompt</span> <span class="o">=</span> <span class="p">(</span><span class="sa">f</span><span class="s2">"Use apenas o texto abaixo para responder.</span><span class="se">\n\n</span><span class="si">{</span><span class="n">contexto</span><span class="si">}</span><span class="se">\n\n</span><span class="s2">"</span>
          <span class="sa">f</span><span class="s2">"Pergunta: </span><span class="si">{</span><span class="n">pergunta</span><span class="si">}</span><span class="se">\n</span><span class="s2">"</span>
          <span class="s2">"Responda em uma frase curta, só com o que está no texto."</span><span class="p">)</span>
</code></pre></div>
<p>Três detalhes que fazem diferença, e todos vieram de tentar:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Detalhe</th>
  <th>Por quê</th>
</tr>
</thead>
<tbody>
<tr>
  <td>&quot;Use apenas o texto abaixo&quot;</td>
  <td>reduz a chance de ele responder de memória</td>
</tr>
<tr>
  <td>Cortar em 900 caracteres</td>
  <td>prompt curto é mais rápido e o modelo se perde menos</td>
</tr>
<tr>
  <td>&quot;Responda em uma frase curta&quot;</td>
  <td>sem isso, um modelo pequeno divaga</td>
</tr>
</tbody>
</table></div>
<figure><img src="docs/assets/aula-13/antes_depois.png" alt="Duas caixas com a resposta à pergunta sobre a máscara causal: sem RAG ele fala de manipulação digital, com RAG ele fala do menos infinito que vira zero"><figcaption>Mesmo modelo, mesmos pesos. A diferença inteira está no texto que entrou antes.</figcaption></figure>

<h2 id="medir-que-e-a-parte-que-ninguem-faz">Medir, que é a parte que ninguém faz<a class="ancora" href="#medir-que-e-a-parte-que-ninguem-faz" aria-label="Link para esta secao">#</a></h2>
<p>Uma demonstração que funciona não prova nada. Monte um conjunto de
perguntas cuja resposta você conhece, e conte quantas o sistema acerta.
Aqui são seis, todas sobre aulas que você já assistiu:</p>
<figure><img src="docs/assets/aula-13/avaliacao.png" alt="Seis perguntas sobre o curso, cada uma com a resposta sem RAG em cinza e com RAG em vermelho"><figcaption>Seis perguntas, dois modos. Em cinza o modelo sozinho, em vermelho o mesmo modelo com os trechos.</figcaption></figure>

<p>O placar honesto: <strong>duas certas, duas parciais, duas erradas</strong>.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Pergunta</th>
  <th>Sem RAG</th>
  <th>Com RAG</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Máscara causal</td>
  <td>&quot;manipulação digital&quot;</td>

<p>Duas leituras importam.</p>
<p><strong>A primeira</strong>: as duas erradas erraram por motivos diferentes, e isso
muda o conserto. Na sigla BPE, <strong>o problema foi buscar</strong>: os três trechos
que vieram citam o BPE de passagem, e nenhum é a seção que diz o que a
sigla quer dizer. Pedaços menores ou uma busca que também olha a palavra
exata resolveriam. Na perplexidade, a busca trouxe a seção certa, que fala
do chute ao acaso (1.024) antes de dar o número do modelo (29,5), e o
modelo pegou o primeiro número. <strong>O problema não foi buscar, foi ler.</strong> Um
modelo maior resolveria; um prompt melhor talvez.</p>
<p><strong>A segunda</strong>: na pergunta do Fashion-MNIST, ele já sabia. RAG não é
sempre necessário. Ele é necessário quando o assunto é seu, e não do
mundo.</p>

<p>Achar que RAG acaba com a alucinação. Ele reduz muito, e não elimina. O
modelo ainda pode misturar dois trechos, pegar a linha errada de uma
tabela, ou completar com o que ele acha que faz sentido. Você continua
precisando conferir, e continua precisando medir.</p>

<h2 id="o-que-fazer-quando-nao-esta-bom">O que fazer quando não está bom<a class="ancora" href="#o-que-fazer-quando-nao-esta-bom" aria-label="Link para esta secao">#</a></h2>
<p>Uma lista de conserto, na ordem em que vale a pena tentar:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Sintoma</th>
  <th>O que mexer</th>
</tr>
</thead>
<tbody>
<tr>
  <td>A busca traz trecho irrelevante</td>
  <td>mude o tamanho do pedaço</td>
</tr>
<tr>
  <td>A busca acerta e a resposta erra</td>
  <td>modelo maior, ou prompt mais específico</td>
</tr>
<tr>
  <td>A resposta inventa detalhe</td>
  <td>peça citação do trecho, e confira</td>
</tr>
<tr>
  <td>A resposta é longa e vaga</td>
  <td>limite o formato no prompt</td>
</tr>
<tr>
  <td>Está lento</td>
  <td>menos trechos, ou trechos menores</td>
</tr>
</tbody>
</table></div>
<p>O que existe depois disso, e que este curso não cobre: <strong>reordenação</strong>
(passar os 20 melhores por um modelo mais caro que reordena), <strong>busca
híbrida</strong> (palavra mais vetor) e <strong>agentes</strong> (o modelo decide sozinho
quando buscar, quando calcular e quando responder).</p>

    if (rota.ancora) {
      var alvo = document.getElementById(rota.ancora);
      if (alvo) { fixarAncora(alvo); return; }
    }
    scrollTo(0, 0);
    marcarSumario();
  }

  // As figuras acima da âncora carregam depois e empurram o texto para
  // baixo. Enquanto a pessoa não mexer na página, cada figura que termina
  // de carregar traz a âncora de volta para o topo.
  function fixarAncora(alvo) {
    alvo.scrollIntoView();
    var mexeu = false;
    function parar() { mexeu = true; }
    ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (evento) {
      addEventListener(evento, parar, { once: true, passive: true });
    });
    Array.prototype.forEach.call(artigo.querySelectorAll("img"), function (img) {
      if (img.complete) return;
      img.addEventListener("load", function () {
        if (!mexeu && alvo.isConnected) alvo.scrollIntoView();
      }, { once: true });
    });
  }

  addEventListener("hashchange", irPara);

  /* ------------------------------------------------------- sumario ativo */
  var marcando = false;
  function marcarSumario() {
    var links = sumario.querySelectorAll("a");
    if (!links.length) return;
    var atual = null;
    Array.prototype.forEach.call(links, function (a) {
      var id = a.getAttribute("href").split("#").pop();
      var alvo = document.getElementById(id);
      if (alvo && alvo.getBoundingClientRect().top < 120) atual = a;
    });
    Array.prototype.forEach.call(links, function (a) { a.classList.toggle("ativo", a === atual); });
  }
  addEventListener("scroll", function () {
    if (marcando) return;
    marcando = true;
    requestAnimationFrame(function () { marcarSumario(); marcando = false; });
  }, { passive: true });

  /* -------------------------------------------------------------- copiar */
  document.addEventListener("click", function (e) {
    var botao = e.target.closest ? e.target.closest(".copiar") : null;
    if (!botao) return;
    var codigo = botao.parentNode.querySelector("code");
    var texto = codigo ? codigo.textContent : "";
    var pronto = function () {
      botao.textContent = "copiado";
      setTimeout(function () { botao.textContent = "copiar"; }, 1400);
    };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(texto).then(pronto, function () {});
    } else {
      var area = document.createElement("textarea");
      area.value = texto;
      document.body.appendChild(area);
      area.select();
      try { document.execCommand("copy"); pronto(); } catch (err) {}
      document.body.removeChild(area);
    }
  });

  /* ---------------------------------------------------------------- quiz */
  // Cada questão aceita uma resposta. O placar fica colado no fim da tela
  // e soma os acertos; "Recomeçar" limpa tudo. Nada é guardado: recarregar
  // a página também recomeça.
  function prepararQuiz(corpo) {
    Array.prototype.forEach.call(corpo.querySelectorAll(".pilha"), prepararPilha);
    var questoes = soltas(corpo);
    if (!questoes.length) return;
    var placar = document.createElement("div");
    placar.className = "quiz-placar";
    placar.setAttribute("aria-live", "polite");
    placar.innerHTML =
      '<div><p class="quiz-placar-nota"></p><p class="quiz-placar-dica"></p></div>' +
      '<button class="quiz-recomecar" type="button">Recomeçar</button>';
    questoes[questoes.length - 1].insertAdjacentElement("afterend", placar);
    atualizarPlacar(corpo);
  }

  // As questões fora de pilha, que o placar da página soma.
  function soltas(corpo) {
    return Array.prototype.filter.call(corpo.querySelectorAll(".quiz"), function (q) {
      return !q.closest(".pilha");
    });
  }

  // Uma pilha mostra uma carta por vez. Depois da resposta aparece o botão
  // da próxima; depois da última, o resultado e o botão de refazer.
  function prepararPilha(pilha) {
    var cartas = pilha.querySelectorAll(".quiz");
    Array.prototype.forEach.call(cartas, function (c, i) {
      c.classList.remove("atual", "saindo", "quiz-respondido", "quiz-acertou", "quiz-errou");
      c.querySelector(".quiz-retorno").hidden = true;
      var botao = c.querySelector(".pilha-proxima");
      if (botao) botao.remove();
      Array.prototype.forEach.call(c.querySelectorAll(".quiz-opcao"), function (b) {
        b.disabled = false;
        b.classList.remove("certa", "errada");
      });
      if (i === 0) c.classList.add("atual");
    });
    pilha.querySelector(".pilha-fim").hidden = true;
    atualizarPilha(pilha, 0);
  }

  function atualizarPilha(pilha, indice) {
    var total = pilha.querySelectorAll(".quiz").length;
    pilha.querySelector(".pilha-cartas").dataset.restantes = String(Math.max(0, total - indice - 1));
    pilha.querySelector(".pilha-progresso").textContent =
      indice < total ? "Pergunta " + (indice + 1) + " de " + total : "Fim";
  }

  function avancarPilha(pilha) {
    var cartas = Array.prototype.slice.call(pilha.querySelectorAll(".quiz"));
    var atual = pilha.querySelector(".quiz.atual");
    var indice = cartas.indexOf(atual);
    atual.classList.remove("atual");
    atual.classList.add("saindo");
    setTimeout(function () {
      atual.classList.remove("saindo");
      if (indice + 1 < cartas.length) {
        cartas[indice + 1].classList.add("atual");
        atualizarPilha(pilha, indice + 1);
        var primeira = cartas[indice + 1].querySelector(".quiz-opcao");
        if (primeira) primeira.focus({ preventScroll: true });
      } else {
        var acertos = pilha.querySelectorAll(".quiz-acertou").length;
        var fim = pilha.querySelector(".pilha-fim");
        fim.querySelector(".pilha-nota").textContent = "Você acertou " + acertos + " de " + cartas.length;
        fim.querySelector(".pilha-dica").textContent = acertos === cartas.length
          ? "Todas certas. Pode ir para o exercício."
          : (acertos >= cartas.length - 1
            ? "Muito bem. Releia a explicação da que errou, e vá para o exercício."
            : "Vale rever os slides desta microaula antes do exercício.");
        fim.hidden = false;
        atualizarPilha(pilha, cartas.length);
      }
    }, 280);
  }

  function atualizarPlacar(corpo) {
    var placar = corpo.querySelector(".quiz-placar");
    if (!placar) return;
    var questoes = soltas(corpo);
    var total = questoes.length;
    var respondidas = 0;
    var acertos = 0;
    questoes.forEach(function (q) {
      if (q.classList.contains("quiz-respondido")) respondidas++;
      if (q.classList.contains("quiz-acertou")) acertos++;
    });
    placar.querySelector(".quiz-placar-nota").textContent =
      "Acertos: " + acertos + " de " + total;
    var dica;
    if (respondidas < total) {
      dica = "Respondidas: " + respondidas + " de " + total + ".";
    } else if (acertos === total) {
      dica = "Todas certas! Você domina o básico dos modelos lineares.";
    } else if (acertos >= total * 0.7) {
      dica = "Muito bem. Releia as explicações das que errou.";
    } else {
      dica = "Vale revisar as aulas: as explicações de cada questão indicam o ponto.";
    }
    placar.querySelector(".quiz-placar-dica").textContent = dica;
  }

  document.addEventListener("click", function (e) {
    var alvo = e.target.closest ? e.target : null;
    if (!alvo) return;

    var proxima = alvo.closest(".pilha-proxima");
    if (proxima) {
      avancarPilha(proxima.closest(".pilha"));
      return;
    }
    var refazer = alvo.closest(".pilha-refazer");
    if (refazer) {
      var pilhaRefeita = refazer.closest(".pilha");
      prepararPilha(pilhaRefeita);
      pilhaRefeita.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }

    var recomecar = alvo.closest(".quiz-recomecar");
    if (recomecar) {
      var corpoQuiz = recomecar.closest(".quiz-placar").parentNode;
      soltas(corpoQuiz).forEach(function (q) {
        q.classList.remove("quiz-respondido", "quiz-acertou", "quiz-errou");
        q.querySelector(".quiz-retorno").hidden = true;
        Array.prototype.forEach.call(q.querySelectorAll(".quiz-opcao"), function (b) {
          b.disabled = false;
          b.classList.remove("certa", "errada");
        });
      });
      atualizarPlacar(corpoQuiz);
      var primeira = soltas(corpoQuiz)[0];
      if (primeira) primeira.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }

    var opcao = alvo.closest(".quiz-opcao");
    if (!opcao || opcao.disabled) return;
    var questao = opcao.closest(".quiz");
    var acertou = opcao.dataset.certa === "1";
    Array.prototype.forEach.call(questao.querySelectorAll(".quiz-opcao"), function (b) {
      b.disabled = true;
      if (b.dataset.certa === "1") b.classList.add("certa");
    });
    if (!acertou) opcao.classList.add("errada");
    questao.classList.add("quiz-respondido", acertou ? "quiz-acertou" : "quiz-errou");
    questao.querySelector(".quiz-veredito").textContent = acertou
      ? "Certo!"
      : "Não é essa. A resposta certa está em verde.";
    questao.querySelector(".quiz-retorno").hidden = false;
    var pilha = questao.closest(".pilha");
    if (pilha) {
      var botao = document.createElement("button");
      botao.type = "button";
      botao.className = "pilha-proxima";
      var ultima = !questao.nextElementSibling || !questao.nextElementSibling.classList.contains("quiz");
      botao.textContent = ultima ? "Ver o resultado" : "Próxima pergunta →";
      questao.querySelector(".quiz-retorno").appendChild(botao);
      botao.focus({ preventScroll: true });
      return;
    }
    atualizarPlacar(questao.parentNode);
  });

  /* ---------------------------------------------------------------- lupa */
  var lupa = document.getElementById("lupa");
  var lupaImg = document.getElementById("lupa-img");
  document.addEventListener("click", function (e) {
    if (e.target.tagName === "IMG" && e.target.closest("figure")) {
      lupaImg.src = e.target.src;
      lupaImg.alt = e.target.alt || "";
      lupa.classList.add("aberta");
    }
  });
  lupa.addEventListener("click", function () { lupa.classList.remove("aberta"); lupaImg.src = ""; });

  /* --------------------------------------------------------------- busca */
  function dobrar(t) {
    return t.normalize("NFC").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  }

  var indice = null;
  function montarIndice() {
    if (indice) return indice;
    indice = [];
    ordem.forEach(function (id) {
      var p = paginas[id];
      if (!p) return;
      var no = p.modelo.content.cloneNode(true);
      // Legendas, ancoras e formulas viram ruido no trecho do resultado.
      Array.prototype.forEach.call(
        no.querySelectorAll("figcaption, .ancora, .formula, .formula-bruta, .quiz"),
        function (x) { x.remove(); }
      );

      var secoes = [{ ancora: "", titulo: p.titulo, partes: [p.descricao || ""] }];
      Array.prototype.forEach.call(no.children, function (el) {
        var tag = el.tagName;
        if (tag === "H2" || tag === "H3") {
          secoes.push({ ancora: el.id, titulo: el.textContent.trim(), partes: [] });
        } else {
          secoes[secoes.length - 1].partes.push(el.textContent);
        }
      });

      secoes.forEach(function (s) {
        var texto = s.partes.join(" ").replace(/\s+/g, " ").trim();
        indice.push({
          id: id,
          pagina: p.titulo,
          ancora: s.ancora,
          titulo: s.titulo,
          texto: texto,
          tituloDobrado: dobrar(s.titulo),
          paginaDobrada: dobrar(p.titulo),
          textoDobrado: dobrar(texto)
        });
      });
    });
    return indice;
  }

  function buscar(consulta) {
    var termos = dobrar(consulta).split(/\s+/).filter(Boolean);
    if (!termos.length) return [];
    var achados = [];
    montarIndice().forEach(function (s) {
      var pontos = 0, posicao = -1, faltou = false;
      termos.forEach(function (termo) {
        var noTitulo = s.tituloDobrado.indexOf(termo);
        var noTexto = s.textoDobrado.indexOf(termo);
        var naPagina = s.paginaDobrada.indexOf(termo);
        if (noTitulo === -1 && noTexto === -1 && naPagina === -1) { faltou = true; return; }
        if (noTitulo > -1) pontos += s.ancora ? 16 : 26;
        if (naPagina > -1) pontos += 10;
        if (noTexto > -1) { pontos += 4; if (posicao === -1) posicao = noTexto; }
      });
      if (faltou || !pontos) return;
      achados.push({ secao: s, pontos: pontos, posicao: posicao, termo: termos[0] });
    });
    achados.sort(function (a, b) { return b.pontos - a.pontos; });
    return achados.slice(0, 40);
  }

  function trecho(s, posicao, termo) {
    if (!s.texto) return "";
    if (posicao === -1) {
      posicao = s.textoDobrado.indexOf(termo);
      if (posicao === -1) return escapar(s.texto.slice(0, 130)) + (s.texto.length > 130 ? "…" : "");
    }
    var ini = Math.max(0, posicao - 55);
    var fim = Math.min(s.texto.length, posicao + termo.length + 95);
    var antes = (ini > 0 ? "…" : "") + s.texto.slice(ini, posicao);
    var meio = s.texto.slice(posicao, posicao + termo.length);
    var depois = s.texto.slice(posicao + termo.length, fim) + (fim < s.texto.length ? "…" : "");
    return escapar(antes) + "<mark>" + escapar(meio) + "</mark>" + escapar(depois);
  }

  var fundoBusca = document.getElementById("busca-fundo");
  var campo = document.getElementById("campo-busca");
  var listaBusca = document.getElementById("busca-resultados");
  var marcado = -1;

  function desenharResultados(achados, consulta) {
    if (!consulta.trim()) {
      listaBusca.innerHTML = '<p class="busca-vazio">Busque por um conceito, uma fórmula ou o nome de uma aula.</p>';
      marcado = -1;
      return;
    }
    if (!achados.length) {
      listaBusca.innerHTML = '<p class="busca-vazio">Nada encontrado para <strong>' + escapar(consulta) + "</strong>.</p>";
      marcado = -1;
      return;
    }
    listaBusca.innerHTML = achados.map(function (a, i) {
      var s = a.secao;
      var destino = "#/" + s.id + (s.ancora ? "#" + s.ancora : "");
      var onde = s.ancora ? s.pagina : (parteDe[s.id] || "Curso");
      return '<a class="resultado' + (i === 0 ? " marcado" : "") + '" href="' + destino + '">' +
             '<div class="onde">' + escapar(onde) + "</div>" +
             '<div class="que">' + escapar(s.titulo) + "</div>" +
             '<div class="trecho">' + trecho(s, a.posicao, a.termo) + "</div></a>";
    }).join("");
    marcado = 0;
  }

  function abrirBusca() {
    fundoBusca.classList.add("aberta");
    campo.focus();
    campo.select();
    desenharResultados(buscar(campo.value), campo.value);
  }
  function fecharBusca() { fundoBusca.classList.remove("aberta"); }

  document.getElementById("botao-busca").addEventListener("click", abrirBusca);
  fundoBusca.addEventListener("click", function (e) { if (e.target === fundoBusca) fecharBusca(); });
  listaBusca.addEventListener("click", function (e) { if (e.target.closest(".resultado")) fecharBusca(); });

  campo.addEventListener("input", function () {
    desenharResultados(buscar(this.value), this.value);
    listaBusca.scrollTop = 0;
  });

  function mover(passo) {
    var itens = listaBusca.querySelectorAll(".resultado");
    if (!itens.length) return;
    if (marcado > -1 && itens[marcado]) itens[marcado].classList.remove("marcado");
    marcado = (marcado + passo + itens.length) % itens.length;
    itens[marcado].classList.add("marcado");
    itens[marcado].scrollIntoView({ block: "nearest" });
  }

  campo.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); mover(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); mover(-1); }
    else if (e.key === "Enter") {
      var itens = listaBusca.querySelectorAll(".resultado");
      if (itens[marcado]) { e.preventDefault(); location.hash = itens[marcado].getAttribute("href"); fecharBusca(); }
    }
  });

  addEventListener("keydown", function (e) {
    var digitando = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); abrirBusca(); return; }
    if (e.key === "/" && !digitando) { e.preventDefault(); abrirBusca(); return; }
    if (e.key === "Escape") {
      fecharBusca();
      fecharMenu();
      if (lupa.classList.contains("aberta")) { lupa.classList.remove("aberta"); lupaImg.src = ""; }
    }
  });

  /* ------------------------------------------------------------- arranque */
  irPara();
})();
</script>
</body>
