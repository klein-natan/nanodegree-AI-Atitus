<h2 id="o-que-o-prophet-faz">O que o Prophet faz<a class="ancora" href="#o-que-o-prophet-faz" aria-label="Link para esta secao">#</a></h2>
<p>Uma equipe da Meta criou o Prophet pensando em séries de negócio: vendas,
acessos, pedidos. A ideia é a mesma da Aula 5, escrita
como modelo.</p>
<div class="formula" title="y(t) = g(t) + s(t) + h(t) + \varepsilon_t"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>y</mi><mo stretchy="false">&#x00028;</mo><mi>t</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0003D;</mo><mi>g</mi><mo stretchy="false">&#x00028;</mo><mi>t</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0002B;</mo><mi>s</mi><mo stretchy="false">&#x00028;</mo><mi>t</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0002B;</mo><mi>h</mi><mo stretchy="false">&#x00028;</mo><mi>t</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0002B;</mo><msub><mi>&#x003B5;</mi><mi>t</mi></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>y(t)</code></td>
  <td>o valor da série no dia <code>t</code></td>
</tr>
<tr>
  <td><code>g(t)</code></td>
  <td>a tendência: para onde o negócio caminha</td>
</tr>
<tr>
  <td><code>s(t)</code></td>
  <td>as sazonalidades: o padrão da semana e o do ano</td>
</tr>
<tr>
  <td><code>h(t)</code></td>
  <td>os feriados e eventos especiais</td>
</tr>
<tr>
  <td><code>εₜ</code></td>
  <td>o resto, o que nenhuma das peças explica</td>
</tr>
</tbody>
</table></div>
<p>Exemplo, para uma quarta-feira de julho de 2025: a tendência dá R$ 1.320,
a sazonalidade semanal tira R$ 15, a anual soma R$ 110 e não há feriado. A
previsão é <code>1.320 − 15 + 110 = 1.415</code> reais.</p>
<p>Repare que é a regressão com calendário da aula passada, com as mesmas
peças. A diferença é que você não monta nenhuma coluna. O Prophet cria
sozinho as curvas da semana e do ano, e ainda deixa a tendência mudar de
inclinação.</p>
<h2 id="o-formato-que-ele-exige">O formato que ele exige<a class="ancora" href="#o-formato-que-ele-exige" aria-label="Link para esta secao">#</a></h2>
<p>O Prophet só aceita a tabela com duas colunas, e com estes nomes exatos:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Coluna</th>
  <th>O que é</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>ds</code></td>
  <td>a data (<em>datestamp</em>)</td>
</tr>
<tr>
  <td><code>y</code></td>
  <td>o valor que você quer prever</td>
</tr>
</tbody>
</table></div>
<p>Renomear as colunas é o primeiro passo de qualquer projeto com Prophet, e
é onde mais gente trava na primeira vez.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">serie</span> <span class="o">=</span> <span class="n">dados</span><span class="o">.</span><span class="n">rename</span><span class="p">(</span><span class="n">columns</span><span class="o">=</span><span class="p">{</span><span class="s2">"data"</span><span class="p">:</span> <span class="s2">"ds"</span><span class="p">,</span> <span class="s2">"vendas"</span><span class="p">:</span> <span class="s2">"y"</span><span class="p">})</span>
</code></pre></div>
<h2 id="tres-linhas-para-treinar-e-prever">Três linhas para treinar e prever<a class="ancora" href="#tres-linhas-para-treinar-e-prever" aria-label="Link para esta secao">#</a></h2>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">modelo</span> <span class="o">=</span> <span class="n">Prophet</span><span class="p">()</span>
<span class="n">modelo</span><span class="o">.</span><span class="n">fit</span><span class="p">(</span><span class="n">treino</span><span class="p">)</span>
<span class="n">futuro</span> <span class="o">=</span> <span class="n">modelo</span><span class="o">.</span><span class="n">make_future_dataframe</span><span class="p">(</span><span class="n">periods</span><span class="o">=</span><span class="mi">28</span><span class="p">)</span>
<span class="n">previsao</span> <span class="o">=</span> <span class="n">modelo</span><span class="o">.</span><span class="n">predict</span><span class="p">(</span><span class="n">futuro</span><span class="p">)</span>
</code></pre></div>
<p><code>make_future_dataframe</code> cria a tabela de datas que você quer prever,
incluindo o histórico. <code>predict</code> devolve uma tabela com uma linha por dia
e várias colunas, das quais três importam agora: <code>yhat</code> (a previsão),
<code>yhat_lower</code> e <code>yhat_upper</code> (as bordas do intervalo de incerteza).</p>
<figure><img src="docs/assets/aula-05/previsao_prophet.png" alt="Gráfico com as vendas observadas, a linha de previsão do Prophet e uma faixa sombreada de incerteza em torno dela, com uma linha vertical marcando o início do teste"><figcaption>À direita da linha amarela, o modelo está prevendo dias que nunca viu.</figcaption></figure>

<h2 id="as-pecas-que-ele-estimou-sozinho">As peças que ele estimou sozinho<a class="ancora" href="#as-pecas-que-ele-estimou-sozinho" aria-label="Link para esta secao">#</a></h2>
<p>A parte mais útil do Prophet não é a previsão: é poder abrir o modelo e
olhar cada peça separada.</p>
<figure><img src="docs/assets/aula-05/componentes_prophet.png" alt="Quatro painéis mostrando a tendência crescente, os tombos dos feriados, o perfil semanal em barras e a onda anual estimados pelo Prophet"><figcaption>As mesmas três peças da Aula 5, agora estimadas por conta própria.</figcaption></figure>

<p>Compare com o que você já sabia da aula passada. A tendência sobe. O
sábado é o melhor dia e a segunda é o pior. O meio do ano vende mais que o
começo. O modelo chegou nisso sozinho, sem ninguém contar.</p>
<p>Esse quadro é o que você leva para uma reunião. Ele responde perguntas de
negócio (&quot;o crescimento continua?&quot;, &quot;vale abrir aos domingos?&quot;) melhor do
que qualquer número único de previsão.</p>
<h2 id="feriados-o-que-o-modelo-nao-adivinha">Feriados: o que o modelo não adivinha<a class="ancora" href="#feriados-o-que-o-modelo-nao-adivinha" aria-label="Link para esta secao">#</a></h2>
<p>Uma coisa o Prophet não descobre sozinho: o calendário. Ele não sabe que

<figure><img src="docs/assets/aula-05/com_sem_feriados.png" alt="Gráfico de dezembro comparando as vendas reais com duas previsões, uma que ignora o Natal e outra que mergulha junto com as vendas no dia 25"><figcaption>A linha cinza segue reto no Natal. A vermelha sabe que o escritório fecha.</figcaption></figure>

<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">feriados</span> <span class="o">=</span> <span class="n">pd</span><span class="o">.</span><span class="n">DataFrame</span><span class="p">({</span>
    <span class="s2">"holiday"</span><span class="p">:</span> <span class="s2">"feriado_nacional"</span><span class="p">,</span>
    <span class="s2">"ds"</span><span class="p">:</span> <span class="n">datas_dos_feriados</span><span class="p">,</span>
<span class="p">})</span>
<span class="n">modelo</span> <span class="o">=</span> <span class="n">Prophet</span><span class="p">(</span><span class="n">holidays</span><span class="o">=</span><span class="n">feriados</span><span class="p">)</span>
</code></pre></div>
<p>Essa lista pode ir além do calendário oficial. Promoções, greves, jogos
importantes, qualquer data que a sua série &quot;sente&quot; entra ali.</p>

<h2 id="um-modelo-que-nunca-viu-esta-cafeteria-o-timesfm">Um modelo que nunca viu esta cafeteria: o TimesFM<a class="ancora" href="#um-modelo-que-nunca-viu-esta-cafeteria-o-timesfm" aria-label="Link para esta secao">#</a></h2>
<p>Todos os modelos até aqui aprenderam com a série da cafeteria. Existe
outro caminho, que chegou à área de séries temporais nos últimos anos: um
<strong>modelo de fundação</strong> (<em>foundation model</em>).</p>
<p>A ideia vem dos modelos de linguagem, que você vai construir mais adiante
no curso. Um modelo de linguagem leu uma quantidade enorme de texto e
aprendeu a prever a próxima palavra. O <strong>TimesFM</strong>, do Google, leu uma
quantidade enorme de séries temporais e aprendeu a prever o próximo
pedaço de uma série. Só a primeira versão já tinha lido cerca de 100
bilhões de pontos, de buscas no Google, visitas à Wikipédia e muitas
outras fontes.</p>
<p>Como ele já viu séries com semanas, anos, tendências e quedas de todo
tipo, ele consegue prever uma série nova sem treinar nela. Isso se chama
previsão <strong>zero-shot</strong>: você entrega o passado, e ele devolve o futuro.</p>
<p>O TimesFM 2.5 tem 231 milhões de pesos e roda no processador do Colab em
poucos segundos. Ele vem do Hugging Face, pela biblioteca <code>transformers</code>:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">modelo</span> <span class="o">=</span> <span class="n">TimesFm2_5ModelForPrediction</span><span class="o">.</span><span class="n">from_pretrained</span><span class="p">(</span><span class="s2">"google/timesfm-2.5-200m-transformers"</span><span class="p">)</span>
<span class="n">historico</span> <span class="o">=</span> <span class="n">torch</span><span class="o">.</span><span class="n">tensor</span><span class="p">(</span><span class="n">treino</span><span class="p">[</span><span class="s2">"y"</span><span class="p">]</span><span class="o">.</span><span class="n">to_numpy</span><span class="p">(),</span> <span class="n">dtype</span><span class="o">=</span><span class="n">torch</span><span class="o">.</span><span class="n">float32</span><span class="p">)</span>
<span class="n">saida</span> <span class="o">=</span> <span class="n">modelo</span><span class="p">(</span><span class="n">past_values</span><span class="o">=</span><span class="p">[</span><span class="n">historico</span><span class="p">])</span>
<span class="n">previsao</span> <span class="o">=</span> <span class="n">saida</span><span class="o">.</span><span class="n">mean_predictions</span><span class="p">[</span><span class="mi">0</span><span class="p">,</span> <span class="p">:</span><span class="mi">28</span><span class="p">]</span>
</code></pre></div>
<p>Repare no que <strong>não</strong> aparece: nenhum <code>fit</code>. O modelo não aprende nada com
a cafeteria. Ele só lê o histórico e escreve os próximos dias.</p>
<figure><img src="docs/assets/aula-05/timesfm_previsao.png" alt="Gráfico do período de teste com as vendas reais, a previsão do TimesFM em zigue-zague acompanhando a semana e uma faixa sombreada em volta, com o Natal marcado fora da faixa"><figcaption>Sem nenhum treino, o TimesFM reproduz o padrão da semana. Só o Natal escapa.</figcaption></figure>

<p>O resultado: MAE de R$ 55,16. Sem treinar nada, o TimesFM bate a régua,
bate o ARIMA sazonal e bate o Prophet sem feriados.</p>
<p>E tem mais. Tirando o Natal da conta, o erro dele nos outros 27 dias é de
R$ 42,62, o menor de todos os modelos. Nos dias comuns, ele é o melhor da
turma. O problema é um dia só: no Natal, ele previu R$ 1.173, e a
cafeteria vendeu R$ 780.</p>
<h3 id="o-contexto-quanto-passado-voce-entrega">O contexto: quanto passado você entrega<a class="ancora" href="#o-contexto-quanto-passado-voce-entrega" aria-label="Link para esta secao">#</a></h3>
<p>O TimesFM não tem pesos para treinar, mas tem uma escolha importante: o
<strong>contexto</strong>, o número de dias de passado que você entrega a ele. A versão
2.5 aceita até 16 mil pontos.</p>
<figure><img src="docs/assets/aula-05/contexto.png" alt="Gráfico de barras com o erro do TimesFM para contextos de 64 a 1.068 dias, com erros perto da régua até 365 dias e caindo para cerca de 55 reais a partir de 512 dias"><figcaption>Com mais de um ano de passado, o modelo enxerga também a onda anual.</figcaption></figure>

<p>Com 64 ou 128 dias, ele só enxerga a semana, e empata com a régua. A
partir de 512 dias, ele enxerga um ano inteiro e mais um pedaço, e
descobre que dezembro é baixa temporada. Na dúvida, entregue todo o
histórico que você tem.</p>
<h3 id="juntando-os-dois-mundos">Juntando os dois mundos<a class="ancora" href="#juntando-os-dois-mundos" aria-label="Link para esta secao">#</a></h3>
<p>O TimesFM traz o padrão. O calendário, ele não tem como saber: ninguém
contou a ele que o dia 25 é feriado. A solução é somar à previsão dele o
efeito do feriado, medido no treino.</p>
<div class="formula" title="\hat{y}_t = \text{TimesFM}_t + w_1 \cdot \text{feriado}_t"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>t</mi></msub><mo>&#x0003D;</mo><msub><mtext>TimesFM</mtext><mi>t</mi></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>1</mn></msub><mo>&#x000B7;</mo><msub><mtext>feriado</mtext><mi>t</mi></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>TimesFMₜ</code></td>
  <td>a previsão do TimesFM para o dia <code>t</code></td>
</tr>
<tr>
  <td><code>feriadoₜ</code></td>
  <td>vale 1 se o dia <code>t</code> é feriado, e 0 se não é</td>
</tr>
<tr>
  <td><code>w₁</code></td>
  <td>o efeito do feriado: a venda média de um feriado menos a de um dia comum, no treino</td>
</tr>
</tbody>
</table></div>
<p>No treino, um feriado vendeu, em média, R$ 389,68 a menos que um dia
comum. Então <code>w₁ = −389,68</code>. Exemplo, no Natal: <code>1.173 − 390 = 783</code>
reais. A cafeteria vendeu R$ 780.</p>
<p>Nos outros 27 dias, <code>feriadoₜ</code> vale 0 e a previsão fica igual. Com esse
único ajuste, o erro médio cai para <strong>R$ 41,24</strong>, o melhor resultado do
módulo.</p>
<figure><img src="docs/assets/aula-05/timesfm_feriado.png" alt="Gráfico de dezembro com as vendas reais e duas previsões iguais em quase todos os dias; no dia 25, a do TimesFM sozinho segue reto e a do TimesFM com o efeito do feriado mergulha junto com as vendas"><figcaption>Um modelo que viu milhões de séries, mais uma coluna que só você conhece.</figcaption></figure>

<h2 id="o-intervalo-de-incerteza">O intervalo de incerteza<a class="ancora" href="#o-intervalo-de-incerteza" aria-label="Link para esta secao">#</a></h2>
<p>Toda linha de <code>yhat</code> do Prophet vem acompanhada de <code>yhat_lower</code> e
<code>yhat_upper</code>. Eles formam a faixa em torno da previsão, e por padrão
cobrem 80% dos casos.</p>
<p>É o mesmo intervalo de predição da Aula 1, com dois ajustes. Lá a faixa
era <code>ŷ ± 2s</code>, com uma largura só para toda a reta; aqui ela muda de dia
para dia, e a promessa é 80% em vez de 95%. A pergunta que ela responde
continua sendo a mesma: onde cai <strong>um</strong> dia, e não a média de muitos.</p>
<figure><img src="docs/assets/aula-05/incerteza.png" alt="Previsão de seis meses à frente com a faixa de incerteza em torno dela, e um segundo painel mostrando que a largura da faixa quase não muda ao longo do horizonte"><figcaption>Seis meses de previsão. A largura da faixa fica em torno de R$ 150 o tempo todo.</figcaption></figure>

<p>A faixa soma duas incertezas. Uma é o barulho do dia a dia, que não some
nunca: dois sábados de julho não vendem exatamente o mesmo. A outra é a
dúvida sobre para onde a tendência vai, e essa cresce com o horizonte.
Nesta série, a primeira domina, e por isso a faixa quase não abre.</p>
<p>O TimesFM também devolve uma faixa. Em vez de uma borda de baixo e uma de
cima, ele devolve <strong>quantis</strong>: o valor abaixo do qual devem ficar 10% dos
dias, 20%, e assim por diante até 90%. Entre o quantil de 10% e o de 90%
cabem 80% dos casos, a mesma promessa do Prophet.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Faixa de 80% no teste</th>
  <th>Dias dentro</th>
  <th>Largura média</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Prophet com feriados</td>
  <td>75%</td>
  <td>cerca de R$ 150</td>
</tr>
<tr>
  <td>TimesFM</td>
  <td>89%</td>
  <td>cerca de R$ 191</td>
</tr>
</tbody>
</table></div>
<p>O TimesFM é mais cauteloso: a faixa dele é mais larga e erra menos. As
duas cumprem a promessa de perto, e nenhuma é garantia.</p>
<p>A lição mais importante vale para as duas: a faixa só conhece o que já
aconteceu. Ela não tem como prever um concorrente novo na esquina, uma
greve de ônibus ou uma obra na rua. O risco de prever seis meses à frente
vem desses eventos, não da largura da faixa.</p>
<p>Use a faixa para conversar sobre risco. &quot;A previsão é R$ 1.200, mas pode
ficar entre R$ 1.130 e R$ 1.280&quot; é uma frase muito mais útil para quem vai
comprar leite do que um número solto.</p>
<h2 id="quando-a-tendencia-dobra">Quando a tendência dobra<a class="ancora" href="#quando-a-tendencia-dobra" aria-label="Link para esta secao">#</a></h2>
<p>O Prophet não obriga a tendência a ser uma reta. Ele permite que ela mude
de inclinação em alguns pontos, chamados <strong>pontos de mudança</strong>
(<em>changepoints</em>).</p>
<figure><img src="docs/assets/aula-05/changepoints.png" alt="Série completa com a linha de tendência estimada por cima e linhas verticais pontilhadas marcando os pontos onde a tendência pode mudar de inclinação"><figcaption>Por padrão, 25 pontos candidatos nos primeiros 80% da série.</figcaption></figure>

<p>Esse é o motivo de o Prophet lidar bem com negócios que mudam de patamar.
Uma loja que abriu uma filial, um site que ganhou tráfego depois de uma
campanha: a tendência dobra, e o modelo acompanha.</p>
<p>O cuidado é o oposto. Se você deixar o modelo dobrar demais, ele começa a
seguir o ruído e a previsão fica instável. O parâmetro
<code>changepoint_prior_scale</code> controla essa liberdade: quanto maior, mais o
modelo aceita dobrar.</p>

O que eles têm em comum é o calendário de feriados, que nenhum deles
descobriu sozinho.</p>
<p>Repare também que os três ficaram entre R$ 41 e R$ 44. Esse é,
provavelmente, o piso desta série: o barulho do dia a dia, que nenhum
modelo prevê.</p>

<div class="quiz" data-numero="4"><p class="quiz-numero">Questão 4</p><p class="quiz-enunciado">A sazonal ingênua (copiar a semana passada) erra R$ 63,78 por dia no teste. Um modelo novo erra <strong>R$ 70</strong> nos mesmos dias. O que concluir?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">O modelo novo é bom: R$ 70 é um erro pequeno perto de vendas de R$ 1.200.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Os dois são equivalentes, porque a diferença é pequena.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">O modelo novo ainda não paga o próprio trabalho: perde para uma regra que não usa modelo nenhum.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">O certo é comparar o modelo novo com a previsão ingênua, que erra R$ 121,28.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">A régua é a melhor previsão de referência, e todo modelo tem que vencê-la. Um erro parece pequeno ou grande dependendo do que você compara, e a comparação honesta é com a melhor regra simples disponível, não com a pior.</p></div></div>

<div class="quiz" data-numero="6"><p class="quiz-numero">Questão 6</p><p class="quiz-enunciado">O <strong>ARIMA(1,0,0)</strong> previu, para os dias do teste, valores que caíam dia após dia em direção a R$ 1.097, a média dos três anos. Qual número está causando isso?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">O <code>p = 1</code>, porque um dia do passado é pouco.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">B</span><span class="quiz-texto">O <code>d = 0</code>: o modelo prevê o valor e supõe que a série oscila em torno de um nível fixo, mas ela sobe.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">O <code>q = 0</code>, porque o modelo não corrige os próprios erros.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Nenhum: o ARIMA sempre volta para a média.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">O <code>d</code> responde se o modelo prevê o valor (0) ou a mudança de um dia para o outro (1). Com <code>d = 0</code>, a previsão volta para o nível médio, que mistura 2022 com 2024. Com <code>d = 1</code>, ele prevê a mudança e soma ao último valor, e a tendência deixa de ser problema. Regra prática: se o gráfico sobe ou desce, use <code>d = 1</code>.</p></div></div>
<h2 id="prophet-e-timesfm">Prophet e TimesFM<a class="ancora" href="#prophet-e-timesfm" aria-label="Link para esta secao">#</a></h2>
<div class="quiz" data-numero="7"><p class="quiz-numero">Questão 7</p><p class="quiz-enunciado">O Prophet, direto da caixa, errou R$ 64,54: empatou com a régua. Com a <strong>lista de feriados</strong>, caiu para R$ 43,73. O que essa diferença ensina?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Que o Prophet precisa de mais dados de treino para funcionar.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Que a régua é um modelo melhor que o Prophet.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">Que o modelo não adivinha o calendário: o conhecimento do negócio é que virou o jogo.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Que feriados são a peça mais importante de qualquer série.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">O Prophet estima tendência e sazonalidades sozinho, mas não tem como saber que 25 de dezembro é diferente dos outros dias. Com a lista, ele chega quase ao mesmo erro da regressão com calendário da Aula 5 (R$ 44,11), porque os dois somam as mesmas peças.</p></div></div>
<div class="quiz" data-numero="8"><p class="quiz-numero">Questão 8</p><p class="quiz-enunciado">A faixa de incerteza do Prophet promete cobrir <strong>80%</strong> dos dias. No teste, <strong>75%</strong> dos dias caíram dentro dela. Qual é a leitura certa?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">A</span><span class="quiz-texto">Um resultado honesto: a faixa cumpriu a promessa de perto, e um dia em cada quatro ou cinco fica de fora mesmo.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">A faixa está errada, porque deveria ter acertado todos os dias.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">O modelo é ruim, porque errou 25% dos dias.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">A faixa garante que nenhum dia vai ficar abaixo da borda de baixo.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Uma faixa de 80% <strong>espera</strong> deixar cerca de um dia em cada cinco de fora. Com só 28 dias de teste, 75% está dentro do esperado. E a faixa só conhece o que já aconteceu: uma greve ou uma obra na rua podem jogar a venda para fora dela.</p></div></div>
<div class="quiz" data-numero="9"><p class="quiz-numero">Questão 9</p><p class="quiz-enunciado">O TimesFM previu as vendas da cafeteria <strong>sem nenhum treino</strong> e bateu a régua. Como isso é possível?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Ele baixou os dados da cafeteria durante o <code>from_pretrained</code>.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Ele treina escondido quando você pede a previsão.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">Ele foi pré-treinado com uma quantidade enorme de outras séries, e aprendeu padrões como semanas, anos e tendências.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Ele copia a semana passada, como a sazonal ingênua.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">O TimesFM é um <strong>modelo de fundação</strong>: foi treinado uma vez, pelo Google, com milhões de séries de todo tipo. Por isso ele prevê uma série nova só lendo o passado dela, sem mudar nenhum peso. Isso se chama previsão <strong>zero-shot</strong>.</p></div></div>
<div class="quiz" data-numero="10"><p class="quiz-numero">Questão 10</p><p class="quiz-enunciado">Nos 27 dias comuns do teste, o TimesFM foi o melhor de todos. No Natal, previu R$ 1.173, e a cafeteria vendeu R$ 780. Qual é a correção mais simples?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Treinar o TimesFM de novo com os dados da cafeteria.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Entregar menos dias de passado ao modelo, para ele se concentrar em dezembro.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Trocar o TimesFM pela régua, que erra menos no Natal.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">D</span><span class="quiz-texto">Somar à previsão dele o efeito médio de um feriado, medido no treino (cerca de −R$ 390), só nos dias de feriado.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">O modelo traz o padrão; o calendário é você quem traz. Com uma coluna de feriado e um peso tirado de uma média do treino, a previsão do Natal vai para R$ 783, e o erro médio cai para R$ 41,24, o melhor resultado do módulo. Entregar menos passado piora o TimesFM: com 365 dias, ele erra R$ 61,72.</p></div></div>

<template class="pagina" data-id="redes-neurais/aula-07-redes-neurais-densas" data-titulo="Aula 7 — Fundamentos de Redes Neurais" data-descricao="Neurônio, ativação, camadas, treino, regularização e callbacks, com Keras">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>
<p>Você vai entender o que é um neurônio (spoiler: é a soma da Aula 2 com uma
dobra em cima), por que empilhar neurônios resolve problemas que uma reta
não resolve, e como treinar uma rede em cinco linhas de Keras. Vai ver
também como segurar uma rede que decora, com L2 e dropout, e como deixar o
treino em piloto automático com callbacks.</p>
</div></div>
<h2 id="para-que-serve">Para que serve<a class="ancora" href="#para-que-serve" aria-label="Link para esta secao">#</a></h2>
<p>O Clube do Café torra os próprios grãos. Cada torra tem dois botões: a
temperatura do tambor e o tempo. Errar qualquer um dos dois estraga o lote.</p>
<p>Quente demais queima. Frio demais deixa o grão verde. Rápido demais não
desenvolve o açúcar. Devagar demais amarga. O ponto bom fica numa faixa no
meio, e é isso que o gráfico mostra:</p>
<figure><img src="docs/assets/aula-07/torras.png" alt="Gráfico de dispersão com temperatura no eixo x e tempo no eixo y, com as torras boas formando uma ilha no centro e as ruins espalhadas em volta"><figcaption>600 torras. As boas formam uma ilha, não uma metade.</figcaption></figure>

<p>Olhe para essa figura e tente traçar uma reta que separe os triângulos dos
círculos. Não existe. É essa impossibilidade que abre o assunto de hoje.</p>
<h2 id="por-que-a-reta-nao-basta">Por que a reta não basta<a class="ancora" href="#por-que-a-reta-nao-basta" aria-label="Link para esta secao">#</a></h2>
<p>Vamos provar. Treine uma regressão logística nesses dados, do jeito da
Aula 3, e olhe o que ela decide.</p>
<figure><img src="docs/assets/aula-07/fronteiras.png" alt="Dois painéis lado a lado: à esquerda a regressão logística pintando tudo de uma cor só, à direita a rede neural desenhando uma fronteira fechada em volta das torras boas"><figcaption>A logística desiste e chuta "ruim" para todo mundo. A rede fecha a ilha.</figcaption></figure>

<p>A regressão logística acertou 71,8% das torras. Parece razoável até você
comparar com o modelo preguiçoso da Aula 3: como 71,8% das torras são
ruins, responder &quot;ruim&quot; para todo mundo dá exatamente os mesmos 71,8%.</p>
<p>Ela não aprendeu nada. E não é culpa dela: a fronteira que ela sabe
desenhar é uma reta, e nenhuma reta separa o dentro do fora de uma ilha.</p>
<p>A rede neural da direita, com duas camadas de 16 neurônios, chega a 91,8%.
A diferença não está no esforço nem nos dados. Está no formato da
fronteira que cada modelo consegue desenhar.</p>
<h2 id="o-que-e-um-neuronio">O que é um neurônio<a class="ancora" href="#o-que-e-um-neuronio" aria-label="Link para esta secao">#</a></h2>
<p>Aqui está a boa notícia: você já sabe o que é.</p>
<figure><img src="docs/assets/aula-07/neuronio.png" alt="Diagrama de um neurônio: duas entradas multiplicadas por pesos, somadas com um viés, passando por uma função de ativação e virando a saída"><figcaption>Entrada vezes peso, soma, e uma dobra no fim.</figcaption></figure>

<div class="formula" title="a = f(w_0 + w_1 x_1 + w_2 x_2)"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>a</mi><mo>&#x0003D;</mo><mi>f</mi><mo stretchy="false">&#x00028;</mo><msub><mi>w</mi><mn>0</mn></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>1</mn></msub><msub><mi>x</mi><mn>1</mn></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>2</mn></msub><msub><mi>x</mi><mn>2</mn></msub><mo stretchy="false">&#x00029;</mo></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>x₁</code>, <code>x₂</code></td>
  <td>as entradas: temperatura e tempo</td>
</tr>
<tr>
  <td><code>w₁</code>, <code>w₂</code></td>
  <td>os pesos, iguais aos das aulas de regressão</td>
</tr>
<tr>
  <td><code>w₀</code></td>
  <td>o viés (<em>bias</em>), o mesmo termo independente de sempre</td>
</tr>
<tr>
  <td><code>f</code></td>
  <td>a função de ativação: a dobra</td>
</tr>
<tr>
  <td><code>a</code></td>
  <td>a saída do neurônio, que vira entrada do próximo</td>
</tr>
</tbody>
</table></div>
<p>Compare com a regressão logística da Aula 3: <code>P = σ(w₀ + w₁x₁ + w₂x₂)</code>. É a
mesma conta. <strong>Um neurônio com ativação sigmoide é uma regressão
logística.</strong> Uma rede neural é um monte deles, empilhados.</p>
<p>Exemplo com números: se <code>w₀ = −3</code>, <code>w₁ = 0,02</code>, <code>w₂ = 0,1</code>, uma torra de
205 °C e 11 minutos dá <code>−3 + 4,10 + 1,10 = 2,20</code> antes da ativação.</p>
<h2 id="a-dobra-funcoes-de-ativacao">A dobra: funções de ativação<a class="ancora" href="#a-dobra-funcoes-de-ativacao" aria-label="Link para esta secao">#</a></h2>
<p>Se a ativação não existisse, empilhar camadas não adiantaria nada. Somar
retas dá reta, e você voltaria ao problema do começo.</p>
<figure><img src="docs/assets/aula-07/ativacoes.png" alt="Dois gráficos: à esquerda a ReLU, uma linha que fica em zero e depois sobe reto, à direita a sigmoide em formato de S"><figcaption>A ReLU é a dobra mais usada hoje. A sigmoide você já conhece.</figcaption></figure>

<div class="formula" title="\text{ReLU}(z) = \max(0, z)"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>ReLU</mtext><mo stretchy="false">&#x00028;</mo><mi>z</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0003D;</mo><mo>max</mo><mo stretchy="false">&#x00028;</mo><mn>0</mn><mo>&#x0002C;</mo><mi>z</mi><mo stretchy="false">&#x00029;</mo></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>z</code></td>
  <td>o resultado da soma, antes da ativação</td>
</tr>
<tr>
  <td><code>max(0, z)</code></td>
  <td>devolve <code>z</code> se ele é positivo, e 0 se é negativo</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: <code>ReLU(2,20) = 2,20</code>. <code>ReLU(−1,4) = 0</code>.</p>
<p>Não parece grande coisa, mas é o suficiente. Cada neurônio com ReLU
introduz uma dobra na fronteira. Com dobras suficientes, a fronteira
contorna qualquer formato. Repare no salto entre 2 e 8 neurônios: é ali
que a fronteira deixa de ser uma reta.</p>
<figure><img src="docs/assets/aula-07/capacidade.png" alt="Quatro painéis mostrando a fronteira aprendida com 1, 2, 8 e 32 neurônios, cada vez mais próxima de contornar a ilha"><figcaption>Com 1 ou 2 neurônios, nada muda. Com 8 aparece uma ilha pequena demais; com 32, o contorno certo.</figcaption></figure>

<p>Onde usar cada uma, na prática:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Onde</th>
  <th>Ativação</th>
  <th>Por quê</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Camadas do meio</td>
  <td>ReLU</td>
  <td>rápida, e é a dobra que cria o formato</td>
</tr>
<tr>
  <td>Saída, para sim ou não</td>
  <td>sigmoide</td>
  <td>devolve probabilidade entre 0 e 1</td>
</tr>
<tr>
  <td>Saída, para um número</td>
  <td>nenhuma</td>
  <td>o valor sai como está</td>
</tr>
</tbody>
</table></div>
<h2 id="a-rede-inteira-em-cinco-linhas">A rede inteira, em cinco linhas<a class="ancora" href="#a-rede-inteira-em-cinco-linhas" aria-label="Link para esta secao">#</a></h2>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">modelo</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">Sequential</span><span class="p">([</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Input</span><span class="p">(</span><span class="n">shape</span><span class="o">=</span><span class="p">(</span><span class="mi">2</span><span class="p">,)),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">16</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"relu"</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">16</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"relu"</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"sigmoid"</span><span class="p">),</span>
<span class="p">])</span>
</code></pre></div>
<p>Lendo de cima para baixo: entram 2 números, viram 16, viram 16 de novo, e
saem como 1 probabilidade. <code>Dense</code> quer dizer que <strong>todo</strong> neurônio da
camada recebe <strong>todas</strong> as saídas da camada anterior.</p>
<p>Essa rede tem 337 pesos. Você pode contar: 2×16+16 na primeira camada,
16×16+16 na segunda, 16×1+1 na saída. Cada um deles é um número que o
treino vai ajustar, exatamente como ajustava os dois pesos da Aula 1.</p>
<h2 id="como-ela-aprende-e-a-aula-1-de-novo">Como ela aprende (é a Aula 1 de novo)<a class="ancora" href="#como-ela-aprende-e-a-aula-1-de-novo" aria-label="Link para esta secao">#</a></h2>
<p>Nada de novo aqui, e vale dizer isso em voz alta:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Peça</th>
  <th>Na Aula 1</th>
  <th>Agora</th>
</tr>
</thead>
<tbody>
<tr>
  <td>O que ajusta</td>
  <td>2 pesos</td>
  <td>337 pesos</td>
</tr>
<tr>
  <td>Função de perda</td>
  <td>MSE</td>
  <td>log loss (a da Aula 3)</td>
</tr>
<tr>
  <td>Como ajusta</td>
  <td>gradiente descendente</td>
  <td>gradiente descendente</td>
</tr>
<tr>
  <td>A regra</td>
  <td><code>w ← w − α · inclinação</code></td>
  <td>a mesma, para cada peso</td>
</tr>
</tbody>
</table></div>
<p>A perda usada para sim ou não é a <strong>entropia cruzada binária</strong>, que a Aula
3 já usava com outro nome:</p>
<div class="formula" title="\text{perda} = -\frac{1}{n}\sum_{i=1}^{n}\left[y_i \log(\hat{y}_i) + (1 - y_i)\log(1 - \hat{y}_i)\right]"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>perda</mtext><mo>&#x0003D;</mo><mo>&#x02212;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mrow><mo stretchy="true" fence="true" form="prefix">[</mo><msub><mi>y</mi><mi>i</mi></msub><mi>log</mi><mo stretchy="false">&#x00028;</mo><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>i</mi></msub><mo stretchy="false">&#x00029;</mo><mo>&#x0002B;</mo><mo stretchy="false">&#x00028;</mo><mn>1</mn><mo>&#x02212;</mo><msub><mi>y</mi><mi>i</mi></msub><mo stretchy="false">&#x00029;</mo><mi>log</mi><mo stretchy="false">&#x00028;</mo><mn>1</mn><mo>&#x02212;</mo><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>i</mi></msub><mo stretchy="false">&#x00029;</mo><mo stretchy="true" fence="true" form="postfix">]</mo></mrow></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>yᵢ</code></td>
  <td>o rótulo real da torra <code>i</code>: 1 para boa, 0 para ruim</td>
</tr>
<tr>
  <td><code>ŷᵢ</code></td>
  <td>a probabilidade que a rede deu</td>
</tr>
<tr>
  <td><code>log</code></td>
  <td>o logaritmo, que castiga com força quem erra com confiança</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: se a rede diz 0,9 para uma torra boa, a parcela dela é
<code>−log(0,9) = 0,105</code>. Se ela diz 0,1 para a mesma torra boa, a parcela vira
<code>−log(0,1) = 2,303</code>. Vinte e duas vezes pior.</p>
<p>A única novidade técnica é o nome do cálculo que distribui a culpa entre as
camadas: <strong>retropropagação</strong> (<em>backpropagation</em>). Ela responde &quot;o quanto
cada um dos 337 pesos contribuiu para o erro&quot; aplicando a regra da cadeia
de trás para frente. O Keras faz isso sozinho, e neste curso você não vai
implementá-la à mão.</p>
<h2 id="epoca-lote-e-a-curva-de-treino">Época, lote e a curva de treino<a class="ancora" href="#epoca-lote-e-a-curva-de-treino" aria-label="Link para esta secao">#</a></h2>
<p>Três palavras que aparecem em toda saída de treino:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Palavra</th>
  <th>O que é</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Lote (<em>batch</em>)</td>
  <td>quantos exemplos entram por vez antes de ajustar os pesos</td>
</tr>
<tr>
  <td>Época (<em>epoch</em>)</td>
  <td>uma passada completa por todos os exemplos</td>
</tr>
<tr>
  <td>Passo</td>
  <td>um ajuste dos pesos, feito uma vez por lote</td>
</tr>
</tbody>
</table></div>
<p>Com 600 torras e lote de 32, uma época tem 19 passos. Em 120 épocas, são
2.280 ajustes.</p>
<figure><img src="docs/assets/aula-07/curva_treino.png" alt="Dois gráficos mostrando a perda caindo e a acurácia subindo ao longo das épocas, com as linhas de treino e validação juntas"><figcaption>A curva de treino é o painel de instrumentos: você olha para ela antes de olhar qualquer outra coisa.</figcaption></figure>

<p>Repare que existem duas linhas em cada gráfico. A de treino usa as torras
que a rede viu; a de validação usa 25% que ela nunca viu. Enquanto as duas
caem juntas, está tudo bem. Quando a de validação para de cair e a de treino
continua, a rede começou a decorar. A próxima seção mostra como evitar isso.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Treinar sem normalizar as entradas. Aqui a temperatura vai a 235 e o tempo
a 17: uma escala é catorze vezes a outra. A rede até aprende, mas devagar e
mal, porque o gradiente fica dominado pela variável de número maior. A
correção é uma linha, antes do treino: subtraia a média e divida pelo
desvio padrão de cada coluna. Faça isso <strong>sempre</strong> em rede neural.</p>
</div></div>
<h2 id="quando-a-rede-decora">Quando a rede decora<a class="ancora" href="#quando-a-rede-decora" aria-label="Link para esta secao">#</a></h2>
<p>Uma rede com liberdade demais faz o que o modelo simples nunca faria:
decora. Para ver isso, dê a ela três camadas de 128 neurônios, mais de 33
mil pesos, e só 420 torras para aprender. Separe outras 180 como
validação e treine por 300 épocas.</p>
<figure><img src="docs/assets/aula-07/sobreajuste.png" alt="Gráfico com a perda de treino caindo ao longo de 300 épocas e a perda de validação subindo depois da época 13"><figcaption>O treino cai sem parar. A validação tem o melhor momento na época 13 e piora dali em diante.</figcaption></figure>

<p>A perda de validação foi mínima na época 13, com 0,213. Na época 300 ela
estava em 0,374. A acurácia no treino chegou a 96,7%, e na validação ficou
em 87,8%. A rede parou de aprender o formato da ilha e passou a decorar o
ruído de cada torra.</p>
<p>A defesa se chama <strong>regularização</strong> (<em>regularization</em>): qualquer técnica
que torne decorar mais caro. Duas delas mexem na própria rede, o L2 e o
dropout. A terceira mexe no treino, e vem na próxima seção.</p>
<h3 id="l2-pesos-pequenos">L2: pesos pequenos<a class="ancora" href="#l2-pesos-pequenos" aria-label="Link para esta secao">#</a></h3>
<p>Você já conhece esse freio da Aula 2, onde ele aparecia como Ridge. Uma
rede que decora costuma ter pesos enormes, porque precisa de curvas
bruscas para encostar em cada ponto. O L2 soma à perda um castigo para cada
peso grande.</p>
<div class="formula" title="\text{perda total} = \text{perda} + \lambda \sum_{j} w_j^2"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>perda&#x000A0;total</mtext><mo>&#x0003D;</mo><mtext>perda</mtext><mo>&#x0002B;</mo><mi>&#x003BB;</mi><msub><mo>&#x02211;</mo><mrow><mi>j</mi></mrow></msub><msubsup><mi>w</mi><mi>j</mi><mn>2</mn></msubsup></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>λ</code></td>
  <td>a força do castigo. Zero desliga o L2</td>
</tr>
<tr>
  <td><code>wⱼ</code></td>
  <td>cada peso da rede. A soma passa por todos eles</td>
</tr>
</tbody>
</table></div>
<p>Na Aula 2 essa força se chamava <code>α</code>. Aqui ela é <code>λ</code> (lambda), para não
confundir com a taxa de aprendizado, que também é <code>α</code>.</p>
<p>Exemplo com <code>λ = 0,01</code>: dois pesos de 3 e −2 custam <code>0,01 × (9 + 4) = 0,13</code>.
Dois pesos de 0,5 custam <code>0,01 × (0,25 + 0,25) = 0,005</code>. Pesos pequenos
saem baratos, e a rede aprende a usá-los.</p>
<p>No Keras, o L2 é um argumento da camada:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">128</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"relu"</span><span class="p">,</span>
                   <span class="n">kernel_regularizer</span><span class="o">=</span><span class="n">keras</span><span class="o">.</span><span class="n">regularizers</span><span class="o">.</span><span class="n">l2</span><span class="p">(</span><span class="mf">0.001</span><span class="p">))</span>
</code></pre></div>
<p>Com <code>λ = 0,001</code>, a perda de validação na época 300 caiu de 0,374 para
0,250.</p>
<h3 id="dropout-neuronios-sorteados">Dropout: neurônios sorteados<a class="ancora" href="#dropout-neuronios-sorteados" aria-label="Link para esta secao">#</a></h3>
<p>Imagine um time em que, a cada treino, alguns jogadores sorteados ficam no
banco. Ninguém pode depender de um único colega, e todos aprendem a
jogar bem com qualquer formação. O <strong>dropout</strong> faz isso com os neurônios.</p>
<p>A cada passo de treino, ele desliga ao acaso uma fração dos neurônios da
camada. Com <code>Dropout(0.3)</code>, 30% ficam em zero naquele passo, e outros 30%
no seguinte. É uma camada nova, que entra depois de cada <code>Dense</code>:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">modelo</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">Sequential</span><span class="p">([</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Input</span><span class="p">(</span><span class="n">shape</span><span class="o">=</span><span class="p">(</span><span class="mi">2</span><span class="p">,)),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">128</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"relu"</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dropout</span><span class="p">(</span><span class="mf">0.3</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">128</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"relu"</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dropout</span><span class="p">(</span><span class="mf">0.3</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"sigmoid"</span><span class="p">),</span>
<span class="p">])</span>
</code></pre></div>
<p>O Keras só sorteia durante o treino. Na hora de prever, todos os neurônios
ficam ligados. Com dropout de 0,3, a perda de validação na época 300 foi de
0,257, e a acurácia de validação subiu de 87,8% para 91,1%.</p>
<figure><img src="docs/assets/aula-07/regularizacao.png" alt="Três painéis com a fronteira de uma mesma rede: solta, com fronteira irregular e um buraco dentro da ilha; com L2 e com dropout, com a fronteira mais lisa"><figcaption>Mesma rede, mesmos dados. A solta desenha um buraco dentro da ilha. Com freio, a fronteira fica lisa.</figcaption></figure>

<p>Dois pontos de partida para ajustar:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Técnica</th>
  <th>Ponto de partida</th>
  <th>Aumente se</th>
</tr>
</thead>
<tbody>
<tr>
  <td>L2</td>
  <td><code>λ</code> entre 0,0001 e 0,01</td>
  <td>a rede ainda decora</td>
</tr>
<tr>
  <td>Dropout</td>
  <td>taxa entre 0,2 e 0,5</td>
  <td>a rede ainda decora</td>
</tr>
</tbody>
</table></div>
<p>Se a rede passar a errar até no treino, você freou demais. Diminua o
valor. Duas defesas fora da rede também funcionam: uma rede menor, como a
da seção de capacidade, e mais dados, que é a mais forte e nem sempre está
ao seu alcance.</p>
<h2 id="callbacks-o-piloto-automatico-do-treino">Callbacks: o piloto automático do treino<a class="ancora" href="#callbacks-o-piloto-automatico-do-treino" aria-label="Link para esta secao">#</a></h2>
<p>Até aqui o treino foi cego: 300 épocas, aconteça o que acontecer. Um
<strong>callback</strong> é um objeto que o Keras chama ao fim de cada época. Ele olha as
métricas e decide algo, como parar o treino. Você entrega os callbacks ao
<code>fit</code>, numa lista:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">modelo</span><span class="o">.</span><span class="n">fit</span><span class="p">(</span><span class="n">entradas</span><span class="p">,</span> <span class="n">alvo</span><span class="p">,</span> <span class="n">epochs</span><span class="o">=</span><span class="mi">300</span><span class="p">,</span> <span class="n">validation_data</span><span class="o">=</span><span class="p">(</span><span class="n">entradas_val</span><span class="p">,</span> <span class="n">alvo_val</span><span class="p">),</span>
           <span class="n">callbacks</span><span class="o">=</span><span class="p">[</span><span class="n">callback_1</span><span class="p">,</span> <span class="n">callback_2</span><span class="p">])</span>
</code></pre></div>
<h3 id="earlystopping-parar-quando-nao-melhora-mais">EarlyStopping: parar quando não melhora mais<a class="ancora" href="#earlystopping-parar-quando-nao-melhora-mais" aria-label="Link para esta secao">#</a></h3>
<p>É a terceira defesa contra a decoreba. O <code>EarlyStopping</code> (parada antecipada)
acompanha a perda de validação. Se ela passa <code>patience</code> épocas sem bater o
recorde, o treino para.</p>
<figure><img src="docs/assets/aula-07/early_stopping.png" alt="Gráfico com as perdas de treino e validação nas primeiras 58 épocas, com uma linha amarela na época 13, o melhor momento, e uma linha tracejada na época 28, onde o treino parou"><figcaption>O melhor momento foi a época 13. Quinze épocas depois, sem recorde, o treino parou.</figcaption></figure>

<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">parar_cedo</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">callbacks</span><span class="o">.</span><span class="n">EarlyStopping</span><span class="p">(</span>
    <span class="n">monitor</span><span class="o">=</span><span class="s2">"val_loss"</span><span class="p">,</span> <span class="n">patience</span><span class="o">=</span><span class="mi">15</span><span class="p">,</span> <span class="n">restore_best_weights</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
</code></pre></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Argumento</th>
  <th>O que faz</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>monitor</code></td>
  <td>a métrica que ele vigia. <code>&quot;val_loss&quot;</code> é a escolha de sempre</td>
</tr>
<tr>
  <td><code>patience</code></td>
  <td>quantas épocas sem recorde ele espera antes de parar</td>
</tr>
<tr>
  <td><code>restore_best_weights</code></td>
  <td>devolve os pesos da melhor época, e não os da última</td>
</tr>
</tbody>
</table></div>
<p>Sem o último argumento, você fica com os pesos de 15 épocas depois do
melhor ponto, um pouco piores. Esquecer dele é o erro mais comum com este
callback.</p>
<p>Neste exemplo o treino parou na época 28, de 300 possíveis, com perda de
validação de 0,213 e acurácia de 91,1%. Economizou 90% do tempo, e ficou
melhor que a rede solta.</p>
<p>Há um cuidado. Como você escolhe o ponto de parada olhando a validação, a
acurácia de validação fica um pouco otimista. Para um número final
honesto, guarde um terceiro pedaço dos dados, o teste, que ninguém olhou.</p>
<h3 id="reducelronplateau-encolher-o-passo-quando-trava">ReduceLROnPlateau: encolher o passo quando trava<a class="ancora" href="#reducelronplateau-encolher-o-passo-quando-trava" aria-label="Link para esta secao">#</a></h3>
<p>Lembra da regra da Aula 1, <code>w ← w − α · inclinação</code>? O <code>α</code> é a <strong>taxa de
aprendizado</strong> (<em>learning rate</em>), o tamanho do passo. Passo grande anda
rápido no começo. No fim, ele pula por cima do vale sem conseguir descer
até o fundo.</p>
<p>O <code>ReduceLROnPlateau</code> vigia a perda de validação. Quando ela trava por
<code>patience</code> épocas, ele encolhe o passo:</p>
<div class="formula" title="\alpha_{\text{novo}} = \alpha \times \text{fator}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>&#x003B1;</mi><mrow><mtext>novo</mtext></mrow></msub><mo>&#x0003D;</mo><mi>&#x003B1;</mi><mo>&#x000D7;</mo><mtext>fator</mtext></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>α</code></td>
  <td>a taxa de aprendizado atual</td>
</tr>
<tr>
  <td><code>fator</code></td>
  <td>quanto ela encolhe a cada platô. Com 0,5, cai pela metade</td>
</tr>
</tbody>
</table></div>
<p>Exemplo com <code>α = 0,01</code> e fator 0,5: a taxa vai a 0,005 no primeiro platô,
a 0,0025 no segundo, e assim por diante, até o piso <code>min_lr</code>.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">reduzir_passo</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">callbacks</span><span class="o">.</span><span class="n">ReduceLROnPlateau</span><span class="p">(</span>
    <span class="n">monitor</span><span class="o">=</span><span class="s2">"val_loss"</span><span class="p">,</span> <span class="n">factor</span><span class="o">=</span><span class="mf">0.5</span><span class="p">,</span> <span class="n">patience</span><span class="o">=</span><span class="mi">5</span><span class="p">,</span> <span class="n">min_lr</span><span class="o">=</span><span class="mf">0.00001</span><span class="p">)</span>
</code></pre></div>
<figure><img src="docs/assets/aula-07/reduce_lr.png" alt="À esquerda, a perda de validação balançando com taxa fixa e estável com o ReduceLROnPlateau; à direita, a taxa de aprendizado caindo em degraus de 0,01 até 0,00001"><figcaption>Com a taxa fixa em 0,01, a validação balança. Com a redução, ela assenta.</figcaption></figure>

<p>O teste usou uma taxa propositalmente alta, 0,01, dez vezes a padrão do
Adam. A perda de validação final foi de 0,253 com a taxa fixa e de 0,224
com a redução. Com a taxa padrão, o ganho é menor: o callback é um seguro
contra passo grande demais.</p>
<h3 id="modelcheckpoint-guardar-o-melhor-modelo">ModelCheckpoint: guardar o melhor modelo<a class="ancora" href="#modelcheckpoint-guardar-o-melhor-modelo" aria-label="Link para esta secao">#</a></h3>
<p>O <code>EarlyStopping</code> devolve os melhores pesos na memória. Se o Colab
desconectar, eles somem. O <code>ModelCheckpoint</code> grava o modelo em arquivo
cada vez que a perda de validação bate um recorde:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">guardar_melhor</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">callbacks</span><span class="o">.</span><span class="n">ModelCheckpoint</span><span class="p">(</span>
    <span class="s2">"melhor_rede.keras"</span><span class="p">,</span> <span class="n">monitor</span><span class="o">=</span><span class="s2">"val_loss"</span><span class="p">,</span> <span class="n">save_best_only</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
</code></pre></div>
<p>Depois, em qualquer notebook, você carrega o modelo e usa sem treinar de
novo:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">modelo</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">models</span><span class="o">.</span><span class="n">load_model</span><span class="p">(</span><span class="s2">"melhor_rede.keras"</span><span class="p">)</span>
</code></pre></div>
<h3 id="os-tres-juntos">Os três juntos<a class="ancora" href="#os-tres-juntos" aria-label="Link para esta secao">#</a></h3>
<p>A regra que faz os callbacks combinarem: o <code>ReduceLROnPlateau</code> espera
<strong>menos</strong> que o <code>EarlyStopping</code>. Primeiro a rede tenta andar com passos
menores. Só depois o treino desiste.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">reduzir_passo</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">callbacks</span><span class="o">.</span><span class="n">ReduceLROnPlateau</span><span class="p">(</span>
    <span class="n">monitor</span><span class="o">=</span><span class="s2">"val_loss"</span><span class="p">,</span> <span class="n">factor</span><span class="o">=</span><span class="mf">0.5</span><span class="p">,</span> <span class="n">patience</span><span class="o">=</span><span class="mi">8</span><span class="p">,</span> <span class="n">min_lr</span><span class="o">=</span><span class="mf">0.00001</span><span class="p">)</span>
<span class="n">parar_cedo</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">callbacks</span><span class="o">.</span><span class="n">EarlyStopping</span><span class="p">(</span>
    <span class="n">monitor</span><span class="o">=</span><span class="s2">"val_loss"</span><span class="p">,</span> <span class="n">patience</span><span class="o">=</span><span class="mi">25</span><span class="p">,</span> <span class="n">restore_best_weights</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
<span class="n">guardar_melhor</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">callbacks</span><span class="o">.</span><span class="n">ModelCheckpoint</span><span class="p">(</span>
    <span class="s2">"melhor_rede.keras"</span><span class="p">,</span> <span class="n">monitor</span><span class="o">=</span><span class="s2">"val_loss"</span><span class="p">,</span> <span class="n">save_best_only</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>

<span class="n">modelo</span><span class="o">.</span><span class="n">fit</span><span class="p">(</span><span class="n">entradas_treino</span><span class="p">,</span> <span class="n">alvo_treino</span><span class="p">,</span> <span class="n">epochs</span><span class="o">=</span><span class="mi">300</span><span class="p">,</span>
           <span class="n">validation_data</span><span class="o">=</span><span class="p">(</span><span class="n">entradas_val</span><span class="p">,</span> <span class="n">alvo_val</span><span class="p">),</span>
           <span class="n">callbacks</span><span class="o">=</span><span class="p">[</span><span class="n">reduzir_passo</span><span class="p">,</span> <span class="n">parar_cedo</span><span class="p">,</span> <span class="n">guardar_melhor</span><span class="p">])</span>
</code></pre></div>
<p>Com dropout na rede e esses três callbacks, o treino parou na época 68, e
o melhor modelo ficou com perda de validação de 0,208.</p>
<p>Outros callbacks que valem um minuto de leitura:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Callback</th>
  <th>O que faz</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>LearningRateScheduler</code></td>
  <td>muda a taxa de aprendizado por uma receita sua, época a época</td>
</tr>
<tr>
  <td><code>CSVLogger</code></td>
  <td>grava as métricas de cada época num arquivo CSV</td>
</tr>
<tr>
  <td><code>TensorBoard</code></td>
  <td>grava um painel interativo do treino</td>
</tr>
<tr>
  <td><code>TerminateOnNaN</code></td>
  <td>para o treino se a perda virar <code>nan</code></td>
</tr>
</tbody>
</table></div>
<h2 id="quando-a-rede-nao-e-a-resposta">Quando a rede não é a resposta<a class="ancora" href="#quando-a-rede-nao-e-a-resposta" aria-label="Link para esta secao">#</a></h2>
<p>A rede venceu por 20 pontos aqui, mas isso não é regra.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Situação</th>
  <th>O que costuma ganhar</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Fronteira reta, poucas variáveis</td>
  <td>regressão logística, que é mais simples de explicar</td>
</tr>
<tr>
  <td>Tabelas grandes, muitas colunas</td>
  <td>árvores e florestas, que quase sempre batem redes</td>
</tr>
<tr>
  <td>Imagem, áudio, texto</td>
  <td>redes, com folga</td>
</tr>
<tr>
  <td>Poucos dados (centenas de linhas)</td>
  <td>modelos simples: rede grande decora</td>
</tr>
</tbody>
</table></div>
<p>A rede tem uma desvantagem que importa: ela não te dá um coeficiente para
interpretar. Na Aula 2 você lia &quot;cada m² soma R$ 25&quot;. Aqui não existe frase
equivalente. Você ganhou formato e perdeu explicação.</p>

<h2 id="para-que-serve">Para que serve<a class="ancora" href="#para-que-serve" aria-label="Link para esta secao">#</a></h2>
<p>Um brechó online recebe milhares de fotos por semana. Alguém precisa
etiquetar cada peça: isso é camiseta, isso é bota, isso é bolsa. Uma
pessoa leva três segundos por foto e erra pouco. O problema é a escala.</p>
<p>Vamos construir o etiquetador. As fotos são as do Fashion-MNIST, um
conjunto público de 70.000 fotos de roupa em dez categorias:</p>
<figure><img src="docs/assets/aula-08/exemplos.png" alt="Dez fotos em tons de cinza, uma de cada categoria: camiseta, calça, pulôver, vestido, casaco, sandália, camisa, tênis, bolsa e bota"><figcaption>Dez categorias, 28 por 28 pixels, em tons de cinza.</figcaption></figure>

<h2 id="a-foto-por-dentro">A foto por dentro<a class="ancora" href="#a-foto-por-dentro" aria-label="Link para esta secao">#</a></h2>
<p>Antes de qualquer modelo, olhe o que existe ali de verdade. Uma imagem é
uma grade de quadradinhos, os <strong>pixels</strong>, e cada pixel é um número.</p>
<h3 id="preto-e-branco-um-numero-por-pixel">Preto e branco: um número por pixel<a class="ancora" href="#preto-e-branco-um-numero-por-pixel" aria-label="Link para esta secao">#</a></h3>
<figure><img src="docs/assets/aula-08/grade_cinza.png" alt="À esquerda, um desenho de 5 por 5 pixels com uma bolinha escura; à direita, a mesma imagem como uma grade de números inteiros: 255 no fundo branco, 150 na borda cinza e 40 no centro escuro"><figcaption>Cada pixel é um número inteiro de 0 a 255. O 0 é preto e o 255 é branco.</figcaption></figure>

<p>Numa imagem em preto e branco, cada pixel guarda um número inteiro de 0 a
255. O 0 é preto, o 255 é branco, e os valores no meio são os cinzas. O
desenho acima tem 5 por 5 pixels, ou seja, 25 números.</p>
<h3 id="em-cor-tres-numeros-por-pixel">Em cor: três números por pixel<a class="ancora" href="#em-cor-tres-numeros-por-pixel" aria-label="Link para esta secao">#</a></h3>
<figure><img src="docs/assets/aula-08/grade_rgb.png" alt="À esquerda, o mesmo desenho em cor, com uma bolinha vermelha sobre fundo azul-claro; à direita, três grades de números inteiros, uma para o vermelho, uma para o verde e uma para o azul, com o pixel do centro destacado"><figcaption>O mesmo desenho em cor. Cada pixel tem três números, e cada grade vai de 0 a 255.</figcaption></figure>

<p>Uma foto colorida guarda três números por pixel: quanto de vermelho (R,
de <em>red</em>), de verde (G) e de azul (B). Cada um vai de 0 a 255. É como três
grades empilhadas, uma por cor. O pixel do centro tem R = 220, G = 40 e
B = 40: muito vermelho e quase nada dos outros dois. Cada grade dessas se
chama <strong>canal</strong>, e o nome volta mais adiante.</p>
<h3 id="as-fotos-desta-aula">As fotos desta aula<a class="ancora" href="#as-fotos-desta-aula" aria-label="Link para esta secao">#</a></h3>
<figure><img src="docs/assets/aula-08/pixels.png" alt="À esquerda a foto de um tênis em tons de cinza com um quadrado amarelo marcando um pedaço; à direita esse pedaço mostrado como uma grade de números inteiros entre 0 e 255"><figcaption>Cada quadradinho da foto é um número inteiro. O 0 é o fundo preto, e os valores altos são a peça.</figcaption></figure>

<p>As fotos do brechó são em tons de cinza, como o primeiro exemplo: 28 por
28 pixels, ou 784 números inteiros de 0 a 255. Neste conjunto, a peça é
clara sobre um fundo preto. Nos outros gráficos desta aula, invertemos as
cores só para a peça aparecer escura no papel branco.</p>
<p>Uma foto de 28 por 28 é uma tabela de 784 números. Nada além disso. O que
você chama de &quot;bico do tênis&quot; é uma região onde alguns números vizinhos
são altos ao mesmo tempo.</p>
<p>Guarde a palavra <strong>vizinhos</strong>. É nela que a aula inteira se apoia.</p>
<h2 id="por-que-a-rede-da-aula-7-e-ruim-nisso">Por que a rede da Aula 7 é ruim nisso<a class="ancora" href="#por-que-a-rede-da-aula-7-e-ruim-nisso" aria-label="Link para esta secao">#</a></h2>
<p>A rede densa espera uma linha de números, não uma tabela. Para alimentá-la,
você achata (<em>flatten</em>) a foto: pega as 28 linhas e emenda uma na outra,
formando uma fila de 784 entradas.</p>
<p>Aí está o problema. Depois de achatar, o pixel que ficava logo acima de
outro vai parar 28 casas adiante na fila. Para a rede, os dois viraram
entradas quaisquer, tão relacionadas quanto duas colunas de uma planilha.
A vizinhança sumiu.</p>
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O teste do embaralhamento</strong></p>
<p>Escolha uma ordem aleatória e embaralhe os 784 pixels de todas as fotos,
sempre com a mesma ordem. Uma pessoa não reconhece mais nada. A rede densa
aprende exatamente igual, porque para ela a ordem nunca significou nada.</p>
<p>Se você fez o <a href="#/redes-neurais/desafio-mnist">Desafio MNIST</a>, já rodou esse teste com a
sua própria rede.</p>
</div></div>
<p>Essa rede não é inútil. Treinada nas 60.000 fotos, ela acerta 87,6%. Mas
gasta 101.770 pesos para chegar lá, quase todos na primeira camada, que
liga cada um dos 784 pixels a cada um dos 128 neurônios.</p>
<h2 id="a-janela-que-passeia">A janela que passeia<a class="ancora" href="#a-janela-que-passeia" aria-label="Link para esta secao">#</a></h2>
<p>A convolução resolve o problema de um jeito quase bobo. Em vez de olhar a
foto inteira de uma vez, você olha um quadradinho de 3 por 3 por vez, e
faz sempre a mesma conta.</p>
<p>Esse quadradinho de nove pesos é o <strong>filtro</strong> (<em>kernel</em>). Em cada posição,
a conta é a mesma: multiplica cada peso pelo pixel que está embaixo dele e
soma as nove multiplicações. O resultado é um número só.</p>
<p>Veja a janela passeando por uma imagem pequena. Para a conta caber na tela,
ela só tem 0 e 1, como uma foto depois de dividida por 255. O filtro tem
uma coluna de <code>−1</code>, uma de <code>0</code> e uma de <code>+1</code>.</p>
<figure><img src="docs/assets/aula-08/convolucao_animada.gif" alt="Animação: uma janela de 3 por 3 passa pela imagem de 6 por 6, uma posição por vez. Em cada posição aparecem as três contas, uma por linha da janela, a soma, e o resultado entrando numa grade de 4 por 4"><figcaption>A janela passa por 16 posições. Em cada uma, três contas e uma soma viram um número do resultado.</figcaption></figure>

<p>Em cada posição, são três passos:</p>
<ol>
<li>Encoste o filtro numa janela de 3 por 3 da imagem.</li>
<li>Multiplique casa com casa, e some tudo.</li>
<li>Escreva o resultado numa casa nova, e deslize a janela uma casa.</li>
</ol>
<p>Na segunda posição, a janela pega duas colunas de zeros e uma de uns. Cada
linha contribui com <code>(−1×0) + (0×0) + (1×1) = 1</code>, e as três linhas somam 3.
Nas posições em que a janela cai inteira num lado só, o resultado é zero,
porque o <code>−1</code> e o <code>+1</code> cancelam.</p>
<figure><img src="docs/assets/aula-08/janela.png" alt="Três painéis: a imagem 6 por 6 com metade preenchida de 1, o filtro 3 por 3 com colunas menos um, zero e mais um, e o resultado 4 por 4"><figcaption>A mesma conta, congelada com a janela na linha 2, coluna 2. O resultado ali é 3.</figcaption></figure>

<p>Esse filtro só reage onde a imagem muda. Ele encontra bordas verticais.</p>
<p>Agora rode o mesmo filtro numa foto de verdade, uma janela por vez, até
cobrir tudo:</p>
<figure><img src="docs/assets/aula-08/convolucao.png" alt="Uma camiseta e duas versões filtradas: uma realçando as laterais verticais, outra realçando a gola e a barra"><figcaption>Mesma camiseta, dois filtros. À esquerda ele achou as laterais; à direita, a gola e a barra.</figcaption></figure>

<p>O resultado é uma imagem nova, chamada <strong>mapa de ativação</strong>: um mapa de
onde aquele detalhe aparece.</p>
<h2 id="tres-ideias-em-uma">Três ideias em uma<a class="ancora" href="#tres-ideias-em-uma" aria-label="Link para esta secao">#</a></h2>
<p>A convolução parece um detalhe técnico, mas ela muda três coisas de uma
vez:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Ideia</th>
  <th>O que significa</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Vizinhança</td>
  <td>cada conta usa só pixels que estão juntos, então &quot;estar perto&quot; volta a valer</td>
</tr>
<tr>
  <td>Peso compartilhado</td>
  <td>os mesmos 9 pesos servem para a foto toda, em vez de 9 pesos por posição</td>
</tr>
<tr>
  <td>Mesmo detalhe em qualquer lugar</td>
  <td>se a peça sair do centro, o filtro a encontra do mesmo jeito</td>
</tr>
</tbody>
</table></div>
<p>O peso compartilhado é o que deixa a rede pequena. Uma camada com 16
filtros de 3×3 tem 160 pesos ao todo, e olha 784 pixels. A primeira camada
da rede densa tinha 100.480 para o mesmo trabalho.</p>
<h2 id="pooling-encolher-sem-perder-o-que-importa">Pooling: encolher sem perder o que importa<a class="ancora" href="#pooling-encolher-sem-perder-o-que-importa" aria-label="Link para esta secao">#</a></h2>
<p>Depois de cada convolução, a rede encolhe a imagem. O jeito mais comum é o
<strong>pooling máximo</strong> (<em>max pooling</em>): divida em quadrados de 2 por 2 e
guarde só o maior número de cada um.</p>
<figure><img src="docs/assets/aula-08/pooling.png" alt="Uma grade 4 por 4 de números dividida em quatro quadrados coloridos, e ao lado uma grade 2 por 2 com o maior número de cada quadrado"><figcaption>Quatro números viram um. O detalhe forte sobrevive, a posição exata dele não.</figcaption></figure>

<p>Duas coisas acontecem. A imagem fica com um quarto do tamanho, o que
deixa tudo mais rápido. E a resposta passa a ser &quot;achei essa borda por
aqui&quot;, em vez de &quot;achei essa borda no pixel 14&quot;. Essa imprecisão é
proposital, e é ela que faz a rede aguentar a peça sair do lugar.</p>
<h2 id="os-filtros-que-ela-aprende-sozinha">Os filtros que ela aprende sozinha<a class="ancora" href="#os-filtros-que-ela-aprende-sozinha" aria-label="Link para esta secao">#</a></h2>
<p>Você não escolhe os nove pesos de cada filtro. Eles são pesos como
quaisquer outros, e o gradiente descendente da Aula 1 os ajusta durante o
treino. A rede decide sozinha quais detalhes vale a pena procurar.</p>
<figure><img src="docs/assets/aula-08/filtros_aprendidos.png" alt="Em cima os nove pesos de cinco filtros aprendidos; embaixo os mapas de ativação de cada um sobre a foto de uma bolsa"><figcaption>Cinco dos 16 filtros da primeira camada, e onde cada um reagiu na mesma bolsa.</figcaption></figure>

<p>Repare que eles não fazem a mesma coisa. Uns reagem no corpo da bolsa,
outros só na borda de cima. Ninguém programou isso.</p>
<h2 id="a-rede-convolucional-inteira">A rede convolucional inteira<a class="ancora" href="#a-rede-convolucional-inteira" aria-label="Link para esta secao">#</a></h2>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">modelo</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">Sequential</span><span class="p">([</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Input</span><span class="p">(</span><span class="n">shape</span><span class="o">=</span><span class="p">(</span><span class="mi">28</span><span class="p">,</span> <span class="mi">28</span><span class="p">,</span> <span class="mi">1</span><span class="p">)),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Conv2D</span><span class="p">(</span><span class="mi">16</span><span class="p">,</span> <span class="mi">3</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"relu"</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">MaxPooling2D</span><span class="p">(</span><span class="mi">2</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Conv2D</span><span class="p">(</span><span class="mi">32</span><span class="p">,</span> <span class="mi">3</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"relu"</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">MaxPooling2D</span><span class="p">(</span><span class="mi">2</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Flatten</span><span class="p">(),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">64</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"relu"</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">10</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"softmax"</span><span class="p">),</span>
<span class="p">])</span>
</code></pre></div>
<p>O <code>1</code> no final de <code>shape=(28, 28, 1)</code> é o <strong>canal</strong>: quantos números tem
cada pixel. Lembra das grades de cor do começo da aula? Cada grade é um
canal. Foto em tons de cinza tem um. Foto colorida tem três, um para
vermelho, um para verde e um para azul, e seria <code>shape=(28, 28, 3)</code>.</p>

</thead>

  <td><code>Conv2D(16, 3)</code></td>
  <td>16 mapas de 26×26</td>
  <td>160</td>

</tr>
