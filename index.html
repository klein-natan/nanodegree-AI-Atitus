<template class="pagina" data-id="llm-do-zero/aula-10-atencao" data-titulo="Aula 10 — Atenção" data-descricao="Como o modelo decide para onde olhar">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>
<p>Você vai calcular à mão o peso de atenção de uma palavra, entender por que
a máscara causal é obrigatória, e ler o mapa de atenção do modelo que
vamos treinar. É a única peça realmente nova de um transformer.</p>
</div></div>
<h2 id="onde-estamos">Onde estamos<a class="ancora" href="#onde-estamos" aria-label="Link para esta secao">#</a></h2>
<figure><img src="docs/assets/aula-10/mapa.png" alt="Quatro quadros lado a lado, um por aula: do texto para números, para onde olhar, montar e treinar, gerar e duvidar. O segundo está aceso"><figcaption>A Aula 9 entregou uma fila de números. Esta aula ensina o modelo a escolher para onde olhar dentro dela.</figcaption></figure>

<h2 id="o-problema">O problema<a class="ancora" href="#o-problema" aria-label="Link para esta secao">#</a></h2>
<p>Leia esta frase e complete a última palavra:</p>
<figure><img src="docs/assets/aula-10/olhar_para_tras.png" alt="Uma frase de 26 palavras sobre a casa de Capitú e uma janela, com quatro palavras destacadas e setas ligando elas à última posição, que está em branco"><figcaption>Para completar a última palavra, o modelo precisa voltar 22 posições.</figcaption></figure>

<p>Você completou sem esforço, porque leu a frase inteira e reteve as quatro
palavras que importam. O modelo precisa fazer o mesmo, e tem duas saídas
ruins pela frente.</p>
<p><strong>Saída ruim 1: olhar só as últimas palavras.</strong> Barato, e perde tudo o que
está longe. Foi assim que os modelos funcionavam antes de 2017.</p>
<p><strong>Saída ruim 2: somar todas as palavras anteriores por igual.</strong> Aí &quot;de&quot;,
&quot;uma&quot; e &quot;para&quot; pesam tanto quanto &quot;Capitú&quot;. A informação some no meio da
média.</p>
<p>A resposta é uma terceira coisa: deixar cada posição <strong>escolher</strong> para onde
olhar, com pesos que o treino ajusta. Isso se chama <strong>atenção</strong>
(<em>attention</em>).</p>
<h2 id="antes-a-palavra-vira-um-vetor">Antes: a palavra vira um vetor<a class="ancora" href="#antes-a-palavra-vira-um-vetor" aria-label="Link para esta secao">#</a></h2>
<p>Cada token da Aula 9 é um número inteiro, e número inteiro não serve para
fazer conta de parecença. O primeiro passo do modelo é trocar cada token
por uma linha de uma tabela:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">embutir</span> <span class="o">=</span> <span class="n">nn</span><span class="o">.</span><span class="n">Embedding</span><span class="p">(</span><span class="mi">1024</span><span class="p">,</span> <span class="mi">128</span><span class="p">)</span>   <span class="c1"># 1.024 tokens, 128 números cada</span>
</code></pre></div>
<p>Essa tabela se chama <strong>embutimento</strong> (<em>embedding</em>). São 131.072 pesos, que
o treino ajusta como quaisquer outros. Depois dela, o token 600 deixou de
ser &quot;o número 600&quot; e virou um ponto num espaço de 128 dimensões, onde
palavras parecidas ficam perto.</p>
<h2 id="primeiro-a-versao-sem-peso-nenhum">Primeiro, a versão sem peso nenhum<a class="ancora" href="#primeiro-a-versao-sem-peso-nenhum" aria-label="Link para esta secao">#</a></h2>
<p>Antes de qualquer coisa treinável, vale ver que a ideia central da atenção
funciona <strong>sem nenhum peso novo</strong>. Só com os vetores que já temos.</p>
<p>Tome três palavras e quatro números por palavra, para caber na página:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Palavra</th>
  <th>Vetor</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>o</code></td>
  <td>(2, 0, 0, 0)</td>
</tr>
<tr>
  <td><code>gato</code></td>
  <td>(0, 3, 1, 0)</td>
</tr>
<tr>
  <td><code>dorme</code></td>
  <td>(0, 1, 1, 0)</td>
</tr>
</tbody>
</table></div>
<p>A palavra <code>dorme</code> quer saber para onde olhar. São quatro passos, e você
pode fazer os quatro à mão.</p>
<p><strong>Passo 1: medir parecença com cada palavra.</strong> Multiplique casa com casa e
some. Isso se chama <strong>produto escalar</strong>, e é a mesma conta da convolução da
Aula 8:</p>
<div class="formula" title="q \cdot k = \sum_{i=1}^{d} q_i k_i"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>q</mi><mo>&#x000B7;</mo><mi>k</mi><mo>&#x0003D;</mo><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>d</mi></mrow></msubsup><msub><mi>q</mi><mi>i</mi></msub><msub><mi>k</mi><mi>i</mi></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>q</code></td>
  <td>o vetor da palavra que está perguntando</td>
</tr>
<tr>
  <td><code>k</code></td>
  <td>o vetor de uma das palavras da frase</td>
</tr>
<tr>
  <td><code>d</code></td>
  <td>quantos números tem cada vetor (aqui, 4)</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: <code>dorme</code> com <code>o</code> dá <code>0·2 + 1·0 + 1·0 + 0·0 = 0</code>. Com <code>gato</code> dá
<code>0 + 3 + 1 + 0 = 4</code>. Com ela mesma dá <code>0 + 1 + 1 + 0 = 2</code>. Vetores
apontando para o mesmo lado dão número alto; perpendiculares dão zero.</p>
<p><strong>Passo 2: dividir pela raiz de <code>d</code>.</strong> Aqui, <code>√4 = 2</code>. Os três números
viram 0, 2 e 1. Já explico por quê.</p>
<p><strong>Passo 3: passar pela softmax</strong>, a mesma da Aula 8, que transforma
qualquer trio de números em pesos que somam 100%: <strong>9%, 67% e 24%</strong>.</p>
<p><strong>Passo 4: somar os vetores, pesados por esses números.</strong></p>
<div class="formula" title="z = 0{,}09 \cdot (2,0,0,0) + 0{,}67 \cdot (0,3,1,0) + 0{,}24 \cdot (0,1,1,0)"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>z</mi><mo>&#x0003D;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><mn>09</mn><mo>&#x000B7;</mo><mo stretchy="false">&#x00028;</mo><mn>2</mn><mo>&#x0002C;</mo><mn>0</mn><mo>&#x0002C;</mo><mn>0</mn><mo>&#x0002C;</mo><mn>0</mn><mo stretchy="false">&#x00029;</mo><mo>&#x0002B;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><mn>67</mn><mo>&#x000B7;</mo><mo stretchy="false">&#x00028;</mo><mn>0</mn><mo>&#x0002C;</mo><mn>3</mn><mo>&#x0002C;</mo><mn>1</mn><mo>&#x0002C;</mo><mn>0</mn><mo stretchy="false">&#x00029;</mo><mo>&#x0002B;</mo><mn>0</mn><mrow><mo>&#x0002C;</mo></mrow><mn>24</mn><mo>&#x000B7;</mo><mo stretchy="false">&#x00028;</mo><mn>0</mn><mo>&#x0002C;</mo><mn>1</mn><mo>&#x0002C;</mo><mn>1</mn><mo>&#x0002C;</mo><mn>0</mn><mo stretchy="false">&#x00029;</mo></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>z</code></td>
  <td>o vetor de saída da posição <code>dorme</code></td>
</tr>
<tr>
  <td>os três pesos</td>
  <td>quanto ela decidiu olhar para cada palavra</td>
</tr>
<tr>
  <td>os três vetores</td>
  <td>as próprias palavras, sem transformação nenhuma</td>
</tr>
</tbody>
</table></div>
<p>O resultado é <code>(0,18, 2,24, 0,91, 0)</code>. Repare: <code>dorme</code> saiu carregando dois
terços de <code>gato</code>. A palavra deixou de ser só ela mesma e virou ela mesma
<strong>mais o contexto</strong>.</p>
<figure><img src="docs/assets/aula-10/conta.png" alt="Quatro painéis em sequência: os produtos 0, 4 e 2; divididos por 2 dando 0, 2 e 1; a softmax dando 9%, 67% e 24%; e a saída como mistura dos três vetores"><figcaption>Quatro passos, três palavras, números pequenos. É a atenção inteira, e ainda não há um peso treinável.</figcaption></figure>

<p><strong>Por que dividir pela raiz de <code>d</code>?</strong> Quanto mais dimensões, maiores os
produtos escalares, só por haver mais parcelas na soma. Números grandes
fazem a softmax virar tudo-ou-nada: 99,9% numa palavra e quase zero nas
outras. A divisão mantém a distribuição espalhada, e com isso o gradiente
continua existindo.</p>
<h2 id="os-dois-buracos-da-versao-sem-pesos">Os dois buracos da versão sem pesos<a class="ancora" href="#os-dois-buracos-da-versao-sem-pesos" aria-label="Link para esta secao">#</a></h2>
<p>A versão de cima funciona, e tem dois defeitos. Os dois dá para medir, e o
resto da aula é tapar um de cada vez.</p>
<figure><img src="docs/assets/aula-10/espelho.png" alt="À esquerda uma matriz 3 por 3 de pesos de atenção com a diagonal destacada em duas das três linhas; à direita duas barras idênticas comparando a saída da palavra dorme na frase normal e na embaralhada"><figcaption>Buraco 1: a palavra olha para si mesma. Buraco 2: embaralhar a frase não muda nada.</figcaption></figure>

<p><strong>Buraco 1: vira espelho.</strong> Faça a mesma conta para as três palavras:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Quem pergunta</th>
  <th>olha <code>o</code></th>
  <th>olha <code>gato</code></th>
  <th>olha <code>dorme</code></th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>o</code></td>
  <td><strong>79%</strong></td>
  <td>11%</td>
  <td>11%</td>
</tr>
<tr>
  <td><code>gato</code></td>
  <td>1%</td>
  <td><strong>95%</strong></td>
  <td>5%</td>
</tr>
<tr>
  <td><code>dorme</code></td>
  <td>9%</td>
  <td><strong>67%</strong></td>
  <td>24%</td>
</tr>
</tbody>
</table></div>
<p>Em duas das três linhas, a palavra olha principalmente para si mesma. Não é
azar: o produto escalar de um vetor com ele mesmo é o comprimento dele ao
quadrado, o maior valor que ele consegue tirar de qualquer comparação.</p>
<p>E tem um problema mais fundo por trás. Parecença de embutimento é <strong>uma</strong>
relação: palavras de sentido próximo ficam perto. Mas <code>dorme</code> não precisa
procurar sinônimos de <code>dorme</code>. Precisa procurar o <strong>sujeito</strong> dela, que é
<code>gato</code>, e sujeito não é sinônimo de nada. Uma relação só, fixa, não cobre
isso.</p>
<p><strong>Buraco 2: a frase virou um saco de palavras.</strong> Embaralhe &quot;o gato dorme&quot;
para &quot;dorme gato o&quot; e refaça a conta. A saída de cada palavra é idêntica.
Nada na fórmula diz onde cada palavra está, então &quot;o gato mordeu o
cachorro&quot; e &quot;o cachorro mordeu o gato&quot; são a mesma coisa para ela.</p>
<p>Tapamos o buraco 1 agora, com pesos treináveis. O buraco 2 fica para o fim
da aula.</p>
<h2 id="os-tres-papeis">Os três papéis<a class="ancora" href="#os-tres-papeis" aria-label="Link para esta secao">#</a></h2>
<p>A atenção de verdade dá três vetores a cada palavra, obtidos multiplicando
o vetor da palavra por três tabelas de pesos diferentes:</p>
<figure><img src="docs/assets/aula-10/qkv.png" alt="Três blocos lado a lado: Pergunta (Q), Etiqueta (K) e Conteúdo (V), cada um com uma frase explicando o papel"><figcaption>A mesma palavra, vista de três jeitos. O treino ajusta as três tabelas de pesos.</figcaption></figure>

<p>Pense numa biblioteca. Você chega com uma <strong>pergunta</strong> (o Q da posição
atual). Cada livro tem uma <strong>etiqueta</strong> na lombada (o K de cada palavra
anterior). Você compara a sua pergunta com todas as etiquetas, escolhe os
livros mais parecidos, e lê o <strong>conteúdo</strong> deles (o V).</p>
<p>A diferença para a biblioteca de verdade: aqui você não escolhe um livro
só. Você lê todos, em proporções diferentes.</p>
<h2 id="a-formula-inteira">A fórmula inteira<a class="ancora" href="#a-formula-inteira" aria-label="Link para esta secao">#</a></h2>
<div class="formula" title="\text{Atenção}(Q, K, V) = \text{softmax}\!\left(\frac{Q K^{\top}}{\sqrt{d}}\right) V"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>Atenção</mtext><mo stretchy="false">&#x00028;</mo><mi>Q</mi><mo>&#x0002C;</mo><mi>K</mi><mo>&#x0002C;</mo><mi>V</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0003D;</mo><mtext>softmax</mtext><mspace width="negativethinmathspace" /><mrow><mo stretchy="true" fence="true" form="prefix">&#x00028;</mo><mfrac><mrow><mi>Q</mi><msup><mi>K</mi><mrow><mo>&#x022A4;</mo></mrow></msup></mrow><mrow><msqrt><mrow><mi>d</mi></mrow></msqrt></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">&#x00029;</mo></mrow><mi>V</mi></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>Q K^T</code></td>
  <td>todos os produtos escalares de todas as perguntas com todas as etiquetas</td>
</tr>
<tr>
  <td><code>√d</code></td>
  <td>a raiz da dimensão, que segura o tamanho dos números</td>
</tr>
<tr>
  <td><code>softmax</code></td>
  <td>transforma os números em pesos que somam 1</td>
</tr>
</tbody>
</table></div>
<p>São os mesmos quatro passos que você já fez à mão. A única diferença: em
vez de comparar as palavras com elas mesmas, o modelo compara o <code>Q</code> de uma
com o <code>K</code> da outra, e entrega o <code>V</code>. Três tabelas a mais, e nada de
conceito novo.</p>
<p>E é isso que resolve o espelho da seção anterior. Como <code>Q</code> e <code>K</code> saem de
tabelas diferentes, o produto de uma palavra com ela mesma deixa de ser
automaticamente o maior. O treino é quem decide quem olha para quem.</p>
<h2 id="a-mascara-nao-vale-olhar-a-resposta">A máscara: não vale olhar a resposta<a class="ancora" href="#a-mascara-nao-vale-olhar-a-resposta" aria-label="Link para esta secao">#</a></h2>
<p>Existe um problema que o desenho acima esconde. Se cada posição olha todas
as outras, a posição 3 olha a posição 4, que é justamente a palavra que ela
deveria prever.</p>
<figure><img src="docs/assets/aula-10/mascara.png" alt="Duas matrizes de atenção lado a lado: à esquerda todos os pesos preenchidos, à direita só o triângulo inferior, com o resto em branco"><figcaption>À esquerda o modelo cola. À direita, cada linha só enxerga o que veio antes dela.</figcaption></figure>

<p>A correção é a <strong>máscara causal</strong>: antes da softmax, troque por menos
infinito todos os produtos que apontam para o futuro. A softmax de menos
infinito é zero, então esses pesos somem.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">mascara</span> <span class="o">=</span> <span class="n">torch</span><span class="o">.</span><span class="n">triu</span><span class="p">(</span><span class="n">torch</span><span class="o">.</span><span class="n">ones</span><span class="p">(</span><span class="n">n</span><span class="p">,</span> <span class="n">n</span><span class="p">),</span> <span class="n">diagonal</span><span class="o">=</span><span class="mi">1</span><span class="p">)</span><span class="o">.</span><span class="n">bool</span><span class="p">()</span>
<span class="n">pontos</span> <span class="o">=</span> <span class="n">pontos</span><span class="o">.</span><span class="n">masked_fill</span><span class="p">(</span><span class="n">mascara</span><span class="p">,</span> <span class="nb">float</span><span class="p">(</span><span class="s2">"-inf"</span><span class="p">))</span>
</code></pre></div>
<p>O nome &quot;causal&quot; vem daí: a informação só corre do passado para o futuro,
nunca ao contrário.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Esquecer a máscara. O modelo treina lindamente, a perda cai para quase
zero, e você comemora. Na hora de gerar texto, ele não tem mais o futuro
para copiar, e a saída vira lixo. É o erro mais frustrante desta aula,
porque o sintoma aparece longe da causa.</p>
</div></div>
<h2 id="quatro-cabecas-quatro-olhares">Quatro cabeças, quatro olhares<a class="ancora" href="#quatro-cabecas-quatro-olhares" aria-label="Link para esta secao">#</a></h2>
<p>Uma atenção só tem que decidir tudo com um conjunto de pesos. Na prática,
o modelo roda várias em paralelo, cada uma com sua própria tabela de Q, K e
V, e junta os resultados no fim. Cada uma se chama <strong>cabeça</strong> (<em>head</em>).</p>
<p>O nosso modelo tem 4 cabeças por camada. Como o vetor tem 128 números,
cada cabeça trabalha com 32. O custo total é o mesmo de uma cabeça de 128,
e o que se ganha é a variedade:</p>
<figure><img src="docs/assets/aula-10/cabecas.png" alt="Oito mapas de atenção em duas linhas: quatro cabeças da camada 1 e quatro da camada 4, cada uma com um padrão diferente"><figcaption>As oito cabeças, na mesma frase. Nenhuma faz o que a outra faz.</figcaption></figure>

<p>Agora olhe de perto duas delas, na frase &quot;A casa de Capitú tinha uma janela
para a rua&quot;:</p>
<figure><img src="docs/assets/aula-10/mapa_atencao.png" alt="Dois mapas de atenção grandes, com os tokens da frase nos dois eixos, mostrando padrões diferentes e todo o canto superior direito em branco"><figcaption>Cada linha é uma posição prevendo. Cada coluna é para onde ela olhou.</figcaption></figure>

<p>Duas coisas para reparar. Primeira: o canto de cima à direita é todo
branco. É a máscara funcionando, no modelo de verdade. Segunda: &quot;Capitú&quot;
aparece cortado em quatro tokens (<code>·C</code>, <code>ap</code>, <code>it</code>, <code>ú</code>), porque um
vocabulário de 1.024 não tem espaço para nomes próprios. Os pedaços de uma
palavra costumam se olhar entre si, e é isso que remonta a palavra.</p>
<p>Dá para medir o que cada camada faz. Numa frase de 34 tokens, a média de
quão longe cada cabeça olha:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Camada</th>
  <th>Distância média</th>
  <th>Peso na palavra anterior</th>
</tr>
</thead>
<tbody>
<tr>
  <td>1</td>
  <td>5,5 tokens</td>
  <td>17%</td>
</tr>
<tr>
  <td>2</td>
  <td>2,8 tokens</td>
  <td>33%</td>
</tr>
<tr>
  <td>3</td>
  <td>2,2 tokens</td>
  <td>39%</td>
</tr>
<tr>
  <td>4</td>
  <td>2,8 tokens</td>
  <td>31%</td>
</tr>
</tbody>
</table></div>
<p>A primeira camada espalha o peso por toda a frase. As de cima ficam bem
mais locais, com um terço do peso na palavra imediatamente anterior.
Ninguém programou essa divisão de trabalho: ela sai do treino.</p>
<h2 id="o-buraco-2-enfim-a-posicao">O buraco 2, enfim: a posição<a class="ancora" href="#o-buraco-2-enfim-a-posicao" aria-label="Link para esta secao">#</a></h2>
<p>Ficou uma dívida lá atrás. Nem Q, nem K, nem V, nem a máscara, nem as
quatro cabeças resolveram o saco de palavras: embaralhe a frase e a conta
dá o mesmo. Todas essas peças mexem em <em>quem olha para quem</em>, e nenhuma
delas sabe <em>onde</em> cada palavra está.</p>
<p>A correção precisa entrar antes dos produtos escalares, mexendo nos
vetores. A solução moderna se chama <strong>RoPE</strong> (<em>rotary position embedding</em>):
gire o vetor de cada palavra por um ângulo proporcional à posição dela.</p>
<figure><img src="docs/assets/aula-10/rope.png" alt="À esquerda três setas saindo da origem com ângulos diferentes, marcadas como posição 0, 2 e 6; à direita uma curva mostrando a parecença caindo conforme a distância aumenta"><figcaption>Duas palavras próximas giram ângulos parecidos, e continuam parecidas. Longe, a parecença cai.</figcaption></figure>

<p>Girar tem uma propriedade que serve à perfeição aqui: quando você gira
dois vetores e compara os dois, o que sobra na comparação é a <strong>diferença</strong>
entre os dois ângulos. Ou seja, o produto escalar passa a depender da
distância entre as duas palavras, e não da posição absoluta de cada uma. O
modelo trata igual uma frase que aparece no começo e no fim do texto.</p>
<p>Não precisa saber a fórmula do giro para seguir adiante. Precisa saber o
buraco que ele tampa, e você acabou de medir esse buraco.</p>
<h2 id="o-preco-da-janela">O preço da janela<a class="ancora" href="#o-preco-da-janela" aria-label="Link para esta secao">#</a></h2>
<p>Uma conta que explica muita notícia. Para uma janela de <code>n</code> tokens, a
atenção calcula <code>n × n</code> produtos escalares. Dobrar a janela quadruplica o
custo.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Janela</th>
  <th>Produtos por cabeça</th>
</tr>
</thead>
<tbody>
<tr>
  <td>128 (o nosso)</td>
  <td>16.384</td>
</tr>
<tr>
  <td>1.000</td>
  <td>1 milhão</td>
</tr>
<tr>
  <td>100.000</td>
  <td>10 bilhões</td>
</tr>
</tbody>
</table></div>
<p>É por isso que janela grande é caro, e por que cada modelo novo anuncia a
janela dele como se fosse uma conquista. É.</p>
<h2 id="explique-sem-olhar">Explique sem olhar<a class="ancora" href="#explique-sem-olhar" aria-label="Link para esta secao">#</a></h2>
<p>O teste mais honesto de que você entendeu é tentar explicar sem ler.
Feche esta página e responda em voz alta, como se explicasse para um
colega. Onde travar, é ali que falta entender: volte à seção.</p>

<h2 id="comece-por-um-modelo-de-mentira">Comece por um modelo de mentira<a class="ancora" href="#comece-por-um-modelo-de-mentira" aria-label="Link para esta secao">#</a></h2>
<p>Antes de escrever qualquer coisa difícil, escreva o modelo inteiro com um
buraco no meio. O bloco não faz nada: recebe e devolve.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="k">class</span><span class="w"> </span><span class="nc">BlocoDeMentira</span><span class="p">(</span><span class="n">nn</span><span class="o">.</span><span class="n">Module</span><span class="p">):</span>
    <span class="k">def</span><span class="w"> </span><span class="nf">forward</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">x</span><span class="p">):</span>
        <span class="k">return</span> <span class="n">x</span>                        <span class="c1"># de propósito: não faz nada</span>

<span class="k">class</span><span class="w"> </span><span class="nc">MiniLLM</span><span class="p">(</span><span class="n">nn</span><span class="o">.</span><span class="n">Module</span><span class="p">):</span>
    <span class="k">def</span><span class="w"> </span><span class="fm">__init__</span><span class="p">(</span><span class="bp">self</span><span class="p">):</span>
        <span class="nb">super</span><span class="p">()</span><span class="o">.</span><span class="fm">__init__</span><span class="p">()</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">embutir</span> <span class="o">=</span> <span class="n">nn</span><span class="o">.</span><span class="n">Embedding</span><span class="p">(</span><span class="mi">1024</span><span class="p">,</span> <span class="mi">128</span><span class="p">)</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">blocos</span> <span class="o">=</span> <span class="n">nn</span><span class="o">.</span><span class="n">ModuleList</span><span class="p">(</span><span class="n">BlocoDeMentira</span><span class="p">()</span> <span class="k">for</span> <span class="n">_</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="mi">4</span><span class="p">))</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">cabeca</span> <span class="o">=</span> <span class="n">nn</span><span class="o">.</span><span class="n">Linear</span><span class="p">(</span><span class="mi">128</span><span class="p">,</span> <span class="mi">1024</span><span class="p">,</span> <span class="n">bias</span><span class="o">=</span><span class="kc">False</span><span class="p">)</span>

    <span class="k">def</span><span class="w"> </span><span class="nf">forward</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">tokens</span><span class="p">):</span>
        <span class="n">x</span> <span class="o">=</span> <span class="bp">self</span><span class="o">.</span><span class="n">embutir</span><span class="p">(</span><span class="n">tokens</span><span class="p">)</span>
        <span class="k">for</span> <span class="n">bloco</span> <span class="ow">in</span> <span class="bp">self</span><span class="o">.</span><span class="n">blocos</span><span class="p">:</span>
            <span class="n">x</span> <span class="o">=</span> <span class="n">bloco</span><span class="p">(</span><span class="n">x</span><span class="p">)</span>
        <span class="k">return</span> <span class="bp">self</span><span class="o">.</span><span class="n">cabeca</span><span class="p">(</span><span class="n">x</span><span class="p">)</span>
</code></pre></div>
<p>Isso <strong>roda</strong>. Você passa uma frase e recebe 1.024 pontuações por posição,
com o formato certo. Dá até para gerar texto, e o texto sai assim:</p>
<div class="bloco-codigo" data-lingua=""><button class="copiar" type="button">copiar</button><pre class="realce"><code>&#x27;Não sei se a senhora são homear\ufffd\th\nfR ta inviJ&#x27;
</code></pre></div>
<p>Lixo, e lixo com o formato correto. Três coisas ficaram estabelecidas de
graça: os pesos entram e saem pela mesma tabela, os blocos são
intercambiáveis, e o que sai da última camada tem um número por token do
vocabulário.</p>
<p>Daqui para a frente o trabalho é um só: <strong>trocar o <code>return x</code> por algo que
valha a pena</strong>. Todo o resto do arquivo já está no lugar, e a cada peça que
você encaixa dá para rodar de novo e ver a perda cair um pouco mais.</p>
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>Por que começar pelo esqueleto</strong></p>
<p>É a diferença entre montar um móvel com o manual aberto e montar peça por
peça torcendo para encaixar no fim. Com o esqueleto rodando, todo erro que
aparecer daqui em diante veio da peça que você acabou de escrever, e não
de mais nada. Isso corta o tempo de depuração pela metade.</p>
</div></div>
<h2 id="o-bloco-transformer">O bloco transformer<a class="ancora" href="#o-bloco-transformer" aria-label="Link para esta secao">#</a></h2>
<p>Um <strong>transformer</strong> é um bloco repetido várias vezes. Cada bloco tem duas
metades, e as duas seguem o mesmo desenho: normaliza, faz alguma coisa,
soma de volta.</p>
<figure><img src="docs/assets/aula-11/bloco.png" alt="Diagrama do bloco: entra, RMSNorm, atenção, soma; depois RMSNorm, MLP, soma, e sai. Dois arcos vermelhos marcam os atalhos que levam a entrada até as somas"><figcaption>Um bloco. A primeira metade mistura posições, a segunda pensa sobre cada posição isolada.</figcaption></figure>

<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="k">def</span><span class="w"> </span><span class="nf">forward</span><span class="p">(</span><span class="bp">self</span><span class="p">,</span> <span class="n">x</span><span class="p">):</span>
    <span class="n">x</span> <span class="o">=</span> <span class="n">x</span> <span class="o">+</span> <span class="bp">self</span><span class="o">.</span><span class="n">atencao</span><span class="p">(</span><span class="bp">self</span><span class="o">.</span><span class="n">norma1</span><span class="p">(</span><span class="n">x</span><span class="p">))</span>
    <span class="k">return</span> <span class="n">x</span> <span class="o">+</span> <span class="bp">self</span><span class="o">.</span><span class="n">mlp</span><span class="p">(</span><span class="bp">self</span><span class="o">.</span><span class="n">norma2</span><span class="p">(</span><span class="n">x</span><span class="p">))</span>
</code></pre></div>
<p>Duas linhas. Repare no <code>x +</code> das duas: é o <strong>atalho</strong> (conexão residual).
A entrada inteira atravessa o bloco por fora, e o modelo soma ela ao
que saiu.</p>
<p><strong>Para que serve o atalho.</strong> Sem ele, o gradiente da Aula 1 precisa
atravessar todas as camadas para chegar à primeira, e vai encolhendo pelo
caminho. Com ele, existe um caminho direto da saída até qualquer camada.</p>
<p>Isso não é para acreditar: é para medir. Monte uma rede de cinco camadas,
faça um passo para trás e imprima o gradiente médio que chega em cada uma:</p>
<figure><img src="docs/assets/aula-11/atalho.png" alt="Duas curvas em escala logarítmica do gradiente médio por camada: a sem atalho despenca nas primeiras camadas, a com atalho fica quase plana"><figcaption>Escala logarítmica. Sem atalho, a primeira camada recebe migalhas.</figcaption></figure>

<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Camada</th>
  <th>Sem atalho</th>
  <th>Com atalho</th>
</tr>
</thead>
<tbody>
<tr>
  <td>1 (a primeira)</td>
  <td>0,00002</td>
  <td><strong>0,00053</strong></td>
</tr>
<tr>
  <td>2</td>
  <td>0,00001</td>
  <td>0,00070</td>
</tr>
<tr>
  <td>3</td>
  <td>0,00017</td>
  <td>0,00078</td>
</tr>
<tr>
  <td>4</td>
  <td>0,00059</td>
  <td>0,00075</td>
</tr>
<tr>
  <td>5 (a última)</td>
  <td>0,00854</td>
  <td>0,01401</td>
</tr>
</tbody>
</table></div>
<p>Leia a coluna do meio de baixo para cima: o gradiente encolhe 359 vezes no
caminho até a primeira camada. Ela quase não aprende. Com o atalho, a
primeira camada recebe <strong>22 vezes mais</strong> gradiente, e as quatro primeiras
ficam na mesma ordem de grandeza.</p>
<p>Esse é o <strong>gradiente que desaparece</strong>, e foi ele que travou as redes
profundas por anos. A ideia do atalho, de 2015, é o que permitiu empilhar
dezenas de camadas.</p>
<p>Uma segunda leitura, mais intuitiva: cada bloco não reescreve o vetor da
palavra. Ele <strong>acrescenta</strong> alguma coisa ao que já estava lá.</p>
<h2 id="as-duas-metades-do-bloco">As duas metades do bloco<a class="ancora" href="#as-duas-metades-do-bloco" aria-label="Link para esta secao">#</a></h2>
<p>A <strong>primeira metade é a atenção</strong> da Aula 10: é onde as posições conversam
entre si. É a única parte do modelo em que uma palavra vê outra.</p>
<p>A <strong>segunda metade é uma camada densa</strong> da Aula 7, aplicada a cada posição
<strong>separadamente</strong>. Ela não olha para os vizinhos: pega o vetor que a
atenção montou e pensa sobre ele sozinho.</p>
<p>Essa divisão de trabalho é o transformer inteiro, e vale decorar assim:</p>
<blockquote>
<p>A atenção <strong>junta</strong> informação de outras posições. A camada densa
<strong>pensa</strong> sobre essa mistura, uma posição de cada vez.</p>
</blockquote>
<p>E a normalização antes de cada metade faz o de sempre, desde a Aula 7:
mantém os números num tamanho parecido, para o treino não desandar.</p>
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que os modelos de hoje trocaram (e por que você não precisa decorar)</strong></p>
<p>O desenho de 2017 usava LayerNorm e ReLU. Llama, Qwen e quase todo modelo
aberto de hoje, o nosso incluído, usam duas substituições:</p>
<ul>
<li><strong>RMSNorm</strong> no lugar da LayerNorm: a mesma normalização da Aula 7, sem a
subtração da média. Faz quase a mesma coisa e custa menos conta.</li>
<li><strong>SwiGLU</strong> no lugar da ReLU: além do caminho que carrega o conteúdo, um
segundo caminho vira uma <strong>porta</strong>, que decide dimensão por dimensão
quanto passa adiante. Custa uma tabela de pesos a mais e rende melhor.</li>
</ul>
<p>São otimizações, não conceitos. Se você trocasse as duas pelas versões de
2017, o modelo desta aula ainda treinaria e ainda escreveria português. Ele
só ficaria um pouco pior e um pouco mais lento.</p>
</div></div>
<h2 id="o-modelo-inteiro">O modelo inteiro<a class="ancora" href="#o-modelo-inteiro" aria-label="Link para esta secao">#</a></h2>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="k">class</span><span class="w"> </span><span class="nc">MiniLLM</span><span class="p">(</span><span class="n">nn</span><span class="o">.</span><span class="n">Module</span><span class="p">):</span>
    <span class="k">def</span><span class="w"> </span><span class="fm">__init__</span><span class="p">(</span><span class="bp">self</span><span class="p">):</span>
        <span class="nb">super</span><span class="p">()</span><span class="o">.</span><span class="fm">__init__</span><span class="p">()</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">embutir</span> <span class="o">=</span> <span class="n">nn</span><span class="o">.</span><span class="n">Embedding</span><span class="p">(</span><span class="mi">1024</span><span class="p">,</span> <span class="mi">128</span><span class="p">)</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">blocos</span> <span class="o">=</span> <span class="n">nn</span><span class="o">.</span><span class="n">ModuleList</span><span class="p">(</span><span class="n">Bloco</span><span class="p">()</span> <span class="k">for</span> <span class="n">_</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="mi">4</span><span class="p">))</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">norma</span> <span class="o">=</span> <span class="n">nn</span><span class="o">.</span><span class="n">RMSNorm</span><span class="p">(</span><span class="mi">128</span><span class="p">)</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">cabeca</span> <span class="o">=</span> <span class="n">nn</span><span class="o">.</span><span class="n">Linear</span><span class="p">(</span><span class="mi">128</span><span class="p">,</span> <span class="mi">1024</span><span class="p">,</span> <span class="n">bias</span><span class="o">=</span><span class="kc">False</span><span class="p">)</span>
        <span class="bp">self</span><span class="o">.</span><span class="n">cabeca</span><span class="o">.</span><span class="n">weight</span> <span class="o">=</span> <span class="bp">self</span><span class="o">.</span><span class="n">embutir</span><span class="o">.</span><span class="n">weight</span>   <span class="c1"># pesos amarrados</span>
</code></pre></div>
<p>A última linha merece explicação. A tabela de entrada troca token por
vetor; a cabeça de saída faz o contrário, troca vetor por pontuação de
cada token. Usar a <strong>mesma</strong> tabela nos dois sentidos economiza 131.072
pesos e costuma melhorar o resultado, porque a tabela recebe gradiente
das duas pontas.</p>
<figure><img src="docs/assets/aula-11/onde_estao_os_pesos.png" alt="Gráfico de barras com os pesos por grupo: embutimento 131.072, atenção 262.144, MLP 393.216 e normalização 1.152"><figcaption>Metade dos pesos está no MLP. A atenção é a peça famosa, mas não é a maior.</figcaption></figure>

<p>Isso costuma surpreender. A atenção é o que dá nome ao artigo e o que
todo mundo explica, mas o modelo gasta mais pesos nas camadas densas que
vêm depois dela.</p>
<h2 id="a-perda-entropia-cruzada-com-1-024-categorias">A perda: entropia cruzada com 1.024 categorias<a class="ancora" href="#a-perda-entropia-cruzada-com-1-024-categorias" aria-label="Link para esta secao">#</a></h2>
<p>É a mesma perda da Aula 8, só que agora as categorias são os 1.024 tokens
do vocabulário, e a previsão acontece em cada uma das 128 posições da
janela.</p>
<div class="formula" title="\text{perda} = -\frac{1}{n}\sum_{i=1}^{n} \log P(\text{token certo}_i)"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>perda</mtext><mo>&#x0003D;</mo><mo>&#x02212;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mi>log</mi><mi>P</mi><mo stretchy="false">&#x00028;</mo><msub><mtext>token&#x000A0;certo</mtext><mi>i</mi></msub><mo stretchy="false">&#x00029;</mo></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>n</code></td>
  <td>quantas previsões o lote tem: 32 × 128 = 4.096</td>
</tr>
<tr>
  <td><code>P(token certo)</code></td>
  <td>a probabilidade que o modelo deu ao token que de fato veio</td>
</tr>
<tr>
  <td><code>log</code></td>
  <td>o logaritmo, que castiga com força quem erra com confiança</td>
</tr>
</tbody>
</table></div>
<p>Antes de qualquer treino, o modelo chuta igual entre os 1.024 tokens.
Então a probabilidade do token certo é <code>1/1024</code>, e a perda tem que dar
<code>ln(1024) = 6,93</code>. O nosso deu 6,95 no passo 0, o que confirma que a
montagem está certa.</p>
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>Um teste que vale ouro</strong></p>
<p>Sempre confira a perda no passo 0 contra <code>ln(vocabulário)</code>. Se der muito
diferente, tem erro de montagem ou de inicialização, e é muito mais fácil
achar agora do que depois de duas horas de treino.</p>
</div></div>
<h2 id="perplexidade-a-perda-em-portugues">Perplexidade: a perda em português<a class="ancora" href="#perplexidade-a-perda-em-portugues" aria-label="Link para esta secao">#</a></h2>
<p>Perda de 3,46 não diz nada a ninguém. Tire a exponencial e ela vira um
número com significado:</p>
<div class="formula" title="\text{perplexidade} = e^{\text{perda}}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>perplexidade</mtext><mo>&#x0003D;</mo><msup><mi>e</mi><mrow><mtext>perda</mtext></mrow></msup></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Valor</th>
  <th>Significa</th>
</tr>
</thead>
<tbody>
<tr>
  <td>perda 6,93</td>
  <td>perplexidade 1.024: o modelo não sabe nada</td>
</tr>
<tr>
  <td>perda 3,46</td>
  <td>perplexidade 31,8: ele está escolhendo entre uns 32 candidatos</td>
</tr>
<tr>
  <td>perda 0</td>
  <td>perplexidade 1: ele acerta sempre, o que só acontece se decorou</td>
</tr>
</tbody>
</table></div>
<p>Perplexidade é &quot;entre quantos tokens o modelo está efetivamente na
dúvida&quot;. Sair de 1.024 para 31,8 quer dizer que o modelo eliminou 97% dos
candidatos antes de escolher.</p>
<h2 id="o-laco-de-treino">O laço de treino<a class="ancora" href="#o-laco-de-treino" aria-label="Link para esta secao">#</a></h2>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="k">for</span> <span class="n">passo</span> <span class="ow">in</span> <span class="nb">range</span><span class="p">(</span><span class="mi">6000</span><span class="p">):</span>
    <span class="n">entrada</span><span class="p">,</span> <span class="n">alvo</span> <span class="o">=</span> <span class="n">sortear</span><span class="p">(</span><span class="n">dados_treino</span><span class="p">)</span>
    <span class="n">_</span><span class="p">,</span> <span class="n">perda</span> <span class="o">=</span> <span class="n">modelo</span><span class="p">(</span><span class="n">entrada</span><span class="p">,</span> <span class="n">alvo</span><span class="p">)</span>
    <span class="n">otimizador</span><span class="o">.</span><span class="n">zero_grad</span><span class="p">(</span><span class="n">set_to_none</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
    <span class="n">perda</span><span class="o">.</span><span class="n">backward</span><span class="p">()</span>
    <span class="n">torch</span><span class="o">.</span><span class="n">nn</span><span class="o">.</span><span class="n">utils</span><span class="o">.</span><span class="n">clip_grad_norm_</span><span class="p">(</span><span class="n">modelo</span><span class="o">.</span><span class="n">parameters</span><span class="p">(),</span> <span class="mf">1.0</span><span class="p">)</span>
    <span class="n">otimizador</span><span class="o">.</span><span class="n">step</span><span class="p">()</span>
</code></pre></div>
<p>Seis linhas, e todas já apareceram no curso. Duas merecem comentário.</p>
<p><strong>AdamW</strong> é o otimizador. Ele é o gradiente descendente da Aula 1 com duas
melhorias: guarda uma média dos gradientes recentes (o que suaviza o
caminho) e dá passos maiores nas direções em que o gradiente é
consistentemente pequeno.</p>
<p><strong>O corte de gradiente</strong> (<code>clip_grad_norm_</code>) limita o tamanho do passo
quando um lote sai muito fora do normal. Sem ele, um único lote estranho
pode jogar os pesos para longe e estragar horas de treino.</p>
<h2 id="o-tamanho-do-passo-muda-ao-longo-do-treino">O tamanho do passo muda ao longo do treino<a class="ancora" href="#o-tamanho-do-passo-muda-ao-longo-do-treino" aria-label="Link para esta secao">#</a></h2>
<figure><img src="docs/assets/aula-11/taxa.png" alt="Curva do tamanho do passo: sobe em linha reta nos primeiros 200 passos e depois desce suavemente como um cosseno até quase zero"><figcaption>Aquecimento e resfriamento. É o padrão em qualquer treino de modelo de linguagem.</figcaption></figure>

<p>No começo os pesos são aleatórios, e passo grande em direção errada só faz
estrago: por isso o <strong>aquecimento</strong>, com a taxa subindo do zero nos
primeiros 200 passos. No fim, o modelo está perto de um bom lugar e passo
grande faz ele passar do ponto: por isso o <strong>resfriamento</strong>, com a taxa
descendo até quase zero.</p>
<h2 id="o-treino-de-verdade">O treino de verdade<a class="ancora" href="#o-treino-de-verdade" aria-label="Link para esta secao">#</a></h2>
<figure><img src="docs/assets/aula-11/curva_treino.png" alt="Dois gráficos: à esquerda a perda de treino e validação caindo de 6,95 até perto de 3, à direita a mesma curva em perplexidade, com uma linha marcando os 1.024 do chute ao acaso"><figcaption>6.000 passos, 40 minutos de processador. A queda grande acontece nos primeiros 1.000.</figcaption></figure>

<p>Repare no formato: a perda despenca no começo e depois vai ficando cada
vez mais difícil melhorar. Sair de 6,95 para 4,0 custou uns poucos
minutos. Sair de 4,0 para 3,46 custou o resto das quatro dezenas.</p>
<p>Essa curva explica por que treinar modelos grandes é caro. Cada ponto a
menos custa mais que o anterior, e não existe atalho.</p>
<p>E veja o que sai do modelo em cada momento:</p>
<figure><img src="docs/assets/aula-11/amostras.png" alt="Quatro caixas com o texto gerado no passo 0, 200, 1000 e 6000, cada uma mais parecida com português que a anterior"><figcaption>O mesmo início, gerado em quatro momentos. Nada mudou além do valor dos 787.584 pesos.</figcaption></figure>

<p>No passo 0 é ruído. Em 200 passos já existem palavras curtas e vírgulas em
lugares plausíveis. Em 1.000 aparecem frases inteiras erradas mas
gramaticais. No fim, ele escreve com a grafia de 1899, porque foi isso que
leu.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Julgar o modelo pela perda de treino. No nosso, ela terminou em 2,96
enquanto a de validação parou em 3,46. Essa diferença é o modelo decorando
trechos do corpus. Enquanto as duas caem juntas, tudo bem. Quando a de
validação começa a subir, pare o treino: o que vem depois é decoreba.</p>
</div></div>

<h2 id="onde-estamos">Onde estamos<a class="ancora" href="#onde-estamos" aria-label="Link para esta secao">#</a></h2>
<figure><img src="docs/assets/aula-12/mapa.png" alt="Quatro quadros lado a lado, um por aula: do texto para números, para onde olhar, montar e treinar, gerar e duvidar. O quarto está aceso"><figcaption>O modelo está treinado. Falta transformar as probabilidades dele em texto, e saber do que ele não é capaz.</figcaption></figure>

<h2 id="o-modelo-nao-devolve-uma-palavra">O modelo não devolve uma palavra<a class="ancora" href="#o-modelo-nao-devolve-uma-palavra" aria-label="Link para esta secao">#</a></h2>
<p>Este é o mal-entendido mais comum sobre modelos de linguagem, e vale
desfazer com um gráfico. Dê ao modelo treinado na Aula 11 o começo &quot;Não
sei se a senhora&quot; e olhe o que ele produz:</p>
<figure><img src="docs/assets/aula-12/distribuicao.png" alt="À esquerda, as dez continuações mais prováveis com suas porcentagens, e uma barra grande para as outras 1.014; à direita, a curva de probabilidade acumulada mostrando que 145 tokens somam 90%"><figcaption>Uma passada do modelo devolve 1.024 números, um por token do vocabulário.</figcaption></figure>

<p>Nenhuma continuação chega a 11%. As dez melhores juntas dão 42%, e o resto
da probabilidade está espalhado por mais de mil tokens.</p>
<p>Escolher <strong>qual</strong> desses 1.024 vai para a tela é um problema separado, que
nada tem a ver com o treino. Ele tem nome: <strong>amostragem</strong> (<em>sampling</em>), e é
o assunto da primeira metade desta aula.</p>
<h2 id="duas-escolhas-ruins">Duas escolhas ruins<a class="ancora" href="#duas-escolhas-ruins" aria-label="Link para esta secao">#</a></h2>
<p><strong>Sempre o mais provável.</strong> Chama-se decodificação gulosa (<em>greedy</em>). É
determinística e parece segura, e o resultado é ruim: o texto entra em
laço, repetindo a mesma frase. Um modelo que só escolhe o topo acaba num
lugar de onde o topo aponta de volta para si.</p>
<p><strong>Sortear direto da distribuição.</strong> O oposto: cada token tem exatamente a
chance que o modelo deu. O problema está na cauda. Nesta posição, os
tokens fora dos 40 melhores somam 33% da probabilidade, espalhados por
984 candidatos. Um a um eles são improváveis, mas juntos dão uma chance em
três de o modelo escolher algo que ele mesmo considera ruim.</p>
<p>A saída é ficar no meio, e existem três controles para isso.</p>
<h2 id="controle-1-a-temperatura">Controle 1: a temperatura<a class="ancora" href="#controle-1-a-temperatura" aria-label="Link para esta secao">#</a></h2>
<p>Antes da softmax, divida todos os números por <code>T</code>.</p>
<div class="formula" title="P_j = \frac{e^{z_j / T}}{\sum_{k} e^{z_k / T}}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>P</mi><mi>j</mi></msub><mo>&#x0003D;</mo><mfrac><mrow><msup><mi>e</mi><mrow><msub><mi>z</mi><mi>j</mi></msub><mo>&#x0002F;</mo><mi>T</mi></mrow></msup></mrow><mrow><msub><mo>&#x02211;</mo><mrow><mi>k</mi></mrow></msub><msup><mi>e</mi><mrow><msub><mi>z</mi><mi>k</mi></msub><mo>&#x0002F;</mo><mi>T</mi></mrow></msup></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>zⱼ</code></td>
  <td>o número cru (o <em>logit</em>) que o modelo deu ao token <code>j</code></td>
</tr>
<tr>
  <td><code>T</code></td>
  <td>a temperatura, um número positivo que você escolhe</td>
</tr>
<tr>
  <td><code>Pⱼ</code></td>
  <td>a probabilidade final desse token</td>
</tr>
</tbody>
</table></div>
<p>Exemplo com três logits: 4, 2 e 0.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Temperatura</th>
  <th>Os logits viram</th>
  <th>As probabilidades ficam</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>T = 0,5</code></td>
  <td>8, 4, 0</td>
  <td>98%, 2%, 0%</td>
</tr>
<tr>
  <td><code>T = 1</code></td>
  <td>4, 2, 0</td>
  <td>87%, 12%, 2%</td>
</tr>
<tr>
  <td><code>T = 2</code></td>
  <td>2, 1, 0</td>
  <td>67%, 24%, 9%</td>
</tr>
</tbody>
</table></div>
<p>A última linha é a mesma conta das Aulas 8 e 10, com os mesmos três
números. Repare no que a temperatura fez: ela não mudou a ordem dos
candidatos, só a distância entre eles.</p>
<figure><img src="docs/assets/aula-12/temperatura.png" alt="Três gráficos de barras dos mesmos oito tokens: com temperatura 0,3 uma barra domina, com 0,8 há três ou quatro candidatas, com 1,5 todas ficam parecidas"><figcaption>A mesma saída do modelo, com três temperaturas. Nada no modelo mudou.</figcaption></figure>

<p>Guarde a leitura em português:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Temperatura</th>
  <th>O que acontece</th>
</tr>
</thead>
<tbody>
<tr>
  <td>perto de 0</td>
  <td>vira a escolha gulosa: sempre o mesmo texto</td>
</tr>
<tr>
  <td>0,7 a 0,9</td>
  <td>o padrão da maioria das ferramentas</td>
</tr>
<tr>
  <td>acima de 1,2</td>
  <td>o modelo passa a considerar tokens que ele mesmo acha improváveis</td>
</tr>
</tbody>
</table></div>
<h2 id="controles-2-e-3-cortar-a-cauda">Controles 2 e 3: cortar a cauda<a class="ancora" href="#controles-2-e-3-cortar-a-cauda" aria-label="Link para esta secao">#</a></h2>
<p>A temperatura reescala tudo, inclusive o lixo. Os outros dois controles
simplesmente eliminam candidatos antes do sorteio.</p>
<p><strong>Top-k</strong>: fique com os <code>k</code> mais prováveis e zere o resto. Com <code>k = 40</code>,
os outros 984 tokens deixam de existir, e com eles vai embora aquele um
terço de risco. Simples, e sempre corta o mesmo
tanto, mesmo quando o modelo está muito seguro.</p>
<p><strong>Top-p</strong> (ou núcleo, <em>nucleus</em>): pegue os mais prováveis até que a soma
deles passe de <code>p</code>. Com <code>p = 0,9</code>, no exemplo do começo desta aula, isso
daria 145 tokens; numa posição onde o modelo está certo do que vem, daria
dois ou três. É a versão que se adapta.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">corte</span> <span class="o">=</span> <span class="n">torch</span><span class="o">.</span><span class="n">topk</span><span class="p">(</span><span class="n">logits</span><span class="p">,</span> <span class="mi">40</span><span class="p">)[</span><span class="mi">0</span><span class="p">][:,</span> <span class="o">-</span><span class="mi">1</span><span class="p">:]</span>
<span class="n">logits</span> <span class="o">=</span> <span class="n">logits</span><span class="o">.</span><span class="n">masked_fill</span><span class="p">(</span><span class="n">logits</span> <span class="o">&lt;</span> <span class="n">corte</span><span class="p">,</span> <span class="nb">float</span><span class="p">(</span><span class="s2">"-inf"</span><span class="p">))</span>
</code></pre></div>
<h2 id="os-quatro-textos">Os quatro textos<a class="ancora" href="#os-quatro-textos" aria-label="Link para esta secao">#</a></h2>
<p>Mesmo modelo, mesmo início, quatro jeitos de escolher:</p>
<figure><img src="docs/assets/aula-12/textos.png" alt="Quatro caixas com texto gerado: a escolha gulosa, temperatura 0,3, temperatura 0,8 e temperatura 1,5, cada uma com um comportamento diferente"><figcaption>Nenhum peso mudou entre as quatro linhas. Só a regra de escolha.</figcaption></figure>

<p>Leia com atenção. Na temperatura 0,3 aparece &quot;disse elle, disse elle&quot;: é a
repetição chegando. Na 1,5 aparecem palavras que não existem. A 0,8 é a que
lê melhor, e é por isso que ela é o padrão em quase toda ferramenta.</p>
<h2 id="autorregressao-o-erro-vira-entrada">Autorregressão: o erro vira entrada<a class="ancora" href="#autorregressao-o-erro-vira-entrada" aria-label="Link para esta secao">#</a></h2>
<p>Uma palavra sobre o mecanismo. Gerar texto é repetir o mesmo passo:</p>
<ol>
<li>Passe o texto atual pelo modelo.</li>
<li>Pegue os 1.024 números da última posição.</li>
<li>Aplique temperatura e corte.</li>
<li>Sorteie um token.</li>
<li>Cole ele no fim do texto e volte ao passo 1.</li>
</ol>
<p>Isso se chama <strong>geração autorregressiva</strong>, e tem uma consequência que
explica muito. O token sorteado no passo 4 vira entrada do passo 1
seguinte. Se ele foi ruim, o modelo não tem como voltar atrás: ele agora
precisa continuar coerentemente a partir do erro.</p>
<p>É por isso que temperatura alta não produz &quot;criatividade&quot;. Ela produz um
erro que contamina tudo o que vem depois.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Subir a temperatura achando que isso deixa o modelo mais criativo. O que
sobe é a chance de ele escolher um token que ele mesmo considera
improvável, e a partir dali o texto tem que se justificar sozinho. Se você
quer outra resposta, mude o começo, não a temperatura.</p>
</div></div>
<h2 id="ele-copia-ou-inventa">Ele copia ou inventa?<a class="ancora" href="#ele-copia-ou-inventa" aria-label="Link para esta secao">#</a></h2>
<p>É a pergunta que a turma sempre faz, e dá para medir. Pegue 200 tokens
gerados pelo modelo e procure, para cada posição, o maior trecho que
aparece <strong>literalmente</strong> no corpus de Machado:</p>
<figure><img src="docs/assets/aula-12/copia.png" alt="Gráfico de barras mostrando que a maioria das posições tem trechos de uma ou duas palavras em comum com o corpus, e o maior tem quatro"><figcaption>O trecho copiado mais longo tem 4 palavras. Tudo o mais o modelo montou.</figcaption></figure>

<p>A média é 1,85 palavras. O modelo não guarda o texto: ele guarda uma
estatística sobre o texto, em 787.584 números. Reconstruir uma frase
inteira de Machado a partir disso é impossível, e produzir uma frase nova
que soa como Machado é exatamente o que ele faz.</p>
<p>Modelos grandes, treinados em textos que aparecem muitas vezes na
internet, conseguem reproduzir trechos longos. É um problema real de
direito autoral, e a causa é a repetição no corpus, não a arquitetura.</p>
<h2 id="por-que-o-modelo-alucina">Por que o modelo alucina<a class="ancora" href="#por-que-o-modelo-alucina" aria-label="Link para esta secao">#</a></h2>
<p>Agora a parte que importa fora da sala de aula. Nosso modelo escreve
frases confiantes sobre coisas que nunca existiram, e não há nada de
errado com ele. Ele está fazendo exatamente o que o treino pediu.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>O que ele tem</th>
  <th>O que ele não tem</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Uma estimativa de qual token é provável</td>
  <td>Qualquer noção de verdadeiro e falso</td>
</tr>
<tr>
  <td>787.584 pesos ajustados por gradiente</td>
  <td>Um lugar para consultar um fato</td>
</tr>
<tr>
  <td>Uma janela de 128 tokens</td>
  <td>Memória do que disse antes disso</td>
</tr>
<tr>
  <td>A estatística do corpus</td>
  <td>Uma marcação do que veio de onde</td>
</tr>
</tbody>
</table></div>
<p>&quot;Alucinação&quot; é um nome ruim, porque sugere defeito. Uma frase falsa e
fluente e uma frase verdadeira e fluente têm exatamente a mesma natureza
para o modelo: as duas são sequências prováveis. Ele não tem como
distinguir, porque nunca teve.</p>
<h2 id="o-modelo-e-o-corpus">O modelo é o corpus<a class="ancora" href="#o-modelo-e-o-corpus" aria-label="Link para esta secao">#</a></h2>
<p>Repare no que o nosso escreve: &quot;elle&quot;, &quot;cousa&quot;, &quot;mettia&quot;, &quot;pharmacia&quot;. Ele
escreve a grafia de 1899 porque leu 3,7 milhões de caracteres de 1899, e
nada mais.</p>
<p>Essa é a lição que vale para qualquer modelo de linguagem, e para qualquer
tamanho. Um modelo treinado em fóruns escreve como fórum. Um modelo
treinado em texto majoritariamente em inglês responde melhor em inglês. Um
modelo treinado em textos que carregam um preconceito reproduz esse
preconceito, com a mesma fluência com que reproduz a gramática.</p>
<p>Não existe modelo neutro. Existe corpus, e o modelo é o que ele diz.</p>
<h2 id="o-que-a-escala-compra">O que a escala compra<a class="ancora" href="#o-que-a-escala-compra" aria-label="Link para esta secao">#</a></h2>
<figure><img src="docs/assets/aula-12/escala.png" alt="Dois gráficos de barras: à esquerda o número de pesos em escala logarítmica, do nosso modelo até um de 7 bilhões; à direita as perplexidades, caindo de 31,8 para cerca de 9"><figcaption>Dez mil vezes mais pesos compram cerca de três vezes menos dúvida. Não é pouco, e é caro.</figcaption></figure>

<p>As perplexidades vêm de conjuntos de teste diferentes, então valem como
ordem de grandeza. O que a figura mostra é o formato da coisa: cada corte
na dúvida custa ordens de grandeza mais treino que o anterior.</p>
<p>E o que se ganha com isso não é só &quot;menos dúvida&quot;. Com escala aparecem
comportamentos que o modelo pequeno não tem: seguir uma instrução, manter
o assunto por páginas, fazer uma conta de várias etapas.</p>
<h2 id="o-que-falta-para-virar-um-assistente">O que falta para virar um assistente<a class="ancora" href="#o-que-falta-para-virar-um-assistente" aria-label="Link para esta secao">#</a></h2>
<p>Nosso modelo continua texto. Ele não responde perguntas, e isso não é
questão de tamanho: é questão de treino. Entre o modelo que você montou e
um assistente existem duas etapas a mais:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Etapa</th>
  <th>O que faz</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Pré-treino</td>
  <td>o que fizemos: prever o próximo token, em muito texto</td>
</tr>
<tr>
  <td>Ajuste por instrução</td>
  <td>treinar em pares de pergunta e resposta boa</td>
</tr>
<tr>
  <td>Ajuste por preferência</td>
  <td>treinar com pessoas comparando duas respostas</td>
</tr>
</tbody>
</table></div>
<p>A segunda etapa é o que ensina o formato &quot;alguém perguntou, agora
responda&quot;. A terceira é o que ensina qual resposta as pessoas preferem. As
duas usam o mesmo gradiente descendente da Aula 1, sobre os mesmos pesos.</p>
<h2 id="a-novidade-gastar-tempo-em-vez-de-peso">A novidade: gastar tempo em vez de peso<a class="ancora" href="#a-novidade-gastar-tempo-em-vez-de-peso" aria-label="Link para esta secao">#</a></h2>
<p>Até 2023, melhorar um modelo queria dizer uma coisa só: mais pesos e mais
texto de treino. De 2024 para cá apareceu uma segunda alavanca, e ela não
mexe em nenhum peso.</p>
<p>A ideia é simples ao ponto de parecer trapaça: <strong>deixe o modelo escrever
mais antes de responder</strong>. Em vez de exigir a resposta na primeira linha,
peça que ele escreva o raciocínio, e só então conclua. Cada token que ele
escreve entra de volta como entrada do próximo, então pensar em voz alta é
literalmente dar a si mesmo mais contexto para trabalhar.</p>
<p>Três formas disso, da mais simples para a mais elaborada:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Truque</th>
  <th>O que se faz</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Escrever o passo a passo</td>
  <td>pedir o raciocínio antes da resposta</td>
</tr>
<tr>
  <td>Votação</td>
  <td>gerar a mesma resposta cinco vezes e ficar com a mais frequente</td>
</tr>
<tr>
  <td>Revisão</td>
  <td>gerar, criticar a própria resposta, e gerar de novo</td>
</tr>
</tbody>
</table></div>
<p>Repare que os três funcionam <strong>com o modelo já pronto</strong>, sem treinar nada.
O que eles gastam é tempo de máquina na hora de responder. Daí o nome:
<em>inference-time scaling</em>, ou escalar no momento de responder.</p>
<p>É por isso que os modelos de raciocínio de hoje demoram e mostram um
&quot;pensando&quot; antes de falar. Não há mágica nova ali dentro: é o mesmo
transformer desta aula, gerando um token de cada vez, só que gerando muito
mais antes de mostrar o resultado.</p>
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>Por que isso importa para você</strong></p>
<p>O modelo que você usa no dia a dia não muda. O seu jeito de pedir muda.
Pedir &quot;explique o seu raciocínio antes de responder&quot; costuma valer mais
que qualquer ajuste de temperatura, e é de graça.</p>
</div></div>
<h2 id="explique-sem-olhar">Explique sem olhar<a class="ancora" href="#explique-sem-olhar" aria-label="Link para esta secao">#</a></h2>
<p>O teste mais honesto de que você entendeu é tentar explicar sem ler.
Feche esta página e responda em voz alta, como se explicasse para um
colega. Onde travar, é ali que falta entender: volte à seção.</p>
<ol>
<li>O que a temperatura muda, e o que ela não muda?</li>
<li>Por que a escolha gulosa entra em repetição?</li>
<li>Por que &quot;alucinação&quot; é um nome ruim para o que o modelo faz?</li>
</ol>
<h2 id="cola-da-aula">Cola da aula<a class="ancora" href="#cola-da-aula" aria-label="Link para esta secao">#</a></h2>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Conceito</th>
  <th>O que significa</th>
</tr>
</thead>

<tr>

</tr>
<tr>

<tr>

<tr>

<tr>

<h2 id="de-787-mil-para-494-milhoes">De 787 mil para 494 milhões<a class="ancora" href="#de-787-mil-para-494-milhoes" aria-label="Link para esta secao">#</a></h2>
<p>Na Aula 11 você treinou um modelo de 787.584 pesos, em 40 minutos de
processador. Ele continua texto e escreve com a grafia de 1899. É um
modelo de verdade, e é pequeno.</p>
<figure><img src="docs/assets/aula-13/escalas.png" alt="Gráfico de barras em escala logarítmica com quatro modelos: o da Aula 11 com 8e5 pesos, o Qwen de 5e8, um aberto de 8e9 e um comercial de 1e12"><figcaption>Cada barra é cerca de mil vezes a anterior. A arquitetura é a mesma nas quatro.</figcaption></figure>

<p>O modelo de hoje tem 627 vezes o tamanho do seu. Ele se chama
<strong>Qwen2.5-0.5B-Instruct</strong>, é aberto, e cabe em uma pasta de 1 gigabyte.</p>
<p>Ele já tem sucessor: a família Qwen3 saiu em 2025, com um modelo de 0,6

versão 2.5 porque medimos todos os números desta página nela. Trocar
de modelo é mudar uma linha, e o resto do código continua igual. Essa é

<p>Um <strong>modelo de fundação</strong> (<em>foundation model</em>) é um modelo grande, treinado
uma vez em muito texto, que serve de base para muitas tarefas diferentes

<h2 id="as-tres-etapas">As três etapas<a class="ancora" href="#as-tres-etapas" aria-label="Link para esta secao">#</a></h2>
<p>O que separa um continuador de texto de um assistente são duas etapas de
treino a mais, e nenhuma delas usa técnica nova.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Etapa</th>
  <th>O que faz</th>
  <th>Onde você viu</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Pré-treino</td>
  <td>prever o próximo token, em trilhões de tokens</td>
  <td>Aula 11</td>
</tr>
<tr>
  <td>Ajuste por instrução</td>
  <td>treinar em pares de pergunta e resposta boa</td>
  <td>é a mesma perda</td>
</tr>
<tr>
  <td>Ajuste por preferência</td>
  <td>treinar com pessoas comparando duas respostas</td>
  <td>é o mesmo gradiente</td>
</tr>
</tbody>
</table></div>
<p>O <code>-Instruct</code> no nome do modelo quer dizer exatamente isso: ele passou
pelas três. A versão sem o sufixo passou só pela primeira, e se comporta
como o seu modelo da Aula 12.</p>
<h2 id="rodar-tres-linhas">Rodar: três linhas<a class="ancora" href="#rodar-tres-linhas" aria-label="Link para esta secao">#</a></h2>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="kn">from</span><span class="w"> </span><span class="nn">transformers</span><span class="w"> </span><span class="kn">import</span> <span class="n">AutoModelForCausalLM</span><span class="p">,</span> <span class="n">AutoTokenizer</span>

<span class="n">tokenizador</span> <span class="o">=</span> <span class="n">AutoTokenizer</span><span class="o">.</span><span class="n">from_pretrained</span><span class="p">(</span><span class="s2">"Qwen/Qwen2.5-0.5B-Instruct"</span><span class="p">)</span>
<span class="n">modelo</span> <span class="o">=</span> <span class="n">AutoModelForCausalLM</span><span class="o">.</span><span class="n">from_pretrained</span><span class="p">(</span><span class="s2">"Qwen/Qwen2.5-0.5B-Instruct"</span><span class="p">)</span>
</code></pre></div>
<p>A biblioteca <code>transformers</code> já vem no Colab. Na primeira vez ela baixa 1
gigabyte do Hugging Face, que é o repositório público onde quase todo
modelo aberto mora. Não há cadastro, chave nem cobrança.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Sobre a paciência</strong></p>
<p>No processador, esse modelo gera cerca de 1 a 4 tokens por segundo. Uma
resposta de 100 tokens leva de meio minuto a um minuto e meio. Ligar a GPU
T4 gratuita do Colab (Ambiente de execução, Alterar o tipo de ambiente de
execução) deixa isso dezenas de vezes mais rápido. Sem GPU funciona igual,
só devagar.</p>
</div></div>
<h2 id="nao-existe-conversa">Não existe conversa<a class="ancora" href="#nao-existe-conversa" aria-label="Link para esta secao">#</a></h2>
<p>Este é o ponto que muda a forma de pensar. Quando você manda uma mensagem
para um modelo, não existe conversa nenhuma. Existe um texto só, com
marcadores, e o modelo continua esse texto exatamente como na Aula 12.</p>
<figure><img src="docs/assets/aula-13/molde.png" alt="O texto cru que entra no modelo, com as marcas im_start e im_end separando o papel system, o papel user e o começo da resposta do assistant"><figcaption>O que sai do molde de conversa é isto: um texto com marcadores de papel.</figcaption></figure>

<p>Os &quot;papéis&quot; (<code>system</code>, <code>user</code>, <code>assistant</code>) são <strong>tokens especiais</strong> que o
modelo aprendeu no ajuste por instrução. Nada mais. O molde termina em
<code>&lt;|im_start|&gt;assistant</code>, e o modelo faz a única coisa que sabe: continua.</p>
<p>É por isso que a chamada é assim:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">mensagens</span> <span class="o">=</span> <span class="p">[</span>
    <span class="p">{</span><span class="s2">"role"</span><span class="p">:</span> <span class="s2">"system"</span><span class="p">,</span> <span class="s2">"content"</span><span class="p">:</span> <span class="s2">"Você é professor de estatística."</span><span class="p">},</span>
    <span class="p">{</span><span class="s2">"role"</span><span class="p">:</span> <span class="s2">"user"</span><span class="p">,</span> <span class="s2">"content"</span><span class="p">:</span> <span class="s2">"Explique o que é uma regressão logística."</span><span class="p">},</span>
<span class="p">]</span>
<span class="n">texto</span> <span class="o">=</span> <span class="n">tokenizador</span><span class="o">.</span><span class="n">apply_chat_template</span><span class="p">(</span><span class="n">mensagens</span><span class="p">,</span> <span class="n">tokenize</span><span class="o">=</span><span class="kc">False</span><span class="p">,</span>
                                        <span class="n">add_generation_prompt</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
</code></pre></div>
<p>Cada modelo tem o seu molde, com marcadores diferentes. O
<code>apply_chat_template</code> usa o molde certo para o modelo que você carregou.</p>
<h2 id="o-prompt-e-o-unico-controle-que-voce-tem">O prompt é o único controle que você tem<a class="ancora" href="#o-prompt-e-o-unico-controle-que-voce-tem" aria-label="Link para esta secao">#</a></h2>
<p>Você não vai treinar esse modelo. O que você controla é o texto que entra
antes da pergunta. Três peças, nesta ordem:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Peça</th>
  <th>O que faz</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Papel</td>
  <td>quem o modelo deve ser, e para quem ele fala</td>
</tr>
<tr>
  <td>Contexto</td>
  <td>o que ele precisa saber e não sabe</td>
</tr>
<tr>
  <td>Tarefa e formato</td>
  <td>o que fazer, e em que forma entregar</td>
</tr>
</tbody>
</table></div>
<p>Veja a diferença na mesma pergunta:</p>
<figure><img src="docs/assets/aula-13/prompts.png" alt="Três respostas do modelo para a mesma pergunta: sem instrução, com papel definido, e com papel mais formato pedido"><figcaption>Nenhum peso mudou entre as três. O que mudou foi o texto que entrou antes.</figcaption></figure>

<p>Duas coisas para reparar, e as duas são honestas.</p>
<p><strong>A primeira</strong>: definir o papel encurtou a resposta e trocou o jargão por
exemplo concreto. Funcionou.</p>
<p><strong>A segunda</strong>: o terceiro prompt pedia &quot;exatamente três itens, cada um com
no máximo quinze palavras&quot;. O modelo não obedeceu. Um modelo de 0,5
bilhão de pesos segue instruções de conteúdo razoavelmente bem, e
instruções de formato mal. Modelos maiores obedecem; esse não.</p>
<h2 id="poucos-exemplos-valem-mais-que-muita-explicacao">Poucos exemplos valem mais que muita explicação<a class="ancora" href="#poucos-exemplos-valem-mais-que-muita-explicacao" aria-label="Link para esta secao">#</a></h2>
<p>Quando o formato importa, mostrar funciona melhor que mandar. Coloque dois
ou três exemplos no próprio prompt:</p>
<div class="bloco-codigo" data-lingua=""><button class="copiar" type="button">copiar</button><pre class="realce"><code>Classifique o comentário como POSITIVO ou NEGATIVO.

Comentário: o café estava frio.
Resposta: NEGATIVO

Comentário: atendimento rápido e simpático.
Resposta: POSITIVO

Comentário: esperei quarenta minutos.
Resposta:
</code></pre></div>
<p>Isso se chama <strong>few-shot</strong> (poucos exemplos), e o nome contrasta com
<strong>zero-shot</strong>, que é pedir sem exemplo nenhum. Repare que nada foi
treinado: os exemplos são só texto, e a única coisa que eles fazem é
tornar o padrão óbvio para a continuação.</p>
<h2 id="os-parametros-ja-conhecidos">Os parâmetros: já conhecidos<a class="ancora" href="#os-parametros-ja-conhecidos" aria-label="Link para esta secao">#</a></h2>
<p>Tudo o que a Aula 12 ensinou continua valendo, com os mesmos nomes.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Parâmetro</th>
  <th>O que faz</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>temperature</code></td>
  <td>divide os logits: baixa concentra, alta espalha</td>
</tr>
<tr>
  <td><code>top_p</code></td>
  <td>fica com os mais prováveis até somarem p</td>
</tr>
<tr>
  <td><code>max_new_tokens</code></td>
  <td>quantos tokens gerar antes de parar</td>
</tr>
<tr>
  <td><code>do_sample=False</code></td>
  <td>desliga o sorteio: sempre o mais provável</td>
</tr>
</tbody>
</table></div>
<figure><img src="docs/assets/aula-13/temperaturas.png" alt="Duas caixas com três nomes de cafeteria cada: com temperatura 0,2 dois nomes se repetem, com temperatura 1,2 os três são diferentes"><figcaption>Três chamadas iguais em cada linha. A temperatura decide se elas dão a mesma resposta.</figcaption></figure>

<p>Uma regra prática: para extrair informação de um texto, use
<code>do_sample=False</code> e tenha respostas reproduzíveis. Para gerar variação,
suba a temperatura e aceite que cada chamada devolve outra coisa.</p>
<h2 id="ele-nao-sabe-dizer-quot-nao-sei-quot">Ele não sabe dizer &quot;não sei&quot;<a class="ancora" href="#ele-nao-sabe-dizer-quot-nao-sei-quot" aria-label="Link para esta secao">#</a></h2>
<p>Agora a parte que importa no trabalho. Pergunte um fato que dá para
conferir:</p>
<figure><img src="docs/assets/aula-13/alucinacao.png" alt="Três respostas do modelo à pergunta sobre quantos capítulos tem Dom Casmurro: dez, três e três"><figcaption>Dom Casmurro tem 148 capítulos. Dá para contar em <code>data/machado.txt</code>.</figcaption></figure>

<p>Ele respondeu 10, depois 3, depois 3. Nenhuma vez respondeu &quot;não sei&quot;, e
nenhuma vez hesitou. Não é aleatoriedade: é o que a Aula 12 já explicou.
O modelo estima qual token é provável, e &quot;10&quot; é um número provável depois
de &quot;Dom Casmurro tem&quot;. Verdadeiro e falso não são categorias que existam
ali dentro.</p>
<p>Volte à figura dos três prompts e leia de novo a segunda resposta. Ele diz
que a função logit &quot;é a inversa da função logarítmica&quot;. Você sabe da Aula
3 que ela é a inversa da sigmoide, e conseguiu ver o erro na hora.</p>
<p>Guarde essa sensação. <strong>Você só pega o erro em assunto que já conhece.</strong></p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Pedir conta a um modelo de linguagem. Ele prevê tokens, e o token que vem
depois de &quot;17 × 24 =&quot; é o que costuma vir em textos parecidos, não o
resultado da multiplicação. Modelos grandes acertam contas pequenas de
tanto terem visto, e erram as grandes com a mesma confiança. Se precisa de
conta, use uma calculadora, e deixe o modelo escrever o texto em volta.</p>
</div></div>
<h2 id="aberto-ou-por-api">Aberto ou por API<a class="ancora" href="#aberto-ou-por-api" aria-label="Link para esta secao">#</a></h2>
<p>Existem dois caminhos para usar um modelo de fundação, e a escolha é de
projeto, não de gosto.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th></th>
  <th>Modelo aberto (o de hoje)</th>
  <th>Modelo por API</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Onde roda</td>
  <td>na sua máquina ou no seu servidor</td>
  <td>no servidor de outra empresa</td>
</tr>
<tr>
  <td>Custo</td>
  <td>processamento seu, e nada por pergunta</td>
  <td>por token, e cresce com o uso</td>
</tr>
<tr>
  <td>Privacidade</td>
  <td>o dado não sai de casa</td>
  <td>o dado sai de casa</td>
</tr>
<tr>
  <td>Qualidade</td>
  <td>boa nos grandes, limitada nos pequenos</td>
  <td>hoje, a melhor disponível</td>
</tr>
<tr>
  <td>Controle</td>
  <td>você escolhe a versão, e ela não muda</td>
  <td>a versão muda quando a empresa quiser</td>
</tr>

<p>O critério que decide na prática costuma ser um só: se o dado não pode
sair da empresa, o modelo aberto deixa de ser opção e passa a ser
requisito.</p>
