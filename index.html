<p>São 56.714 pesos, contra 101.770 da densa. E olhe onde eles estão: as duas
camadas de convolução, que fazem o trabalho de enxergar, usam 4.800. Todo
o resto está na parte densa do final, que só junta as pistas e vota.</p>
<p>Ler a tabela de cima para baixo conta a história: a imagem vai encolhendo
e o número de mapas vai crescendo. No começo a rede procura bordas. No
fim, ela procura combinações de bordas.</p>
<h2 id="a-saida-dez-probabilidades">A saída: dez probabilidades<a class="ancora" href="#a-saida-dez-probabilidades" aria-label="Link para esta secao">#</a></h2>
<p>Nas aulas anteriores a resposta era sim ou não, e a sigmoide dava conta.
Aqui são dez categorias. A função que resolve isso é a <strong>softmax</strong>: ela
recebe dez números soltos e devolve dez probabilidades que somam 1.</p>
<div class="formula" title="P_j = \frac{e^{z_j}}{\sum_{k=1}^{10} e^{z_k}}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>P</mi><mi>j</mi></msub><mo>&#x0003D;</mo><mfrac><mrow><msup><mi>e</mi><mrow><msub><mi>z</mi><mi>j</mi></msub></mrow></msup></mrow><mrow><msubsup><mo>&#x02211;</mo><mrow><mi>k</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mn>10</mn></mrow></msubsup><msup><mi>e</mi><mrow><msub><mi>z</mi><mi>k</mi></msub></mrow></msup></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>zⱼ</code></td>
  <td>o número cru que a última camada produziu para a categoria <code>j</code></td>
</tr>
<tr>
  <td><code>e</code></td>
  <td>o número de Euler, 2,718</td>
</tr>
<tr>
  <td><code>Pⱼ</code></td>
  <td>a probabilidade final da categoria <code>j</code></td>
</tr>
<tr>
  <td>o denominador</td>
  <td>a soma de todas as dez parcelas, que força o total a dar 1</td>
</tr>
</tbody>
</table></div>
<p>Exemplo com três categorias, para caber na conta. Os números crus foram 2,
1 e 0. Elevando <code>e</code> a cada um: 7,39, 2,72 e 1,00. A soma é 11,11. As
probabilidades ficam 0,67, 0,24 e 0,09. A maior ganha, e a resposta é a
primeira categoria.</p>
<h3 id="um-exemplo-de-verdade">Um exemplo de verdade<a class="ancora" href="#um-exemplo-de-verdade" aria-label="Link para esta secao">#</a></h3>
<p>Agora a mesma conta com uma foto real do conjunto de teste, uma bota. A
tabela mostra os três passos, linha por linha:</p>
<figure><img src="docs/assets/aula-08/softmax.png" alt="Uma foto de bota e uma tabela com as dez categorias. A primeira coluna mostra o número cru da rede, a segunda mostra o e elevado a esse número, e a terceira mostra a probabilidade, com a bota em 83,2%, o tênis em 16,8% e as outras oito em 0,0%"><figcaption>Dez números crus viram dez probabilidades que somam 100%. Os números são os da rede da aula, arredondados.</figcaption></figure>

<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Passo</th>
  <th>O que acontece</th>
  <th>Na linha da bota</th>
</tr>
</thead>
<tbody>
<tr>
  <td>1</td>
  <td>a rede produz um número cru por categoria</td>
  <td>8,4</td>
</tr>
<tr>
  <td>2</td>
  <td>eleva <code>e</code> a cada número, e soma tudo</td>
  <td><code>e</code> elevado a 8,4 dá 4.447, e a soma das dez é 5.348</td>
</tr>
<tr>
  <td>3</td>
  <td>divide cada linha pela soma</td>
  <td>4.447 ÷ 5.348 = 83,2%</td>
</tr>
</tbody>
</table></div>
<p>Repare em dois efeitos. Primeiro, elevar <code>e</code> aumenta as distâncias: 8,4
contra 6,8 parece pouco, e vira 4.447 contra 898, cinco vezes mais. Segundo,
só duas categorias ficaram com probabilidade que se enxerga: a bota e o
tênis. Faz sentido, são peças parecidas. As outras oito somam menos de
0,1%.</p>
<p>A resposta da rede é a categoria de maior probabilidade: bota.</p>
<h3 id="quando-a-rede-hesita">Quando a rede hesita<a class="ancora" href="#quando-a-rede-hesita" aria-label="Link para esta secao">#</a></h3>
<p>Nem toda foto é tão clara. Veja uma camisa:</p>
<figure><img src="docs/assets/aula-08/softmax_duvida.png" alt="Uma foto de camisa e um gráfico de barras com as dez probabilidades: camisa 51%, pulôver 40%, camiseta 8% e as outras sete com menos de 1%"><figcaption>A resposta foi camisa, mas a rede quase disse pulôver.</figcaption></figure>

<p>A rede respondeu camisa, com 51%, e acertou. Mas pulôver ficou com 40%. A
probabilidade conta a <strong>dúvida</strong>, e isso é útil. Você pode, por exemplo,
mandar para uma pessoa toda foto em que a maior probabilidade fique abaixo
de 70%. É o mesmo canto de erros que a matriz de confusão vai mostrar mais
adiante.</p>
<h2 id="o-resultado">O resultado<a class="ancora" href="#o-resultado" aria-label="Link para esta secao">#</a></h2>
<p>Mesmas 60.000 fotos, mesmas 8 épocas de treino, mesmo otimizador:</p>
<figure><img src="docs/assets/aula-08/densa_vs_cnn.png" alt="Dois gráficos de barras: à esquerda o acerto de 87,6% da densa contra 90,2% da convolucional, à direita 101.770 pesos contra 56.714"><figcaption>A convolucional acerta 2,6 pontos a mais usando quase metade dos pesos.</figcaption></figure>

<p>Dois pontos e meio parece pouco. Em 10.000 fotos, são 260 peças
etiquetadas certo que antes iam erradas.</p>
<h2 id="por-que-ela-ganha-o-teste-do-deslocamento">Por que ela ganha: o teste do deslocamento<a class="ancora" href="#por-que-ela-ganha-o-teste-do-deslocamento" aria-label="Link para esta secao">#</a></h2>
<p>O número de acerto não explica nada sozinho. Aqui está o teste que
explica. Pegue as mesmas fotos de teste e empurre cada uma alguns pixels
para o lado. A peça é a mesma, só mudou de lugar.</p>
<figure><img src="docs/assets/aula-08/deslocamento.png" alt="À esquerda a mesma bolsa antes e depois de ser deslocada quatro pixels; à direita um gráfico com o acerto das duas redes caindo conforme o deslocamento aumenta, com a densa caindo muito mais rápido"><figcaption>Com dois pixels de deslocamento, a densa desaba para 51,5% e a convolucional segura 76,0%.</figcaption></figure>

<p>A densa aprendeu &quot;o pixel 350 costuma ser escuro em foto de calça&quot;. Mude a
peça de lugar e essa regra morre. A convolucional aprendeu &quot;existe uma
borda vertical em algum canto&quot;, e a regra sobrevive.</p>
<p>As duas pioram, e isso também é honesto: nenhuma das duas viu foto
deslocada durante o treino. A diferença está na velocidade da queda.</p>
<h2 id="onde-ela-erra">Onde ela erra<a class="ancora" href="#onde-ela-erra" aria-label="Link para esta secao">#</a></h2>
<p>Acerto médio esconde tudo. A matriz de confusão mostra o que aconteceu com
cada categoria:</p>
<figure><img src="docs/assets/aula-08/matriz_confusao.png" alt="Matriz 10 por 10 com as categorias reais nas linhas e as respostas do modelo nas colunas, com números altos na diagonal e um bloco de erros entre camisa, camiseta, pulôver e casaco"><figcaption>Linha é o que a peça era; coluna é o que o modelo respondeu. Fora da diagonal, é erro.</figcaption></figure>

<p>Todo o erro se concentra num canto só: camisa, camiseta, pulôver e casaco.
São quatro peças de tronco, todas com dois braços e uma gola, em 28 por 28
pixels e sem cor. Uma pessoa erraria as mesmas.</p>
<p>Isso muda a conversa com o cliente. Em vez de &quot;o modelo tem 90%&quot;, você diz
&quot;o modelo é confiável em oito categorias e precisa de revisão humana em
quatro&quot;. A segunda frase é útil, e só a matriz de confusão te dá ela.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Esquecer o canal. A <code>Conv2D</code> espera um bloco de formato <code>(n, 28, 28, 1)</code>,
e o Keras entrega as fotos como <code>(n, 28, 28)</code>. O erro que aparece fala de
dimensões incompatíveis e assusta. A correção é uma linha:
<code>x_treino.reshape(-1, 28, 28, 1)</code>. O <code>-1</code> quer dizer &quot;descubra quantas
fotos são&quot;.</p>
</div></div>

<h2 id="redes-densas">Redes densas<a class="ancora" href="#redes-densas" aria-label="Link para esta secao">#</a></h2>
<div class="quiz" data-numero="1"><p class="quiz-numero">Questão 1</p><p class="quiz-enunciado">Nas 600 torras de café, a regressão logística acertou <strong>71,8%</strong>. Em 71,8% das torras o café sai ruim. Qual é a leitura certa?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">A logística é um bom modelo: acertou quase três em cada quatro torras.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">B</span><span class="quiz-texto">Ela não aprendeu nada: responder &quot;ruim&quot; para todo mundo daria exatamente o mesmo número.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Ela só precisa de mais torras para passar disso.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">A rede neural vai acertar os mesmos 71,8%, porque os dados são os mesmos.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">A fronteira que a logística sabe desenhar é uma reta, e nenhuma reta separa o dentro do fora de uma ilha. Ela empatou com o modelo preguiçoso da Aula 3. A rede com duas camadas de 16 neurônios chega a 91,8% com os mesmos dados: a diferença está no formato da fronteira.</p></div></div>
<div class="quiz" data-numero="2"><p class="quiz-numero">Questão 2</p><p class="quiz-enunciado">Você empilha 10 camadas escondidas, todas <strong>sem função de ativação</strong>, e deixa só a sigmoide na saída. Como fica a fronteira nas torras?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Uma ilha, porque dez camadas têm dobras de sobra.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Uma ilha grosseira, que melhora se você acrescentar mais camadas.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">Uma reta, igual à da regressão logística.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">A rede não treina: o Keras recusa camadas sem ativação.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">A dobra vem da ativação. Sem ela, cada camada só multiplica e soma, e uma soma de somas pode ser reescrita como uma única conta, <code>w₀ + w₁x₁ + w₂x₂</code>. Mil camadas resolveriam o mesmo problema que a Aula 2 resolvia. Cada neurônio com <strong>ReLU</strong> acrescenta uma dobra à fronteira.</p></div></div>
<div class="quiz" data-numero="3"><p class="quiz-numero">Questão 3</p><p class="quiz-enunciado">Numa rede grande, a perda de <strong>treino</strong> cai sem parar durante 300 épocas. A de <strong>validação</strong> cai até a época 13 e, dali em diante, sobe. Qual é o diagnóstico?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">A rede ainda está aprendendo: falta treinar mais épocas.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">O conjunto de validação está errado, porque deveria cair junto com o de treino.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">A rede é pequena demais para o problema.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">D</span><span class="quiz-texto">A rede passou a decorar o ruído das torras de treino, e o melhor momento foi a época 13.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Quando a rede decora, a perda de treino sempre melhora, e é a de validação que conta a verdade. Neste exemplo ela foi de 0,213 na época 13 para 0,374 na 300, e a acurácia ficou em 96,7% no treino contra 87,8% na validação. Treinar mais só pioraria. As defesas são parar a tempo, o L2, o dropout ou uma rede menor.</p></div></div>
<div class="quiz" data-numero="4"><p class="quiz-numero">Questão 4</p><p class="quiz-enunciado">A mesma rede, agora com <strong>dropout de 0,3</strong>: a acurácia de treino caiu de 97% para 91%, e a de validação subiu de 88% para 91%. O modelo piorou?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">A</span><span class="quiz-texto">Não: o freio tirou a decoreba, e a que importa é a acurácia de validação.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Sim: a acurácia de treino caiu, então ele aprendeu menos.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Sim, e a saída é diminuir o dropout até o treino voltar a 97%.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Depende: só valeria a pena se o treino continuasse acima de 95%.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Decorar infla a acurácia de treino e deixa a de validação para trás (97% contra 88%). Com o freio, as duas se aproximam (91% e 91%). A validação é a que mede torras que a rede nunca viu. O sinal de alerta seria o oposto: freio demais derruba <strong>as duas</strong>.</p></div></div>
<div class="quiz" data-numero="5"><p class="quiz-numero">Questão 5</p><p class="quiz-enunciado">Um <code>EarlyStopping(patience=15)</code> parou o treino na época 28, e a melhor perda de validação foi na 13. Sem <code>restore_best_weights=True</code>, com que pesos a rede fica?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Com os da época 13, porque o callback sempre guarda o melhor.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">B</span><span class="quiz-texto">Com os da época 28, quinze épocas depois do melhor ponto, um pouco piores.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Com os da época 1, porque o treino foi interrompido.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Com pesos aleatórios, e é preciso treinar de novo.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Sem esse argumento, o Keras deixa a rede onde o treino parou. É o erro mais comum com o callback. Com <code>restore_best_weights=True</code>, a rede volta aos pesos da época 13. Para guardar o melhor modelo em arquivo, entra o <code>ModelCheckpoint</code>.</p></div></div>
<div class="quiz" data-numero="6"><p class="quiz-numero">Questão 6</p><p class="quiz-enunciado">Com a taxa de aprendizado em 0,01, a perda de validação balança até o fim do treino. Você acrescenta <code>ReduceLROnPlateau(factor=0.5, patience=5)</code>. O que muda?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">O Keras troca o otimizador por outro, mais lento.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">A rede ganha mais neurônios quando a validação trava.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">Cada vez que a validação passa 5 épocas sem melhorar, o passo cai pela metade, e a curva assenta.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">O treino para depois de 5 épocas sem melhora.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">A taxa vai a 0,005, depois a 0,0025, e assim por diante, até o piso. No teste, a perda de validação final foi de 0,253 com a taxa fixa e de 0,224 com a redução. A última opção descreve o <code>EarlyStopping</code>, que <strong>para</strong> o treino. O <code>ReduceLROnPlateau</code> só encolhe o passo e continua, e por isso deve esperar menos épocas que o <code>EarlyStopping</code>.</p></div></div>
<h2 id="redes-convolucionais">Redes convolucionais<a class="ancora" href="#redes-convolucionais" aria-label="Link para esta secao">#</a></h2>
<div class="quiz" data-numero="7"><p class="quiz-numero">Questão 7</p><p class="quiz-enunciado">Você embaralha os 784 pixels de todas as fotos, sempre na mesma ordem. Uma pessoa não reconhece mais nada, mas a rede densa aprende <strong>exatamente igual</strong>. O que isso revela?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">A</span><span class="quiz-texto">Que ela nunca usou o fato de os pixels serem vizinhos: depois do <code>Flatten</code>, a vizinhança já tinha sumido.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Que a rede densa enxerga melhor que uma pessoa.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Que embaralhar os pixels é um bom jeito de melhorar a rede.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Que a rede densa só funciona com fotos embaralhadas.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Ao achatar a foto, o pixel que ficava logo acima de outro vai parar 28 casas adiante na fila. Para a rede, os dois viraram entradas quaisquer, tão relacionadas quanto duas colunas de uma planilha. A convolução devolve o valor da vizinhança, porque cada conta usa só pixels que estão juntos.</p></div></div>
<div class="quiz" data-numero="8"><p class="quiz-numero">Questão 8</p><p class="quiz-enunciado">Uma camada com 16 filtros 3×3 tem <strong>160 pesos</strong>. A primeira camada da rede densa, com 128 neurônios olhando as mesmas fotos, tem <strong>100.480</strong>. Por que a convolução precisa de tão poucos?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Porque ela olha só um pedaço da foto e descarta o resto.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Porque os pesos dos filtros são menores e ocupam menos memória.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Porque ela aprende menos detalhes que a densa.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">D</span><span class="quiz-texto">Porque os mesmos nove pesos de cada filtro servem para a foto inteira, em todas as posições.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">É o <strong>peso compartilhado</strong>: 16 filtros × (9 pesos + 1 viés) = 160. Na densa, cada um dos 784 pixels se liga a cada um dos 128 neurônios, e isso dá 784 × 128 + 128 = 100.480. Compartilhar também faz o filtro achar o mesmo detalhe em qualquer lugar da foto.</p></div></div>
<div class="quiz" data-numero="9"><p class="quiz-numero">Questão 9</p><p class="quiz-enunciado">Você desloca as fotos de teste em <strong>2 pixels</strong>. A acurácia da rede densa vai de 87,6% para 51,5%, e a da convolucional, de 90,2% para 76,0%. Qual é a leitura certa?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">As duas pioraram, então são igualmente frágeis.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">B</span><span class="quiz-texto">A densa decorou posições (como &quot;o pixel 350 é escuro&quot;), e a convolucional aprendeu detalhes (como &quot;há uma borda vertical em algum canto&quot;), que sobrevivem ao deslocamento.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">A convolucional é imune a deslocamentos, porque caiu menos.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">O teste é injusto, porque favorece a convolucional.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Nenhuma das duas viu fotos deslocadas no treino, e as duas pioram. A diferença está na <strong>velocidade da queda</strong>. A convolucional não é imune: com 4 pixels de deslocamento, ela cai para 33,6%. A densa, para 13,6%.</p></div></div>
<div class="quiz" data-numero="10"><p class="quiz-numero">Questão 10</p><p class="quiz-enunciado">O modelo convolucional acerta 90,2% das fotos. A matriz de confusão mostra calça com 98,0% e camisa com 65,7%, e a camisa virou camiseta 132 vezes. O que você diz ao brechó?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">&quot;Confie nos 90% em qualquer categoria.&quot;</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">&quot;O modelo é ruim e deve ser descartado.&quot;</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">&quot;Ele é confiável em oito categorias e precisa de revisão humana em quatro: camisa, camiseta, pulôver e casaco.&quot;</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">&quot;Troque as camisas por camisetas no catálogo, porque o modelo as confunde.&quot;</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Acerto médio esconde tudo. O erro se concentra num canto só: quatro peças de tronco, todas com dois braços e uma gola, em 28 por 28 pixels e sem cor. Uma pessoa erraria as mesmas. A frase &quot;confiável em oito, revisão em quatro&quot; é útil, e só a matriz de confusão permite dizê-la.</p></div></div>

<p>Todo mundo usa um modelo de linguagem grande (LLM). Poucos sabem como um
funciona por dentro. Ao longo destas três aulas, você monta um em Keras,
peça por peça, e treina no processador do Google Colab, sem placa de
vídeo. São 809.728 pesos, contra centenas de bilhões dos modelos
comerciais, e a arquitetura é a mesma.</p>
<p>O texto usado no treino é a obra de Machado de Assis, em domínio público.</p>
<h2 id="como-as-aulas-funcionam">Como as aulas funcionam<a class="ancora" href="#como-as-aulas-funcionam" aria-label="Link para esta secao">#</a></h2>
<p>Cada aula alterna uma explicação curta, de 20 a 30 minutos, e um exercício
que você faz sozinho no notebook, de 20 a 25 minutos. Entre os dois, um
quiz de 5 perguntas, no fim da página da aula, confere se a explicação
assentou. São três rodadas por aula:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Aula</th>
  <th>Os três exercícios</th>
</tr>
</thead>
<tbody>
<tr>
  <td>9</td>
  <td>o modelo de contagem, o BPE, codificar e decodificar</td>
</tr>
<tr>
  <td>10</td>
  <td>o token vira vetor, a atenção com máscara, o modelo inteiro</td>
</tr>
<tr>
  <td>11</td>
  <td>o treino pelo relógio, gerar texto (e ligar o treino de 35 minutos), o ajuste fino</td>

</table></div>
<p>No fim da Aula 10, você montou o modelo e viu ele escrever com os pesos do
professor. No fim da Aula 11, os pesos são seus: você apertou o botão do
treino, ouviu o seu modelo escrever e ensinou a ele outro assunto.</p>
<p>Os exercícios têm lacunas (<code>____</code>) e uma célula de conferência depois de
cada passo. Se travar, a página
<a href="#/llm-do-zero/colas-dos-exercicios">Colas dos Exercícios</a> tem dicas para cada passo,
que você abre uma de cada vez.</p>
<h2 id="os-tres-habitos-do-modulo">Os três hábitos do módulo<a class="ancora" href="#os-tres-habitos-do-modulo" aria-label="Link para esta secao">#</a></h2>
<p>As três aulas seguem a ordem de construção de <em>Build a Large Language
Model (From Scratch)</em>, de Sebastian Raschka, adaptada ao tempo de aula e a
quem está vendo isso pela primeira vez. Três hábitos vieram de lá, e valem
para muito além de LLM:</p>
<ol>
<li><strong>Você sempre sabe onde está.</strong> As três aulas abrem com o mesmo mapa,
mudando só o quadro aceso.</li>
<li><strong>Direto ao que importa.</strong> Cada peça entra na forma que os modelos de
verdade usam, com as camadas prontas do Keras. A matemática aparece
para explicar o que a camada faz, não para ser refeita à mão.</li>
<li><strong>Medir em vez de afirmar.</strong> Toda vez que caberia dizer &quot;isto
funciona&quot;, mostramos o número: o passo zero contra os 6,93 do chute, a
máscara que não deixa o passado mudar, a frase que o ajuste fino deixou
de estranhar.</li>
</ol>

<template class="pagina" data-id="llm-do-zero/aula-09-tokenizacao" data-titulo="Aula 9 — Do Texto aos Números" data-descricao="O que um LLM faz, e como o texto vira número">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>
<p>Você vai entender o que um modelo de linguagem faz e escrever o mais
simples de todos, que só conta letras. Vai escrever também o tokenizador
que as próximas duas aulas usam.</p>
</div></div>
<h2 id="onde-estamos">Onde estamos<a class="ancora" href="#onde-estamos" aria-label="Link para esta secao">#</a></h2>
<figure><img src="docs/assets/aula-09/mapa.png" alt="Três quadros lado a lado, um por aula: do texto para números, como funciona por dentro, treinar e usar. O primeiro está aceso"><figcaption>Três aulas para construir a máquina inteira. Esta é a primeira peça.</figcaption></figure>

<p>Nestas três aulas você constrói um modelo de linguagem do zero, em
Keras, e treina no processador do Colab. Cada aula alterna explicações
curtas e exercícios, e cada exercício acrescenta uma peça ao mesmo modelo.
No fim da Aula 11, o modelo é seu: você escreveu cada parte e apertou o
botão do treino.</p>
<h2 id="o-que-um-llm-faz">O que um LLM faz<a class="ancora" href="#o-que-um-llm-faz" aria-label="Link para esta secao">#</a></h2>
<p>Um modelo de linguagem grande faz <strong>uma</strong> coisa: recebe um pedaço de texto
e devolve as probabilidades do que vem em seguida. Só isso. Conversar,
resumir, traduzir e programar são tudo consequência de repetir essa
resposta muitas vezes.</p>
<p>Comece pelo que é fácil de conferir. Aqui estão as continuações de
&quot;minha mãe&quot; nas 90 vezes em que a expressão aparece nos livros de Machado
de Assis:</p>
<figure><img src="docs/assets/aula-09/proxima_palavra.png" alt="Gráfico de barras com as continuações mais comuns da expressão minha mãe: que e era com 9% cada, depois me, ficou, lhe, e, a e fez, e uma barra grande para as outras 55 continuações"><figcaption>Nenhuma continuação passa de 9%. A resposta certa não é uma palavra, é uma distribuição.</figcaption></figure>

<p>Repare que não existe resposta certa. Existem 63 continuações diferentes, e
a mais provável aparece em menos de uma vez a cada dez. É por isso que a
saída do modelo é uma <strong>distribuição de probabilidade</strong>, exatamente como a
softmax da Aula 8 produzia para as dez categorias de roupa. Só que aqui as
categorias são todas as continuações possíveis.</p>
<h2 id="o-modelo-mais-simples-contar">O modelo mais simples: contar<a class="ancora" href="#o-modelo-mais-simples-contar" aria-label="Link para esta secao">#</a></h2>
<p>Antes de qualquer rede neural, dá para construir um modelo de linguagem
com uma tabela de contagem. Percorra o livro inteiro e anote, para cada
letra, qual letra veio logo depois dela.</p>
<figure><img src="docs/assets/aula-09/depois_de.png" alt="Três gráficos de barras: depois de q vem u em 100% das vezes; depois de a vêm espaço com 28%, s com 11% e r com 9%; depois de espaço as letras se espalham, com d em 11%"><figcaption>Depois de "q", quase sempre "u". Depois de um espaço, quase qualquer coisa.</figcaption></figure>

<p>A contagem vira probabilidade com uma divisão. A chance de uma letra vir
depois de outra é quantas vezes isso aconteceu, dividido por quantas vezes
a primeira apareceu:</p>
<div class="formula" title="P(\text{seguinte} \mid \text{atual}) = \frac{\text{contagem}(\text{atual}, \text{seguinte})}{\text{contagem}(\text{atual})}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>P</mi><mo stretchy="false">&#x00028;</mo><mtext>seguinte</mtext><mo>&#x02223;</mo><mtext>atual</mtext><mo stretchy="false">&#x00029;</mo><mo>&#x0003D;</mo><mfrac><mrow><mtext>contagem</mtext><mo stretchy="false">&#x00028;</mo><mtext>atual</mtext><mo>&#x0002C;</mo><mtext>seguinte</mtext><mo stretchy="false">&#x00029;</mo></mrow><mrow><mtext>contagem</mtext><mo stretchy="false">&#x00028;</mo><mtext>atual</mtext><mo stretchy="false">&#x00029;</mo></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>P(seguinte ∣ atual)</code></td>
  <td>a chance da próxima letra, sabendo qual é a atual (a barra se lê &quot;sabendo que&quot;)</td>
</tr>
<tr>
  <td><code>contagem(atual, seguinte)</code></td>
  <td>quantas vezes o par apareceu, nessa ordem, no corpus</td>
</tr>
<tr>
  <td><code>contagem(atual)</code></td>
  <td>quantas vezes a letra atual apareceu</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: o &quot;q&quot; aparece 33.847 vezes nos livros de Machado. Em 33.842
delas, a letra seguinte é &quot;u&quot;. A chance é 33.842 / 33.847 = 99,99%. O
modelo nunca leu uma regra de ortografia, e achou a regra do &quot;qu&quot; sozinho.</p>
<p>Para <strong>gerar</strong> texto, você sorteia a próxima letra com essas chances, cola
no fim e repete. É o Exercício 1 da aula, e o resultado é este:</p>
<div class="bloco-codigo" data-lingua=""><button class="copiar" type="button">copiar</button><pre class="realce"><code>A ou ntilemuerinãocuma ganto a me l Ansisbo erdo ostrunes m ansamenerelhasaqus
</code></pre></div>
<p>Parece português visto de longe: letras frequentes, espaços no lugar, um
&quot;ão&quot; aqui e ali. De perto, não tem uma palavra. O defeito é óbvio: o
modelo só olha <strong>uma</strong> letra para trás.</p>
<h2 id="por-que-contar-nao-escala">Por que contar não escala<a class="ancora" href="#por-que-contar-nao-escala" aria-label="Link para esta secao">#</a></h2>
<p>A correção parece simples: olhar mais letras para trás. O problema é o
tamanho da tabela. Cada letra a mais de contexto multiplica o número de
linhas por 118, que é a quantidade de caracteres diferentes no corpus.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Olhando para trás</th>
  <th>Linhas na tabela</th>
  <th>Quantas o corpus já mostrou</th>
</tr>
</thead>
<tbody>
<tr>
  <td>1 letra</td>
  <td>118</td>
  <td>todas</td>
</tr>
<tr>
  <td>3 letras</td>
  <td>1,6 milhão</td>
  <td>uma fração pequena</td>
</tr>
<tr>
  <td>10 letras</td>
  <td>5 × 10²⁰</td>
  <td>quase nenhuma</td>
</tr>
</tbody>
</table></div>
<p>Com dez letras de contexto, quase toda combinação que o modelo encontrar é
nova, e a tabela não tem nada a dizer sobre ela. Contar não generaliza:
&quot;o gato dorme&quot; e &quot;o cão dorme&quot; são linhas diferentes, sem nada em comum.</p>
<p>Uma rede neural resolve isso. Ela troca a tabela por pesos que vários
contextos parecidos dividem, então o que ela aprende num contexto vale
para os vizinhos. As próximas duas aulas constroem essa rede.</p>
<h2 id="o-material-da-obra">O material da obra<a class="ancora" href="#o-material-da-obra" aria-label="Link para esta secao">#</a></h2>
<p>O modelo que você vai construir é pequeno (809.728 pesos, contra centenas
de bilhões dos modelos comerciais) e treina no processador, sem placa de
vídeo.</p>
<p>O texto que ele vai ler é toda a prosa de Machado de Assis: onze obras,
3.676.878 caracteres, 623.120 palavras. Está em domínio público, e o
arquivo mora em <code>data/machado.txt</code>.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>O detalhe que vai voltar em todas as aulas</strong></p>
<p>Esses livros são de 1880 a 1908, com a grafia da época: &quot;elle&quot;, &quot;cousa&quot;,
&quot;difficil&quot;, &quot;pharmacia&quot;. O modelo vai aprender a escrever assim, porque é
o que ele viu. Guarde essa observação. Ela é a coisa mais importante que
este curso tem a dizer sobre modelos de linguagem.</p>
</div></div>
<h2 id="limpar-o-texto-sem-estragar-o-texto">Limpar o texto, sem estragar o texto<a class="ancora" href="#limpar-o-texto-sem-estragar-o-texto" aria-label="Link para esta secao">#</a></h2>
<p>Quem já viu processamento de texto antigo espera uma faxina antes de
tudo: passar para minúsculas, tirar acentos e pontuação, apagar as
palavras muito comuns (&quot;de&quot;, &quot;a&quot;, &quot;que&quot;) e cortar cada palavra no radical
(&quot;casamento&quot;, &quot;casado&quot; e &quot;casar&quot; viram <code>cas</code>). Fazia sentido quando o
objetivo era classificar um texto contando palavras, como nos modelos de
saco de palavras: a maiúscula e a vírgula só atrapalhavam a contagem.</p>
<p>Um modelo de linguagem não faz nada disso, porque ele precisa <strong>escrever</strong>.
Se nunca vir uma vírgula, não sabe onde pôr uma. Se tudo estiver em
minúsculas, não sabe que frase começa com maiúscula, nem que &quot;Capitu&quot; é
um nome. As palavras comuns são justamente as que mais aparecem no texto
que ele vai gerar. A regra de hoje é: <strong>tirar o que não é texto, nunca o
que é</strong>.</p>
<p>O que se tira, então? Nos modelos grandes, que leem bilhões de páginas da
internet, a limpeza é pesada, mas é limpeza de lixo:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>O que sai</th>
  <th>Por quê</th>
</tr>
</thead>
<tbody>
<tr>
  <td>menus, propaganda, código de página, rodapés</td>
  <td>não é texto escrito por alguém para ser lido</td>
</tr>
<tr>
  <td>páginas repetidas</td>
  <td>o modelo decoraria o que aparece mil vezes</td>
</tr>
<tr>
  <td>texto de baixa qualidade ou em outra língua</td>
  <td>ensina o que não se quer</td>
</tr>
<tr>
  <td>dados pessoais (e-mails, telefones)</td>
  <td>o modelo poderia repetir</td>
</tr>
</tbody>
</table></div>
<p>Com os livros de Machado, o trabalho foi pequeno. O script
<code>data/scripts/baixar_machado.py</code> faz cinco coisas:</p>
<ol>
<li>Tira o cabeçalho e o rodapé em inglês que o Project Gutenberg cola em
todo livro (licença, créditos).</li>
<li><strong>Normaliza o Unicode</strong>. Existem dois jeitos de guardar o &quot;ã&quot; no
computador: uma letra só, ou um &quot;a&quot; seguido de um til solto. Na tela
são iguais, mas para o tokenizador seriam peças diferentes. A
normalização (chamada NFC) escolhe sempre o primeiro jeito.</li>
<li>Troca aspas curvas (“ ”) e travessões tipográficos pelas versões
simples (<code>&quot;</code> e <code>--</code>). Significam a mesma coisa, e não vale gastar
vocabulário com variantes.</li>
<li>Tira o sublinhado (<code>_assim_</code>) que o Gutenberg usa para marcar itálico.</li>
<li>Tira os espaços no fim das linhas e as linhas em branco repetidas.</li>
</ol>
<p>Maiúsculas, acentos, pontuação, quebras de parágrafo e a grafia de 1900
ficaram exatamente como estavam.</p>
<h2 id="a-unidade-errada-duas-vezes">A unidade errada, duas vezes<a class="ancora" href="#a-unidade-errada-duas-vezes" aria-label="Link para esta secao">#</a></h2>
<p>Antes de qualquer conta, uma decisão: qual é a peça mínima que o modelo
manipula?</p>
<figure><img src="docs/assets/aula-09/tres_unidades.png" alt="A frase O menino era pai do homem cortada de três formas: em 26 letras, em 10 tokens e em 7 palavras"><figcaption>A mesma frase, cortada de três jeitos. O ponto médio marca um espaço dentro da peça.</figcaption></figure>

<p><strong>Palavra inteira</strong> parece o óbvio, e não funciona. O corpus tem 50.390
palavras diferentes, e essa é só a contagem de Machado. Pior: na primeira
palavra que o modelo nunca viu, ele não tem entrada nenhuma para usar.
Nomes próprios, erros de digitação e palavras novas quebram tudo.</p>
<p><strong>Letra</strong> resolve o vocabulário: são 118 caracteres diferentes, e nada
fica de fora. Mas a frase acima vira 26 peças em vez de 7. Como o custo do
modelo cresce com o número de peças, você paga quase quatro vezes mais
para dizer a mesma coisa.</p>
<h2 id="o-meio-termo-bpe">O meio-termo: BPE<a class="ancora" href="#o-meio-termo-bpe" aria-label="Link para esta secao">#</a></h2>
<p>A solução usada por todos os modelos modernos se chama <strong>codificação por
pares de bytes</strong> (<em>byte pair encoding</em>, ou BPE). A regra cabe em uma frase:</p>
<blockquote>
<p>Encontre o par de peças vizinhas mais comum no texto, junte as duas numa
peça nova, e repita.</p>
</blockquote>
<p>Faça à mão, com o texto <code>banana banana banana</code>:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Passo</th>
  <th>Par mais comum</th>
  <th>Como cada <code>banana</code> fica</th>
</tr>
</thead>
<tbody>
<tr>
  <td>0</td>
  <td></td>
  <td><code>b</code> <code>a</code> <code>n</code> <code>a</code> <code>n</code> <code>a</code></td>
</tr>
<tr>
  <td>1</td>
  <td><code>a</code>+<code>n</code>, 6 vezes</td>
  <td><code>b</code> <code>an</code> <code>an</code> <code>a</code></td>
</tr>
<tr>
  <td>2</td>
  <td><code>b</code>+<code>an</code>, 3 vezes</td>
  <td><code>ban</code> <code>an</code> <code>a</code></td>
</tr>
<tr>
  <td>3</td>
  <td><code>ban</code>+<code>an</code>, 3 vezes</td>
  <td><code>banan</code> <code>a</code></td>
</tr>
</tbody>
</table></div>
<p>Em três passos, <code>banana</code> saiu de seis peças para duas. Nenhum linguista
escolheu essas peças: elas saíram da contagem.</p>
<p>Num texto minúsculo como esse, vários pares empatam (<code>na</code> também aparece 6
vezes no passo 1) e o programa desempata por uma regra fixa. Em texto de
verdade o empate no topo quase nunca acontece.</p>
<p>Veja o BPE trabalhando, devagar, em outra frase:</p>
<figure><video src="docs/assets/aula-09/bpe.mp4" poster="docs/assets/aula-09/bpe.jpg" controls preload="none" playsinline aria-label="Animação do BPE sobre a frase casa casada casamento"></video><figcaption>"casa casada casamento": quatro rodadas de contar, escolher e fundir. As peças "ca", "cas", "casa" e "·casa" saem da contagem, e 21 peças viram 10.</figcaption></figure>

<p>No computador, cada passo da tabela são três linhas: contar os pares
vizinhos, achar o mais comum, e trocar cada ocorrência dele por um número
novo. O treino repete as três:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="k">for</span> <span class="n">novo</span> <span class="ow">in</span> <span class="p">[</span><span class="mi">256</span><span class="p">,</span> <span class="mi">257</span><span class="p">,</span> <span class="mi">258</span><span class="p">]:</span>
    <span class="n">pares</span> <span class="o">=</span> <span class="n">contar_pares</span><span class="p">(</span><span class="n">ids</span><span class="p">)</span>          <span class="c1"># conta os pares vizinhos</span>
    <span class="n">par</span> <span class="o">=</span> <span class="n">par_mais_comum</span><span class="p">(</span><span class="n">pares</span><span class="p">)</span>        <span class="c1"># acha o mais comum</span>
    <span class="n">ids</span> <span class="o">=</span> <span class="n">fundir</span><span class="p">(</span><span class="n">ids</span><span class="p">,</span> <span class="n">par</span><span class="p">,</span> <span class="n">novo</span><span class="p">)</span>       <span class="c1"># troca o par pelo número novo</span>
</code></pre></div>
<p>Rodando isso no corpus inteiro até chegar a 1.024 peças, é isto o que sai:</p>
<figure><img src="docs/assets/aula-09/fusoes.png" alt="Três colunas com os tokens aprendidos: as primeiras fusões são pedaços curtos como espaço-d e ra, no meio aparecem dous e tal, e no fim palavras inteiras como fazer, sei e filha"><figcaption>As primeiras fusões são pedaços de duas letras. As últimas já são palavras inteiras.</figcaption></figure>

<p>Leia as três colunas na ordem. No começo o algoritmo junta o que é comum
em qualquer texto em português (<code>ra</code>, <code>os</code>, <code>qu</code>). No meio já aparece a
grafia da época (<code>·dous</code>). No fim sobrou espaço para palavras inteiras que
Machado usa muito (<code>fazer</code>, <code>sei</code>, <code>filha</code>). O vocabulário é um retrato do
corpus.</p>
<h2 id="bytes-para-nada-ficar-de-fora">Bytes, para nada ficar de fora<a class="ancora" href="#bytes-para-nada-ficar-de-fora" aria-label="Link para esta secao">#</a></h2>
<p>Um detalhe que parece técnico e não é. O BPE não começa das letras: começa
dos <strong>bytes</strong>. Todo texto do mundo, em qualquer língua, é uma sequência de
bytes, e existem exatamente 256 valores possíveis.</p>
<p>A consequência: o vocabulário inicial tem 256 peças e cobre tudo. O
modelo nunca encontra um caractere que ele não saiba representar. Um
emoji, um ideograma chinês ou um nome próprio esquisito viram vários
bytes, e o modelo processa sem reclamar.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Texto</th>
  <th>Bytes em UTF-8</th>
  <th>Quantos</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>a</code></td>
  <td>97</td>
  <td>1</td>
</tr>
<tr>
  <td><code>ã</code></td>
  <td>195, 163</td>
  <td>2</td>
</tr>
<tr>
  <td><code>🙂</code></td>
  <td>240, 159, 153, 130</td>
  <td>4</td>
</tr>
</tbody>
</table></div>
<p>Um efeito colateral divertido: como o <code>ã</code> ocupa dois bytes, no começo do
treino ele é duas peças. Uma das primeiras fusões junta as duas. O
algoritmo aprendeu a letra <code>ã</code> sozinho, contando.</p>
<div class="formula" title="\text{vocabulário} = 256 \text{ bytes} + 768 \text{ fusões} = 1024"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>vocabulário</mtext><mo>&#x0003D;</mo><mn>256</mn><mtext>&#x000A0;bytes</mtext><mo>&#x0002B;</mo><mn>768</mn><mtext>&#x000A0;fusões</mtext><mo>&#x0003D;</mo><mn>1024</mn></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td>256</td>
  <td>os valores possíveis de um byte, a base de tudo</td>
</tr>
<tr>
  <td>768</td>
  <td>quantas vezes você mandou juntar o par mais comum</td>
</tr>
<tr>
  <td>1024</td>
  <td>o tamanho final da tabela, escolhido por você</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: com 768 fusões, o corpus de 3.676.878 caracteres vira 1.484.827
tokens. São 2,48 caracteres por token.</p>
<h2 id="antes-de-juntar-separar-as-palavras">Antes de juntar, separar as palavras<a class="ancora" href="#antes-de-juntar-separar-as-palavras" aria-label="Link para esta secao">#</a></h2>
<p>Se você rodar o BPE direto sobre o texto corrido, ele aprende peças que
atravessam a pontuação. No exercício da aula, com um trecho de Machado,
as primeiras fusões saem assim: <code>e·</code>, <code>a·</code>, <code>o·</code>, <code>,·</code>, e logo depois
<code>o,·</code>, que junta o fim de uma palavra, a vírgula e o espaço.</p>
<p>Isso desperdiça vocabulário. &quot;dele.&quot; e &quot;dele,&quot; viram peças diferentes, sem
nada em comum. Por isso o tokenizador oficial corta o texto em palavras
<strong>antes</strong> de fundir: cada palavra com o espaço da frente, cada número,
cada sinal de pontuação, separados. As fusões só acontecem dentro de um
pedaço.</p>
<p>O corte é feito por uma expressão regular, guardada junto com a tabela de
fusões no arquivo <code>machado_bpe.json</code>. É por isso que, na figura das três
unidades, o espaço aparece grudado no <strong>começo</strong> das palavras (<code>·men</code>,
<code>·era</code>).</p>
<h2 id="codificar-e-decodificar">Codificar e decodificar<a class="ancora" href="#codificar-e-decodificar" aria-label="Link para esta secao">#</a></h2>
<p>Com a tabela pronta, converter texto em números é mecânico:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">tokens</span> <span class="o">=</span> <span class="n">codificar</span><span class="p">(</span><span class="s2">"O menino era pai do homem."</span><span class="p">)</span>
<span class="c1"># [79, 600, 281, 111, 354, 405, 105, 319, 724, 46]</span>

<span class="n">decodificar</span><span class="p">(</span><span class="n">tokens</span><span class="p">)</span>
<span class="c1"># 'O menino era pai do homem.'</span>
</code></pre></div>
<p><strong>Decodificar</strong> é o caminho fácil: cada número vira os bytes dele, e os
bytes juntos viram texto.</p>
<p><strong>Codificar</strong> tem uma regra que importa. Dentro de cada palavra, você
aplica as fusões <strong>na ordem em que o treino aprendeu cada uma</strong>: das
fusões possíveis, sempre a de número menor. É essa ordem que garante que a mesma
palavra seja cortada do mesmo jeito que o modelo viu no treino.</p>
<p>Uma regra que não tem exceção: <strong>codificar e decodificar têm que usar a
mesma tabela de fusões</strong>. Se você treinar o modelo com uma tabela e usar
outra na hora de conversar com ele, os números vão significar outra coisa,
e a saída vira lixo.</p>
<figure><img src="docs/assets/aula-09/compressao.png" alt="Dois gráficos de barras comparando letra, token e palavra: à esquerda quantas peças o corpus tem em cada esquema, à direita o tamanho do vocabulário de cada um, em escala logarítmica"><figcaption>O BPE fica no meio de propósito: poucas peças e vocabulário pequeno, ao mesmo tempo.</figcaption></figure>

<p>Os dois gráficos contam a mesma escolha por dois lados. Por letra, o
vocabulário é minúsculo mas o texto fica longo. Por palavra, o texto fica
curto mas o vocabulário explode. O BPE não vence em nenhum dos dois, e é
aceitável nos dois.</p>
<h2 id="o-tokenizador-tambem-tem-sotaque">O tokenizador também tem sotaque<a class="ancora" href="#o-tokenizador-tambem-tem-sotaque" aria-label="Link para esta secao">#</a></h2>
<p>Como as fusões saem da contagem, o tokenizador fica bom no texto que ele
leu e ruim no resto. O de Machado corta assim:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Palavra</th>
  <th>Tokens</th>
  <th>Como ficou</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>·elle</code></td>
  <td>1</td>
  <td><code>·elle</code></td>
</tr>
<tr>
  <td><code>·ele</code></td>
  <td>2</td>
  <td><code>·e</code> <code>le</code></td>
</tr>
<tr>
  <td><code>·cousa</code></td>
  <td>1</td>
  <td><code>·cousa</code></td>
</tr>
<tr>
  <td><code>·internet</code></td>
  <td>4</td>
  <td><code>·inter</code> <code>n</code> <code>e</code> <code>t</code></td>
</tr>
<tr>
  <td><code>·smartphone</code></td>
  <td>7</td>
  <td><code>·s</code> <code>mar</code> <code>t</code> <code>p</code> <code>ho</code> <code>n</code> <code>e</code></td>
</tr>
</tbody>
</table></div>
<p>A grafia de 1899 sai barata, e a de hoje sai cara. Isso acontece com os
modelos comerciais também: o tokenizador deles aprendeu com muito mais
texto em inglês que em português, então a mesma frase em português costuma
gastar mais tokens. Mais tokens querem dizer resposta mais cara e menos
texto cabendo na janela.</p>
<h2 id="depois-do-numero-um-vetor">Depois do número, um vetor<a class="ancora" href="#depois-do-numero-um-vetor" aria-label="Link para esta secao">#</a></h2>
<p>Os tokens viraram números, mas o modelo não usa esses números como
quantidades. Se usasse, ele acharia que <code>·men</code> (600) vale quase oito
vezes <code>O</code> (79), o que não quer dizer nada: os números são só a ordem em
que o BPE criou cada peça.</p>
<p>O número é um <strong>endereço</strong>. O modelo guarda uma tabela com uma linha por
token (1.024 linhas) e 128 colunas. Cada token é trocado pela sua linha,
uma lista de 128 números chamada <strong>embedding</strong> do token. É esse vetor que entra no modelo.</p>
<figure><img src="docs/assets/aula-09/texto_ao_vetor.png" alt="Fluxo de cima para baixo: a frase O menino era pai do homem, os tokens O, men, in, o, era, os números 79, 600, 281, 111 e 354, e embaixo de cada número uma coluna de valores como menos 0,09 e mais 0,17, coloridos de azul a vermelho, com uma seta para o modelo"><figcaption>Texto, tokens, ids e vetores. Os valores são do modelo treinado: as 6 primeiras das 128 colunas de cada linha.</figcaption></figure>

<p>No começo do treino a tabela é sorteada, e os vetores não significam
nada. O treino ajusta cada número dela, como ajusta qualquer outro peso.
No fim, tokens que aparecem em lugares parecidos acabam com vetores
parecidos. No modelo treinado da disciplina, o vetor mais parecido com o
de <code>·elle</code> é o de <code>·ella</code>; perto de <code>·dous</code> estão <code>·duas</code> e <code>·tres</code>; perto
de <code>·era</code> estão <code>·fosse</code> e <code>·foi</code>. Ninguém ensinou gramática ao modelo:
ele achou sozinho que essas palavras fazem o mesmo papel. Na Aula 10 você
monta essa tabela, com uma linha de Keras, e vê esse espaço em 3D.</p>
<p>O caminho inteiro, então, é este:</p>
<div class="bloco-codigo" data-lingua=""><button class="copiar" type="button">copiar</button><pre class="realce"><code>texto  →  tokens  →  ids  →  vetores (embeddings)  →  modelo
</code></pre></div>
<p>Esta aula cuida das três primeiras setas.</p>

<div class="quiz" data-numero="2"><p class="quiz-numero">Questão 2</p><p class="quiz-enunciado">E qual é o problema de usar a letra como peça?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Existem letras demais no português.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">As letras não têm número.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">O modelo não sabe juntar letras.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">D</span><span class="quiz-texto">O texto vira uma fila muito longa, e o custo cresce com o número de peças.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Com 118 símbolos nada fica de fora, mas &quot;O menino era pai do homem.&quot; vira 26 peças em vez de 7. O modelo paga quase quatro vezes mais para dizer a mesma coisa.</p></div></div>
<div class="quiz" data-numero="3"><p class="quiz-numero">Questão 3</p><p class="quiz-enunciado">Qual é a regra do BPE?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">A</span><span class="quiz-texto">Encontre o par de peças vizinhas mais comum, junte as duas numa peça nova, e repita.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Corte o texto sempre de três em três letras.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Junte as palavras que um linguista marcou como importantes.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Separe o texto nas sílabas de cada palavra.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">É a regra inteira, e ela cabe numa frase. Ninguém escolhe as peças: elas saem da contagem.</p></div></div>
<div class="quiz" data-numero="4"><p class="quiz-numero">Questão 4</p><p class="quiz-enunciado">Antes de treinar um modelo de linguagem, o que se faz com as maiúsculas, os acentos e a pontuação do texto?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Passa tudo para minúsculas e tira os acentos, para o vocabulário ficar menor.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Tira a pontuação, porque ela não carrega significado.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">Deixa como está: o modelo vai ter que escrever tudo isso, então precisa ver tudo isso.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Tira as palavras mais comuns, como &quot;de&quot; e &quot;que&quot;.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">A faxina pesada é do processamento de texto antigo, feito para classificar. Um LLM escreve, então só sai o que não é texto (cabeçalhos, menus, cópias repetidas). Nos livros de Machado, maiúsculas, acentos e pontuação ficaram intactos.</p></div></div>
<div class="quiz" data-numero="5"><p class="quiz-numero">Questão 5</p><p class="quiz-enunciado">As últimas fusões do tokenizador de Machado são palavras inteiras, como &quot;·fazer&quot; e &quot;·filha&quot;. O que isso diz?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Que o algoritmo errou no fim.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Que essas palavras são raras.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Que o tokenizador foi feito à mão.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">D</span><span class="quiz-texto">Que o vocabulário é um retrato do corpus: o que Machado usa muito vira peça.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">As primeiras fusões são pedaços comuns em qualquer português (&quot;ra&quot;, &quot;qu&quot;). As últimas já são palavras frequentes nos livros. Treinado em outro texto, o vocabulário seria outro.</p></div></div>
</div><div class="pilha-fim" hidden><p class="pilha-nota"></p><p class="pilha-dica"></p><button class="pilha-refazer" type="button">Refazer o quiz</button></div></div>
<h3 id="microaula-3-do-texto-aos-numeros-e-de-volta">Microaula 3: do texto aos números, e de volta<a class="ancora" href="#microaula-3-do-texto-aos-numeros-e-de-volta" aria-label="Link para esta secao">#</a></h3>
<div class="pilha" data-titulo="Microaula 3 · Codificar e decodificar"><div class="pilha-topo"><span class="pilha-titulo">Microaula 3 · Codificar e decodificar</span><span class="pilha-progresso"></span></div><div class="pilha-cartas"><div class="quiz" data-numero="1"><p class="quiz-numero">Questão 1</p><p class="quiz-enunciado">Por que o BPE começa dos bytes, e não das letras?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Porque bytes são mais rápidos de digitar.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">B</span><span class="quiz-texto">Porque qualquer texto, em qualquer língua, é uma fila de bytes: nenhum caractere fica de fora.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Porque o português não tem letras suficientes.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Porque os bytes já vêm agrupados em palavras.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Um byte tem 256 valores possíveis. Um emoji ou um ideograma vira vários bytes, e o modelo nunca encontra um símbolo que não saiba escrever.</p></div></div>
<div class="quiz" data-numero="2"><p class="quiz-numero">Questão 2</p><p class="quiz-enunciado">Dentro do modelo, o que acontece com o número de cada token, como o 600 de &quot;·men&quot;?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Ele entra no modelo como está, e 600 vale mais que 79.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">B</span><span class="quiz-texto">Ele é um endereço: escolhe uma linha de uma tabela, o embedding, e é essa lista de números que entra no modelo.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Ele é dividido por 1.024, para virar uma chance.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Ele é trocado de volta pelas letras antes de entrar no modelo.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">O número é só a ordem em que o BPE criou a peça. Cada token vira uma linha de 128 números, que o treino ajusta. No fim, tokens que aparecem em lugares parecidos ganham linhas parecidas, como &quot;·elle&quot; e &quot;·ella&quot;.</p></div></div>
<div class="quiz" data-numero="3"><p class="quiz-numero">Questão 3</p><p class="quiz-enunciado">Por que o tokenizador oficial separa o texto em palavras antes de fundir?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Para o texto ficar mais longo.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Porque o BPE só funciona com uma palavra de cada vez.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Para tirar a pontuação do texto.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">D</span><span class="quiz-texto">Para nenhuma fusão atravessar o espaço ou a pontuação, e &quot;dele.&quot; e &quot;dele,&quot; dividirem a mesma peça.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Sem essa separação, o BPE aprende peças como &quot;o,·&quot;, que juntam fim de palavra, vírgula e espaço, e desperdiçam vocabulário.</p></div></div>
<div class="quiz" data-numero="4"><p class="quiz-numero">Questão 4</p><p class="quiz-enunciado">Ao codificar uma palavra, em que ordem as fusões são aplicadas?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">A</span><span class="quiz-texto">Na ordem em que o treino aprendeu: sempre a de número menor primeiro.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Da maior peça para a menor.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Em ordem alfabética.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Na ordem em que as letras aparecem na palavra.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">É essa ordem que faz a mesma palavra ser cortada do mesmo jeito que o modelo viu no treino.</p></div></div>
<div class="quiz" data-numero="5"><p class="quiz-numero">Questão 5</p><p class="quiz-enunciado">O que acontece se você treinar o modelo com uma tabela de fusões e usar outra na hora de conversar com ele?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Nada: os números são os mesmos.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">O modelo fica mais rápido.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">Os números passam a significar outra coisa, e a saída vira lixo.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">O modelo aprende a tabela nova sozinho.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">É o erro do dia. O tokenizador é parte do modelo: os dois andam juntos, sempre. Por isso o notebook carrega a tabela oficial em vez de treinar uma nova.</p></div></div>
</div><div class="pilha-fim" hidden><p class="pilha-nota"></p><p class="pilha-dica"></p><button class="pilha-refazer" type="button">Refazer o quiz</button></div></div>
