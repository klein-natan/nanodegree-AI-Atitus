<template class="pagina" data-id="modelos-lineares/aula-02-regressao-multipla" data-titulo="Aula 2 — Regressão Múltipla" data-descricao="Várias variáveis ao mesmo tempo, preditores categóricos e interpretação dos coeficientes">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>
<p>Você vai aprender a prever um número usando várias informações ao mesmo
tempo, a incluir no modelo uma coluna que não é número (o bairro), e a ler
cada coeficiente em português, sabendo o que ele mede e o que ele não
mede.</p>
</div></div>
<h2 id="para-que-serve">Para que serve<a class="ancora" href="#para-que-serve" aria-label="Link para esta secao">#</a></h2>
<p>Você quer alugar um apartamento e abre um site de imóveis. Dois anúncios
têm exatamente 70 m². Um pede R$ 2.400 e o outro pede R$ 3.500. A área é a
mesma, então o preço não vem só dela.</p>
<p>Vem também do número de quartos, da idade do prédio e, principalmente, do
bairro. Na Aula 1 a reta usava uma informação só. Aqui você aprende a usar
todas as informações ao mesmo tempo, que é como qualquer modelo de verdade
funciona.</p>
<p>O dataset desta aula tem 300 apartamentos, com quatro informações sobre
cada um: área, quartos, idade e bairro.</p>
<h2 id="uma-variavel-nao-basta">Uma variável não basta<a class="ancora" href="#uma-variavel-nao-basta" aria-label="Link para esta secao">#</a></h2>
<p>Comece pelo que você já sabe fazer: uma reta com a área.</p>
<figure><img src="docs/assets/aula-02/dispersao_area.png" alt="Gráfico de dispersão de área contra aluguel, com a reta de regressão simples atravessando a nuvem de pontos"><figcaption>A área sozinha explica 71% da variação dos aluguéis. Sobram 29%.</figcaption></figure>

<p>A reta acompanha a tendência, e o <code>R²</code> dá 0,71. Não é ruim. Mas repare na
espessura da nuvem: para uma mesma área existem aluguéis bem diferentes. É
essa faixa vertical que as outras informações vão explicar.</p>
<h2 id="a-formula-com-varias-variaveis">A fórmula com várias variáveis<a class="ancora" href="#a-formula-com-varias-variaveis" aria-label="Link para esta secao">#</a></h2>
<p>O modelo continua sendo uma soma. Cada informação entra multiplicada pelo
seu próprio peso.</p>
<div class="formula" title="\hat{y} = w_0 + w_1 x_1 + w_2 x_2 + \dots + w_p x_p"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mo>&#x0003D;</mo><msub><mi>w</mi><mn>0</mn></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>1</mn></msub><msub><mi>x</mi><mn>1</mn></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>2</mn></msub><msub><mi>x</mi><mn>2</mn></msub><mo>&#x0002B;</mo><mo>&#x02026;</mo><mo>&#x0002B;</mo><msub><mi>w</mi><mi>p</mi></msub><msub><mi>x</mi><mi>p</mi></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>ŷ</code></td>
  <td>o aluguel previsto, em reais</td>
</tr>
<tr>
  <td><code>p</code></td>
  <td>quantas informações (variáveis) o modelo usa</td>
</tr>
<tr>
  <td><code>x₁, x₂...</code></td>
  <td>as informações do apartamento: área, quartos, idade</td>
</tr>
<tr>
  <td><code>w₁, w₂...</code></td>
  <td>o peso de cada informação</td>
</tr>
<tr>
  <td><code>w₀</code></td>
  <td>o valor base, quando todas as informações valem zero</td>
</tr>
</tbody>
</table></div>
<p>Escrever <code>x₁ + x₂ + ...</code> cansa quando o modelo tem muitas variáveis. A
forma compacta usa o mesmo somatório da Aula 1:</p>
<div class="formula" title="\hat{y} = w_0 + \sum_{j=1}^{p} w_j x_j"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mo>&#x0003D;</mo><msub><mi>w</mi><mn>0</mn></msub><mo>&#x0002B;</mo><msubsup><mo>&#x02211;</mo><mrow><mi>j</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>p</mi></mrow></msubsup><msub><mi>w</mi><mi>j</mi></msub><msub><mi>x</mi><mi>j</mi></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>j</code></td>
  <td>o número da variável: 1 para a área, 2 para os quartos...</td>
</tr>
<tr>
  <td><code>Σ</code></td>
  <td>&quot;some para todas as variáveis, de <code>j = 1</code> até <code>j = p</code>&quot;</td>
</tr>
</tbody>
</table></div>
<p>Exemplo com três variáveis, usando os pesos que o modelo desta aula
encontrou. Para um apartamento de 70 m², com 2 quartos e 10 anos, no
Centro: <code>442 + 25,10 × 70 + 220,10 × 2 + (−11,60) × 10 = 2.521</code> reais.</p>
<h2 id="nada-muda-no-treino">Nada muda no treino<a class="ancora" href="#nada-muda-no-treino" aria-label="Link para esta secao">#</a></h2>
<p>Esta é a boa notícia. A função de perda continua sendo o MSE, e o
gradiente descendente continua fazendo o mesmo. A única diferença é o
tamanho do gradiente: em vez de duas inclinações, agora ele tem uma para
cada peso.</p>
<div class="formula" title="\nabla \text{MSE} = \left( \frac{\partial \text{MSE}}{\partial w_0} , \frac{\partial \text{MSE}}{\partial w_1} , \dots , \frac{\partial \text{MSE}}{\partial w_p} \right)"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mo>&#x02207;</mo><mtext>MSE</mtext><mo>&#x0003D;</mo><mrow><mo stretchy="true" fence="true" form="prefix">&#x00028;</mo><mfrac><mrow><mo>&#x02202;</mo><mtext>MSE</mtext></mrow><mrow><mo>&#x02202;</mo><msub><mi>w</mi><mn>0</mn></msub></mrow></mfrac><mo>&#x0002C;</mo><mfrac><mrow><mo>&#x02202;</mo><mtext>MSE</mtext></mrow><mrow><mo>&#x02202;</mo><msub><mi>w</mi><mn>1</mn></msub></mrow></mfrac><mo>&#x0002C;</mo><mo>&#x02026;</mo><mo>&#x0002C;</mo><mfrac><mrow><mo>&#x02202;</mo><mtext>MSE</mtext></mrow><mrow><mo>&#x02202;</mo><msub><mi>w</mi><mi>p</mi></msub></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">&#x00029;</mo></mrow></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>∂MSE/∂wⱼ</code></td>
  <td>a inclinação do erro quando só o peso <code>wⱼ</code> se mexe</td>
</tr>
<tr>
  <td><code>p</code></td>
  <td>o número de variáveis do modelo</td>
</tr>
</tbody>
</table></div>
<p>A regra de atualização também é a mesma, aplicada a cada peso, passo a
passo:</p>
<div class="formula" title="w_{t+1} = w_t - \alpha \cdot \frac{\partial \text{MSE}}{\partial w}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>w</mi><mrow><mi>t</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msub><mo>&#x0003D;</mo><msub><mi>w</mi><mi>t</mi></msub><mo>&#x02212;</mo><mi>&#x003B1;</mi><mo>&#x000B7;</mo><mfrac><mrow><mo>&#x02202;</mo><mtext>MSE</mtext></mrow><mrow><mo>&#x02202;</mo><mi>w</mi></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>t</code></td>
  <td>o número do passo</td>
</tr>
<tr>
  <td><code>α</code></td>
  <td>a taxa de aprendizado, o tamanho do passo</td>
</tr>
</tbody>
</table></div>
<p>Com duas variáveis, a reta vira um plano. Com três ou mais ninguém
consegue desenhar, mas a conta é idêntica.</p>
<figure><img src="docs/assets/aula-02/plano_3d.png" alt="Nuvem de pontos em três dimensões, com área, quartos e aluguel, atravessada por um plano inclinado"><figcaption>Área e quartos no chão, aluguel na altura. O modelo agora é um plano.</figcaption></figure>

<h2 id="o-bairro-nao-e-um-numero">O bairro não é um número<a class="ancora" href="#o-bairro-nao-e-um-numero" aria-label="Link para esta secao">#</a></h2>
<p>Área, quartos e idade são números. O bairro é um nome: Centro, Jardins ou
Vila Nova. E ele importa muito.</p>
<figure><img src="docs/assets/aula-02/efeito_bairro.png" alt="Três colunas de pontos, uma por bairro, com a média de cada bairro marcada por um traço horizontal"><figcaption>O aluguel médio muda quase R$ 1.000 entre Jardins e Vila Nova.</figcaption></figure>

<p>A tentação é numerar: Centro = 1, Jardins = 2, Vila Nova = 3. Não faça
isso. O modelo trataria esses números como quantidade, e passaria a
acreditar em duas bobagens. Que Vila Nova é &quot;três vezes&quot; o Centro. E que a
distância entre Centro e Jardins é a mesma que entre Jardins e Vila Nova.</p>
<p>O jeito certo é criar uma coluna nova para cada bairro, com 0 ou 1. Essas
colunas se chamam <strong>variáveis indicadoras</strong> (<em>dummy variables</em>).</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Bairro do anúncio</th>
  <th><code>bairro_Jardins</code></th>
  <th><code>bairro_Vila Nova</code></th>
</tr>
</thead>
<tbody>
<tr>
  <td>Centro</td>
  <td>0</td>
  <td>0</td>
</tr>
<tr>
  <td>Jardins</td>
  <td>1</td>
  <td>0</td>
</tr>
<tr>
  <td>Vila Nova</td>
  <td>0</td>
  <td>1</td>
</tr>
</tbody>
</table></div>
<p>Repare que existem três bairros e só duas colunas. O Centro é a
<strong>categoria de referência</strong>: ele aparece quando as duas colunas valem
zero. Sempre sobra uma categoria de fora, e é isso que você quer. Se
criasse as três colunas, uma delas seria adivinhável a partir das outras
duas, e o modelo ficaria com infinitas soluções equivalentes.</p>
<p>Com as duas colunas novas, o modelo fica assim:</p>
<div class="formula" title="\hat{y} = w_0 + w_1 \text{área} + w_2 \text{quartos} + w_3 \text{idade} + w_4 \text{jardins} + w_5 \text{vila}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mo>&#x0003D;</mo><msub><mi>w</mi><mn>0</mn></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>1</mn></msub><mtext>área</mtext><mo>&#x0002B;</mo><msub><mi>w</mi><mn>2</mn></msub><mtext>quartos</mtext><mo>&#x0002B;</mo><msub><mi>w</mi><mn>3</mn></msub><mtext>idade</mtext><mo>&#x0002B;</mo><msub><mi>w</mi><mn>4</mn></msub><mtext>jardins</mtext><mo>&#x0002B;</mo><msub><mi>w</mi><mn>5</mn></msub><mtext>vila</mtext></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>jardins</code></td>
  <td>vale 1 se o apartamento é no Jardins, 0 se não é</td>
</tr>
<tr>
  <td><code>vila</code></td>
  <td>vale 1 se o apartamento é na Vila Nova, 0 se não é</td>
</tr>
<tr>
  <td><code>w₄, w₅</code></td>
  <td>quanto cada bairro soma ou tira, em relação ao Centro</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: o mesmo apartamento de 70 m², 2 quartos e 10 anos custa R$ 2.521
no Centro. No Jardins, a coluna <code>jardins</code> passa a valer 1, e o aluguel
previsto sobe para <code>2.521 + 828 = 3.349</code> reais.</p>
<h2 id="lendo-os-coeficientes">Lendo os coeficientes<a class="ancora" href="#lendo-os-coeficientes" aria-label="Link para esta secao">#</a></h2>
<p>Cada coeficiente responde a uma pergunta muito específica: quanto muda o
aluguel se esta variável subir uma unidade <strong>e todas as outras ficarem
paradas</strong>?</p>
<figure><img src="docs/assets/aula-02/coeficientes.png" alt="Gráfico de barras horizontais com o coeficiente de cada variável do modelo, mostrando área, quartos, idade e os dois bairros"><figcaption>Cada barra é o efeito de uma unidade a mais daquela variável.</figcaption></figure>

<p>Traduzindo o gráfico para frases:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Coeficiente</th>
  <th>Valor</th>
  <th>Lê-se assim</th>
</tr>
</thead>
<tbody>
<tr>
  <td>área</td>
  <td>+25,10</td>
  <td>cada m² a mais soma R$ 25,10 no aluguel</td>
</tr>
<tr>
  <td>quartos</td>
  <td>+220,10</td>
  <td>um quarto a mais soma R$ 220,10, na mesma área</td>
</tr>
<tr>
  <td>idade</td>
  <td>−11,60</td>
  <td>cada ano de prédio tira R$ 11,60</td>
</tr>
<tr>
  <td>Jardins</td>
  <td>+827,60</td>
  <td>o mesmo apartamento no Jardins custa R$ 827,60 a mais que no Centro</td>
</tr>
<tr>
  <td>Vila Nova</td>
  <td>−303,20</td>
  <td>e na Vila Nova custa R$ 303,20 a menos que no Centro</td>
</tr>
</tbody>
</table></div>
<p>O <code>w₀</code> de 442 reais é o valor base: o que o modelo prevê para um
apartamento de 0 m², 0 quartos, novo, no Centro. Esse apartamento não
existe. Isso é normal, e não invalida o modelo. O papel de <code>w₀</code> é ajustar
a altura de todo o resto.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Olhar para o gráfico acima e concluir que &quot;o bairro é a variável mais
importante, porque a barra é maior&quot;. As barras estão em unidades
diferentes. Uma delas é o efeito de <strong>um metro quadrado</strong>, a outra é o
efeito de <strong>mudar de bairro</strong>. Vinte metros quadrados a mais valem
R$ 502, quase tanto quanto trocar o Centro pelo Jardins. Coeficiente
grande não significa variável importante: significa que a unidade daquela
variável é pequena.</p>
</div></div>
<h2 id="por-que-um-coeficiente-muda-quando-outro-entra">Por que um coeficiente muda quando outro entra<a class="ancora" href="#por-que-um-coeficiente-muda-quando-outro-entra" aria-label="Link para esta secao">#</a></h2>
<p>Este é o ponto mais difícil da aula, e vale a pena ir devagar.</p>
<p>Sozinha, a área tem coeficiente 29,70. No modelo completo, ela cai para
25,10. A área não mudou. A pergunta é que mudou.</p>
<p>Quando a área é a única variável, ela leva o crédito por tudo que anda
junto com ela. Apartamentos maiores costumam ter mais quartos: neste
dataset, a correlação entre área e quartos é de 0,82. Sem a coluna de
quartos no modelo, o efeito dos quartos se esconde dentro do coeficiente
da área.</p>
<p>Quando os quartos entram, cada um fica com a sua parte. Por isso o
coeficiente da área diminui. Ele passou a significar &quot;o efeito de mais um
metro quadrado, <strong>no mesmo número de quartos</strong>&quot;.</p>
<p>O mesmo raciocínio explica um número estranho deste dataset. A Vila Nova
tem a maior área média (76,5 m²) e o menor aluguel médio (R$ 2.286). Isso
não é contradição. O coeficiente da Vila Nova compara apartamentos de
mesma área, e aí o bairro sai devendo.</p>
<h2 id="quanto-mais-variaveis-melhor">Quanto mais variáveis, melhor?<a class="ancora" href="#quanto-mais-variaveis-melhor" aria-label="Link para esta secao">#</a></h2>
<p>Existe uma armadilha aqui. Toda variável nova, por pior que seja, faz o
<code>R²</code> subir ou ficar igual. Ele nunca cai.</p>
<figure><img src="docs/assets/aula-02/r2_vs_variaveis.png" alt="Dois gráficos lado a lado: à esquerda o R² sobe conforme variáveis úteis entram no modelo; à direita colunas de números sorteados continuam subindo o R², mas o R² ajustado cai"><figcaption>À direita, colunas de números sorteados. O R² sobe mesmo assim; o R² ajustado não cai nessa.</figcaption></figure>

<p>A defesa contra isso é o <strong>R² ajustado</strong>, que desconta do <code>R²</code> o preço de
cada variável nova.</p>
<div class="formula" title="R^2_{\text{aj}} = 1 - (1 - R^2) \cdot \frac{n - 1}{n - p - 1}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msubsup><mi>R</mi><mrow><mtext>aj</mtext></mrow><mn>2</mn></msubsup><mo>&#x0003D;</mo><mn>1</mn><mo>&#x02212;</mo><mo stretchy="false">&#x00028;</mo><mn>1</mn><mo>&#x02212;</mo><msup><mi>R</mi><mn>2</mn></msup><mo stretchy="false">&#x00029;</mo><mo>&#x000B7;</mo><mfrac><mrow><mi>n</mi><mo>&#x02212;</mo><mn>1</mn></mrow><mrow><mi>n</mi><mo>&#x02212;</mo><mi>p</mi><mo>&#x02212;</mo><mn>1</mn></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>n</code></td>
  <td>quantos apartamentos existem na tabela</td>
</tr>
<tr>
  <td><code>p</code></td>
  <td>quantas variáveis o modelo usa</td>
</tr>
<tr>
  <td><code>R²</code></td>
  <td>o R² comum, aquele da Aula 1</td>
</tr>
</tbody>
</table></div>
<p>Exemplo com o modelo completo: <code>n = 300</code>, <code>p = 5</code> e <code>R² = 0,937</code>. A conta
dá <code>R²</code> ajustado de 0,936. A diferença é pequena porque as cinco variáveis
são boas. Encha o modelo de colunas sorteadas e a diferença cresce.</p>
<p>A regra prática: se você adicionou uma variável e o <code>R²</code> ajustado caiu,
essa variável não estava pagando o próprio custo.</p>
<h2 id="separe-treino-e-teste">Separe treino e teste<a class="ancora" href="#separe-treino-e-teste" aria-label="Link para esta secao">#</a></h2>
<p>A seção anterior mostrou o <code>R²</code> ajustado como diagnóstico. Ele ajuda, e não
resolve. O jeito direto de saber se um modelo presta é guardar dados que
ele nunca viu.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="kn">from</span><span class="w"> </span><span class="nn">sklearn.model_selection</span><span class="w"> </span><span class="kn">import</span> <span class="n">train_test_split</span>

<span class="n">treino_x</span><span class="p">,</span> <span class="n">teste_x</span><span class="p">,</span> <span class="n">treino_y</span><span class="p">,</span> <span class="n">teste_y</span> <span class="o">=</span> <span class="n">train_test_split</span><span class="p">(</span>
    <span class="n">tabela</span><span class="p">,</span> <span class="n">dados</span><span class="p">[</span><span class="s2">"aluguel"</span><span class="p">],</span> <span class="n">test_size</span><span class="o">=</span><span class="mf">0.3</span><span class="p">,</span> <span class="n">random_state</span><span class="o">=</span><span class="mi">42</span><span class="p">)</span>
</code></pre></div>
<p>Você treina com 70% dos apartamentos e mede com os outros 30%. A regra é
simples e não tem exceção: <strong>o modelo nunca pode ver os dados de teste
durante o treino</strong>. Se ele vir, a medida deixa de valer.</p>
<p>Com essa separação, dá para enxergar o problema que o <code>R²</code> ajustado só
apontava de longe. Comece com as 5 colunas boas e vá enchendo o modelo de
colunas de números sorteados:</p>
<figure><img src="docs/assets/aula-02/sobreajuste.png" alt="À esquerda, duas curvas de R² conforme colunas sorteadas entram: a de treino sobe e a de teste desce; à direita, barras mostrando o erro no teste subindo de R$ 187 para R$ 221"><figcaption>As colunas novas são números sorteados. Elas não sabem nada sobre aluguel, e mesmo assim o modelo as usa.</figcaption></figure>

<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Colunas sorteadas</th>
  <th><code>R²</code> no treino</th>
  <th><code>R²</code> no teste</th>
  <th>Erro no teste</th>
</tr>
</thead>
<tbody>
<tr>
  <td>nenhuma</td>
  <td>0,931</td>
  <td>0,947</td>
  <td>R$ 187</td>
</tr>
<tr>
  <td>10</td>
  <td>0,935</td>
  <td>0,944</td>
  <td>R$ 192</td>
</tr>
<tr>
  <td>20</td>
  <td>0,938</td>
  <td>0,939</td>
  <td>R$ 199</td>
</tr>
<tr>
  <td>40</td>
  <td>0,947</td>
  <td><strong>0,927</strong></td>
  <td><strong>R$ 221</strong></td>
</tr>
</tbody>
</table></div>
<p>Leia as duas colunas do meio na horizontal. O <code>R²</code> de treino <strong>sobe</strong> de
0,931 para 0,947, e o de teste <strong>desce</strong> de 0,947 para 0,927. O modelo
está ficando melhor no que já viu e pior no que importa.</p>
<p>Isso tem nome: <strong>sobreajuste</strong> (<em>overfitting</em>). O modelo decorou o ruído
das 210 linhas de treino em vez de aprender a regra.</p>
<h2 id="regularizacao-um-freio-nos-coeficientes">Regularização: um freio nos coeficientes<a class="ancora" href="#regularizacao-um-freio-nos-coeficientes" aria-label="Link para esta secao">#</a></h2>
<p>Por que o modelo usa colunas que não sabem nada? Porque nada o impede. O
gradiente descendente só tem uma ordem: minimize o erro no treino. Se dar
um coeficiente de 40 reais a uma coluna sorteada tira um centavo do erro,
ele dá.</p>
<p>A <strong>regularização</strong> muda a ordem. Em vez de &quot;minimize o erro&quot;, ela diz
&quot;minimize o erro <strong>e</strong> mantenha os coeficientes pequenos&quot;:</p>
<div class="formula" title="\text{custo} = \text{MSE} + \alpha \cdot \text{penalidade}(w)"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>custo</mtext><mo>&#x0003D;</mo><mtext>MSE</mtext><mo>&#x0002B;</mo><mi>&#x003B1;</mi><mo>&#x000B7;</mo><mtext>penalidade</mtext><mo stretchy="false">&#x00028;</mo><mi>w</mi><mo stretchy="false">&#x00029;</mo></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td>MSE</td>
  <td>o erro de sempre, o que o modelo já minimizava</td>
</tr>
<tr>
  <td>penalidade</td>
  <td>um número que cresce quando os coeficientes crescem</td>
</tr>
<tr>
  <td><code>α</code></td>
  <td>a força do freio: 0 desliga, quanto maior mais aperta</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: com <code>α = 0</code>, o custo é só o MSE e nada muda. Com <code>α</code> gigante,
compensa zerar todos os coeficientes e prever a média para todo mundo. O
valor útil está no meio, e quem escolhe é a validação cruzada.</p>
<p>O scikit-learn traz três penalidades, e a diferença entre elas está só na
conta do &quot;penalidade(w)&quot;.</p>
<h3 id="ridge-encolhe-tudo">Ridge: encolhe tudo<a class="ancora" href="#ridge-encolhe-tudo" aria-label="Link para esta secao">#</a></h3>
<div class="formula" title="\text{penalidade} = \sum_{j=1}^{p} w_j^2"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>penalidade</mtext><mo>&#x0003D;</mo><msubsup><mo>&#x02211;</mo><mrow><mi>j</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>p</mi></mrow></msubsup><msubsup><mi>w</mi><mi>j</mi><mn>2</mn></msubsup></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>wⱼ²</code></td>
  <td>o coeficiente da variável <code>j</code>, elevado ao quadrado</td>
</tr>
<tr>
  <td><code>Σ</code></td>
  <td>some para todas as <code>p</code> variáveis do modelo</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: um coeficiente de 10 contribui com 100 para a penalidade, e um de
1 contribui com 1. Cortar o de 10 pela metade economiza 75; cortar o de 1
pela metade economiza 0,75. Cem vezes menos.</p>
<p>É por isso que o Ridge <strong>espreme os grandes</strong> e deixa os pequenos quase em
paz. E é por isso que nenhum chega a zero: quanto menor o coeficiente,
menor o prêmio por encolher mais um pouco. Sempre sobra um pouquinho.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="kn">from</span><span class="w"> </span><span class="nn">sklearn.linear_model</span><span class="w"> </span><span class="kn">import</span> <span class="n">RidgeCV</span>
<span class="n">modelo</span> <span class="o">=</span> <span class="n">RidgeCV</span><span class="p">(</span><span class="n">alphas</span><span class="o">=</span><span class="n">np</span><span class="o">.</span><span class="n">logspace</span><span class="p">(</span><span class="o">-</span><span class="mi">2</span><span class="p">,</span> <span class="mi">3</span><span class="p">,</span> <span class="mi">60</span><span class="p">))</span><span class="o">.</span><span class="n">fit</span><span class="p">(</span><span class="n">treino_x</span><span class="p">,</span> <span class="n">treino_y</span><span class="p">)</span>
</code></pre></div>
<h3 id="lasso-corta">Lasso: corta<a class="ancora" href="#lasso-corta" aria-label="Link para esta secao">#</a></h3>
<div class="formula" title="\text{penalidade} = \sum_{j=1}^{p} \left| w_j \right|"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>penalidade</mtext><mo>&#x0003D;</mo><msubsup><mo>&#x02211;</mo><mrow><mi>j</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>p</mi></mrow></msubsup><mrow><mo stretchy="true" fence="true" form="prefix">&#x0007C;</mo><msub><mi>w</mi><mi>j</mi></msub><mo stretchy="true" fence="true" form="postfix">&#x0007C;</mo></mrow></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>\|wⱼ\|</code></td>
  <td>o coeficiente da variável <code>j</code>, sem o sinal</td>
</tr>
<tr>
  <td><code>Σ</code></td>
  <td>some para todas as <code>p</code> variáveis do modelo</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: cortar um coeficiente de 0,2 para 0 economiza 0,2 na penalidade.
Cortar um de 10,2 para 10 economiza os mesmos 0,2. O desconto é o mesmo,
não importa o tamanho.</p>
<p>Aí está a diferença inteira. Sem prêmio maior para os grandes, o freio
empurra os coeficientes inúteis <strong>até zero</strong>, e a coluna sai do modelo.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="kn">from</span><span class="w"> </span><span class="nn">sklearn.linear_model</span><span class="w"> </span><span class="kn">import</span> <span class="n">LassoCV</span>
<span class="n">modelo</span> <span class="o">=</span> <span class="n">LassoCV</span><span class="p">(</span><span class="n">alphas</span><span class="o">=</span><span class="n">np</span><span class="o">.</span><span class="n">logspace</span><span class="p">(</span><span class="o">-</span><span class="mi">2</span><span class="p">,</span> <span class="mi">3</span><span class="p">,</span> <span class="mi">60</span><span class="p">),</span> <span class="n">cv</span><span class="o">=</span><span class="mi">5</span><span class="p">)</span><span class="o">.</span><span class="n">fit</span><span class="p">(</span><span class="n">treino_x</span><span class="p">,</span> <span class="n">treino_y</span><span class="p">)</span>
</code></pre></div>
<figure><img src="docs/assets/aula-02/regularizacao.png" alt="Dois painéis com os 45 coeficientes conforme o alfa cresce: no Ridge todas as linhas se aproximam de zero sem chegar, no Lasso as linhas cinzas tocam o zero uma a uma"><figcaption>Em vermelho, as 5 colunas de verdade. Em cinza, as 40 sorteadas. A linha tracejada é o α escolhido por validação cruzada.</figcaption></figure>

<p>Repare no painel da direita: as linhas cinzas tocam o zero e ficam lá. No
α escolhido, o Lasso zerou 27 das 45 colunas, e quase todas eram ruído.</p>
<h3 id="elasticnet-os-dois-juntos">ElasticNet: os dois juntos<a class="ancora" href="#elasticnet-os-dois-juntos" aria-label="Link para esta secao">#</a></h3>
<div class="formula" title="\text{penalidade} = \rho \sum_{j=1}^{p} \left| w_j \right| + \frac{1 - \rho}{2}\sum_{j=1}^{p} w_j^2"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>penalidade</mtext><mo>&#x0003D;</mo><mi>&#x003C1;</mi><msubsup><mo>&#x02211;</mo><mrow><mi>j</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>p</mi></mrow></msubsup><mrow><mo stretchy="true" fence="true" form="prefix">&#x0007C;</mo><msub><mi>w</mi><mi>j</mi></msub><mo stretchy="true" fence="true" form="postfix">&#x0007C;</mo></mrow><mo>&#x0002B;</mo><mfrac><mrow><mn>1</mn><mo>&#x02212;</mo><mi>&#x003C1;</mi></mrow><mrow><mn>2</mn></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>j</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>p</mi></mrow></msubsup><msubsup><mi>w</mi><mi>j</mi><mn>2</mn></msubsup></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>ρ</code> (o <code>l1_ratio</code>)</td>
  <td>quanto da penalidade é Lasso: 1 é Lasso puro, 0 é Ridge puro</td>
</tr>
<tr>
  <td><code>α</code></td>
  <td>a força do freio, como antes</td>
</tr>
</tbody>
</table></div>
<p>Ele existe por um motivo prático. Quando duas colunas andam muito juntas
(a área e os quartos, com correlação de 0,82), o Lasso costuma escolher
uma e zerar a outra, meio ao acaso. O ElasticNet segura as duas.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="kn">from</span><span class="w"> </span><span class="nn">sklearn.linear_model</span><span class="w"> </span><span class="kn">import</span> <span class="n">ElasticNetCV</span>
<span class="n">modelo</span> <span class="o">=</span> <span class="n">ElasticNetCV</span><span class="p">(</span><span class="n">alphas</span><span class="o">=</span><span class="n">np</span><span class="o">.</span><span class="n">logspace</span><span class="p">(</span><span class="o">-</span><span class="mi">2</span><span class="p">,</span> <span class="mi">3</span><span class="p">,</span> <span class="mi">60</span><span class="p">),</span>
                      <span class="n">l1_ratio</span><span class="o">=</span><span class="p">[</span><span class="mf">0.1</span><span class="p">,</span> <span class="mf">0.5</span><span class="p">,</span> <span class="mf">0.9</span><span class="p">,</span> <span class="mf">1.0</span><span class="p">],</span> <span class="n">cv</span><span class="o">=</span><span class="mi">5</span><span class="p">)</span><span class="o">.</span><span class="n">fit</span><span class="p">(</span><span class="n">treino_x</span><span class="p">,</span> <span class="n">treino_y</span><span class="p">)</span>
</code></pre></div>
<h2 id="o-resultado-nos-90-apartamentos-de-teste">O resultado, nos 90 apartamentos de teste<a class="ancora" href="#o-resultado-nos-90-apartamentos-de-teste" aria-label="Link para esta secao">#</a></h2>
<p>Com as 5 colunas boas mais 40 sorteadas:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Modelo</th>
  <th><code>α</code> escolhido</th>
  <th><code>R²</code> no teste</th>
  <th>Erro no teste</th>
  <th>Colunas zeradas</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Sem freio</td>
  <td>—</td>
  <td>0,927</td>
  <td>R$ 221</td>
  <td>0 de 45</td>
</tr>
<tr>
  <td>RidgeCV</td>
  <td>4,24</td>
  <td>0,927</td>
  <td>R$ 220</td>
  <td>0 de 45</td>
</tr>
<tr>
  <td>LassoCV</td>
  <td>16,61</td>
  <td><strong>0,941</strong></td>
  <td><strong>R$ 197</strong></td>
  <td><strong>27 de 45</strong></td>
</tr>
<tr>
  <td>ElasticNetCV</td>
  <td>16,61</td>
  <td>0,941</td>
  <td>R$ 197</td>
  <td>27 de 45</td>
</tr>
</tbody>
</table></div>
<p>Três coisas para ler nessa tabela, e as três são honestas.</p>
<p><strong>O Ridge quase não ajudou.</strong> Ele encolheu os coeficientes do ruído (a soma
deles caiu de 668 para 660), e isso não bastou. Quando o problema é
<em>coluna que não deveria estar ali</em>, encolher não resolve: precisa cortar.</p>
<p><strong>O Lasso ajudou de verdade.</strong> O erro caiu de R$ 221 para R$ 197, e a soma
dos coeficientes do ruído desabou de 668 para 186.</p>
<p><strong>O ElasticNet deu exatamente o mesmo resultado do Lasso.</strong> Não é
coincidência: deixando ele escolher o <code>l1_ratio</code> entre 0,1 e 1,0, ele
escolheu <strong>1,0</strong>, que é Lasso puro. Ou seja, perguntamos ao modelo qual
ferramenta usar, e ele respondeu.</p>
<div class="destaque destaque-success" role="note"><div class="destaque-icone" aria-hidden="true">✓</div><div class="destaque-corpo"><p class="destaque-rotulo">Dica</p><p><strong>E se as colunas forem todas boas?</strong></p>
<p>Repetimos tudo sem as colunas sorteadas, só com as 5 de verdade. O <code>R²</code> de
teste deu 0,9470 nos três modelos, e o <code>LassoCV</code> escolheu <code>α = 0,01</code>, quase
zero. Regularização não é imposto: quando não há o que cortar, ela se
desliga sozinha. É por isso que dá para usar as versões <code>CV</code> por padrão.</p>
</div></div>
<h2 id="padronizar-antes-de-regularizar">Padronizar antes de regularizar<a class="ancora" href="#padronizar-antes-de-regularizar" aria-label="Link para esta secao">#</a></h2>
<p>O freio olha o <strong>tamanho</strong> dos coeficientes. E o tamanho de um coeficiente
depende da unidade da variável, não da importância dela.</p>
<p>A área está em metros quadrados, então o coeficiente dela é R$ 25 por
unidade. Se estivesse em hectares, o mesmo efeito viraria um coeficiente
de R$ 250.000. Nada mudou no mundo, e o freio passaria a odiar essa
coluna.</p>
<p>Veja o estrago no nosso caso. O mesmo Lasso, com e sem padronizar:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Coluna</th>
  <th>Sem padronizar</th>
  <th>Padronizado</th>
</tr>
</thead>
<tbody>
<tr>
  <td>área</td>
  <td>29,20</td>
  <td><strong>646,13</strong></td>
</tr>
<tr>
  <td>quartos</td>
  <td>52,48</td>
  <td>186,24</td>
</tr>
<tr>
  <td>idade</td>
  <td>−10,43</td>
  <td>−63,71</td>
</tr>
<tr>
  <td>Jardins</td>
  <td><strong>643,51</strong></td>
  <td>335,23</td>
</tr>
<tr>
  <td>Vila Nova</td>
  <td>−188,25</td>
  <td>−111,01</td>
</tr>
</tbody>
</table></div>
<p>Sem padronizar, o bairro Jardins parece a variável mais forte do modelo e a
área parece a mais fraca. Padronizado, a ordem se inverte: a área é a mais
forte, com folga. A primeira leitura é um artefato de unidade.</p>
<p>A correção é uma linha, e ela vem antes do modelo:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="kn">from</span><span class="w"> </span><span class="nn">sklearn.preprocessing</span><span class="w"> </span><span class="kn">import</span> <span class="n">StandardScaler</span>

<span class="n">escala</span> <span class="o">=</span> <span class="n">StandardScaler</span><span class="p">()</span><span class="o">.</span><span class="n">fit</span><span class="p">(</span><span class="n">treino_x</span><span class="p">)</span>
<span class="n">treino_padronizado</span> <span class="o">=</span> <span class="n">escala</span><span class="o">.</span><span class="n">transform</span><span class="p">(</span><span class="n">treino_x</span><span class="p">)</span>
<span class="n">teste_padronizado</span> <span class="o">=</span> <span class="n">escala</span><span class="o">.</span><span class="n">transform</span><span class="p">(</span><span class="n">teste_x</span><span class="p">)</span>
</code></pre></div>
<p>Repare que o <code>fit</code> usa <strong>só o treino</strong>. Depois você aplica a mesma escala
no teste. Calcular a média e o desvio com os dados de teste juntos é
deixar o modelo espiar o que ele não deveria ver.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Rodar <code>Ridge</code> ou <code>Lasso</code> sem padronizar. O código funciona, não dá erro
nenhum, e o modelo passa a escolher o que cortar olhando a unidade de cada
coluna. Regressão comum não tem esse problema: só a regularizada tem.</p>
<p>Um detalhe que confunde muita gente: o <code>α</code> do <code>Ridge</code> e o do <code>Lasso</code> não
significam a mesma coisa, porque as duas classes normalizam a conta de
formas diferentes. Nunca compare os dois pelo número do <code>α</code>, e prefira as
versões <code>RidgeCV</code>, <code>LassoCV</code> e <code>ElasticNetCV</code>, que escolhem sozinhas.</p>
</div></div>
<h2 id="qual-dos-tres-usar">Qual dos três usar<a class="ancora" href="#qual-dos-tres-usar" aria-label="Link para esta secao">#</a></h2>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Situação</th>
  <th>Escolha</th>
</tr>
</thead>
<tbody>
<tr>

</tr>
<tr>

  <td>Ridge</td>

<tr>

</table></div>
<p>E uma regra que vale mais que a tabela: <strong>compare no conjunto de teste</strong>.
As três versões <code>CV</code> custam uma linha cada, e a resposta certa é a que
erra menos nos dados que o modelo nunca viu.</p>
<h2 id="o-grafico-que-voce-olha-antes-de-confiar">O gráfico que você olha antes de confiar<a class="ancora" href="#o-grafico-que-voce-olha-antes-de-confiar" aria-label="Link para esta secao">#</a></h2>

<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>
<p>Você vai aprender a prever uma categoria em vez de um número, usando a
mesma soma de sempre esmagada pela função sigmoide. Vai aprender a ler os
coeficientes em chances, a escolher o limiar de decisão, e a medir acertos
com acurácia, precisão, recall e F1.</p>
</div></div>
<h2 id="para-que-serve">Para que serve<a class="ancora" href="#para-que-serve" aria-label="Link para esta secao">#</a></h2>
<p>Uma empresa de streaming quer saber quem está prestes a cancelar. Não
adianta descobrir depois: quando o cliente cancela, ele já foi. A pergunta
útil é outra. Quem, entre os clientes de hoje, tem mais chance de cancelar
no mês que vem?</p>
<p>Essa pergunta não pede um número como preço ou aluguel. Ela pede uma
resposta de duas opções: cancela ou não cancela. Chamamos isso de
<strong>classificação</strong>, e o modelo mais simples para resolver é a <strong>regressão
logística</strong>.</p>
<p>O dataset desta aula tem 400 clientes, com quatro informações sobre cada
um: tempo de casa, valor mensal, chamados ao suporte e plano. A coluna
<code>cancelou</code> vale 1 para quem cancelou e 0 para quem ficou. No total, 36%
cancelaram.</p>
<h2 id="por-que-a-reta-nao-serve">Por que a reta não serve<a class="ancora" href="#por-que-a-reta-nao-serve" aria-label="Link para esta secao">#</a></h2>
<p>A tentação é usar a regressão da Aula 1, com 0 e 1 no lugar do preço. Veja
o que acontece.</p>
<figure><img src="docs/assets/aula-03/por_que_nao_reta.png" alt="Gráfico com pontos em 0 e em 1 e uma reta atravessando, passando abaixo de zero à esquerda e acima de um à direita"><figcaption>A reta não sabe que existe um teto em 1 e um chão em 0.</figcaption></figure>

<p>A reta não tem freio. Para quem nunca ligou para o suporte, ela prevê um
valor negativo. Para quem ligou seis vezes, prevê mais que 1. Probabilidade
negativa não existe, e probabilidade acima de 100% também não.</p>
<p>Precisamos de uma função que aceite qualquer número na entrada e devolva
sempre algo entre 0 e 1.</p>
<h2 id="a-funcao-sigmoide">A função sigmoide<a class="ancora" href="#a-funcao-sigmoide" aria-label="Link para esta secao">#</a></h2>
<p>Essa função existe, tem formato de S, e se chama <strong>sigmoide</strong>.</p>
<div class="formula" title="\sigma(z) = \frac{1}{1 + e^{-z}}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>&#x003C3;</mi><mo stretchy="false">&#x00028;</mo><mi>z</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>1</mn><mo>&#x0002B;</mo><msup><mi>e</mi><mrow><mo>&#x02212;</mo><mi>z</mi></mrow></msup></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>σ</code></td>
  <td>a letra grega sigma minúscula, o nome da função</td>
</tr>
<tr>
  <td><code>z</code></td>
  <td>qualquer número, positivo ou negativo, que entra na função</td>
</tr>
<tr>
  <td><code>e</code></td>
  <td>o número de Euler, aproximadamente 2,718</td>
</tr>
<tr>
  <td><code>σ(z)</code></td>
  <td>o resultado, sempre entre 0 e 1: uma probabilidade</td>
</tr>
</tbody>
</table></div>
<figure><img src="docs/assets/aula-03/sigmoide.png" alt="Curva em formato de S que sobe de zero até um, cruzando 0,5 quando z vale zero"><figcaption>Qualquer número entra; sempre sai algo entre 0 e 1.</figcaption></figure>

<p>Três exemplos para pegar o jeito. Com <code>z = 0</code>, a conta dá <code>1/(1+1) = 0,5</code>.
Com <code>z = 2</code>, dá 0,88. Com <code>z = −2</code>, dá 0,12. Números bem grandes chegam
perto de 1 sem nunca encostar, e bem negativos chegam perto de 0 pelo
mesmo motivo.</p>
<p>Por que essa curva, e não qualquer outra em formato de S? Duas razões
honestas. A primeira é conveniência: a derivada dela é simples, e o
gradiente descendente da Aula 1 agradece. A segunda é a que importa para
você: com essa curva, cada coeficiente ganha uma leitura em chances de
aposta, que aparece daqui a pouco. Outras curvas em S existem, e não têm
essa leitura.</p>
<h2 id="o-modelo-logistico">O modelo logístico<a class="ancora" href="#o-modelo-logistico" aria-label="Link para esta secao">#</a></h2>
<p>Agora junte as duas peças. A soma de sempre produz o <code>z</code>, e a sigmoide
transforma esse <code>z</code> em probabilidade.</p>
<div class="formula" title="P(\text{cancelar}) = \sigma(z) \qquad \text{com} \qquad z = w_0 + w_1 x_1 + \dots + w_p x_p"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>P</mi><mo stretchy="false">&#x00028;</mo><mtext>cancelar</mtext><mo stretchy="false">&#x00029;</mo><mo>&#x0003D;</mo><mi>&#x003C3;</mi><mo stretchy="false">&#x00028;</mo><mi>z</mi><mo stretchy="false">&#x00029;</mo><mspace width="2em" /><mtext>com</mtext><mspace width="2em" /><mi>z</mi><mo>&#x0003D;</mo><msub><mi>w</mi><mn>0</mn></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>1</mn></msub><msub><mi>x</mi><mn>1</mn></msub><mo>&#x0002B;</mo><mo>&#x02026;</mo><mo>&#x0002B;</mo><msub><mi>w</mi><mi>p</mi></msub><msub><mi>x</mi><mi>p</mi></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>P(cancelar)</code></td>
  <td>a probabilidade de o cliente cancelar, de 0 a 1</td>
</tr>
<tr>
  <td><code>z</code></td>
  <td>a mesma soma da Aula 2, sem nenhuma novidade</td>
</tr>
<tr>
  <td><code>xⱼ</code>, <code>wⱼ</code></td>
  <td>a informação do cliente e o peso dela</td>
</tr>
</tbody>
</table></div>
<p>A parte de dentro é idêntica à regressão múltipla. O que muda é a casca:
antes o resultado da soma era a previsão; agora ele passa pela sigmoide e
vira probabilidade.</p>
<p>O treino também segue a mesma receita: uma função de perda e gradiente
descendente. A perda deixa de ser o MSE e passa a ser a <em>log loss</em>, que
pune com força quem erra com muita confiança. A ideia de descer a serra
não muda em nada.</p>
<p>Veja a curva ajustada usando só os chamados ao suporte:</p>
<figure><img src="docs/assets/aula-03/probabilidade_chamados.png" alt="Curva em S subindo com o número de chamados ao suporte, com pontos amarelos marcando a taxa real de cancelamento de cada grupo"><figcaption>Os pontos amarelos são a taxa real de cada grupo. A curva passa por eles.</figcaption></figure>

<h2 id="interpretando-os-coeficientes">Interpretando os coeficientes<a class="ancora" href="#interpretando-os-coeficientes" aria-label="Link para esta secao">#</a></h2>
<p>Estes são os pesos que o modelo desta aula encontrou:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Variável</th>
  <th>Coeficiente</th>
  <th>Direção</th>
</tr>
</thead>
<tbody>
<tr>
  <td>tempo de casa (meses)</td>
  <td>−0,079</td>
  <td>mais tempo de casa, menos risco</td>
</tr>
<tr>
  <td>valor mensal (R$)</td>
  <td>+0,011</td>
  <td>mais caro, mais risco</td>
</tr>
<tr>
  <td>chamados ao suporte</td>
  <td>+0,996</td>
  <td>cada chamado aumenta bastante o risco</td>
</tr>
<tr>
  <td>plano Padrão (vs. Básico)</td>
  <td>−0,184</td>
  <td>risco um pouco menor</td>
</tr>
<tr>
  <td>plano Premium (vs. Básico)</td>
  <td>−0,505</td>
  <td>risco bem menor</td>
</tr>
</tbody>
</table></div>
<p>O sinal você já sabe ler: positivo empurra a probabilidade para cima,
negativo puxa para baixo. O tamanho é que engana. O coeficiente não soma
probabilidade, porque a sigmoide não é reta. Ele soma no <code>z</code>, e o efeito
no fim depende de onde o cliente já estava.</p>
<p>Existe uma leitura exata, e ela usa <strong>chances</strong> (<em>odds</em>), no sentido de
aposta: 3 para 1, 1 para 2.</p>
<div class="formula" title="\frac{p}{1 - p} = e^{z}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mfrac><mrow><mi>p</mi></mrow><mrow><mn>1</mn><mo>&#x02212;</mo><mi>p</mi></mrow></mfrac><mo>&#x0003D;</mo><msup><mi>e</mi><mrow><mi>z</mi></mrow></msup></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>p</code></td>
  <td>a probabilidade de cancelar</td>
</tr>
<tr>
  <td><code>1 − p</code></td>
  <td>a probabilidade de ficar</td>
</tr>
<tr>
  <td><code>p / (1 − p)</code></td>
  <td>a chance: quantas vezes cancelar é mais provável que ficar</td>
</tr>
</tbody>
</table></div>
<p>Com essa forma, cada coeficiente ganha uma tradução simples. Somar 1 na
variável <code>xⱼ</code> multiplica a chance por <code>e</code> elevado a <code>wⱼ</code>.</p>
<p>Exemplo com os chamados ao suporte, cujo coeficiente é 0,996. O número <code>e</code>
elevado a 0,996 dá 2,71. Ou seja: cada chamado a mais <strong>multiplica por
2,7 a chance de o cliente cancelar</strong>, com tudo o mais parado. Para o tempo
de casa, <code>e</code> elevado a −0,079 dá 0,92: cada mês a mais multiplica a chance
por 0,92, que é o mesmo que reduzir 8%.</p>
<p>Dois clientes de verdade, calculados com esse modelo:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Cliente</th>
  <th>Perfil</th>
  <th>Probabilidade</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Em risco</td>
  <td>6 meses de casa, R$ 130, 3 chamados, Premium</td>
  <td>0,95</td>
</tr>
<tr>
  <td>Tranquilo</td>
  <td>36 meses de casa, R$ 40, 0 chamados, Básico</td>
  <td>0,05</td>
</tr>
</tbody>
</table></div>
<h2 id="da-probabilidade-a-decisao">Da probabilidade à decisão<a class="ancora" href="#da-probabilidade-a-decisao" aria-label="Link para esta secao">#</a></h2>
<p>O modelo devolve uma probabilidade, mas a equipe de retenção precisa de
uma lista de nomes. Alguém tem que decidir onde cortar. Esse ponto de
corte se chama <strong>limiar</strong> (<em>threshold</em>).</p>
<figure><img src="docs/assets/aula-03/limiar.png" alt="Clientes espalhados por probabilidade prevista, separados em duas faixas conforme cancelaram ou não, com duas linhas verticais marcando os limiares de 0,3 e 0,5"><figcaption>Cada ponto é um cliente. Mover a linha muda quem entra na lista de risco.</figcaption></figure>

<p>O limiar padrão é 0,5, mas ele não tem nada de sagrado. Ele só é o padrão
porque é o meio. Escolher o limiar é uma decisão de negócio, e a próxima
seção mostra o que se ganha e o que se perde ao mexer nele.</p>
<h2 id="a-matriz-de-confusao">A matriz de confusão<a class="ancora" href="#a-matriz-de-confusao" aria-label="Link para esta secao">#</a></h2>
<p>Antes das métricas, o quadro que gera todas elas. Com o limiar em 0,5, os
400 clientes se distribuem assim:</p>
<figure><img src="docs/assets/aula-03/matriz_confusao.png" alt="Matriz dois por dois com 218 verdadeiros negativos, 37 falsos positivos, 64 falsos negativos e 81 verdadeiros positivos"><figcaption>As quatro caixas em que todo cliente cai.</figcaption></figure>

<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Caixa</th>
  <th>Quantos</th>
  <th>O que aconteceu</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Verdadeiro positivo (VP)</td>
  <td>81</td>
  <td>o modelo avisou e o cliente cancelou</td>
</tr>
<tr>
  <td>Falso positivo (FP)</td>
  <td>37</td>
  <td>o modelo avisou e o cliente ficou</td>
</tr>
<tr>
  <td>Falso negativo (FN)</td>
  <td>64</td>
  <td>o modelo não avisou e o cliente cancelou</td>
</tr>
<tr>
  <td>Verdadeiro negativo (VN)</td>
  <td>218</td>
  <td>o modelo não avisou e o cliente ficou</td>
</tr>
</tbody>
</table></div>
<p>Os dois erros custam coisas diferentes. Um falso positivo gasta um cupom
de desconto com quem ia ficar de qualquer jeito. Um falso negativo perde o
cliente. Qual dos dois dói mais é uma pergunta da empresa, não da
estatística.</p>
<h2 id="as-quatro-metricas">As quatro métricas<a class="ancora" href="#as-quatro-metricas" aria-label="Link para esta secao">#</a></h2>
<h3 id="acuracia-a-fracao-de-acertos">Acurácia: a fração de acertos<a class="ancora" href="#acuracia-a-fracao-de-acertos" aria-label="Link para esta secao">#</a></h3>
<div class="formula" title="\text{acurácia} = \frac{VP + VN}{VP + VN + FP + FN}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>acurácia</mtext><mo>&#x0003D;</mo><mfrac><mrow><mi>V</mi><mi>P</mi><mo>&#x0002B;</mo><mi>V</mi><mi>N</mi></mrow><mrow><mi>V</mi><mi>P</mi><mo>&#x0002B;</mo><mi>V</mi><mi>N</mi><mo>&#x0002B;</mo><mi>F</mi><mi>P</mi><mo>&#x0002B;</mo><mi>F</mi><mi>N</mi></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td>numerador</td>
  <td>os acertos: avisou e cancelou, ou não avisou e ficou</td>
</tr>
<tr>
  <td>denominador</td>
  <td>todos os clientes</td>
</tr>
</tbody>
</table></div>
<p>No nosso caso: <code>(81 + 218) / 400 = 0,75</code>. O modelo acerta 75% das vezes.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Comemorar uma acurácia de 75% sem olhar mais nada. Neste dataset, 64% dos
clientes não cancelaram. Um modelo preguiçoso que responde &quot;ninguém
cancela&quot; para todo mundo acerta 64% e não serve para nada. A acurácia
sozinha não distingue esse modelo do seu. Sempre compare a acurácia com a
taxa da classe mais comum, e sempre olhe as outras métricas.</p>
</div></div>
<h3 id="precisao-e-recall">Precisão e recall<a class="ancora" href="#precisao-e-recall" aria-label="Link para esta secao">#</a></h3>
<div class="formula" title="\text{precisão} = \frac{VP}{VP + FP} \qquad \text{recall} = \frac{VP}{VP + FN}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>precisão</mtext><mo>&#x0003D;</mo><mfrac><mrow><mi>V</mi><mi>P</mi></mrow><mrow><mi>V</mi><mi>P</mi><mo>&#x0002B;</mo><mi>F</mi><mi>P</mi></mrow></mfrac><mspace width="2em" /><mtext>recall</mtext><mo>&#x0003D;</mo><mfrac><mrow><mi>V</mi><mi>P</mi></mrow><mrow><mi>V</mi><mi>P</mi><mo>&#x0002B;</mo><mi>F</mi><mi>N</mi></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td>precisão</td>
  <td>dos clientes que o modelo apontou, quantos realmente cancelaram</td>
</tr>
<tr>
  <td>recall</td>
  <td>dos clientes que cancelaram, quantos o modelo conseguiu apontar</td>
</tr>
<tr>
  <td><code>VP</code>, <code>FP</code>, <code>FN</code></td>
  <td>as caixas da matriz de confusão</td>
</tr>
</tbody>
</table></div>
<p>No nosso caso: precisão de <code>81 / 118 = 0,69</code> e recall de <code>81 / 145 = 0,56</code>.
Traduzindo: quando o modelo aponta alguém, ele acerta 69% das vezes; e ele
pega 56% de todos os cancelamentos que aconteceram.</p>
<p>Repare que as duas respondem a perguntas diferentes. Precisão é sobre a
lista que você gerou. Recall é sobre o problema inteiro que existe lá
fora.</p>
<h3 id="f1-as-duas-num-numero-so">F1: as duas num número só<a class="ancora" href="#f1-as-duas-num-numero-so" aria-label="Link para esta secao">#</a></h3>
<div class="formula" title="F_1 = 2 \cdot \frac{\text{precisão} \cdot \text{recall}}{\text{precisão} + \text{recall}}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>F</mi><mn>1</mn></msub><mo>&#x0003D;</mo><mn>2</mn><mo>&#x000B7;</mo><mfrac><mrow><mtext>precisão</mtext><mo>&#x000B7;</mo><mtext>recall</mtext></mrow><mrow><mtext>precisão</mtext><mo>&#x0002B;</mo><mtext>recall</mtext></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>F₁</code></td>
  <td>a média harmônica entre precisão e recall</td>
</tr>
<tr>
  <td>média harmônica</td>
  <td>um tipo de média que puxa o resultado para o menor dos dois</td>
</tr>
</tbody>
</table></div>
<p>No nosso caso: <code>F₁ = 0,62</code>. O valor fica sempre entre a precisão e o
recall, e mais perto do pior dos dois. É por isso que ele serve como
número único: para o F1 subir, os dois precisam ir bem.</p>
<h2 id="escolhendo-o-limiar">Escolhendo o limiar<a class="ancora" href="#escolhendo-o-limiar" aria-label="Link para esta secao">#</a></h2>
<p>Agora junte tudo. Baixar o limiar significa avisar mais gente, o que pega
mais cancelamentos (recall sobe) e erra mais alarmes (precisão cai).</p>
<figure><img src="docs/assets/aula-03/metricas_vs_limiar.png" alt="Três curvas mostrando precisão subindo, recall descendo e F1 fazendo um arco conforme o limiar aumenta"><figcaption>Uma sobe, a outra desce. O F1 procura o equilíbrio entre as duas.</figcaption></figure>

<p>Compare os dois limiares no mesmo modelo:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Limiar</th>
  <th>Acurácia</th>
  <th>Precisão</th>
  <th>Recall</th>
  <th>F1</th>
  <th>Lista de risco</th>
</tr>
</thead>
<tbody>
<tr>
  <td>0,50</td>
  <td>0,75</td>
  <td>0,69</td>
  <td>0,56</td>
  <td>0,62</td>
  <td>118 clientes</td>
</tr>
<tr>
  <td>0,30</td>
  <td>0,72</td>
  <td>0,58</td>
  <td>0,84</td>
  <td>0,68</td>
  <td>212 clientes</td>
</tr>
</tbody>
</table></div>
<p>Baixar o limiar para 0,30 derrubou a acurácia e a precisão, e mesmo assim
foi a melhor escolha para este problema. Com 0,30, o modelo pega 84% dos
cancelamentos em vez de 56%. Se o cupom de desconto é barato e perder
cliente é caro, essa troca compensa.</p>
<p>A pergunta não é &quot;qual limiar é o correto&quot;. É &quot;qual erro custa mais caro
para nós&quot;.</p>
<h2 id="a-curva-roc-todos-os-limiares-de-uma-vez">A curva ROC: todos os limiares de uma vez<a class="ancora" href="#a-curva-roc-todos-os-limiares-de-uma-vez" aria-label="Link para esta secao">#</a></h2>
<p>A tabela acima compara dois limiares. Existem infinitos. A <strong>curva ROC</strong>
mostra todos ao mesmo tempo.</p>
<p>Ela é um gráfico de dois números, e os dois você já calculou:</p>
<div class="formula" title="\text{TPR} = \frac{VP}{VP + FN} \qquad \text{FPR} = \frac{FP}{FP + VN}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>TPR</mtext><mo>&#x0003D;</mo><mfrac><mrow><mi>V</mi><mi>P</mi></mrow><mrow><mi>V</mi><mi>P</mi><mo>&#x0002B;</mo><mi>F</mi><mi>N</mi></mrow></mfrac><mspace width="2em" /><mtext>FPR</mtext><mo>&#x0003D;</mo><mfrac><mrow><mi>F</mi><mi>P</mi></mrow><mrow><mi>F</mi><mi>P</mi><mo>&#x0002B;</mo><mi>V</mi><mi>N</mi></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td>TPR</td>
  <td>dos que cancelaram, quantos o modelo pegou. É o recall</td>
</tr>
<tr>
  <td>FPR</td>
  <td>dos que ficaram, quantos o modelo acusou à toa</td>
</tr>
<tr>
  <td><code>VP</code>, <code>FP</code>, <code>FN</code>, <code>VN</code></td>
  <td>as quatro caixas da matriz de confusão</td>
</tr>
</tbody>
</table></div>
<p>Exemplo, com o limiar em 0,50: o modelo pega 56% dos cancelamentos (TPR)
e acusa à toa 15% de quem ia ficar (FPR). Esse par vira um ponto. Varie o
limiar de 1 até 0, marque todos os pontos, e você tem a curva:</p>
<figure><img src="docs/assets/aula-03/roc.png" alt="À esquerda a curva ROC subindo acima da diagonal, com três pontos marcados nos limiares 0,7, 0,5 e 0,3; à direita dois histogramas sobrepostos das probabilidades dadas a quem ficou e a quem cancelou"><figcaption>Cada ponto da curva é um limiar. A área embaixo dela resume o modelo num número.</figcaption></figure>

<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Limiar</th>
  <th>TPR (pego dos que saíram)</th>
  <th>FPR (acuso dos que ficaram)</th>
</tr>
</thead>
<tbody>
<tr>
  <td>0,70</td>
  <td>30%</td>
  <td>5%</td>
</tr>
<tr>
  <td>0,50</td>
  <td>56%</td>
  <td>15%</td>
</tr>
<tr>
  <td>0,30</td>
  <td>84%</td>
  <td>35%</td>
</tr>
<tr>
  <td>0,20</td>
  <td>91%</td>
  <td>49%</td>
</tr>
</tbody>
</table></div>
<p>A diagonal tracejada é o modelo que chuta. Quanto mais a curva sobe em
direção ao canto de cima à esquerda, melhor: ali você pega muitos
cancelamentos incomodando pouca gente.</p>
<h3 id="auc-a-area-embaixo-da-curva">AUC: a área embaixo da curva<a class="ancora" href="#auc-a-area-embaixo-da-curva" aria-label="Link para esta secao">#</a></h3>
<p>O resumo da curva num número só é a <strong>AUC</strong> (<em>area under the curve</em>). A
nossa dá <strong>0,82</strong>. E ela tem uma leitura exata, que é a melhor coisa desta
seção:</p>
<blockquote>
<p>Sorteie um cliente que cancelou e um que ficou. A AUC é a probabilidade
de o modelo ter dado nota maior ao que cancelou.</p>
</blockquote>
<p>Isso não é analogia: é o que a AUC mede. Dá para conferir, e conferimos.
Sorteamos 200.000 pares desses e contamos: o cancelador recebeu nota maior
em <strong>82,3%</strong> das vezes. A AUC calculada pela fórmula é 82,3%.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>AUC</th>
  <th>O que significa</th>
</tr>
</thead>
<tbody>
<tr>
  <td>0,50</td>
  <td>o modelo ordena tão bem quanto uma moeda</td>
</tr>
<tr>
  <td>0,82</td>
  <td>o nosso: acerta a ordem em 4 de cada 5 pares</td>
</tr>
<tr>
  <td>1,00</td>
  <td>ordena perfeitamente, o que costuma ser sinal de vazamento</td>
</tr>
</tbody>
</table></div>
<p>O painel da direita da figura mostra a mesma coisa por outro ângulo: as
duas distribuições de probabilidade se sobrepõem bastante, e é essa
sobreposição que impede a AUC de subir mais.</p>
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>A vantagem e o limite da AUC</strong></p>
<p>Ela não depende de limiar nenhum, então serve para comparar modelos antes
de decidir a operação. E ela não depende de quantos casos positivos
existem, então não cai na armadilha da acurácia.</p>
<p>O limite é o outro lado da mesma moeda: <strong>a AUC só enxerga a ordem</strong>. Se
você somar 0,3 a todas as probabilidades, a ordem não muda e a AUC fica
idêntica, mesmo que os números virem mentira. É por isso que existe a
próxima seção.</p>
</div></div>
<h2 id="calibracao-a-probabilidade-e-um-numero-honesto">Calibração: a probabilidade é um número honesto?<a class="ancora" href="#calibracao-a-probabilidade-e-um-numero-honesto" aria-label="Link para esta secao">#</a></h2>
<p>O modelo diz que um cliente tem 30% de chance de cancelar. Pergunta justa:
de cem clientes a quem ele deu 30%, quantos cancelam de fato?</p>
<p>Se a resposta for perto de trinta, o modelo é <strong>calibrado</strong>. As
probabilidades dele são promessas que se cumprem, e você pode multiplicá-las
por dinheiro. Se a resposta for cinquenta, o número 30% é só um lugar na
fila, e não uma probabilidade.</p>
<p>Para conferir, agrupe os clientes por probabilidade prevista e compare com
o que aconteceu:</p>
<figure><img src="docs/assets/aula-03/calibracao.png" alt="À esquerda a curva de calibração do modelo acompanhando de perto a diagonal ideal; à direita a mesma curva comparada com a de um modelo com class_weight balanced, que fica bem acima da diagonal"><figcaption>Quanto mais perto da diagonal, mais honesta a probabilidade.</figcaption></figure>

<div class="tabela-rolavel"><table><thead>
<tr>
  <th>O modelo prometeu</th>
  <th>Cancelaram de fato</th>
</tr>
</thead>
<tbody>
<tr>
  <td>4,5%</td>
  <td>0,0%</td>
</tr>
<tr>
  <td>10,2%</td>
  <td>6,0%</td>
</tr>
<tr>
  <td>16,4%</td>
  <td>24,0%</td>
</tr>
<tr>
  <td>26,4%</td>
  <td>24,0%</td>
</tr>
<tr>
  <td>37,3%</td>
  <td>38,0%</td>
</tr>
<tr>
  <td>48,7%</td>
  <td>60,0%</td>
</tr>
<tr>
  <td>63,4%</td>
  <td>58,0%</td>
</tr>
<tr>
  <td>83,0%</td>
  <td>80,0%</td>
</tr>
</tbody>
</table></div>
<p>Não é perfeito, e é bom o suficiente. Repare que as duas piores linhas são
as de 16,4% e 48,7%, e que cada faixa dessas tem só cinquenta clientes: com
tão poucos, o &quot;aconteceu&quot; balança sozinho. É o mesmo motivo pelo qual você
não julga uma moeda por dez lançamentos.</p>
<p>A regressão logística costuma sair bem calibrada de fábrica, porque a
função de perda que ela minimiza pune exatamente a probabilidade errada.</p>
<h3 id="o-brier-calibracao-num-numero">O Brier: calibração num número<a class="ancora" href="#o-brier-calibracao-num-numero" aria-label="Link para esta secao">#</a></h3>
<div class="formula" title="\text{Brier} = \frac{1}{n}\sum_{i=1}^{n}(p_i - y_i)^2"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>Brier</mtext><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mo stretchy="false">&#x00028;</mo><msub><mi>p</mi><mi>i</mi></msub><mo>&#x02212;</mo><msub><mi>y</mi><mi>i</mi></msub><msup><mo stretchy="false">&#x00029;</mo><mn>2</mn></msup></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>pᵢ</code></td>
  <td>a probabilidade que o modelo deu ao cliente <code>i</code></td>
</tr>
<tr>
  <td><code>yᵢ</code></td>
  <td>o que aconteceu: 1 se cancelou, 0 se ficou</td>
</tr>
<tr>
  <td>resultado</td>
  <td>quanto menor, melhor; 0 seria a perfeição</td>
</tr>
</tbody>
</table></div>
<p>É o MSE da Aula 1, aplicado à probabilidade. O nosso dá <strong>0,165</strong>. Ele
sozinho não diz muito; ele serve para comparar duas versões do mesmo
modelo.</p>
<h3 id="o-que-quebra-a-calibracao">O que quebra a calibração<a class="ancora" href="#o-que-quebra-a-calibracao" aria-label="Link para esta secao">#</a></h3>
<p>Aqui está a demonstração que vale a seção inteira. Treinamos o mesmo
modelo com <code>class_weight=&quot;balanced&quot;</code>, uma opção comum para dar mais peso à
classe minoritária:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th></th>
  <th>AUC</th>
  <th>Brier</th>
  <th>Probabilidade média</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Normal</td>
  <td>0,8233</td>
  <td>0,165</td>
  <td>0,363</td>
</tr>
<tr>
  <td><code>class_weight=&quot;balanced&quot;</code></td>
  <td>0,8229</td>
  <td>0,173</td>
  <td>0,457</td>
</tr>
<tr>
  <td>A verdade</td>
  <td></td>
  <td></td>
  <td>0,362</td>
</tr>
</tbody>
</table></div>
<p>A AUC é praticamente idêntica: <strong>a ordenação não mudou nada</strong>. Mas a
probabilidade média saltou de 0,363 para 0,457, enquanto a taxa real de
cancelamento é 0,362. O segundo modelo passou a achar que quase metade da
base vai embora.</p>
<p>Se você usar esse modelo para ordenar uma lista de ligações, tanto faz. Se
usar para calcular quanto dinheiro está em risco, ele erra em 26%.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Usar <code>class_weight=&quot;balanced&quot;</code>, reamostragem ou SMOTE e depois tratar a
saída como probabilidade. Essas técnicas mudam de propósito a proporção de
classes que o modelo enxerga, e a probabilidade sai inflada. Elas não são
erradas: erradas são as contas de dinheiro feitas em cima delas.</p>
<p>O conserto se chama recalibração, e no scikit-learn é o
<code>CalibratedClassifierCV</code>. Um teste rápido antes: compare a probabilidade
média prevista com a taxa real. Se as duas não baterem, o modelo não está
calibrado.</p>
</div></div>
<h2 id="o-limiar-e-a-razao-entre-dois-custos">O limiar é a razão entre dois custos<a class="ancora" href="#o-limiar-e-a-razao-entre-dois-custos" aria-label="Link para esta secao">#</a></h2>
<p>Agora dá para fechar a decisão que ficou em aberto. Suponha, para o Clube:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Erro</th>
  <th>Custo</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Falso positivo: cupom para quem ia ficar</td>
  <td>R$ 20</td>
</tr>
<tr>
  <td>Falso negativo: cliente que foi embora</td>
  <td>R$ 300</td>
</tr>
</tbody>
</table></div>
<p>Com esses dois números, escolher o limiar deixa de ser opinião. Para cada
limiar, conte os dois erros e some o prejuízo:</p>
<div class="formula" title="\text{custo} = FP \cdot 20 + FN \cdot 300"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>custo</mtext><mo>&#x0003D;</mo><mi>F</mi><mi>P</mi><mo>&#x000B7;</mo><mn>20</mn><mo>&#x0002B;</mo><mi>F</mi><mi>N</mi><mo>&#x000B7;</mo><mn>300</mn></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>FP</code></td>
  <td>quantos falsos positivos aquele limiar produz</td>
</tr>
<tr>
  <td><code>FN</code></td>
  <td>quantos falsos negativos</td>
</tr>
<tr>
  <td>resultado</td>
  <td>o prejuízo total, em reais</td>
</tr>
</tbody>
</table></div>
<figure><img src="docs/assets/aula-03/custo_limiar.png" alt="Curva do custo total subindo com o limiar, com a faixa de menor custo sombreada entre 0,05 e 0,16, o mínimo marcado em 0,14 e o limiar padrão 0,50 marcado bem acima"><figcaption>O limiar padrão de 0,50 custa cinco vezes o melhor limiar.</figcaption></figure>

<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Estratégia</th>
  <th>Lista</th>
  <th>Custo</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Não ligar para ninguém</td>
  <td>0</td>
  <td>R$ 43.500</td>
</tr>
<tr>
  <td>Limiar padrão de 0,50</td>
  <td>118</td>
  <td>R$ 19.940</td>
</tr>
<tr>
  <td><strong>Melhor limiar (0,14)</strong></td>
  <td><strong>292</strong></td>
  <td><strong>R$ 3.900</strong></td>
</tr>
<tr>
  <td>Ligar para todo mundo</td>
  <td>400</td>
  <td>R$ 5.100</td>
</tr>
</tbody>
</table></div>
<p>Trocar 0,50 por 0,14 economiza <strong>R$ 16.040</strong>, e nenhuma linha do modelo
mudou. Só a régua de decisão.</p>
<p>Existe até uma conta fechada para o limiar ideal:</p>
<div class="formula" title="\text{limiar}^{*} = \frac{\text{custo}_{FP}}{\text{custo}_{FP} + \text{custo}_{FN}}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msup><mtext>limiar</mtext><mrow><mo>&#x0002A;</mo></mrow></msup><mo>&#x0003D;</mo><mfrac><mrow><msub><mtext>custo</mtext><mrow><mi>F</mi><mi>P</mi></mrow></msub></mrow><mrow><msub><mtext>custo</mtext><mrow><mi>F</mi><mi>P</mi></mrow></msub><mo>&#x0002B;</mo><msub><mtext>custo</mtext><mrow><mi>F</mi><mi>N</mi></mrow></msub></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>custo_FP</code></td>
  <td>o preço de acusar quem ia ficar: R$ 20</td>
</tr>
<tr>
  <td><code>custo_FN</code></td>
  <td>o preço de deixar passar quem foi embora: R$ 300</td>
</tr>
<tr>
  <td>resultado</td>
  <td>o limiar a partir do qual vale a pena agir</td>
</tr>
</tbody>
</table></div>
<p>A leitura em português: aja sempre que a chance de perder o cliente valer
mais que o preço do cupom. Com 20 e 300, ela dá 0,06. O mínimo que medimos caiu em 0,14, e os dois
concordam mais do que parece: qualquer limiar entre 0,05 e 0,16 custa
entre R$ 3.900 e R$ 4.500. A faixa é plana, e é isso que você leva para a
reunião, não a segunda casa decimal.</p>
<p>Repare na última linha da tabela, que é desconfortável e verdadeira.
<strong>Ligar para todo mundo custa R$ 5.100, quase tão bem quanto o modelo.</strong>
Quando um erro custa quinze vezes o outro, a decisão quase se resolve
sozinha, e o modelo agrega pouco. Descobrir isso antes de construir o
modelo economiza mais que o modelo.</p>
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>Sobre estes números</strong></p>
<p>Todos vêm dos mesmos 400 clientes com que o modelo treinou, então são um
pouco otimistas. Medimos a diferença: separando 30% dos clientes, a AUC
cai de 0,83 no treino para 0,80 no teste. Pequena aqui, e a Aula 2 mostra
por que ela nem sempre é.</p>

<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>

<h2 id="para-que-serve">Para que serve<a class="ancora" href="#para-que-serve" aria-label="Link para esta secao">#</a></h2>
<p>Uma cafeteria perto de escritórios abre todo dia e precisa decidir quanto
comprar de leite, quantos pães encomendar e quantas pessoas escalar. Errar
para cima é desperdício. Errar para baixo é cliente indo embora.</p>
<p>A pergunta é simples: quanto vamos vender amanhã? A diferença para as
aulas anteriores é que agora a ordem dos dados importa. O que aconteceu
ontem ajuda a explicar hoje, e uma linha da tabela não pode trocar de
lugar com outra.</p>
<p>Isso é uma <strong>série temporal</strong>: uma sequência de valores medidos ao longo
do tempo, em intervalos regulares. Vendas por dia, acessos por hora,
temperatura por minuto.</p>
<p>O dataset desta aula tem 1.096 dias de vendas, de janeiro de 2022 a
dezembro de 2024.</p>
<figure><img src="docs/assets/aula-04/serie_completa.png" alt="Gráfico de linha com três anos de vendas diárias, mostrando oscilação diária intensa e crescimento ao longo do tempo"><figcaption>Três anos de vendas. Parece bagunça, mas tem três padrões escondidos.</figcaption></figure>

<h2 id="as-tres-pecas-de-qualquer-serie">As três peças de qualquer série<a class="ancora" href="#as-tres-pecas-de-qualquer-serie" aria-label="Link para esta secao">#</a></h2>
<p>Toda série temporal pode ser lida como uma soma de peças. As três que
importam nesta aula:</p>
<ul>
<li><strong>Tendência</strong>: para onde o negócio caminha no longo prazo. Aqui, para
cima: a venda média foi de R$ 938 por dia em 2022 para R$ 1.267 em 2024.</li>
<li><strong>Sazonalidade</strong>: um padrão que se repete em intervalos fixos. Esta
série tem duas. Uma semanal (sábado vende mais que segunda) e uma anual
(o inverno vende mais café que o verão: R$ 1.222 contra R$ 976 por dia).</li>
<li><strong>Resto</strong>: o que sobra depois de tirar as duas primeiras. Parte é ruído
puro, parte é evento (um feriado, uma chuva forte, uma obra na rua).</li>
</ul>
<p>Ampliando doze semanas, dá para ver as três peças separadas:</p>
<figure><img src="docs/assets/aula-04/componentes.png" alt="Quatro painéis empilhados mostrando a série observada, a tendência suave, a onda semanal repetida e o resíduo em torno de zero"><figcaption>A mesma janela de 12 semanas, decomposta em três peças.</figcaption></figure>

<p>Repare no último painel. Aqueles dois mergulhos fundos não são ruído: são
feriados, quando os escritórios fecham e a cafeteria vende R$ 719 em vez
dos R$ 1.109 de um dia comum.</p>
<h2 id="a-media-movel">A média móvel<a class="ancora" href="#a-media-movel" aria-label="Link para esta secao">#</a></h2>
<p>Como se separa a tendência do resto? A ferramenta mais simples é a <strong>média
móvel</strong>: em vez de olhar o valor de cada dia, você olha a média dos
últimos dias.</p>
<div class="formula" title="\text{MM}_k(t) = \frac{1}{k}\sum_{i=0}^{k-1} y_{t-i}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mtext>MM</mtext><mi>k</mi></msub><mo stretchy="false">&#x00028;</mo><mi>t</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>k</mi></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>0</mn></mrow><mrow><mi>k</mi><mo>&#x02212;</mo><mn>1</mn></mrow></msubsup><msub><mi>y</mi><mrow><mi>t</mi><mo>&#x02212;</mo><mi>i</mi></mrow></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>k</code></td>
  <td>o tamanho da janela: quantos dias entram na média</td>
</tr>
<tr>
  <td><code>t</code></td>
  <td>o dia que você está olhando</td>
</tr>
<tr>
  <td><code>yₜ₋ᵢ</code></td>
  <td>o valor de <code>i</code> dias atrás</td>
</tr>
<tr>
  <td><code>MMₖ(t)</code></td>
  <td>a média móvel de <code>k</code> dias, no dia <code>t</code></td>
</tr>
</tbody>
</table></div>
<p>Exemplo com uma janela de 3 dias. Se as vendas foram R$ 900, R$ 1.100 e
R$ 1.000, a média móvel do terceiro dia é <code>(900 + 1.100 + 1.000) / 3 = 1.000</code>.</p>
<p>A janela decide o que você enxerga. Uma janela de 7 dias apaga a diferença
entre os dias da semana e deixa o mês aparecer. Uma de 30 dias apaga
também o mês e deixa só o rumo do ano.</p>
<figure><img src="docs/assets/aula-04/media_movel.png" alt="Vendas diárias em cinza com duas linhas de média móvel por cima, uma de 7 dias e outra de 30 dias, cada vez mais suaves"><figcaption>Quanto maior a janela, mais lisa a linha, e menos detalhe sobra.</figcaption></figure>

<p>Uma janela de 7 dias é a escolha natural aqui, porque a sazonalidade
principal é semanal. A regra vale em geral: use uma janela do tamanho do
ciclo que você quer apagar.</p>
<h2 id="o-padrao-semanal">O padrão semanal<a class="ancora" href="#o-padrao-semanal" aria-label="Link para esta secao">#</a></h2>
<p>Vale olhar a sazonalidade semanal de frente. Basta tirar a média de cada

<p>Esse desenho é estável, e é exatamente por isso que ele serve para prever.
