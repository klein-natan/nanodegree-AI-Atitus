/* ---------------------------------------------------------------- tokens */
:root {
  --fundo: #fbfbfa;
  --superficie: #ffffff;
  --superficie-2: #f4f4f1;

  --tinta-suave: #5f5f5a;
  --tinta-fraca: #8a8a83;
  --borda: #e3e2dd;
  --borda-forte: #cfcec8;
  --destaque: #2f5bd0;
  --destaque-suave: #eaf0ff;
  --sombra: 0 1px 2px rgba(20,20,18,.05), 0 8px 24px rgba(20,20,18,.06);
  --info: #2f5bd0;   --info-bg: #eef3ff;
  --aviso: #a7660a;  --aviso-bg: #fdf3e2;
  --ok: #1d7a4c;     --ok-bg: #e8f6ee;
  --perigo: #c0392b; --perigo-bg: #fdecea;
  --largura-leitura: 45rem;
  --fonte: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-tema="escuro"] {
  --fundo: #121215;
  --superficie: #17171b;
  --superficie-2: #1f1f25;
  --tinta: #e7e7e3;
  --tinta-suave: #a9a9a2;
  --tinta-fraca: #7b7b74;
  --borda: #2b2b33;
  --borda-forte: #3a3a44;
  --destaque: #8aabff;
  --destaque-suave: #1c2542;
  --sombra: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --info: #8aabff;   --info-bg: #1a2340;
  --aviso: #e0a34a;  --aviso-bg: #33270f;
  --ok: #6cc294;     --ok-bg: #12301f;
  --perigo: #f08a7e; --perigo-bg: #381915;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--fundo);
  color: var(--tinta);
  font-family: var(--fonte);
  font-size: 16.5px;
  line-height: 1.68;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--destaque); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------------------------------------------------------------- topo */
.topo {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: .75rem;
  height: 56px; padding: 0 1rem;
  background: color-mix(in srgb, var(--fundo) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--borda);
}
.marca { display: flex; align-items: baseline; gap: .5rem; font-weight: 650; letter-spacing: -.01em; }
.marca a { color: var(--tinta); }
.marca .sub {
  font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--tinta-fraca);
}
.topo .espaco { flex: 1; }

.botao {
  display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  height: 34px; padding: 0 .7rem;
  border: 1px solid var(--borda); border-radius: 8px;
  background: var(--superficie); color: var(--tinta-suave);
  font: inherit; font-size: .85rem; cursor: pointer;
}
.botao:hover { border-color: var(--borda-forte); color: var(--tinta); }
.botao svg { width: 15px; height: 15px; }

.abrir-busca { min-width: 210px; justify-content: space-between; color: var(--tinta-fraca); }
.abrir-busca kbd {
  font-family: var(--fonte); font-size: .7rem; padding: .1rem .35rem;
  border: 1px solid var(--borda); border-radius: 5px; color: var(--tinta-fraca);
}
.so-icone { width: 34px; padding: 0; }
.menu-mobile { display: none; }

/* ---------------------------------------------------------------- layout */
.layout {
  display: grid;
  grid-template-columns: 17rem minmax(0, 1fr) 15rem;
  gap: 2.5rem;
  max-width: 96rem; margin: 0 auto; padding: 0 1.25rem;
  align-items: start;
}

/* ---------------------------------------------------------------- menu */
.lateral {
  position: sticky; top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto; overscroll-behavior: contain;
  padding: 1.5rem .5rem 3rem 0;
  scrollbar-width: thin;
}
.lateral::-webkit-scrollbar { width: 7px; }
.lateral::-webkit-scrollbar-thumb { background: var(--borda-forte); border-radius: 4px; }

.nav-parte {
  margin: 1.5rem 0 .4rem; padding: 0 .6rem;
  font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--tinta-fraca);
}
.nav-parte:first-child { margin-top: 0; }
.nav-item {
  display: block; padding: .32rem .6rem; margin: 1px 0;
  border-radius: 7px; border-left: 2px solid transparent;
  color: var(--tinta-suave); font-size: .9rem; line-height: 1.45;
}
.nav-item:hover { background: var(--superficie-2); color: var(--tinta); text-decoration: none; }
.nav-item.ativo {
  background: var(--destaque-suave); color: var(--destaque);
  font-weight: 600; border-left-color: var(--destaque);
}

/* ---------------------------------------------------------------- texto */
.conteudo { min-width: 0; padding: 2.25rem 0 5rem; }
article { max-width: var(--largura-leitura); }

.trilha { font-size: .78rem; color: var(--tinta-fraca); margin-bottom: .5rem; letter-spacing: .02em; }
.titulo-pagina { font-size: clamp(1.8rem, 1.2rem + 1.8vw, 2.5rem); line-height: 1.15; letter-spacing: -.025em; margin: 0; }
.descricao-pagina { color: var(--tinta-suave); font-size: 1.04rem; margin: .6rem 0 0; }
.regua { height: 1px; background: var(--borda); border: 0; margin: 1.75rem 0 2rem; }

article h2 {
  font-size: 1.45rem; letter-spacing: -.015em; line-height: 1.25;
  margin: 3rem 0 .9rem; padding-top: .25rem;
  scroll-margin-top: 78px;
}
article h3 {
  font-size: 1.12rem; letter-spacing: -.008em;
  margin: 2rem 0 .6rem; scroll-margin-top: 78px;
}
article h4 { font-size: 1rem; margin: 1.5rem 0 .4rem; scroll-margin-top: 78px; }
article p { margin: 0 0 1.05rem; }
article ul, article ol { margin: 0 0 1.05rem; padding-left: 1.3rem; }
article li { margin: .3rem 0; }
article li > ul, article li > ol { margin: .3rem 0; }
article strong { font-weight: 650; }
article hr { border: 0; border-top: 1px solid var(--borda); margin: 2.5rem 0; }
article blockquote {
  margin: 1.25rem 0; padding: .2rem 0 .2rem 1.1rem;
  border-left: 3px solid var(--borda-forte); color: var(--tinta-suave);
}

.ancora {
  margin-left: .45rem; color: var(--tinta-fraca); opacity: 0;
  font-weight: 400; text-decoration: none; transition: opacity .12s;
}
h2:hover .ancora, h3:hover .ancora, h4:hover .ancora { opacity: .55; }
.ancora:hover { opacity: 1 !important; text-decoration: none; }

article :not(pre) > code {
  font-family: var(--mono); font-size: .875em;
  background: var(--superficie-2); border: 1px solid var(--borda);
  padding: .1em .35em; border-radius: 5px; white-space: nowrap;
}

/* ---------------------------------------------------------------- figuras */
article figure { margin: 1.75rem 0; }
article figure img {
  display: block; width: 100%; height: auto;
  border: 1px solid var(--borda); border-radius: 10px;
  background: #fff; cursor: zoom-in;
}
article figure video {
  display: block; width: 100%; height: auto; aspect-ratio: 16 / 9;
  border: 1px solid var(--borda); border-radius: 10px; background: #fff;
}
article figcaption {
  margin-top: .6rem; font-size: .84rem; color: var(--tinta-fraca);
  line-height: 1.5; text-align: center;
}
article figcaption:empty { display: none; }
article p > img { max-width: 100%; height: auto; vertical-align: middle; }

.lupa {
  position: fixed; inset: 0; z-index: 90; display: none;
  place-items: center; padding: 2rem;
  background: rgba(10,10,12,.9); cursor: zoom-out;
}
.lupa.aberta { display: grid; }
.lupa img { max-width: 100%; max-height: 100%; border-radius: 8px; background: #fff; }

/* ---------------------------------------------------------------- codigo */
.bloco-codigo { position: relative; margin: 1.5rem 0; }
.bloco-codigo pre {
  margin: 0; padding: 1rem 1.1rem; overflow-x: auto;
  background: var(--superficie-2); border: 1px solid var(--borda); border-radius: 10px;
  font-family: var(--mono); font-size: .845rem; line-height: 1.62;
  tab-size: 4;
}
.bloco-codigo[data-lingua]:not([data-lingua=""])::before {
  content: attr(data-lingua);
  position: absolute; top: .55rem; left: 1.1rem;
  font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
  color: var(--tinta-fraca); pointer-events: none;
}
.bloco-codigo[data-lingua]:not([data-lingua=""]) pre { padding-top: 2rem; }
.copiar {
  position: absolute; top: .5rem; right: .5rem; z-index: 2;
  padding: .2rem .5rem; border: 1px solid var(--borda); border-radius: 6px;
  background: var(--superficie); color: var(--tinta-fraca);
  font: inherit; font-size: .7rem; cursor: pointer; opacity: 0; transition: opacity .12s;
}
.bloco-codigo:hover .copiar, .copiar:focus { opacity: 1; }
.copiar:hover { color: var(--tinta); border-color: var(--borda-forte); }

[data-tema="escuro"] .realce .ss { color: #A5D6FF } /* Literal.String.Symbol */
[data-tema="escuro"] .realce .bp { color: #E6EDF3 } /* Name.Builtin.Pseudo */
[data-tema="escuro"] .realce .fm { color: #D2A8FF; font-weight: bold } /* Name.Function.Magic */
[data-tema="escuro"] .realce .vc { color: #79C0FF } /* Name.Variable.Class */
[data-tema="escuro"] .realce .vg { color: #79C0FF } /* Name.Variable.Global */
[data-tema="escuro"] .realce .vi { color: #79C0FF } /* Name.Variable.Instance */
[data-tema="escuro"] .realce .vm { color: #79C0FF } /* Name.Variable.Magic */
[data-tema="escuro"] .realce .il { color: #A5D6FF } /* Literal.Number.Integer.Long */

/* ---------------------------------------------------------------- tabelas */
.tabela-rolavel { margin: 1.5rem 0; overflow-x: auto; border: 1px solid var(--borda); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
thead th {
  text-align: left; font-weight: 650; white-space: nowrap;
  background: var(--superficie-2); color: var(--tinta-suave);
  font-size: .78rem; letter-spacing: .04em; text-transform: uppercase;
}
th, td { padding: .6rem .85rem; border-bottom: 1px solid var(--borda); vertical-align: top; }
tbody tr:last-child td { border-bottom: 0; }
td code { white-space: nowrap; }

/* ---------------------------------------------------------------- destaques */
.destaque {
  display: flex; gap: .85rem; margin: 1.6rem 0;
  padding: .95rem 1.1rem; border-radius: 10px;
  border: 1px solid var(--cor); border-left-width: 3px;
  background: var(--cor-bg);
}
.destaque-info    { --cor: color-mix(in srgb, var(--info) 35%, transparent);   --cor-bg: var(--info-bg);   --forte: var(--info); }
.destaque-warning { --cor: color-mix(in srgb, var(--aviso) 35%, transparent);  --cor-bg: var(--aviso-bg);  --forte: var(--aviso); }
.destaque-success { --cor: color-mix(in srgb, var(--ok) 35%, transparent);     --cor-bg: var(--ok-bg);     --forte: var(--ok); }
.destaque-danger  { --cor: color-mix(in srgb, var(--perigo) 35%, transparent); --cor-bg: var(--perigo-bg); --forte: var(--perigo); }
.destaque-icone {
  flex: none; width: 20px; height: 20px; margin-top: .22rem;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--forte); color: var(--fundo);
  font-size: .72rem; font-weight: 700; line-height: 1;
}
.destaque-corpo { min-width: 0; flex: 1; }
.destaque-corpo > :last-child { margin-bottom: 0; }
.destaque-rotulo {
  margin: 0 0 .2rem !important; font-size: .7rem; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase; color: var(--forte);
}
.destaque .bloco-codigo, .destaque .tabela-rolavel { margin: .9rem 0; }

/* ---------------------------------------------------------------- expansivel */
.expansivel {
  margin: .7rem 0; border: 1px solid var(--borda); border-radius: 10px;
  background: var(--superficie);
}
.expansivel > summary {
  cursor: pointer; padding: .7rem 1rem; font-weight: 600;
  list-style: none; display: flex; gap: .6rem; align-items: baseline;
}
.expansivel > summary::-webkit-details-marker { display: none; }
.expansivel > summary::before {
  content: "+"; flex: none; width: 1.1rem; text-align: center;
  font-weight: 700; color: var(--destaque);
}
.expansivel[open] > summary::before { content: "−"; }
.expansivel > summary:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; border-radius: 10px; }
.expansivel > :not(summary) { margin-left: 1rem; margin-right: 1rem; }
.expansivel > :last-child { margin-bottom: 1rem; }
.expansivel .bloco-codigo { margin: .6rem 1rem 1rem; }

/* ---------------------------------------------------------------- pilha */
.pilha { margin: 1.6rem 0 2.4rem; }
.pilha-topo {
  display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
  margin-bottom: .6rem; font-size: .8rem; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; color: var(--destaque);
}
.pilha-progresso { color: var(--tinta-suave); white-space: nowrap; }
.pilha-cartas { position: relative; padding-bottom: 14px; }
.pilha-cartas::before, .pilha-cartas::after {
  content: ""; position: absolute; left: 14px; right: 14px; bottom: 7px; height: 30px;
  border: 1px solid var(--borda); border-radius: 12px; background: var(--superficie); z-index: 0;
}
.pilha-cartas::after { left: 28px; right: 28px; bottom: 0; opacity: .7; }
.pilha-cartas[data-restantes="1"]::after, .pilha-cartas[data-restantes="0"]::after,
.pilha-cartas[data-restantes="0"]::before { display: none; }
.pilha .quiz { position: relative; z-index: 1; margin: 0; display: none; }
.pilha .quiz-numero { display: none; }
.pilha .quiz.atual { display: block; animation: carta-entra .35s ease-out; }
.pilha .quiz.saindo { display: block; animation: carta-sai .3s ease-in forwards; }
@keyframes carta-entra { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes carta-sai { to { opacity: 0; transform: translateX(-40px) rotate(-3deg); } }
.pilha-proxima {
  margin-top: .9rem; padding: .55rem 1.1rem; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--destaque); background: var(--destaque); color: var(--fundo);
  font: inherit; font-weight: 700;
}
.pilha-proxima:hover { filter: brightness(1.08); }
.pilha-proxima:focus-visible, .pilha-refazer:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }
.pilha-fim {
  position: relative; z-index: 1; padding: 1.2rem; border-radius: 12px;
  border: 1px solid var(--borda); background: var(--superficie); box-shadow: var(--sombra);
  text-align: center;
}
.pilha-fim p { margin: 0 0 .4rem !important; }
.pilha-nota { font-size: 1.25rem; font-weight: 700; }
.pilha-dica { color: var(--tinta-suave); }
.pilha-refazer {
  margin-top: .5rem; padding: .5rem 1rem; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--borda); background: transparent; color: var(--tinta); font: inherit;
}
.pilha-refazer:hover { border-color: var(--destaque); color: var(--destaque); }
@media print { .pilha .quiz { display: block !important; } .pilha-cartas::before, .pilha-cartas::after { display: none; } }

/* ---------------------------------------------------------------- quiz */
.quiz {
  margin: 1.6rem 0; padding: 1.1rem 1.2rem 1.2rem;
  border: 1px solid var(--borda); border-radius: 12px;
  background: var(--superficie); box-shadow: var(--sombra);
}
.quiz-numero {
  margin: 0 0 .35rem !important; font-size: .7rem; font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase; color: var(--destaque);
}
.quiz-enunciado { margin: 0 0 .9rem !important; font-weight: 600; }
.quiz-opcoes { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.quiz-opcoes li { margin: 0; }
.quiz-opcao {
  width: 100%; display: flex; gap: .7rem; align-items: flex-start; text-align: left;
  padding: .65rem .8rem; border: 1px solid var(--borda-forte); border-radius: 9px;
  background: var(--fundo); color: var(--tinta); font: inherit; line-height: 1.45;
  cursor: pointer; transition: border-color .15s, background .15s;
}
.quiz-opcao:hover:not(:disabled) { border-color: var(--destaque); background: var(--destaque-suave); }
.quiz-opcao:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }
.quiz-opcao:disabled { cursor: default; }
.quiz-letra {
  flex: none; width: 1.55rem; height: 1.55rem; display: grid; place-items: center;
  border-radius: 50%; border: 1px solid var(--borda-forte);
  font-size: .78rem; font-weight: 700; color: var(--tinta-suave);
}
.quiz-texto { min-width: 0; flex: 1; padding-top: .08rem; }
.quiz-opcao.certa { border-color: var(--ok); background: var(--ok-bg); }
.quiz-opcao.certa .quiz-letra { background: var(--ok); border-color: var(--ok); color: var(--fundo); }
.quiz-opcao.errada { border-color: var(--perigo); background: var(--perigo-bg); }
.quiz-opcao.errada .quiz-letra { background: var(--perigo); border-color: var(--perigo); color: var(--fundo); }
.quiz-respondido .quiz-opcao:not(.certa):not(.errada) { opacity: .55; }
.quiz-retorno { margin-top: .9rem; padding: .8rem .95rem; border-radius: 9px; background: var(--info-bg); }
.quiz-retorno p { margin: 0 !important; }
.quiz-veredito { font-weight: 700; margin-bottom: .25rem !important; }
.quiz-acertou .quiz-veredito { color: var(--ok); }
.quiz-errou .quiz-veredito { color: var(--perigo); }
.quiz-placar {
  position: sticky; bottom: 1rem; z-index: 5; margin: 2rem 0 1rem;
  display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap;
  padding: .85rem 1.1rem; border-radius: 12px;
  border: 1px solid var(--borda-forte); background: var(--superficie); box-shadow: var(--sombra);
}
.quiz-placar p { margin: 0 !important; }
.quiz-placar-nota { font-weight: 700; }
.quiz-placar-dica { color: var(--tinta-suave); font-size: .92rem; }
.quiz-recomecar {
  padding: .45rem .9rem; border-radius: 8px; border: 1px solid var(--borda-forte);
  background: var(--fundo); color: var(--tinta); font: inherit; font-size: .9rem; cursor: pointer;
}
.quiz-recomecar:hover { border-color: var(--destaque); color: var(--destaque); }
@media print {
  .quiz-placar { display: none; }
}

/* ---------------------------------------------------------------- formulas */
.formula {
  margin: 1.5rem 0; padding: 1.1rem .9rem; overflow-x: auto;
  background: var(--superficie-2); border: 1px solid var(--borda); border-radius: 10px;
  text-align: center;
}
.formula math { font-size: 1.16rem; }
.formula-bruta {
  margin: 1.5rem 0; padding: 1rem; overflow-x: auto;
  background: var(--superficie-2); border: 1px solid var(--borda); border-radius: 10px;
  font-family: var(--mono); font-size: .85rem;
}

/* ---------------------------------------------------------------- fluxo */
.fluxo {
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
  margin: 1.75rem 0; padding: 1.25rem;
  background: var(--superficie-2); border: 1px solid var(--borda); border-radius: 10px;

/* ---------------------------------------------------------------- paginacao */
.paginacao {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;

<p>Em uma imagem, este é o mapa dos conteúdos trabalhados no Nanodegree de
IA &amp; ML:</p>
<figure><img src="docs/assets/fundamentos/Gemini_Generated_Image_xp7qjfxp7qjfxp7q.jpg" alt="Mapa dos conteúdos do Nanodegree, dos fundamentos matemáticos às aplicações de IA generativa"><figcaption></figcaption></figure>

<p>Os conteúdos equilibram duas forças da área: fundamentos e novidades. As
bases da matemática e do aprendizado de máquina provavelmente não vão mudar,
e é por isso que trabalhamos esses conteúdos: uma base sólida importa. Por
outro lado, muita coisa nova apareceu nos últimos três anos. Abordamos essas
novidades dentro do contexto dos fundamentos, para que você fique bem
informado dos últimos avanços da área.</p>
<div class="destaque destaque-danger" role="note"><div class="destaque-icone" aria-hidden="true">⚠</div><div class="destaque-corpo"><p class="destaque-rotulo">Importante</p><p>Em qualquer área sempre existem fundamentos. <em>Dominar os fundamentos é
essencial!</em> Mas estar a par das tendências atuais é um segundo passo
importante.</p>
</div></div>
<h2 id="como-este-curso-funciona">Como este curso funciona<a class="ancora" href="#como-este-curso-funciona" aria-label="Link para esta secao">#</a></h2>
<p>Você não precisa saber programar bem, nem lembrar de cálculo, para
acompanhar. Cada aula parte de uma situação concreta, o preço de um
aluguel, a previsão de vendas de uma cafeteria, e só depois mostra a
matemática por trás dela.</p>
<p>As fórmulas aparecem sempre traduzidas para português simples, com um
exemplo numérico ao lado. Você não vai decorar símbolos: vai entender o que
cada um faz.</p>
<p>Cada aula tem três materiais, sempre juntos:</p>
<ul>
<li><strong>Esta página do GitBook</strong>, com a teoria completa, para ler antes ou
depois da aula.</li>
<li><strong>Um slide de apoio</strong>, usado durante a aula ao vivo.</li>
<li><strong>Um notebook do Google Colab</strong>, onde você roda o código e faz os
exercícios.</li>
</ul>
<p>Antes da primeira aula, leia <a href="#/antes-de-comecar">Antes de começar</a>. Leva
dois minutos e evita perder tempo de aula com configuração.</p>
<p>A única aula fora desse formato é a
<a href="#/sistemas-de-ml/aula-04-sistema-ponta-a-ponta">Aula 4</a>, que a turma
constrói no VS Code, no próprio computador, seguindo o README do projeto em
vez de slides.</p>

<template class="pagina" data-id="glossario" data-titulo="Glossário" data-descricao="Termos técnicos do curso, explicados em uma frase cada">
<p>Toda vez que uma aula usa um termo técnico pela primeira vez, ele entra
aqui. Se você esqueceu o que uma palavra significa, é mais rápido procurar
nesta página do que voltar a reler uma aula inteira.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Termo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Inteligência artificial (IA)</td>
  <td>Programas que tomam decisões ou fazem previsões a partir de dados, em vez de seguir regras escritas à mão</td>
</tr>
<tr>
  <td>Aprendizado de máquina (<em>machine learning</em>)</td>
  <td>A parte da IA em que o programa aprende a regra sozinho, olhando exemplos</td>
</tr>
<tr>
  <td>Modelo</td>
  <td>O programa (com seus parâmetros ajustados) que faz a previsão</td>
</tr>
<tr>
  <td>Dataset</td>
  <td>A tabela de dados usada para treinar ou testar um modelo</td>
</tr>
<tr>
  <td>Regressão linear</td>
  <td>Um modelo que prevê um número desenhando uma reta (ou um plano, com mais variáveis) no meio dos dados</td>
</tr>
<tr>
  <td>Coeficiente</td>
  <td>Um dos números que a regressão ajusta para desenhar a melhor reta (<code>w₀</code>, <code>w₁</code>, ...); também chamado de peso</td>
</tr>
<tr>
  <td>Resíduo (<code>εᵢ</code>)</td>
  <td>A diferença entre o valor real e o valor previsto pelo modelo, para um exemplo</td>
</tr>
<tr>
  <td>Função de perda (<em>loss function</em>)</td>
  <td>A fórmula que resume o quanto um modelo erra, num único número</td>
</tr>
<tr>
  <td>MSE (erro quadrático médio)</td>
  <td>A média dos resíduos elevados ao quadrado. A função de perda mais comum em regressão</td>
</tr>
<tr>
  <td>Derivada (inclinação)</td>
  <td>O quanto uma curva sobe ou desce em um ponto: a subida dividida pelo avanço, com o avanço quase zero. Diz para que lado mexer um peso para o erro cair, e o quão rápido</td>
</tr>
<tr>
  <td>Reta tangente</td>
  <td>A reta que encosta na curva em um único ponto. A inclinação dela é a derivada naquele ponto</td>
</tr>
<tr>
  <td>Gradiente</td>
  <td>A inclinação da função de perda, uma para cada peso do modelo. Aponta para onde o erro cresce mais rápido</td>
</tr>
<tr>
  <td>Gradiente descendente</td>
  <td>A técnica de ajustar os coeficientes aos poucos, sempre na direção que reduz o erro</td>
</tr>
<tr>
  <td>Taxa de aprendizado (<code>α</code>)</td>
  <td>O tamanho do passo que o gradiente descendente dá a cada ajuste</td>
</tr>
<tr>
  <td>MAE (erro absoluto médio)</td>
  <td>A média do tamanho dos erros de um modelo, na mesma unidade da previsão</td>
</tr>
<tr>
  <td>RMSE (raiz do erro quadrático médio)</td>
  <td>A raiz quadrada do MSE. Penaliza erros grandes mais que o MAE</td>
</tr>
<tr>
  <td>R² (coeficiente de determinação)</td>
  <td>A fração da variação dos dados que o modelo consegue explicar, de 0 a 1</td>
</tr>
<tr>
  <td>Regressão múltipla</td>
  <td>Uma regressão que usa várias variáveis ao mesmo tempo, cada uma com o seu peso</td>
</tr>
<tr>
  <td>Variável indicadora (<em>dummy</em>)</td>
  <td>Coluna de 0 ou 1 que representa uma categoria (por exemplo, um bairro)</td>
</tr>
<tr>
  <td>Categoria de referência</td>
  <td>A categoria que fica sem coluna própria e serve de comparação para as outras</td>
</tr>
<tr>
  <td>Colinearidade</td>
  <td>Duas variáveis que andam juntas e dividem entre si o crédito pelo mesmo efeito</td>
</tr>
<tr>
  <td>R² ajustado</td>
  <td>O R² descontando o custo de cada variável nova adicionada ao modelo</td>
</tr>
<tr>
  <td>Conjunto de treino</td>
  <td>A parte dos dados com que o modelo aprende</td>
</tr>
<tr>
  <td>Conjunto de teste</td>
  <td>A parte separada antes do treino, que o modelo não pode ver, e onde você mede de verdade</td>
</tr>
<tr>
  <td>Sobreajuste (<em>overfitting</em>)</td>
  <td>Quando o modelo melhora no treino e piora no teste: ele decorou em vez de aprender</td>
</tr>
<tr>
  <td>Regularização</td>
  <td>Somar à função de perda um pedágio por coeficiente grande: <code>custo = MSE + α · penalidade(w)</code></td>
</tr>
<tr>
  <td>Força da regularização (<code>α</code>)</td>
  <td>O quanto o pedágio aperta: 0 desliga o freio, valores grandes empurram tudo para perto de zero. Não confundir com a taxa de aprendizado</td>
</tr>
<tr>
  <td>Ridge (penalidade L2)</td>
  <td>Regularização que cobra <code>Σw²</code>. Encolhe os coeficientes grandes e não zera nenhum</td>
</tr>
<tr>
  <td>Lasso (penalidade L1)</td>
  <td>Regularização que cobra a soma dos coeficientes sem o sinal. Zera os coeficientes inúteis e tira a coluna do modelo</td>
</tr>
<tr>
  <td>ElasticNet</td>
  <td>Mistura de Ridge e Lasso, com <code>l1_ratio</code> (ρ) decidindo a proporção entre as duas</td>
</tr>
<tr>
  <td>Validação cruzada</td>
  <td>Dividir o treino em dobras, alternar qual fica para validação e calcular a média da métrica; ajuda a escolher hiperparâmetros sem usar o teste final</td>
</tr>
<tr>
  <td>Desbalanceamento de classes</td>
  <td>Quando uma categoria aparece menos que outra; acurácia sozinha pode esconder falhas na classe menor</td>
</tr>
<tr>
  <td>Hiperparâmetro</td>
  <td>Escolha feita antes do treino, como <code>C</code> ou <code>class_weight</code> na regressão logística</td>
</tr>
<tr>
  <td>Optuna</td>
  <td>Biblioteca que testa combinações de hiperparâmetros e procura a melhor pela métrica escolhida</td>
</tr>
<tr>
  <td>Padronização (<code>StandardScaler</code>)</td>
  <td>Deixar cada coluna com média 0 e desvio 1, para que o freio da regularização não dependa da unidade</td>
</tr>
<tr>
  <td>Classificação</td>
  <td>Prever uma categoria (cancela ou não cancela) em vez de um número</td>
</tr>
<tr>
  <td>Regressão logística</td>
  <td>O modelo que passa a soma dos pesos por uma sigmoide e devolve uma probabilidade</td>
</tr>
<tr>
  <td>Sigmoide</td>
  <td>Função em forma de S que transforma qualquer número em algo entre 0 e 1</td>
</tr>
<tr>
  <td>Chance (<em>odds</em>)</td>
  <td>A razão entre a probabilidade de acontecer e a de não acontecer</td>
</tr>
<tr>
  <td>Limiar (<em>threshold</em>)</td>
  <td>O ponto de corte que transforma uma probabilidade em decisão</td>
</tr>
<tr>
  <td>Matriz de confusão</td>
  <td>Tabela com acertos e erros de um classificador: VP, FP, FN e VN</td>
</tr>
<tr>
  <td>Acurácia</td>
  <td>A fração de previsões corretas sobre o total</td>
</tr>
<tr>
  <td>Precisão</td>
  <td>Dos casos apontados pelo modelo, a fração que era de verdade</td>
</tr>
<tr>
  <td>Recall</td>
  <td>Dos casos que eram de verdade, a fração que o modelo apontou</td>
</tr>
<tr>
  <td>F1</td>
  <td>A média harmônica entre precisão e recall, num número só</td>
</tr>
<tr>
  <td>TPR (taxa de verdadeiros positivos)</td>
  <td>Dos casos que eram de verdade, a fração que o modelo pegou. É o recall com outro nome</td>
</tr>
<tr>
  <td>FPR (taxa de falsos positivos)</td>
  <td>Dos casos que não eram, a fração que o modelo acusou à toa</td>
</tr>
<tr>
  <td>Curva ROC</td>
  <td>O gráfico de TPR contra FPR com todos os limiares de uma vez, um ponto para cada corte</td>
</tr>
<tr>
  <td>AUC</td>
  <td>A área embaixo da curva ROC. Sorteando um caso positivo e um negativo, é a chance de o modelo dar nota maior ao positivo</td>
</tr>
<tr>
  <td>Calibração</td>
  <td>Um modelo calibrado promete probabilidades que acontecem na frequência prometida</td>
</tr>
<tr>
  <td>Brier</td>
  <td>A média dos <code>(probabilidade − resultado)²</code>. É o MSE aplicado à probabilidade, e mede calibração</td>
</tr>
<tr>
  <td>Limiar por custo</td>
  <td>Escolher o corte pela razão entre o preço dos dois erros, e não pelo 0,50 de fábrica</td>
</tr>
<tr>
  <td>Série temporal</td>
  <td>Sequência de valores medidos ao longo do tempo, em que a ordem importa</td>
</tr>
<tr>
  <td>Tendência</td>
  <td>Para onde uma série caminha no longo prazo</td>

<tr>
  <td>Sazonalidade</td>
  <td>Padrão que se repete em intervalo fixo, como a semana ou o ano</td>
</tr>
<tr>
  <td>Média móvel</td>
  <td>Média dos últimos <code>k</code> valores, usada para suavizar uma série</td>

<tr>

  <td>Prever que amanhã será igual a hoje</td>

  <td>Prever que amanhã será igual ao mesmo dia do ciclo anterior</td>

<tr>

  <td>Modelo que prevê a série pelo próprio passado. <code>p</code>: quantos dias entram (AR); <code>d</code>: prever o valor (0) ou a mudança (1) (I); <code>q</code>: quantos erros recentes corrigem a previsão (MA)</td>

<tr>

  <td>A faixa em que cai <strong>uma</strong> observação nova: <code>ŷ ± 2s</code></td>

  <td>Intervalo de confiança</td>
  <td>A faixa em que cai a <strong>média</strong>; encolhe com mais dados</td>

<tr>
  <td>Prophet</td>
  <td>Biblioteca de previsão de séries temporais que estima tendência, sazonalidades e feriados</td>

<tr>
  <td>Intervalo de incerteza</td>
  <td>A faixa em torno da previsão, que cobre uma porcentagem dos casos (80% no padrão do Prophet)</td>

<tr>
  <td>Ponto de mudança (<em>changepoint</em>)</td>
  <td>Data em que a tendência tem permissão para mudar de inclinação</td>

  <td>TimesFM</td>

  <td>Lista das bibliotecas de um projeto, para outra máquina repetir a instalação</td>
</tr>
<tr>
  <td>Streamlit</td>
  <td>Biblioteca que transforma um arquivo Python numa página web, sem escrever HTML</td>
</tr>
<tr>
  <td>Protótipo</td>
  <td>Sistema que funciona, mas ainda não retreina, registra nem monitora nada</td>
</tr>
<tr>
  <td>Neurônio</td>
  <td>A soma de entradas vezes pesos, seguida de uma função de ativação</td>
</tr>
<tr>
  <td>Função de ativação</td>
  <td>A dobra depois da soma, que permite fronteiras que não são retas</td>

  <td>ReLU</td>
  <td>Ativação que transforma número negativo em zero e deixa o positivo passar</td>

<tr>
  <td>Camada densa</td>
  <td>Camada em que todo neurônio recebe todas as saídas da camada anterior</td>

  <td>Retropropagação</td>
  <td>O cálculo que distribui a culpa do erro entre todos os pesos da rede</td>

  <td>Época</td>
  <td>Uma passada completa por todos os exemplos de treino</td>

</tr>

<tr>

<template class="pagina" data-id="fundamentos/contexto-historico" data-titulo="0. Contexto Histórico" data-descricao="Setenta anos de entusiasmo, decepção e recomeço">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta página</strong></p>
<p>A IA não nasceu em 2022. Ela tem setenta anos, dois invernos e uma virada
de método que explica tudo o que você vai estudar neste curso. Saber essa
história é o que separa o encantamento ingênuo do ceticismo apressado.</p>
</div></div>
<h2 id="a-pergunta-que-comecou-tudo">A pergunta que começou tudo<a class="ancora" href="#a-pergunta-que-comecou-tudo" aria-label="Link para esta secao">#</a></h2>
<p>Em 1950, Alan Turing fez uma pergunta: uma máquina pode pensar?</p>
<p>Ele percebeu na hora que a pergunta era ruim. Ninguém consegue definir
&quot;pensar&quot; de um jeito que todo mundo aceite. Então trocou por outra, que dá
para testar: se você conversar com uma máquina e não conseguir dizer se do
outro lado tem uma pessoa, faz sentido chamar aquilo de inteligência?</p>
<p>A troca não resolveu nada. Deu à área um ponto de partida, e isso já foi
muito.</p>
<p>Seis anos depois, em 1956, a Conferência de Dartmouth batizou o campo:
<strong>inteligência artificial</strong>. É a data de nascimento oficial. O entusiasmo
era enorme, e as previsões também: muita gente achava que em poucas
décadas as máquinas fariam quase todo trabalho intelectual humano.</p>
<p>Os computadores da época eram lentos, caros e limitadíssimos.</p>
<h2 id="o-perceptron-a-semente">O perceptron: a semente<a class="ancora" href="#o-perceptron-a-semente" aria-label="Link para esta secao">#</a></h2>
<p>No mesmo período apareceu o <strong>perceptron</strong>, a primeira tentativa séria de
copiar um neurônio. A ideia cabe em uma frase: receba várias entradas,
combine com pesos, produza uma resposta.</p>
<figure><img src="docs/assets/fundamentos/Gemini_Generated_Image_9h0dbe9h0dbe9h0d.png" alt="Ilustração de um neurônio artificial recebendo entradas e produzindo uma saída"><figcaption>Entradas, pesos, uma soma, uma resposta. É a Aula 1 deste curso, e é de 1958.</figcaption></figure>

<p>Guarde esse desenho. Ele é literalmente a Aula 1 do nosso curso: uma soma
de entradas, cada uma com o seu peso. O que mudou de 1958 para cá não foi
a ideia, foi a escala.</p>
<p>O perceptron plantou a semente das redes neurais. E plantou algo maior: a
suspeita de que a inteligência de uma máquina talvez não precisasse vir de
regras escritas à mão.</p>
<h2 id="a-ia-simbolica-e-por-que-ela-travou">A IA simbólica, e por que ela travou<a class="ancora" href="#a-ia-simbolica-e-por-que-ela-travou" aria-label="Link para esta secao">#</a></h2>
<p>Nos anos 1960 a área viveu uma fase de otimismo. Sistemas simbólicos
resolviam teoremas. O programa <a href="https://www.masswerk.at/elizabot/">ELIZA</a>
simulava uma conversa e impressionava as pessoas.</p>
<figure><img src="docs/assets/fundamentos/weizenbaum eliza.jpg" alt="Foto de Joseph Weizenbaum, criador do programa ELIZA"><figcaption>Joseph Weizenbaum escreveu ELIZA em 1966. Ele passou o resto da vida alertando contra o que as pessoas achavam que ela era.</figcaption></figure>

<p>ELIZA ensinou uma lição que vale exatamente igual hoje: <strong>uma conversa
simples já causa a impressão de compreensão</strong>. Parecia inteligência. Era
manipulação de regras.</p>
<p>O problema apareceu quando tentaram sair do laboratório. A IA simbólica
funciona escrevendo regras do tipo &quot;se acontecer X, faça Y&quot;. Isso vai bem
em domínios pequenos e controlados. E fracassa no bom senso, na ambiguidade
da linguagem e na bagunça da vida real.</p>
<p>Escrever à mão todas as regras do mundo é impossível. Não é difícil: é
impossível.</p>
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>A IA simbólica não morreu</strong></p>
<p>Ela virou ferramenta especializada. A biblioteca
<a href="https://www.sympy.org/en/index.html">SymPy</a> faz matemática simbólica e é
excelente naquilo. E existe uma linha de pesquisa ativa em arquiteturas
<a href="https://arxiv.org/abs/2305.00813">neuro-simbólicas</a>, que tentam juntar as
duas abordagens.</p>
</div></div>
<h2 id="dois-invernos">Dois invernos<a class="ancora" href="#dois-invernos" aria-label="Link para esta secao">#</a></h2>
<p>Na década de 1970 veio o primeiro recuo, e o nome que ficou é bom demais
para não usar: <strong>o primeiro inverno da IA</strong>. O entusiasmo esfriou, as
promessas pareceram exageradas, o dinheiro sumiu. O relatório Lighthill, de
1973, criticou os resultados da área no Reino Unido e ajudou a fechar a
torneira.</p>
<p>A pesquisa não parou. O robô Shakey e os primeiros trabalhos em aprendizado
por reforço mantiveram viva a ideia de máquinas que agem e aprendem.</p>
<p>Nos anos 1980 veio a recuperação, com os <strong>sistemas especialistas</strong>. A
mudança de estratégia foi esperta: em vez de imitar toda a inteligência
humana, resolver uma tarefa só. Diagnosticar uma doença. Apoiar uma decisão
de crédito. O método era reunir numa base o conhecimento de especialistas
humanos, e em muitos casos funcionou.</p>
<p>No mesmo período, a <strong>retropropagação</strong> deu às redes neurais um jeito
prático de ajustar pesos a partir dos erros. É o gradiente descendente da
nossa Aula 1.</p>
<p>E veio o segundo obstáculo. Os sistemas especialistas dependiam de
conhecimento humano inserido a mão: caro, lento e difícil de manter. Sem
dados abundantes e sem infraestrutura, envelheciam depressa. Resultado:
<strong>segundo inverno</strong>.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Ciclo</th>
  <th>Quando</th>
  <th>O que empolgou</th>
  <th>O que travou</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Otimismo simbólico</td>
  <td>1956 a 1973</td>
  <td>teoremas, ELIZA</td>
  <td>regras não cobrem o mundo real</td>
</tr>
<tr>
  <td>Primeiro inverno</td>
  <td>1973 a 1980</td>
  <td></td>
  <td>corte de financiamento</td>
</tr>
<tr>
  <td>Sistemas especialistas</td>
  <td>1980 a 1987</td>
  <td>diagnóstico, retropropagação</td>
  <td>conhecimento a mão é caro</td>
</tr>
<tr>
  <td>Segundo inverno</td>
  <td>1987 a 1993</td>
  <td></td>

</tr>
<tr>
  <td>Aprendizado de máquina</td>
  <td>1990 em diante</td>

  <td>(a virada que ficou)</td>
</tr>

</table></div>
<h2 id="a-virada-parar-de-escrever-regras">A virada: parar de escrever regras<a class="ancora" href="#a-virada-parar-de-escrever-regras" aria-label="Link para esta secao">#</a></h2>
<p>Nos anos 1990 aconteceu a mudança que sustenta este curso inteiro, e ela
foi silenciosa. A Web começou a produzir dados em volume nunca visto, e a
expressão &quot;inteligência artificial&quot; perdeu espaço para uma mais modesta:
<strong>aprendizado de máquina</strong>.</p>
<p>A troca de nome escondia uma troca de método:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Abordagem</th>
  <th>Quem escreve a regra</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Programação tradicional</td>
  <td>uma pessoa escreve as regras, e o programa segue</td>
</tr>
<tr>
  <td>Aprendizado de máquina</td>
  <td>você dá exemplos, e o programa acha a regra sozinho</td>
</tr>
</tbody>
</table></div>
<p>Pense em filtrar spam. Escrever à mão todas as regras que separam spam de
e-mail legítimo é aquele problema impossível de novo. Mas mostre ao
programa alguns milhares de exemplos marcados, e ele encontra sozinho as
combinações de palavras, formatos e comportamentos que denunciam spam.</p>
<p>É esse o movimento. E é exatamente o que você vai fazer na Aula 1, com
aluguéis em vez de spam.</p>
<h2 id="o-que-fez-a-coisa-funcionar">O que fez a coisa funcionar<a class="ancora" href="#o-que-fez-a-coisa-funcionar" aria-label="Link para esta secao">#</a></h2>
<p>Nos anos 2000 a internet passou a gerar um volume gigantesco de dados. Ao
mesmo tempo, as <strong>GPUs</strong>, criadas para jogos, se revelaram perfeitas para
treinar redes grandes.</p>
<p>O avanço da IA não veio de uma descoberta milagrosa. Veio de três coisas
chegando juntas:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Ingrediente</th>
  <th>O que trouxe</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Algoritmos</td>
  <td>redes profundas melhor compreendidas</td>
</tr>
<tr>
  <td>Dados</td>
  <td>a internet inteira, gerada de graça pelos usuários</td>
</tr>
<tr>
  <td>Máquina</td>
  <td>GPUs, capazes de milhares de contas em paralelo</td>
</tr>
</tbody>
</table></div>
<p>Tire qualquer um dos três e nada acontece. Foi preciso os três.</p>
<p>Na década de 2010 o <strong>aprendizado profundo</strong> virou protagonista. Visão
computacional, fala e linguagem deram saltos. Assistentes virtuais
apareceram no bolso de todo mundo. A IA saiu do laboratório e entrou no
produto.</p>
<h2 id="o-que-veio-junto-e-nao-e-bonito">O que veio junto, e não é bonito<a class="ancora" href="#o-que-veio-junto-e-nao-e-bonito" aria-label="Link para esta secao">#</a></h2>
<p>O avanço trouxe problemas novos, e vale nomear os quatro que mais aparecem:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Problema</th>
  <th>O que acontece</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Viés herdado</td>
  <td>o modelo aprende o preconceito que estava nos dados</td>
</tr>
<tr>
  <td>Erro desigual</td>
  <td>reconhecimento facial que erra mais em uns grupos que em outros</td>
</tr>
<tr>
  <td>Alucinação</td>
  <td>resposta errada com aparência de resposta certa</td>
</tr>
<tr>
  <td>Deepfake</td>
  <td>áudio e vídeo falsos, difíceis de distinguir do real</td>
</tr>
</tbody>
</table></div>
<p>E uma lição que a história repete: <strong>vencer um teste específico não é
entender o mundo</strong>. Modelos que batem recordes em benchmarks ainda tropeçam
em dirigir numa rua caótica.</p>
<p>Desde 2020 estamos na era generativa. Modelos escrevem texto, imagem,
código e áudio com fluência surpreendente, e a IA deixou de ser uma peça
escondida dentro de sistemas corporativos para virar um assistente com quem
você conversa. O alcance cresceu, e os debates sobre desinformação e
direito autoral cresceram junto.</p>
<h2 id="a-leitura-que-interessa">A leitura que interessa<a class="ancora" href="#a-leitura-que-interessa" aria-label="Link para esta secao">#</a></h2>
<p>Olhe a tabela dos ciclos de novo. Entusiasmo, decepção, método novo,
recursos novos, nova onda. Isso não é fracasso: é uma área aprendendo com
os próprios limites.</p>
<p>Daí a lição para quem está começando:</p>
<blockquote>
<p>Inteligência artificial não é mágica. É um campo construído com
hipóteses, experimentos, erros e revisões, por pessoas, com dados de
pessoas, e limitado pelas escolhas dessas pessoas.</p>
</blockquote>
<p>Entender a história evita os dois extremos que mais atrapalham: o
encantamento ingênuo, que acha que a máquina pensa, e o ceticismo
apressado, que acha que não mudou nada.</p>
<p>A pergunta de Turing continua aberta, e hoje ela tem uma versão mais útil:
que tipo de inteligência queremos construir, e para servir a que tipo de
sociedade?</p>

<template class="pagina" data-id="fundamentos/engenharia-de-ml" data-titulo="1. Engenharia de Machine Learning" data-descricao="Por que o modelo é a parte fácil">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta página</strong></p>
<p>Um modelo que funciona no seu notebook não é um produto. Você vai ver o que
falta entre os dois, por que o código do algoritmo é só 5% do trabalho, e
por que sistemas de ML falham sem dar erro nenhum.</p>
</div></div>
<h2 id="aprendizado-de-maquina-em-uma-frase">Aprendizado de máquina, em uma frase<a class="ancora" href="#aprendizado-de-maquina-em-uma-frase" aria-label="Link para esta secao">#</a></h2>
<p>No <strong>aprendizado de máquina</strong>, o programa encontra padrões nos dados em vez
de seguir regras que alguém escreveu.</p>
<p>O exemplo é o da nossa Aula 1. Você quer prever o preço de um apartamento.
O caminho tradicional seria escrever centenas de regras sobre como o
bairro, a área e o número de quartos afetam o preço. Boa sorte.</p>
<p>O caminho do ML é outro: mostre ao programa alguns milhares de vendas
passadas e deixe ele achar a relação sozinho. Depois, aplique essa relação
a um apartamento novo, que ninguém precificou ainda.</p>
<h2 id="a-diferenca-que-muda-tudo-probabilidade">A diferença que muda tudo: probabilidade<a class="ancora" href="#a-diferenca-que-muda-tudo-probabilidade" aria-label="Link para esta secao">#</a></h2>
<p>Software tradicional é <strong>determinístico</strong>. Mesma entrada, mesma saída,
sempre. Se der errado, dá erro.</p>
<p>Sistema de ML é <strong>probabilístico</strong>. Ele não entrega uma verdade: entrega
uma estimativa. E aqui está a consequência que assusta:</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>A falha silenciosa</strong></p>
<p>Um sistema de ML pode rodar sem um único erro técnico e entregar previsões
completamente erradas. O código está certo. Os dados é que mudaram.</p>
<p>Em software comum, quando quebra, você fica sabendo. Em ML, não. É por isso
que monitorar não é opcional.</p>
</div></div>
<h2 id="programacao-tradicional-contra-ml">Programação tradicional contra ML<a class="ancora" href="#programacao-tradicional-contra-ml" aria-label="Link para esta secao">#</a></h2>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th></th>
  <th>Programação tradicional</th>
  <th>Aprendizado de máquina</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Quem escreve a lógica</td>
  <td>a pessoa, em <code>if</code> e <code>else</code></td>
  <td>o algoritmo, a partir de exemplos</td>
</tr>
<tr>
  <td>O que você fornece</td>
  <td>as regras</td>
  <td>os dados e as respostas certas</td>
</tr>
<tr>
  <td>O que você testa</td>
  <td>o código</td>
  <td>o código <strong>e</strong> os dados</td>
</tr>
<tr>
  <td>O que você versiona</td>
  <td>o código</td>
  <td>o código, os dados <strong>e</strong> o modelo</td>
</tr>
<tr>
  <td>Quando falha</td>
  <td>dá erro</td>
  <td>continua rodando</td>
</tr>
</tbody>
</table></div>
<p>A linha que mais custa a entrar na cabeça é a quarta. Em ML, o modelo é o
resultado de um algoritmo <strong>mais</strong> um conjunto específico de dados. Trocar
os dados dá outro modelo, mesmo sem tocar numa linha de código. Então os
dados também precisam de versão.</p>
<p>Essa mudança é indispensável para problemas que ninguém consegue codificar
a mão: reconhecer fala, detectar fraude, traduzir texto.</p>
<h2 id="cientista-de-dados-e-engenheiro-de-ml">Cientista de dados e engenheiro de ML<a class="ancora" href="#cientista-de-dados-e-engenheiro-de-ml" aria-label="Link para esta secao">#</a></h2>
<p><strong>Engenharia de Machine Learning</strong> é aplicar prática de engenharia de
software a sistemas que são probabilísticos por natureza.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th></th>
  <th>Ciência de dados</th>
  <th>Engenharia de ML</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Onde o trabalho vive</td>
  <td>notebook, exploração</td>
  <td>código de produção</td>
</tr>
<tr>
  <td>O que entrega</td>
  <td>um protótipo que responde a pergunta</td>
  <td>um sistema que atende usuários</td>
</tr>
<tr>
  <td>O que otimiza</td>
  <td>descoberta</td>
  <td>confiabilidade, escala, manutenção</td>
</tr>
</tbody>
</table></div>
<p>As duas são necessárias, e a Aula 4 deste curso é justamente a travessia de
uma para a outra.</p>
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O princípio dos 5%</strong></p>
<p>O choque de quem entra na área: o código do algoritmo é cerca de <strong>5%</strong> do
esforço de um sistema industrial.</p>
<p>Os outros 95% são coleta e limpeza de dados, infraestrutura, automação de
testes, pipelines e monitoramento.</p>
<p>O bom engenheiro de ML não é o que escreve o algoritmo mais complexo. É o
que constrói o sistema mais confiável em volta dele.</p>
</div></div>
<h2 id="o-ciclo-de-vida-e-por-que-ele-nao-termina">O ciclo de vida, e por que ele não termina<a class="ancora" href="#o-ciclo-de-vida-e-por-que-ele-nao-termina" aria-label="Link para esta secao">#</a></h2>
<p>Um programa comum você escreve uma vez, e ele executa a tarefa fixa. Um
sistema de ML se parece mais com uma planta: precisa de cuidado contínuo,
adaptação ao ambiente e alimentação constante com dados novos.</p>
<p>O ciclo não é uma linha reta que acaba na entrega. É um loop, e uma
descoberta na etapa 3 costuma mandar você de volta para a etapa 2.</p>
<figure><img src="docs/assets/fundamentos/Gemini_Generated_Image_opoetpopoetpopoe (2).png" alt="Diagrama circular das quatro etapas do ciclo de vida de um projeto de machine learning"><figcaption>Quatro etapas, e uma seta que volta. O monitoramento reinicia o ciclo.</figcaption></figure>

<p><strong>1. Escopo e objetivo.</strong> Traduzir um desejo de negócio em um objetivo
técnico. &quot;Aumentar o engajamento&quot; não é objetivo de ML. Prever em que o
usuário vai clicar é classificação; prever quanto tempo ele vai ficar é
regressão. Escolher errado aqui custa meses.</p>
<p><strong>2. Engenharia de dados.</strong> Coletar, limpar registros corrompidos e
transformar tudo num formato que o algoritmo engula. Essa transformação
tem nome: <strong>engenharia de características</strong> (<em>feature engineering</em>). É a
etapa mais difícil e mais decisiva. Sem dado bom, nenhum modelo salva.</p>
<p><strong>3. Desenvolvimento e avaliação.</strong> Escolher o algoritmo, treinar, e então
testar contra dados que o modelo nunca viu. É o <code>train_test_split</code> da nossa
Aula 2. O objetivo é garantir que ele <strong>generalize</strong>, e não que tenha
decorado o passado.</p>
<p><strong>4. Implantação e monitoramento.</strong> Colocar no ar, e continuar olhando. O
mundo muda, os dados mudam junto, e o desempenho cai. Quando cai o
bastante, o ciclo recomeça.</p>
<h2 id="por-que-os-modelos-apodrecem">Por que os modelos apodrecem<a class="ancora" href="#por-que-os-modelos-apodrecem" aria-label="Link para esta secao">#</a></h2>
<p>Software tradicional não se degrada sozinho: se ninguém mexer no código,
ele faz amanhã o que fazia ontem.</p>
<p>Modelo de ML se degrada. Ele costuma estar no melhor momento logo depois do
treino, e piora conforme o mundo se afasta dos dados com que aprendeu. Há
dois jeitos de isso acontecer, e vale saber diferenciar:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Nome</th>
  <th>O que muda</th>
  <th>Exemplo</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Desvio de dados (<em>data drift</em>)</td>
  <td>as entradas mudam de perfil</td>
  <td>um recomendador treinado com adolescentes começa a atender idosos</td>
</tr>
<tr>
  <td>Desvio de conceito (<em>concept drift</em>)</td>
  <td>a relação entre entrada e resposta muda</td>
  <td>os padrões de consumo numa pandemia</td>
</tr>
</tbody>
</table></div>
<p>Nos dois casos o código continua rodando sem reclamar. Só as previsões
ficam erradas.</p>
<h2 id="producao-nao-e-competicao">Produção não é competição<a class="ancora" href="#producao-nao-e-competicao" aria-label="Link para esta secao">#</a></h2>
<p>Numa competição ou num artigo, o objetivo é um só: acertar mais que os
outros, num conjunto de dados parado.</p>
<p>Em produção você equilibra objetivos que brigam entre si:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Requisito</th>
  <th>A pergunta que ele faz</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Precisão</td>
  <td>o modelo acerta?</td>
</tr>
<tr>
  <td>Latência</td>
  <td>ele responde a tempo?</td>
</tr>
<tr>
  <td>Throughput</td>
  <td>ele aguenta o volume?</td>
</tr>
<tr>
  <td>Custo</td>
  <td>a conta da infraestrutura fecha?</td>
</tr>
<tr>
  <td>Segurança</td>
  <td>os dados dos usuários estão protegidos?</td>
</tr>
</tbody>
</table></div>
<p>Um modelo mais preciso e lento demais é inútil. Um modelo mais preciso e
caro demais também. Essa negociação é o trabalho.</p>
<h2 id="mlops-se-nao-esta-automatizado-esta-quebrado">MLOps: se não está automatizado, está quebrado<a class="ancora" href="#mlops-se-nao-esta-automatizado-esta-quebrado" aria-label="Link para esta secao">#</a></h2>
<p><strong>MLOps</strong> é a prática de unificar o desenvolvimento de sistemas de ML com a
operação deles. O objetivo é padronizar e automatizar o ciclo inteiro.</p>
<p>A filosofia cabe numa frase dura: se um processo depende de alguém lembrar
de fazer, ele já está quebrado. Intervenção manual é lenta e erra.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Pilar</th>
  <th>O que automatiza</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Integração contínua (CI)</td>
  <td>testa o código <strong>e</strong> a validade dos dados</td>
</tr>
<tr>
  <td>Entrega contínua (CD)</td>
  <td>publica sozinho os modelos aprovados</td>
</tr>
<tr>
  <td>Treinamento contínuo (CT)</td>
  <td>retreina quando chegam dados novos ou o desempenho cai</td>
</tr>
</tbody>
</table></div>
<p>O terceiro é o que não existe em software comum, e é o que fecha o loop do
ciclo de vida.</p>
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>A regra dos 25%</strong></p>
<p>O erro mais comum é achar que modelagem matemática é a competência que
importa. Não é. O resultado depende de quatro coisas, em partes iguais:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Domínio</th>
  <th>O que ele garante</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Engenharia de software</td>
  <td>código robusto e testável</td>
</tr>
<tr>
  <td>Engenharia de dados</td>
  <td>coleta, limpeza e validação</td>
</tr>
<tr>
  <td>Modelagem</td>
  <td>a escolha e o treino do algoritmo</td>
</tr>
<tr>
  <td>Entendimento do negócio</td>
  <td>que o problema resolvido seja o problema certo</td>
</tr>
</tbody>
</table></div>
<p>O quarto é o mais ignorado e o mais caro quando falta. Modelo perfeito para
a pergunta errada não vale nada.</p>
</div></div>

<template class="pagina" data-id="fundamentos/engenharia-de-ia" data-titulo="2. Engenharia de IA" data-descricao="Construir com modelos que outra pessoa treinou">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta página</strong></p>
<p>Engenharia de ML é treinar o seu modelo. Engenharia de IA é adaptar um
modelo que já existe. Você vai ver o que muda no trabalho, as três formas
de adaptar um modelo de fundação, e por que a parte difícil não é fazer
funcionar.</p>
</div></div>
<h2 id="a-fronteira-mudou-de-lugar">A fronteira mudou de lugar<a class="ancora" href="#a-fronteira-mudou-de-lugar" aria-label="Link para esta secao">#</a></h2>
<p>Até pouco tempo, usar IA de ponta exigia laboratório e infraestrutura cara.
Hoje, uma chave de API e vinte linhas de Python colocam um modelo estado da
arte dentro do seu produto.</p>
<p><strong>Engenharia de IA</strong> é construir aplicações em cima de modelos de fundação
já treinados. E o trabalho não é chamar a API. É definir o problema, dar
contexto ao modelo, avaliar as respostas e operar o sistema com segurança.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th></th>
  <th>Engenharia de ML</th>
  <th>Engenharia de IA</th>
</tr>
</thead>
<tbody>
<tr>
  <td>O modelo</td>
  <td>a equipe treina e mantém o seu</td>
  <td>alguém já treinou</td>
</tr>
<tr>
  <td>O trabalho central</td>
  <td>dados e treino</td>
  <td>contexto, avaliação e operação</td>
</tr>
<tr>
  <td>Onde está o risco</td>
  <td>o modelo não aprende</td>
  <td>o modelo responde bem, e errado</td>
</tr>
</tbody>
</table></div>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>A regra dos 80%</strong></p>
<p>Sair do zero a 80% e ter uma demonstração que funciona é fácil. Ir de 80% a
95% e ter um produto que aguenta produção é o trabalho inteiro.</p>
<p>Toda a diferença mora em avaliação, dados confiáveis, controle de acesso e
monitoramento. Nenhuma dessas coisas aparece na demonstração.</p>
</div></div>
<h2 id="a-unidade-de-tudo-o-token">A unidade de tudo: o token<a class="ancora" href="#a-unidade-de-tudo-o-token" aria-label="Link para esta secao">#</a></h2>
<p>Modelos de linguagem não leem texto como você. Eles trabalham com
<strong>tokens</strong>, que são pedaços de texto.</p>
<p>Um token pode ser uma palavra inteira, um pedaço dela ou um caractere só. A
divisão muda de modelo para modelo e de idioma para idioma. Em inglês,
<code>can't</code> costuma virar <code>can</code> e <code>'t</code>.</p>
<p>Por que não usar palavras inteiras? Por três motivos:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Motivo</th>
  <th>O que ganha</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Cobertura</td>
  <td>o modelo monta palavras que nunca viu, com pedaços que conhece</td>
</tr>
<tr>
  <td>Eficiência</td>
  <td>o vocabulário fica muito menor que uma lista de palavras</td>
</tr>
<tr>
  <td>Flexibilidade</td>
  <td>texto, código e símbolos usam a mesma representação</td>
</tr>
</tbody>
</table></div>
<p>Token não é detalhe técnico: é a unidade de <strong>custo</strong> e de <strong>limite</strong>. Você
paga por token, e a janela de contexto se mede em tokens. E a janela precisa
caber tudo: as instruções, os documentos recuperados, o histórico da
conversa e a resposta que está sendo gerada.</p>
<p>Uma regra aproximada para o inglês: 100 tokens dão umas 75 palavras. Em
português rende menos.</p>
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>Português custa mais caro</strong></p>
<p>Os grandes modelos treinaram os tokenizadores deles quase todo em inglês,
então o inglês comprime melhor. A mesma frase em português vira
mais tokens: mais custo e menos espaço na janela.</p>
<p>Vale testar em <a href="https://gpt-tokenizer.dev/">gpt-tokenizer.dev</a>: escreva uma
frase em português e a tradução dela, e compare a contagem.</p>
<p>Você vai construir um tokenizador desses do zero na Aula 9, e vai ver a
compressão acontecer com o texto do Machado de Assis.</p>
</div></div>
<h2 id="como-o-modelo-preve-autorregressao">Como o modelo prevê: autorregressão<a class="ancora" href="#como-o-modelo-preve-autorregressao" aria-label="Link para esta secao">#</a></h2>
<p>Modelos generativos são sistemas probabilísticos. Eles estimam a
probabilidade do próximo token, dado tudo que veio antes.</p>
<p>Em &quot;Why does the chicken cross the ___&quot;, o modelo dá probabilidade alta a
<code>road</code>. Escolhe um token, cola no fim da frase, e repete. Cada palavra que
ele escreve vira entrada da próxima.</p>
<p>Por isso o nome: <strong>modelo autorregressivo</strong>. A família GPT inteira é assim.</p>
<p>E aqui está a consequência que gera quase todo mal-entendido sobre IA:</p>
<blockquote>
<p>O modelo não consulta uma fonte de verdade. Ele gera a continuação mais
provável. Uma resposta fluida pode estar completamente errada.</p>
</blockquote>
<figure><img src="docs/assets/fundamentos/diagrama-llms-3.png" alt="Diagrama comparando modelos autorregressivos e modelos mascarados"><figcaption>Autorregressivo prevê o que vem depois. Mascarado preenche buracos no meio.</figcaption></figure>

<p>Existe outra família, os modelos <strong>mascarados</strong>, como o BERT. Eles
preenchem lacunas no meio do texto, e são bons em classificação e análise
de sentimento. Para gerar texto, código e diálogo, os autorregressivos
dominaram.</p>
<h2 id="o-truque-que-permitiu-a-escala-auto-supervisao">O truque que permitiu a escala: auto-supervisão<a class="ancora" href="#o-truque-que-permitiu-a-escala-auto-supervisao" aria-label="Link para esta secao">#</a></h2>
<p>Durante anos, rotular dados a mão foi o gargalo do ML. Para ensinar um
modelo a distinguir gato de cachorro, alguém tinha que marcar cada foto.</p>
<p>A <strong>auto-supervisão</strong> resolve isso de um jeito quase óbvio depois que você
vê: o próprio dado já contém a resposta. Em texto, o que veio antes é o
contexto, e o próximo token é o alvo.</p>
<p>Veja a frase &quot;I love street food&quot; virando seis exemplos de treino:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Entrada (contexto)</th>
  <th>Alvo (próximo token)</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>&lt;BOS&gt;</code></td>
  <td>I</td>
</tr>
<tr>
  <td>I</td>
  <td>love</td>
</tr>
<tr>
  <td>I love</td>
  <td>street</td>
</tr>
<tr>
  <td>I love street</td>
  <td>food</td>
</tr>
<tr>
  <td>I love street food</td>
  <td>.</td>
</tr>
<tr>
  <td>I love street food .</td>
  <td><code>&lt;EOS&gt;</code></td>
</tr>
</tbody>
</table></div>
<p>Nenhuma pessoa rotulou nada. <code>&lt;BOS&gt;</code> e <code>&lt;EOS&gt;</code> são tokens especiais que
marcam começo e fim de sequência.</p>
<p>Agora multiplique isso por toda a internet. É daí que saem os modelos de
fundação, e é exatamente esse par entrada/alvo que você vai montar na
Aula 9.</p>
<h2 id="modelos-de-fundacao-e-multimodalidade">Modelos de fundação e multimodalidade<a class="ancora" href="#modelos-de-fundacao-e-multimodalidade" aria-label="Link para esta secao">#</a></h2>
<p>Um <strong>modelo de fundação</strong> aprende padrões amplos com um volume enorme de
dados, e depois se adapta a muitas tarefas sem precisar treinar de novo do
zero.</p>
<p>Muitos são <strong>multimodais</strong>: processam combinações de texto, imagem, áudio e
vídeo. Modelos como o CLIP aprendem a relação entre uma imagem e a
descrição dela, e esses pares substituem boa parte da rotulagem manual.</p>
<p>O modelo entrega capacidade geral. Quem transforma capacidade em valor é a
aplicação.</p>
<h2 id="as-tres-formas-de-adaptar-da-mais-barata-para-a-mais-cara">As três formas de adaptar, da mais barata para a mais cara<a class="ancora" href="#as-tres-formas-de-adaptar-da-mais-barata-para-a-mais-cara" aria-label="Link para esta secao">#</a></h2>
<p>A regra é começar pela mais simples que resolva. Cada degrau custa mais
dinheiro, mais prazo e mais risco.</p>
<figure><img src="docs/assets/fundamentos/Gemini_Generated_Image_desqrudesqrudesq.png" alt="Diagrama com os três níveis de adaptação de um modelo: engenharia de prompt, RAG e ajuste fino"><figcaption>Suba um degrau só quando o de baixo não resolver.</figcaption></figure>

<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Técnica</th>
  <th>O que faz</th>
  <th>Quando usar</th>
</tr>
</thead>
<tbody>
<tr>
  <td><strong>Engenharia de prompt</strong></td>
  <td>define instruções, exemplos, formato e limites</td>
  <td>sempre; é o primeiro degrau</td>
</tr>
<tr>
  <td><strong>RAG</strong></td>
  <td>busca conteúdo numa fonte externa e manda junto no contexto</td>
  <td>informação privada, que muda, ou que precisa de citação</td>
</tr>
<tr>
  <td><strong>Ajuste fino</strong></td>
  <td>treina o modelo com exemplos especializados</td>
  <td>quando prompt e RAG não seguram o comportamento</td>
</tr>
</tbody>
</table></div>
<p>Duas confusões que custam caro:</p>
<p><strong>RAG não cura alucinação sozinho.</strong> Ele só ajuda se a busca trouxer a
fonte certa, se o prompt mandar responder apenas com base nas evidências, e
se a interface mostrar de onde veio a resposta. Sem os três, você trocou
uma alucinação por uma alucinação com aparência de fonte.</p>
<p><strong>Ajuste fino não é base de conhecimento.</strong> Ele muda comportamento, tom e
formato. Ele não mantém a informação atualizada. Para conhecimento que
muda, use RAG. Técnicas de <strong>PEFT</strong> (<em>parameter-efficient fine-tuning</em>)
baixam bastante o custo do treino, mas não mudam essa divisão de tarefas.</p>
<p>Você constrói um RAG do zero na Aula 13.</p>
<h2 id="o-ciclo-de-uma-aplicacao-de-ia">O ciclo de uma aplicação de IA<a class="ancora" href="#o-ciclo-de-uma-aplicacao-de-ia" aria-label="Link para esta secao">#</a></h2>
<p>O processo é iterativo, e difere do ciclo de ML tradicional por gastar quase
nada em treino e quase tudo em <strong>adaptação e avaliação</strong>.</p>
<figure><img src="docs/assets/fundamentos/Gemini_Generated_Image_vrh9v8vrh9v8vrh9.png" alt="Diagrama circular das seis etapas de uma aplicação de IA generativa"><figcaption>Seis etapas. A segunda é a que todo mundo pula, e é a que decide o projeto.</figcaption></figure>

<p><strong>1. Planejar e avaliar o caso de uso.</strong> Antes de qualquer código: a IA é a
ferramenta certa aqui? Ela é crítica ao produto ou enfeite? E como vamos
medir sucesso, em métrica de negócio e em latência e custo por resposta?</p>
<p><strong>2. Desenhar o pipeline de avaliação.</strong> Esta é a etapa mais difícil, e a
mais pulada. Como os modelos de fundação respondem de forma aberta, você
precisa de critérios escritos e de um conjunto de casos de teste, real ou
sintético, para saber se uma mudança melhorou ou piorou.</p>
<p><strong>3. Escolher o modelo.</strong> API comercial ou modelo aberto hospedado por
você? A decisão pesa sete eixos: privacidade dos dados, linhagem do modelo,
desempenho, funcionalidades, custo, controle e possibilidade de rodar no
dispositivo.</p>
<p><strong>4. Adaptar.</strong> Os três degraus da seção anterior, na ordem.</p>
<p><strong>5. Arquitetura e guardrails.</strong> O que separa protótipo de produto:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Peça</th>
  <th>Para que serve</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Guardrails</td>
  <td>filtram entrada e saída: dado sensível, conteúdo tóxico, alucinação grave</td>
</tr>
<tr>
  <td>Roteadores e gateways</td>
  <td>mandam cada pedido ao modelo certo e controlam custo</td>
</tr>
<tr>
  <td>Cache</td>
  <td>guardam respostas repetidas, e cortam latência e conta</td>
</tr>
</tbody>
</table></div>
<p><strong>6. Monitorar e coletar feedback.</strong> Depois no ar, acompanhe os desvios de
comportamento do modelo e do usuário. O feedback, explícito ou implícito,
alimenta o que se chama de <strong>volante de dados</strong>: o uso melhora o sistema,
que atrai mais uso.</p>
<h2 id="avaliar-e-testar-o-que-da-errado">Avaliar é testar o que dá errado<a class="ancora" href="#avaliar-e-testar-o-que-da-errado" aria-label="Link para esta secao">#</a></h2>
<p>Monte um conjunto de casos que represente a realidade: os comuns, os
difíceis e os maliciosos. Em cada resposta, olhe correção, completude,
formato e presença de fonte.</p>
<p>E teste de propósito as três falhas previsíveis:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Falha</th>
  <th>O que acontece</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Alucinação</td>
  <td>a resposta inventa um fato ou uma fonte</td>
</tr>
<tr>
  <td>Instrução maliciosa</td>
  <td>um documento tenta mudar as regras da sua aplicação</td>
</tr>
<tr>
  <td>Vazamento</td>
  <td>dado pessoal ou interno aparece no prompt ou na resposta</td>
</tr>
</tbody>
</table></div>
<p>A segunda merece atenção. Se a sua aplicação lê documentos que outras
pessoas escreveram, alguém pode esconder instruções lá dentro. O modelo não
distingue por conta própria o que é conteúdo e o que é ordem.</p>
<p>Defina limites claros, filtre dado sensível, controle o acesso às fontes e
mantenha revisão humana onde a decisão pesa.</p>
<h2 id="onde-isso-rende-de-verdade">Onde isso rende de verdade<a class="ancora" href="#onde-isso-rende-de-verdade" aria-label="Link para esta secao">#</a></h2>
<p>IA generativa ajuda mais em tarefas repetitivas, com bastante contexto
disponível e resultado que alguém consegue revisar.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Caso</th>
  <th>O que faz</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Assistente interno</td>
  <td>responde com base em políticas, manuais e documentação da casa</td>
</tr>
<tr>
  <td>Extração de documentos</td>
  <td>transforma PDF e imagem em dado estruturado</td>
</tr>
<tr>
  <td>Apoio ao desenvolvimento</td>
  <td>explica, testa, refatora e documenta código</td>
</tr>
</tbody>
</table></div>
<p>O objetivo não é automatizar tudo. É montar fluxos verificáveis, onde
pessoa e sistema entregam mais juntos do que separados.</p>
