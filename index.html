<h2 id="regressao-linear-simples">Regressão linear simples<a class="ancora" href="#regressao-linear-simples" aria-label="Link para esta secao">#</a></h2>
<div class="quiz" data-numero="1"><p class="quiz-numero">Questão 1</p><p class="quiz-enunciado">Um modelo prevê o preço de uma corrida por aplicativo com a reta <strong>preço = 5 + 2,20 × distância</strong>. O que o número 2,20 quer dizer?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">O preço de uma corrida de 0 km.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">B</span><span class="quiz-texto">Cada quilômetro a mais soma R$ 2,20 ao preço previsto.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">O preço médio de todas as corridas.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">O erro médio da reta, em reais.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">O 2,20 é o peso <code>w₁</code>, o preço por quilômetro: ele diz quanto a previsão sobe a cada km a mais. O 5 é o <code>w₀</code>, a taxa fixa, que é o preço previsto para uma corrida de 0 km.</p></div></div>
<div class="quiz" data-numero="2"><p class="quiz-numero">Questão 2</p><p class="quiz-enunciado">Uma reta que prevê o preço das corridas tem <strong>R² de 0,85</strong>. Qual é a leitura correta?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">A reta acerta exatamente 85% das corridas.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">A reta erra, em média, 15% do preço de cada corrida.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">85% das corridas ficam acima da reta.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">D</span><span class="quiz-texto">A reta explica 85% da variação dos preços. O resto vem de coisas que ela não enxerga, como trânsito e horário.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">O R² compara a reta com o chute mais simples, que é prever o preço médio para todo mundo. Perto de 1, a reta explica quase toda a variação; perto de 0, ela não ajuda muito mais que a média. Ele não conta acertos exatos, e o erro em porcentagem é outra métrica (o MAPE).</p></div></div>
<div class="quiz" data-numero="3"><p class="quiz-numero">Questão 3</p><p class="quiz-enunciado">Dois modelos têm o <strong>mesmo MAE</strong>, de R$ 1,60 por corrida. O RMSE do modelo A é R$ 2,00, e o do modelo B é <strong>R$ 6,50</strong>. O que o RMSE alto do modelo B sugere?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">A</span><span class="quiz-texto">O modelo B tem alguns erros bem grandes escondidos na média.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">O modelo B erra mais em todas as corridas.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">O modelo B é mais preciso, porque o RMSE dele é maior.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Nada: com o mesmo MAE, os dois modelos são iguais.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">O RMSE eleva cada erro ao quadrado antes de tirar a média, então poucos erros grandes pesam muito nele. MAE igual e RMSE bem maior é o sinal de umas poucas previsões muito ruins. Vale investigar quais corridas são essas.</p></div></div>
<h2 id="regressao-multipla">Regressão múltipla<a class="ancora" href="#regressao-multipla" aria-label="Link para esta secao">#</a></h2>
<div class="quiz" data-numero="4"><p class="quiz-numero">Questão 4</p><p class="quiz-enunciado">Num modelo de aluguel com área, quartos, idade do prédio e bairro, o coeficiente de <strong>quartos é +220,10</strong>. O que esse número diz?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Todo apartamento com mais quartos custa R$ 220,10 a mais, não importa o tamanho.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">B</span><span class="quiz-texto">Um quarto a mais soma R$ 220,10 ao aluguel, comparando apartamentos de mesma área, idade e bairro.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Cada quarto custa R$ 220,10 por mês para ser mantido.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Quartos é a variável mais importante do modelo.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Na regressão múltipla, cada coeficiente mede o efeito de uma unidade a mais daquela variável <strong>com todas as outras paradas</strong>. É por isso que o coeficiente de uma variável muda quando outra entra no modelo: a pergunta que ele responde muda.</p></div></div>
<div class="quiz" data-numero="5"><p class="quiz-numero">Questão 5</p><p class="quiz-enunciado">No mesmo modelo, o coeficiente do bairro <strong>Jardins é +827,60</strong>, e o da <strong>área é +25,10</strong> por metro quadrado. Dá para concluir que o bairro importa muito mais que a área?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Sim: o coeficiente maior sempre indica a variável mais importante.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Sim: variáveis de texto, como o bairro, sempre pesam mais.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">Não: os dois coeficientes são positivos, então importam igualmente.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">D</span><span class="quiz-texto">Não: as unidades são diferentes. Vinte metros quadrados a mais já somam R$ 502, perto do efeito de trocar de bairro.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Um coeficiente é o efeito de <strong>uma unidade</strong> da variável. O do bairro é o efeito de mudar de bairro; o da área é o efeito de um único metro quadrado. Coeficiente grande não quer dizer variável importante: pode querer dizer só que a unidade daquela variável é pequena.</p></div></div>
<div class="quiz" data-numero="6"><p class="quiz-numero">Questão 6</p><p class="quiz-enunciado">Depois de colocar dezenas de colunas novas no modelo de aluguel, o <strong>R² no treino subiu</strong> de 0,931 para 0,947, e o <strong>R² no teste caiu</strong> de 0,947 para 0,927. O que aconteceu?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">O modelo melhorou, porque o R² do treino subiu.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">O conjunto de teste está com problema e deveria ser trocado.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">O modelo começou a decorar o ruído do treino e passou a prever pior os apartamentos novos.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Nada importante: diferenças de R² tão pequenas não significam nada.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Toda coluna nova faz o R² do treino subir ou ficar igual, mesmo que seja inútil. Quem mostra a verdade é o teste, com dados que o modelo nunca viu. Treino melhorando e teste piorando é o <strong>sobreajuste</strong>. A regularização, como o Lasso, é o freio contra ele.</p></div></div>
<h2 id="regressao-logistica">Regressão logística<a class="ancora" href="#regressao-logistica" aria-label="Link para esta secao">#</a></h2>
<div class="quiz" data-numero="7"><p class="quiz-numero">Questão 7</p><p class="quiz-enunciado">Num modelo de cancelamento de clientes, o coeficiente de <strong>chamados ao suporte é +0,996</strong>, e o de <strong>tempo de casa é −0,079</strong>. O que dá para concluir?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">A</span><span class="quiz-texto">Mais chamados aumentam o risco de cancelar, e mais tempo de casa diminui.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Cada chamado soma 99,6% de probabilidade de cancelar.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">O tempo de casa não importa, porque o coeficiente dele é quase zero.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Os dois aumentam o risco, porque o modelo só soma.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">O sinal diz a direção: positivo empurra o risco para cima, negativo puxa para baixo. O tamanho não é uma porcentagem, porque a sigmoide não é uma reta. E −0,079 é o efeito de <strong>um mês</strong> de casa: ao longo de dois anos, ele pesa bastante.</p></div></div>
<div class="quiz" data-numero="8"><p class="quiz-numero">Questão 8</p><p class="quiz-enunciado">Numa base de clientes, <strong>64% não cancelam</strong>. Um modelo de cancelamento tem <strong>acurácia de 75%</strong>. O que dá para dizer?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">É um ótimo modelo: 75% é uma nota alta.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">É um modelo ruim: abaixo de 80%, nenhum modelo serve.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">Ainda não dá para saber: um &quot;modelo&quot; que responde sempre &quot;fica&quot; já acerta 64%. É preciso olhar precisão, recall ou F1.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">O modelo encontra 75% dos clientes que cancelam.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Quando uma resposta é bem mais comum que a outra, a acurácia engana. Compare sempre com a taxa da classe mais comum e olhe as métricas que contam os cancelamentos encontrados. Encontrar 75% dos que cancelam seria um recall de 0,75, que é outra coisa.</p></div></div>
<div class="quiz" data-numero="9"><p class="quiz-numero">Questão 9</p><p class="quiz-enunciado">A equipe de retenção reclama: &quot;o modelo deixa passar muitos clientes que acabam cancelando&quot;. Qual métrica está baixa, e o que dá para fazer <strong>sem treinar o modelo de novo</strong>?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">A precisão. Dá para subir o limiar.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">A acurácia. Dá para trocar o modelo por um que responde sempre &quot;fica&quot;.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">O R². Dá para colocar mais variáveis.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">D</span><span class="quiz-texto">O recall. Dá para baixar o limiar, aceitando mais alarmes falsos.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">O recall responde &quot;dos que cancelaram, quantos o modelo apontou?&quot;. Baixar o limiar põe mais gente na lista: o modelo encontra mais cancelamentos, mas também aponta mais gente que ficaria, e a precisão cai. Onde cortar é uma decisão de negócio.</p></div></div>
<div class="quiz" data-numero="10"><p class="quiz-numero">Questão 10</p><p class="quiz-enunciado">O modelo de cancelamento tem <strong>AUC de 0,82</strong>. Qual é a leitura correta?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">A</span><span class="quiz-texto">Sorteando um cliente que cancelou e um que ficou, em 82% das vezes o modelo dá um risco maior ao que cancelou.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">O modelo acerta 82% dos clientes.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">82% dos clientes vão cancelar.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">O melhor limiar para esse modelo é 0,82.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">A AUC mede se o modelo <strong>ordena</strong> bem os clientes: 0,5 é chute, 1 é perfeito. Ela não depende de limiar nenhum, e por isso não é uma taxa de acertos. Como ela só olha a ordem, um modelo com boa AUC ainda pode dar probabilidades exageradas.</p></div></div>
<h2 id="treino-teste-e-ajuste">Treino, teste e ajuste<a class="ancora" href="#treino-teste-e-ajuste" aria-label="Link para esta secao">#</a></h2>
<div class="quiz" data-numero="11"><p class="quiz-numero">Questão 11</p><p class="quiz-enunciado">Um colega treina um modelo de aluguel com <strong>todos</strong> os 300 apartamentos e mede o R² <strong>nos mesmos 300</strong>: dá 0,95. Por que esse número não serve para dizer se o modelo é bom?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Porque o R² só vale para a regressão logística.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Porque 300 apartamentos é pouco. Com 3.000, medir no treino seria confiável.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">Porque o modelo está sendo medido em dados que já viu. O número sai otimista e não diz como ele vai com apartamentos novos.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">Serve, sim: usar todos os dados no treino deixa a medida mais honesta.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">É como dar a prova com as mesmas questões da lista de exercícios: a nota mostra quem decorou, não quem aprendeu. Por isso separamos um <strong>conjunto de teste</strong> que o modelo nunca vê durante o treino. Só ele mede o desempenho em casos novos.</p></div></div>
<div class="quiz" data-numero="12"><p class="quiz-numero">Questão 12</p><p class="quiz-enunciado">O que acontece numa <strong>validação cruzada com 5 dobras</strong>?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">A</span><span class="quiz-texto">O treino é dividido em 5 partes. O modelo treina 5 vezes, e em cada vez uma parte diferente fica de fora para servir de prova. A nota é a média das 5 provas.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">Os dados são divididos em 5 partes, e o modelo treina só com a melhor delas.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">O modelo treina 5 vezes com os mesmos dados, para ficar mais preciso a cada rodada.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">O conjunto de teste é dividido em 5, para medir o modelo final 5 vezes.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">A validação cruzada funciona como provas simuladas feitas só com o treino. Cada parte serve de prova uma vez, e a média das notas é mais estável que uma prova só. Assim dá para comparar modelos sem gastar o conjunto de teste, que fica guardado para o fim.</p></div></div>
<div class="quiz" data-numero="13"><p class="quiz-numero">Questão 13</p><p class="quiz-enunciado">Para escolher a força do freio da regularização, alguém testa 50 valores e fica com o que deu <strong>o melhor resultado no conjunto de teste</strong>. Depois, apresenta esse resultado como o desempenho do modelo. Qual é o problema?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">Nenhum: é para isso que serve o conjunto de teste.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">B</span><span class="quiz-texto">O teste passou a fazer parte da escolha. A nota dele sai otimista e deixa de ser uma prova honesta. A escolha deveria ser feita com validação cruzada no treino.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">50 valores é pouco. Com 500, o resultado no teste ficaria honesto.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">O problema é usar regularização. Sem ela, não haveria nada a escolher.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Toda escolha feita olhando para o teste &quot;vaza&quot; informação da prova para o modelo. Com 50 tentativas, alguma vai bem no teste por sorte. O caminho certo é escolher com validação cruzada (é o que o <code>LassoCV</code> e o <code>RidgeCV</code> fazem) e medir o escolhido no teste <strong>uma única vez</strong>, no fim.</p></div></div>
<div class="quiz" data-numero="14"><p class="quiz-numero">Questão 14</p><p class="quiz-enunciado">Qual destes é um <strong>hiperparâmetro</strong>, e não um parâmetro que o modelo aprende sozinho?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">O peso <code>w₁</code>, o preço por quilômetro da reta das corridas.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">O coeficiente do bairro Jardins no modelo de aluguel.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">C</span><span class="quiz-texto">O <code>w₀</code> da regressão logística de cancelamento.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">D</span><span class="quiz-texto">A força do freio <code>α</code> da regularização, que precisa ser escolhida antes do treino.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Os <strong>parâmetros</strong> (os pesos <code>w</code>) o modelo aprende sozinho com os dados, como um aluno aprende a matéria. Os <strong>hiperparâmetros</strong> são escolhas feitas antes do treino, como o professor decidir quanto tempo de revisão a turma vai ter. A força do freio e a taxa de aprendizado do gradiente descendente são hiperparâmetros: nós testamos valores e ficamos com o melhor.</p></div></div>
<div class="quiz" data-numero="15"><p class="quiz-numero">Questão 15</p><p class="quiz-enunciado">Num modelo de aluguel com 45 colunas (5 de verdade e 40 de números sorteados), o <strong>Lasso zerou 27 coeficientes</strong>. O que isso quer dizer?</p><ol class="quiz-opcoes"><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">A</span><span class="quiz-texto">O treino deu errado: um modelo bom não deveria ter coeficientes zero.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">B</span><span class="quiz-texto">As 27 colunas zeradas são as mais importantes do modelo.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="1"><span class="quiz-letra">C</span><span class="quiz-texto">O freio tirou do modelo as colunas que quase não ajudavam, e a maioria delas era ruído.</span></button></li><li><button class="quiz-opcao" type="button" data-certa="0"><span class="quiz-letra">D</span><span class="quiz-texto">O modelo passou a prever o mesmo valor para todos os apartamentos.</span></button></li></ol><div class="quiz-retorno" hidden><p class="quiz-veredito"></p><p class="quiz-explicacao">Sem freio, o modelo dá um pouco de peso até para colunas inúteis, porque isso reduz um tiquinho o erro no treino. A regularização cobra uma multa por coeficientes grandes. O <strong>Ridge</strong> encolhe todos os coeficientes sem zerar nenhum; o <strong>Lasso</strong> empurra os inúteis até zero, e a coluna sai do modelo. Por isso ele ajuda quando há muitas colunas suspeitas.</p></div></div>

<template class="pagina" data-id="sistemas-de-ml/aula-04-sistema-ponta-a-ponta" data-titulo="Aula 4 — Um Sistema de Ponta a Ponta" data-descricao="Um sistema de risco de cancelamento, do dado bruto à decisão">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>
<p>Um modelo sozinho não resolve o problema de ninguém. Nesta aula, você
constrói um sistema inteiro em volta da regressão logística da Aula 3:
separar os dados, criar uma régua, preparar a tabela, treinar, ajustar,
testar, explicar e decidir. Em aula, fazemos tudo no notebook. O projeto
<code>projeto-aula-04/</code> mostra o mesmo sistema organizado em arquivos, com um
painel.</p>
</div></div>
<h2 id="para-que-serve">Para que serve<a class="ancora" href="#para-que-serve" aria-label="Link para esta secao">#</a></h2>
<p>O Clube do Café é uma assinatura mensal de café em grãos, com 2.000
assinantes. Todo mês, alguns cancelam: 29% já cancelaram. A equipe pode
ligar para um cliente e oferecer um desconto, mas cada ligação custa
dinheiro. A pergunta da empresa é:</p>
<blockquote>
<p><strong>Para quem vale a pena ligar esta semana?</strong></p>
</blockquote>
<p>O sistema dá a cada cliente uma nota de risco, de 0 a 1, e transforma
essa nota numa lista de ligações.</p>
<h2 id="os-dados">Os dados<a class="ancora" href="#os-dados" aria-label="Link para esta secao">#</a></h2>
<p>Cada assinante tem dez informações: tempo de casa, plano, mensalidade,
forma de pagamento, se entrou com cupom, entregas atrasadas, reclamações
ao suporte, nota média dada aos cafés, dias sem entrar no app e idade. A
coluna <code>cancelou</code> é a resposta.</p>
<p>Dois problemas aparecem logo. 194 clientes nunca deram nota, então a
avaliação deles está vazia. E as colunas vivem em réguas muito
diferentes: a mensalidade vai de 30 a 150, e o cupom só vale 0 ou 1.</p>
<h2 id="a-prova-final-fica-trancada">A prova final fica trancada<a class="ancora" href="#a-prova-final-fica-trancada" aria-label="Link para esta secao">#</a></h2>
<p>Um bom professor não entrega a prova final como lista de exercícios. Com
o modelo é igual: 25% dos clientes vão para uma gaveta trancada, o
<strong>teste</strong>, que só é aberto no fim.</p>
<p>Para comparar modelos antes disso, usamos <strong>provas simuladas</strong>: o treino
é dividido em 5 pedaços, e cada pedaço serve de prova uma vez. A nota do
modelo é a média das 5 provas. É a <strong>validação cruzada</strong>.</p>
<h2 id="o-baseline-a-regua">O baseline: a régua<a class="ancora" href="#o-baseline-a-regua" aria-label="Link para esta secao">#</a></h2>
<p>O primeiro &quot;modelo&quot; é preguiçoso: responde sempre &quot;fica&quot;, sem olhar para
o cliente. Ele acerta 71% das vezes e não encontra nenhum cancelamento.
O F1 dele é zero.</p>
<p>Essa é a lição: quando uma resposta é bem mais comum que a outra, a
acurácia engana. O sistema é julgado pelo F1.</p>
<h2 id="o-preparo-uma-receita-para-cada-coluna">O preparo: uma receita para cada coluna<a class="ancora" href="#o-preparo-uma-receita-para-cada-coluna" aria-label="Link para esta secao">#</a></h2>
<p>Na cozinha, cada ingrediente tem seu preparo. Com os dados é igual:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Problema</th>
  <th>Onde</th>
  <th>Solução</th>
</tr>
</thead>
<tbody>
<tr>
  <td>células vazias</td>
  <td>avaliação</td>
  <td>preencher com a mediana e marcar quem não tinha nota</td>
</tr>
<tr>
  <td>réguas diferentes</td>
  <td>colunas de números</td>
  <td>padronizar</td>
</tr>
<tr>
  <td>texto em vez de número</td>
  <td>plano, forma de pagamento</td>
  <td>uma coluna de 0 e 1 por opção</td>
</tr>
<tr>
  <td>poucos valores enormes</td>
  <td>dias sem acessar</td>
  <td>encolher com o logaritmo</td>
</tr>
</tbody>
</table></div>
<p>Padronizar põe todas as colunas na mesma régua:</p>
<div class="formula" title="\text{valor padronizado} = \frac{\text{valor} - \text{média}}{\text{desvio padrão}}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>valor&#x000A0;padronizado</mtext><mo>&#x0003D;</mo><mfrac><mrow><mtext>valor</mtext><mo>&#x02212;</mo><mtext>média</mtext></mrow><mrow><mtext>desvio&#x000A0;padrão</mtext></mrow></mfrac></mrow></math></div>
<p>A mensalidade média é R$ 78,60, com desvio padrão de R$ 33,90. Quem paga
R$ 129 vira 1,5: um pouco acima do normal.</p>
<p>Cada receita é um <code>Pipeline</code>, uma lista de passos feitos em ordem. O
<code>ColumnTransformer</code> manda cada grupo de colunas para a sua receita e junta
tudo numa tabela só. O preparo fica na mesma peça que o modelo, para
aprender médias e medianas só com o treino, sem espiar a prova final.</p>
<h2 id="o-modelo-aprende-um-cliente-de-cada-vez">O modelo aprende um cliente de cada vez<a class="ancora" href="#o-modelo-aprende-um-cliente-de-cada-vez" aria-label="Link para esta secao">#</a></h2>
<p>Na regressão logística, cada característica soma ou tira pontos de risco,
e a sigmoide transforma o total num número entre 0 e 1. O que muda aqui é
o jeito de aprender os pesos.</p>
<p>O <strong>SGD</strong> (gradiente descendente estocástico) é um aprendiz que olha os
clientes um por um, em ordem sorteada. A cada palpite errado, ele ajusta
um pouquinho os pesos. Na Aula 1, o gradiente descendente olhava todos os
exemplos antes de cada ajuste; o SGD ajusta a cada exemplo.</p>
<p>Ele aprende rápido. Depois de ver 10 clientes, a AUC é 0,53, quase um
chute. Depois de 50, passa de 0,75. Depois de 300, está em 0,78, e cada
cliente novo ensina pouca coisa nova.</p>
<p>Sem nenhum ajuste, o modelo chega a F1 de 0,49 nas provas simuladas. O
baseline tinha zero.</p>
<h2 id="o-ajuste-fino-com-optuna">O ajuste fino com Optuna<a class="ancora" href="#o-ajuste-fino-com-optuna" aria-label="Link para esta secao">#</a></h2>
<p>Os pesos o modelo aprende sozinho. Os <strong>hiperparâmetros</strong> são escolhas
feitas antes do treino. Ajustamos dois:</p>
<ul>
<li><strong>a força do freio</strong> (<code>alpha</code>): impede o modelo de decorar os clientes
do treino. Freio de menos, ele decora; freio demais, fica simples demais;</li>
<li><strong>os pesos das classes</strong> (<code>class_weight</code>): com <code>&quot;balanced&quot;</code>, cada cliente
que cancelou conta como 1,7 cliente, e o modelo presta mais atenção em
quem é minoria.</li>
</ul>
<p>O Optuna procura a melhor combinação como quem acerta o sal de uma
receita: prova, ajusta, prova de novo. A nota de cada tentativa é o F1
nas provas simuladas.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="k">def</span><span class="w"> </span><span class="nf">avaliar</span><span class="p">(</span><span class="n">tentativa</span><span class="p">):</span>
    <span class="n">forca</span> <span class="o">=</span> <span class="n">tentativa</span><span class="o">.</span><span class="n">suggest_float</span><span class="p">(</span><span class="s2">"forca"</span><span class="p">,</span> <span class="mf">0.00001</span><span class="p">,</span> <span class="mf">0.1</span><span class="p">,</span> <span class="n">log</span><span class="o">=</span><span class="kc">True</span><span class="p">)</span>
    <span class="n">pesos</span> <span class="o">=</span> <span class="n">tentativa</span><span class="o">.</span><span class="n">suggest_categorical</span><span class="p">(</span><span class="s2">"pesos"</span><span class="p">,</span> <span class="p">[</span><span class="kc">None</span><span class="p">,</span> <span class="s2">"balanced"</span><span class="p">])</span>
    <span class="n">modelo</span> <span class="o">=</span> <span class="n">montar_modelo</span><span class="p">(</span><span class="n">forca</span><span class="p">,</span> <span class="n">pesos</span><span class="p">)</span>
    <span class="k">return</span> <span class="n">cross_val_score</span><span class="p">(</span><span class="n">modelo</span><span class="p">,</span> <span class="n">X_treino</span><span class="p">,</span> <span class="n">y_treino</span><span class="p">,</span> <span class="n">cv</span><span class="o">=</span><span class="n">dobras</span><span class="p">,</span> <span class="n">scoring</span><span class="o">=</span><span class="s2">"f1"</span><span class="p">)</span><span class="o">.</span><span class="n">mean</span><span class="p">()</span>
</code></pre></div>
<p>Em 30 tentativas, o F1 sobe de 0,49 para 0,58, com <code>&quot;balanced&quot;</code>.</p>
<h2 id="a-prova-final">A prova final<a class="ancora" href="#a-prova-final" aria-label="Link para esta secao">#</a></h2>
<p>O modelo ajustado treina com o treino inteiro e faz a prova uma única
vez. Dos 146 clientes do teste que cancelaram, ele encontra 113. O F1 é
0,62 e a AUC é 0,82, perto do que as provas simuladas prometiam: o modelo
aprendeu de verdade, não decorou.</p>
<h2 id="em-que-o-modelo-presta-atencao">Em que o modelo presta atenção<a class="ancora" href="#em-que-o-modelo-presta-atencao" aria-label="Link para esta secao">#</a></h2>
<p>Para saber quanto um jogador importa, tire ele de campo e veja quanto o
time piora. Aqui, tirar uma coluna é <strong>embaralhá-la</strong>: cada cliente recebe
o valor de outra pessoa. Quanto mais a AUC cai, mais importante era a
coluna. É a <strong>importância por permutação</strong>.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Coluna</th>
  <th>Queda na AUC</th>
</tr>
</thead>
<tbody>
<tr>
  <td>meses de casa</td>
  <td>0,125</td>
</tr>
<tr>
  <td>dias sem acessar</td>
  <td>0,048</td>
</tr>
<tr>
  <td>entregas atrasadas</td>
  <td>0,039</td>
</tr>
<tr>
  <td>avaliação média</td>
  <td>0,036</td>
</tr>
<tr>
  <td>idade</td>
  <td>0,000</td>
</tr>
</tbody>
</table></div>
<p>O tempo de casa é o que mais pesa. A idade não ajuda em nada e pode sair
do sistema. E importância não é causa: ela mostra em que o <em>modelo</em>
presta atenção, não o que faz o cliente sair.</p>
<h2 id="a-decisao-para-quem-ligar">A decisão: para quem ligar<a class="ancora" href="#a-decisao-para-quem-ligar" aria-label="Link para esta secao">#</a></h2>
<p>O modelo dá o risco. Quem decide a partir de que risco vale ligar é a
empresa. Esse corte é o <strong>limiar</strong>.</p>
<p>Suponha que cada ligação custe R$ 10, que 30% de quem ia cancelar aceite
o desconto, e que cada cliente salvo pague mais 4 meses. Ligar para 200
clientes custa R$ 2.000. Se 110 deles iam cancelar pagando R$ 80, o
desconto segura 33, que pagam R$ 10.560 a mais. O lucro é R$ 8.560.</p>
<p>Escolher o limiar também é um ajuste, então ele sai das provas simuladas,
e não da prova final. Com esses números, o melhor limiar é 0,25, e ele
rende uns 20% a mais que o 0,50. Se cada ligação custasse R$ 60, o melhor
limiar subiria para 0,85, e o 0,50 daria prejuízo. Mesmo modelo, mesmos
clientes, decisão diferente.</p>
<h2 id="e-se">E se?<a class="ancora" href="#e-se" aria-label="Link para esta secao">#</a></h2>
<p>Com o modelo pronto, dá para simular. O cliente de maior risco no teste
tem 97% de risco. Se as entregas dele não tivessem atrasado, o modelo
daria 90%. Zerando os atrasos de todo mundo, uns 190 clientes sairiam da
lista de ligações.</p>
<p>O simulador mostra o que o <em>modelo</em> prevê. O modelo aprendeu associações,
e só um teste na vida real mostra o efeito de uma mudança.</p>

<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>Como funciona</strong></p>
<p>Em equipe, você tem 45 minutos para construir um classificador que diga

<h2 id="o-desafio">O desafio<a class="ancora" href="#o-desafio" aria-label="Link para esta secao">#</a></h2>
<p>Em 1912, o Titanic afundou na primeira viagem. Os dados deste desafio
imitam os passageiros daquele navio: quem eram, em que classe viajavam,
com quantos parentes, quanto pagaram. Eles são <strong>sintéticos</strong>: nenhum
passageiro existe de verdade, e por isso a resposta não está em lugar
nenhum da internet.</p>
<p>A tarefa é a da Aula 3: uma classificação com duas respostas possíveis.
Sobreviveu (1) ou não sobreviveu (0).</p>
<h2 id="como-participar">Como participar<a class="ancora" href="#como-participar" aria-label="Link para esta secao">#</a></h2>
<ol>
<li>Forme a equipe e escolha um nome. Use sempre o mesmo nome em todos os
envios.</li>
<li>Abra o notebook do desafio no Colab (o botão está em <strong>Materiais</strong>, no
fim da página) e salve uma cópia no seu Drive.</li>
<li>Treine o seu classificador com <code>titanic_treino.csv</code>.</li>
<li>Preveja os 300 passageiros de <code>titanic_teste.csv</code>.</li>
<li>Rode a última célula do notebook: ela baixa o arquivo <code>envio.csv</code>.</li>
<li>Envie o arquivo no placar, na seção <strong>O placar</strong>, mais abaixo.</li>
</ol>

  <th>O que é</th>
</tr>
</thead>

  <td><code>id_passageiro</code></td>
  <td>o número do passageiro. Não é característica: não use no modelo</td>

<p>No treino, 35% dos passageiros sobreviveram. O teste tem a mesma
proporção, mas chega sem a coluna <code>sobreviveu</code>: a resposta fica só com o
professor.</p>
<h2 id="o-arquivo-de-envio">O arquivo de envio<a class="ancora" href="#o-arquivo-de-envio" aria-label="Link para esta secao">#</a></h2>

<p>A última célula do notebook já monta o arquivo nesse formato:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">envio</span> <span class="o">=</span> <span class="n">pd</span><span class="o">.</span><span class="n">DataFrame</span><span class="p">({</span>

<span class="p">})</span>
<span class="n">envio</span><span class="o">.</span><span class="n">to_csv</span><span class="p">(</span><span class="s2">"envio.csv"</span><span class="p">,</span> <span class="n">index</span><span class="o">=</span><span class="kc">False</span><span class="p">)</span>
</code></pre></div>
<p>Se o arquivo tiver algum problema (coluna faltando, passageiro a menos,
valor fora de 0 e 1), o placar recusa o envio e explica o que corrigir. O
envio recusado não conta no seu limite.</p>
<h2 id="como-o-placar-ordena">Como o placar ordena<a class="ancora" href="#como-o-placar-ordena" aria-label="Link para esta secao">#</a></h2>
<p>O placar mostra cinco métricas da Aula 3: acurácia, precisão, recall, F1
e AUC. A ordem é pelo <strong>F1</strong>, que junta precisão e recall num número só.</p>
<div class="formula" title="F_1 = \frac{2 \cdot \text{precisão} \cdot \text{recall}}{\text{precisão} + \text{recall}}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>F</mi><mn>1</mn></msub><mo>&#x0003D;</mo><mfrac><mrow><mn>2</mn><mo>&#x000B7;</mo><mtext>precisão</mtext><mo>&#x000B7;</mo><mtext>recall</mtext></mrow><mrow><mtext>precisão</mtext><mo>&#x0002B;</mo><mtext>recall</mtext></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td>precisão</td>
  <td>dos passageiros que o modelo disse que sobreviveram, a fração que sobreviveu de verdade</td>
</tr>
<tr>
  <td>recall</td>
  <td>dos passageiros que sobreviveram de verdade, a fração que o modelo encontrou</td>
</tr>
<tr>
  <td><code>F₁</code></td>
  <td>a média harmônica das duas: só fica alta se as duas forem altas</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: um modelo com precisão de 0,60 e recall de 0,70 tem F1 igual a
<code>2 × 0,60 × 0,70 / (0,60 + 0,70) = 0,646</code>.</p>
<p>O placar usa o F1 porque a acurácia engana aqui. Prever que <strong>ninguém</strong>
sobrevive acerta 65% dos passageiros, sem modelo nenhum, mas tem F1 zero:
não encontra um sobrevivente sequer. Essa previsão aparece no placar como
a régua. A sua equipe tem que ficar acima dela.</p>
<p>Em caso de empate no F1, desempata a AUC, que mede se o modelo dá
probabilidades maiores para quem sobreviveu.</p>
<h2 id="as-regras">As regras<a class="ancora" href="#as-regras" aria-label="Link para esta secao">#</a></h2>
<ul>
<li>Cada equipe pode enviar <strong>até 5 vezes</strong>. No placar, vale o melhor F1 da
equipe.</li>
<li>O nome da equipe não diferencia maiúsculas: &quot;Iceberg&quot; e &quot;iceberg&quot; são a
mesma equipe.</li>
<li>Use só os dados do desafio. O modelo é livre: o que vimos no curso ou
qualquer outro do scikit-learn.</li>
<li>O desafio dura 45 minutos. Quando o professor encerrar, vale o placar
daquele momento.</li>
</ul>
<h2 id="dicas">Dicas<a class="ancora" href="#dicas" aria-label="Link para esta secao">#</a></h2>
<ul>
<li><code>sexo</code>, <code>porto_embarque</code> e até <code>classe</code> são categorias. O
<code>pd.get_dummies</code> da Aula 2 transforma cada uma em colunas de 0 e 1.
Aplique a mesma transformação no treino e no teste.</li>
<li>A regressão logística da Aula 3 é um ótimo começo.</li>
<li>O limiar de 0,5 não é obrigatório. Baixar o limiar aumenta o recall, e
pode aumentar o F1.</li>
<li>Com só 5 envios, meça antes de enviar. Separe um pedaço do treino para
validação, ou use a validação cruzada da Aula 3. O placar não é lugar de
tentativa e erro.</li>
</ul>

<template class="pagina" data-id="series-temporais" data-titulo="Séries Temporais" data-descricao="Visão geral do módulo de Séries Temporais">
<p>Muitos problemas de previsão não são &quot;prever um valor a partir de outro&quot;.
São &quot;prever o futuro de algo que muda com o tempo&quot;. Vendas de uma loja,
número de acessos a um site, temperatura de uma cidade: tudo isso é uma
série temporal.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Aula</th>
  <th>Conteúdo</th>
  <th>Status</th>
</tr>
</thead>
<tbody>
<tr>
  <td><a href="#/series-temporais/aula-05-conceitos-series-temporais">Aula 5 — Conceitos de Séries Temporais</a></td>
  <td>Tendência, sazonalidade e ruído, o corte no tempo, previsões de referência, regressão com calendário e ARIMA</td>
  <td>Disponível</td>
</tr>

<template class="pagina" data-id="series-temporais/aula-05-conceitos-series-temporais" data-titulo="Aula 5 — Conceitos de Séries Temporais" data-descricao="Tendência, sazonalidade e ruído, as previsões simples que todo modelo precisa vencer, e os dois primeiros modelos: regressão com calendário e ARIMA">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>
<p>Você vai aprender a ler um gráfico ao longo do tempo, separando o que ele
tem de tendência, de padrão que se repete e de ruído. Vai fazer três
previsões sem modelo nenhum e usá-las como régua. Depois vai treinar os
dois primeiros modelos de verdade, uma regressão com o calendário e um
ARIMA, e ver quais deles vencem a régua.</p>
</div></div>
<h2 id="para-que-serve">Para que serve<a class="ancora" href="#para-que-serve" aria-label="Link para esta secao">#</a></h2>
<p>Uma cafeteria perto de escritórios abre todo dia e precisa decidir quanto
comprar de leite, quantos pães encomendar e quantas pessoas escalar. Errar
para cima é desperdício. Errar para baixo é cliente indo embora.</p>
<p>A pergunta é simples: quanto vamos vender amanhã? A diferença para as
aulas anteriores é que agora a ordem dos dados importa. O que aconteceu
ontem ajuda a explicar hoje, e uma linha da tabela não pode trocar de
lugar com outra.</p>
<p>Isso é uma <strong>série temporal</strong>: uma sequência de valores medidos ao longo
do tempo, em intervalos regulares. Vendas por dia, acessos por hora,
temperatura por minuto.</p>
<p>O dataset desta aula tem 1.096 dias de vendas, de janeiro de 2022 a
dezembro de 2024.</p>
<figure><img src="docs/assets/aula-04/serie_completa.png" alt="Gráfico de linha com três anos de vendas diárias, mostrando oscilação diária intensa e crescimento ao longo do tempo"><figcaption>Três anos de vendas. Parece bagunça, mas tem três padrões escondidos.</figcaption></figure>

<h2 id="as-tres-pecas-de-qualquer-serie">As três peças de qualquer série<a class="ancora" href="#as-tres-pecas-de-qualquer-serie" aria-label="Link para esta secao">#</a></h2>
<p>Toda série temporal pode ser lida como uma soma de peças. As três que
importam nesta aula:</p>
<ul>
<li><strong>Tendência</strong>: para onde o negócio caminha no longo prazo. Aqui, para
cima: a venda média foi de R$ 938 por dia em 2022 para R$ 1.267 em 2024.</li>
<li><strong>Sazonalidade</strong>: um padrão que se repete em intervalos fixos. Esta
série tem duas. Uma semanal (sábado vende mais que segunda) e uma anual
(o inverno vende mais café que o verão: R$ 1.222 contra R$ 976 por dia).</li>
<li><strong>Resto</strong>: o que sobra depois de tirar as duas primeiras. Parte é ruído
puro, parte é evento (um feriado, uma chuva forte, uma obra na rua).</li>
</ul>
<p>Ampliando doze semanas, dá para ver as três peças separadas:</p>
<figure><img src="docs/assets/aula-04/componentes.png" alt="Quatro painéis empilhados mostrando a série observada, a tendência suave, a onda semanal repetida e o resíduo em torno de zero"><figcaption>A mesma janela de 12 semanas, decomposta em três peças.</figcaption></figure>

<p>Repare no último painel. Aqueles dois mergulhos fundos não são ruído: são
feriados, quando os escritórios fecham e a cafeteria vende R$ 719 em vez
dos R$ 1.109 de um dia comum.</p>
<h2 id="a-media-movel">A média móvel<a class="ancora" href="#a-media-movel" aria-label="Link para esta secao">#</a></h2>
<p>Como se separa a tendência do resto? A ferramenta mais simples é a <strong>média
móvel</strong>: em vez de olhar o valor de cada dia, você olha a média dos
últimos dias.</p>
<div class="formula" title="\text{MM}_k(t) = \frac{1}{k}\sum_{i=0}^{k-1} y_{t-i}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mtext>MM</mtext><mi>k</mi></msub><mo stretchy="false">&#x00028;</mo><mi>t</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>k</mi></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>0</mn></mrow><mrow><mi>k</mi><mo>&#x02212;</mo><mn>1</mn></mrow></msubsup><msub><mi>y</mi><mrow><mi>t</mi><mo>&#x02212;</mo><mi>i</mi></mrow></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>k</code></td>
  <td>o tamanho da janela: quantos dias entram na média</td>
</tr>
<tr>
  <td><code>t</code></td>
  <td>o dia que você está olhando</td>
</tr>
<tr>
  <td><code>yₜ₋ᵢ</code></td>
  <td>o valor de <code>i</code> dias atrás</td>
</tr>
<tr>
  <td><code>MMₖ(t)</code></td>
  <td>a média móvel de <code>k</code> dias, no dia <code>t</code></td>
</tr>
</tbody>
</table></div>
<p>Exemplo com uma janela de 3 dias. Se as vendas foram R$ 900, R$ 1.100 e
R$ 1.000, a média móvel do terceiro dia é <code>(900 + 1.100 + 1.000) / 3 = 1.000</code>.</p>
<p>A janela decide o que você enxerga. Uma janela de 7 dias apaga a diferença
entre os dias da semana e deixa o mês aparecer. Uma de 30 dias apaga
também o mês e deixa só o rumo do ano.</p>
<figure><img src="docs/assets/aula-04/media_movel.png" alt="Vendas diárias em cinza com duas linhas de média móvel por cima, uma de 7 dias e outra de 30 dias, cada vez mais suaves"><figcaption>Quanto maior a janela, mais lisa a linha, e menos detalhe sobra.</figcaption></figure>

<p>Uma janela de 7 dias é a escolha natural aqui, porque a sazonalidade
principal é semanal. A regra vale em geral: use uma janela do tamanho do
ciclo que você quer apagar.</p>
<h2 id="o-padrao-semanal">O padrão semanal<a class="ancora" href="#o-padrao-semanal" aria-label="Link para esta secao">#</a></h2>
<p>Vale olhar a sazonalidade semanal de frente. Basta tirar a média de cada
dia da semana ao longo dos três anos.</p>
<figure><img src="docs/assets/aula-04/perfil_semanal.png" alt="Gráfico de barras com a venda média de cada dia da semana, mostrando sábado no topo e segunda-feira embaixo"><figcaption>Sábado vende R$ 334 a mais que segunda, todas as semanas, há três anos.</figcaption></figure>

<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Dia</th>
  <th>Venda média</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Segunda</td>
  <td>R$ 953</td>
</tr>
<tr>
  <td>Terça</td>
  <td>R$ 1.025</td>
</tr>
<tr>
  <td>Quarta</td>
  <td>R$ 1.027</td>
</tr>
<tr>
  <td>Quinta</td>
  <td>R$ 1.070</td>
</tr>
<tr>
  <td>Sexta</td>
  <td>R$ 1.128</td>
</tr>
<tr>
  <td>Sábado</td>
  <td>R$ 1.287</td>
</tr>
<tr>
  <td>Domingo</td>
  <td>R$ 1.216</td>
</tr>
</tbody>
</table></div>
<p>Esse desenho é estável, e é exatamente por isso que ele serve para prever.
Um padrão que se repete há três anos provavelmente se repete na semana que
vem.</p>
<h2 id="a-regra-de-ouro-o-corte-e-no-tempo">A regra de ouro: o corte é no tempo<a class="ancora" href="#a-regra-de-ouro-o-corte-e-no-tempo" aria-label="Link para esta secao">#</a></h2>
<p>Aqui mora o erro mais caro do assunto inteiro.</p>
<p>Nas aulas anteriores, separar treino e teste era sorteio: pegue 80% das
linhas ao acaso para treinar e 20% para testar. Em série temporal isso
está <strong>errado</strong>. Sortear linhas significa treinar com dados de dezembro
para prever novembro, e ninguém prevê o passado.</p>
<p>O corte é sempre no tempo. O treino é tudo até uma data, e o teste é o que
vem depois.</p>
<figure><img src="docs/assets/aula-04/treino_teste.png" alt="Série temporal com uma linha vertical separando o período de treino, à esquerda, do período de teste, à direita"><figcaption>Treino de um lado, teste do outro. Nunca embaralhado.</figcaption></figure>

<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Usar <code>train_test_split</code> do scikit-learn numa série temporal, com o
<code>shuffle</code> no valor padrão. O código roda, as métricas saem ótimas, e o
resultado não vale nada: o modelo viu o futuro durante o treino. Isso se
chama <strong>vazamento de dados</strong> (<em>data leakage</em>), e o sintoma é sempre o
mesmo. Um desempenho excelente no teste que não se repete na vida real.</p>
</div></div>
<h2 id="tres-previsoes-sem-modelo-nenhum">Três previsões sem modelo nenhum<a class="ancora" href="#tres-previsoes-sem-modelo-nenhum" aria-label="Link para esta secao">#</a></h2>
<p>Antes de treinar qualquer coisa, faça as previsões mais burras possíveis.
Elas são a régua: um modelo que não vence essas três não está pagando o
próprio trabalho.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Previsão de referência</th>
  <th>Regra</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Ingênua (<em>naïve</em>)</td>
  <td>amanhã vai ser igual a hoje</td>
</tr>
<tr>
  <td>Média móvel</td>
  <td>amanhã vai ser a média dos últimos 7 dias</td>
</tr>
<tr>
  <td>Sazonal ingênua</td>
  <td>amanhã vai ser igual ao mesmo dia da semana passada</td>
</tr>
</tbody>
</table></div>
<p>As três, escritas como fórmula:</p>
<div class="formula" title="\hat{y}_{t+1} = y_t \qquad \hat{y}_{t+1} = \frac{1}{7}\sum_{i=0}^{6} y_{t-i} \qquad \hat{y}_{t+1} = y_{t-6}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mrow><mi>t</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msub><mo>&#x0003D;</mo><msub><mi>y</mi><mi>t</mi></msub><mspace width="2em" /><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mrow><mi>t</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msub><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>7</mn></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>0</mn></mrow><mrow><mn>6</mn></mrow></msubsup><msub><mi>y</mi><mrow><mi>t</mi><mo>&#x02212;</mo><mi>i</mi></mrow></msub><mspace width="2em" /><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mrow><mi>t</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msub><mo>&#x0003D;</mo><msub><mi>y</mi><mrow><mi>t</mi><mo>&#x02212;</mo><mn>6</mn></mrow></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>ŷₜ₊₁</code></td>
  <td>a previsão para o dia seguinte</td>
</tr>
<tr>
  <td><code>yₜ</code></td>
  <td>o valor observado hoje</td>
</tr>
<tr>
  <td><code>yₜ₋₆</code></td>
  <td>o valor de seis dias atrás, o mesmo dia da semana passada</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: no sábado a cafeteria vendeu R$ 1.300. Para o domingo, a ingênua
prevê os mesmos R$ 1.300. A sazonal ingênua prevê o que o domingo passado
vendeu.</p>
<figure><img src="docs/assets/aula-04/baselines.png" alt="Gráfico com o período de teste e três linhas de previsão: uma reta horizontal da previsão ingênua, outra da média, e uma linha em zigue-zague da sazonal ingênua"><figcaption>Só a sazonal ingênua acompanha o sobe e desce da semana.</figcaption></figure>

<p>Nos últimos 28 dias, guardados como teste:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Previsão</th>
  <th>MAE</th>
  <th>RMSE</th>
  <th>MAPE</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Ingênua</td>
  <td>R$ 121,28</td>
  <td>R$ 156,45</td>
  <td>10,3%</td>
</tr>
<tr>
  <td>Média de 7 dias</td>
  <td>R$ 115,93</td>
  <td>R$ 154,73</td>
  <td>10,4%</td>
</tr>
<tr>
  <td>Sazonal ingênua</td>
  <td>R$ 63,78</td>
  <td>R$ 110,80</td>
  <td>6,0%</td>
</tr>
</tbody>
</table></div>
<p>A sazonal ingênua erra quase metade das outras duas, e não usa modelo
nenhum: ela só repete a última semana. Qualquer modelo desta série tem que
começar batendo R$ 63,78 de MAE.</p>
<h2 id="mape-o-erro-em-porcentagem">MAPE: o erro em porcentagem<a class="ancora" href="#mape-o-erro-em-porcentagem" aria-label="Link para esta secao">#</a></h2>
<p>MAE, RMSE e MAPE você já conhece da Aula 1. Aqui o MAPE ganha uma
importância extra, e vale relembrar por quê: ele mede o erro como fração
do valor real, e por isso compara períodos de movimento diferente.</p>
<div class="formula" title="\text{MAPE} = \frac{100}{n}\sum_{t=1}^{n}\left|\frac{y_t - \hat{y}_t}{y_t}\right|"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>MAPE</mtext><mo>&#x0003D;</mo><mfrac><mrow><mn>100</mn></mrow><mrow><mi>n</mi></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>t</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mrow><mo stretchy="true" fence="true" form="prefix">&#x0007C;</mo><mfrac><mrow><msub><mi>y</mi><mi>t</mi></msub><mo>&#x02212;</mo><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>t</mi></msub></mrow><mrow><msub><mi>y</mi><mi>t</mi></msub></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">&#x0007C;</mo></mrow></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>yₜ</code></td>
  <td>o valor real no dia <code>t</code></td>
</tr>
<tr>
  <td><code>ŷₜ</code></td>
  <td>o valor previsto para o dia <code>t</code></td>
</tr>
<tr>
  <td>barras verticais</td>
  <td>valor absoluto: o erro sempre conta positivo</td>
</tr>
<tr>
  <td>resultado</td>
  <td>o erro médio em porcentagem do valor real</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: um erro de R$ 60 num dia de R$ 1.200 é 5%. O mesmo erro de R$ 60
num dia de R$ 600 é 10%. O MAPE conta o segundo como pior, e é isso que o
torna útil para comparar períodos de movimento diferente.</p>
<p>O cuidado com o MAPE: ele explode quando o valor real chega perto de zero.
Numa série que passa por zero, use MAE.</p>
<h2 id="o-primeiro-modelo-uma-regressao-com-o-calendario">O primeiro modelo: uma regressão com o calendário<a class="ancora" href="#o-primeiro-modelo-uma-regressao-com-o-calendario" aria-label="Link para esta secao">#</a></h2>
<p>A sazonal ingênua é boa, mas não sabe nada. Ela não sabe que o negócio
cresce, que dezembro vende menos que julho, nem que o Natal existe. Ela
só copia a semana passada.</p>
<p>Você já conhece uma ferramenta que aprende esse tipo de coisa: a
regressão múltipla da Aula 2. O truque é transformar o calendário em
colunas. Cada peça da série vira uma coluna da tabela.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Peça da série</th>
  <th>Coluna na tabela</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Tendência</td>
  <td><code>dia_numero</code>: 0 no primeiro dia, 1 no segundo, e assim por diante</td>
</tr>
<tr>
  <td>Sazonalidade semanal</td>
  <td>uma variável indicadora por dia da semana, com a segunda como referência</td>
</tr>
<tr>
  <td>Sazonalidade anual</td>
  <td>uma variável indicadora por mês, com janeiro como referência</td>
</tr>
<tr>
  <td>Feriado</td>
  <td>a coluna <code>feriado</code>, que já vem no arquivo com 0 ou 1</td>
</tr>
</tbody>
</table></div>
<p>As variáveis indicadoras são as mesmas colunas de 0 e 1 que você usou
para os bairros na Aula 2. Um sábado tem 1 na coluna do sábado e 0 nas
outras. A segunda-feira tem 0 em todas, porque é a categoria de
referência.</p>
<p>A regressão soma um peso para cada coluna, como sempre. Mostrando só
quatro das 19 colunas:</p>
<div class="formula" title="\hat{y}_t = w_0 + w_1 \cdot t + w_2 \cdot \text{sábado}_t + w_3 \cdot \text{feriado}_t + \dots"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>t</mi></msub><mo>&#x0003D;</mo><msub><mi>w</mi><mn>0</mn></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>1</mn></msub><mo>&#x000B7;</mo><mi>t</mi><mo>&#x0002B;</mo><msub><mi>w</mi><mn>2</mn></msub><mo>&#x000B7;</mo><msub><mtext>sábado</mtext><mi>t</mi></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>3</mn></msub><mo>&#x000B7;</mo><msub><mtext>feriado</mtext><mi>t</mi></msub><mo>&#x0002B;</mo><mo>&#x02026;</mo></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>ŷₜ</code></td>
  <td>a venda prevista para o dia <code>t</code></td>
</tr>
<tr>
  <td><code>t</code></td>
  <td>o número do dia, a coluna <code>dia_numero</code></td>
</tr>
<tr>
  <td><code>w₁</code></td>
  <td>quanto a venda cresce a cada dia que passa: a tendência</td>
</tr>
<tr>
  <td><code>sábadoₜ</code>, <code>feriadoₜ</code></td>
  <td>colunas de 0 ou 1: valem 1 se o dia <code>t</code> é sábado, ou feriado</td>
</tr>
<tr>
  <td><code>w₂</code>, <code>w₃</code></td>
  <td>quanto um sábado soma, e quanto um feriado tira</td>
</tr>
</tbody>
</table></div>
<p>O modelo completo, treinado nos 1.068 dias de treino, aprendeu estes pesos
(entre outros):</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Peso</th>
  <th>Valor</th>
  <th>Tradução</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>w₀</code></td>
  <td>R$ 603</td>
  <td>uma segunda de janeiro, no primeiro dia da série</td>
</tr>
<tr>
  <td><code>w₁</code></td>
  <td>R$ 0,45 por dia</td>
  <td>cerca de R$ 164 a mais por dia de venda a cada ano</td>
</tr>
<tr>
  <td>sábado</td>
  <td>+ R$ 337</td>
  <td>um sábado vende R$ 337 a mais que uma segunda</td>
</tr>
<tr>
  <td>julho</td>
  <td>+ R$ 236</td>
  <td>julho vende R$ 236 a mais que janeiro</td>
</tr>
<tr>
  <td>feriado</td>
  <td>− R$ 387</td>
  <td>um feriado derruba a venda em R$ 387</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: o Natal de 2024 caiu numa quarta, o dia 1.089 da série, em
dezembro. A conta fica <code>603 + 0,45 × 1.089 + 80 + 1 − 387 ≈ 787</code>. Os R$ 80
são o peso da quarta, e o R$ 1 é o peso de dezembro. A cafeteria vendeu
R$ 780 naquele dia.</p>
<h3 id="uma-peca-de-cada-vez">Uma peça de cada vez<a class="ancora" href="#uma-peca-de-cada-vez" aria-label="Link para esta secao">#</a></h3>
<p>O jeito mais claro de ver o que cada coluna faz é treinar três versões,
cada uma com uma peça a mais, e medir as três nos mesmos 28 dias de teste.</p>
<figure><img src="docs/assets/aula-04/regressao.png" alt="Gráfico do período de teste com as vendas reais e três previsões de regressão: uma tracejada, alta demais, e duas que acompanham as vendas, sendo que só uma mergulha no Natal"><figcaption>Sem o mês, a regressão erra para cima o mês inteiro. Sem o feriado, ela não vê o Natal.</figcaption></figure>

<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Regressão</th>
  <th>MAE</th>
  <th>RMSE</th>
  <th>MAPE</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Tendência + semana</td>
  <td>R$ 131,63</td>
  <td>R$ 159,24</td>
  <td>11,7%</td>
</tr>
<tr>
  <td>+ mês</td>
  <td>R$ 60,21</td>
  <td>R$ 95,17</td>
  <td>5,5%</td>
</tr>
<tr>
  <td>+ feriado</td>
  <td>R$ 44,11</td>
  <td>R$ 60,12</td>
  <td>3,6%</td>
</tr>
</tbody>
</table></div>
<p>A primeira versão é <strong>pior que todas as previsões de referência</strong>. Ela
sabe o dia da semana e a tendência, mas não sabe que dezembro é baixa
temporada, e erra para cima o mês inteiro. Um modelo de verdade pode, sim,
perder da régua.</p>
<p>A coluna do mês conserta isso e já vence a régua. A coluna de feriado
acerta o Natal, e o erro médio cai para R$ 44. Cada peça que você conhece
do negócio vira uma coluna, e cada coluna conserta um erro diferente.</p>
<h2 id="o-passado-como-variavel-a-ideia-do-arima">O passado como variável: a ideia do ARIMA<a class="ancora" href="#o-passado-como-variavel-a-ideia-do-arima" aria-label="Link para esta secao">#</a></h2>
<p>A regressão com calendário usa a data para prever. Existe outro caminho:
usar as próprias vendas dos dias anteriores.</p>
<figure><img src="docs/assets/aula-04/defasagens.png" alt="Dois gráficos de dispersão lado a lado: as vendas de hoje contra as de ontem, com correlação 0,70, e contra as de 7 dias atrás, com correlação 0,86, mais concentrada numa diagonal"><figcaption>Hoje se parece com ontem, e se parece ainda mais com o mesmo dia da semana passada.</figcaption></figure>

<p>Uma coluna com o valor de alguns dias atrás se chama <strong>defasagem</strong>
(<em>lag</em>). O <strong>ARIMA</strong> é um modelo clássico que prevê a série usando só o
passado dela mesma. Ele faz três perguntas, e cada resposta é um número
que você escolhe. Por isso ele se escreve ARIMA(p, d, q).</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Número</th>
  <th>A pergunta que ele responde</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>p</code></td>
  <td>quantos dias do passado entram como coluna?</td>
</tr>
<tr>
  <td><code>d</code></td>
  <td>o modelo prevê o valor ou a mudança de um dia para o outro?</td>
</tr>
<tr>
  <td><code>q</code></td>
  <td>quantos erros recentes o modelo usa para se corrigir?</td>
</tr>
</tbody>
</table></div>
<p>Vale ver um de cada vez.</p>
<h3 id="p-quantos-dias-do-passado-entram">p: quantos dias do passado entram<a class="ancora" href="#p-quantos-dias-do-passado-entram" aria-label="Link para esta secao">#</a></h3>
<p>A primeira letra, AR, quer dizer <strong>autorregressão</strong>: uma regressão da
série contra as próprias defasagens. É a regressão da Aula 1, só que as
colunas de entrada são as vendas dos dias anteriores. O <code>p</code> diz quantas
dessas colunas entram. Com <code>p = 2</code>:</p>
<div class="formula" title="\hat{y}_t = w_0 + w_1 \cdot y_{t-1} + w_2 \cdot y_{t-2}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>t</mi></msub><mo>&#x0003D;</mo><msub><mi>w</mi><mn>0</mn></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>1</mn></msub><mo>&#x000B7;</mo><msub><mi>y</mi><mrow><mi>t</mi><mo>&#x02212;</mo><mn>1</mn></mrow></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>2</mn></msub><mo>&#x000B7;</mo><msub><mi>y</mi><mrow><mi>t</mi><mo>&#x02212;</mo><mn>2</mn></mrow></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>ŷₜ</code></td>
  <td>a venda prevista para hoje</td>
</tr>
<tr>
  <td><code>yₜ₋₁</code>, <code>yₜ₋₂</code></td>
  <td>as vendas de ontem e de anteontem, que já aconteceram</td>
</tr>
<tr>
  <td><code>w₀</code>, <code>w₁</code>, <code>w₂</code></td>
  <td>os pesos, aprendidos no treino como em qualquer regressão</td>
</tr>
</tbody>
</table></div>
<p>Exemplo, com pesos ilustrativos: <code>w₀ = 250</code>, <code>w₁ = 0,5</code> e <code>w₂ = 0,3</code>.
Ontem a cafeteria vendeu R$ 1.200 e anteontem R$ 1.100. A previsão para
hoje é <code>250 + 0,5 × 1.200 + 0,3 × 1.100 = 1.180</code> reais.</p>
<p>Com <code>p = 1</code>, só ontem entra. Com <code>p = 0</code>, nenhum dia entra, e sobram as
outras duas ideias.</p>
<h3 id="d-prever-o-valor-ou-a-mudanca">d: prever o valor ou a mudança?<a class="ancora" href="#d-prever-o-valor-ou-a-mudanca" aria-label="Link para esta secao">#</a></h3>
<p>Um ARIMA com <code>d = 0</code> prevê o valor das vendas diretamente. O problema é
que ele supõe que a série oscila em torno de um nível fixo, e a nossa
série sobe. O ARIMA(1,0,0) mostra o estrago: nos dias de teste, a
previsão escorrega para R$ 1.097, a média dos três anos, que mistura 2022
com 2024. O erro médio vai a R$ 166,82, pior que qualquer previsão de
referência.</p>
<p>Com <code>d = 1</code>, o modelo passa a olhar a <strong>diferença</strong> entre dois dias
seguidos:</p>
<div class="formula" title="\Delta y_t = y_t - y_{t-1}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>&#x00394;</mi><msub><mi>y</mi><mi>t</mi></msub><mo>&#x0003D;</mo><msub><mi>y</mi><mi>t</mi></msub><mo>&#x02212;</mo><msub><mi>y</mi><mrow><mi>t</mi><mo>&#x02212;</mo><mn>1</mn></mrow></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>Δyₜ</code></td>
  <td>a mudança de ontem para hoje</td>
</tr>
<tr>
  <td><code>yₜ</code>, <code>yₜ₋₁</code></td>
  <td>as vendas de hoje e de ontem</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: uma série que vendeu R$ 1.000, R$ 1.010, R$ 1.020 e R$ 1.030
sobe sem parar. As diferenças são 10, 10 e 10: uma série parada, fácil de
prever. O modelo prevê a próxima mudança (mais 10) e soma ao último valor.
A previsão é R$ 1.040.</p>
<p>É assim que o ARIMA lida com a tendência. A regra prática: se o gráfico
sobe ou desce, use <code>d = 1</code>; se ele oscila em torno de um nível estável,
<code>d = 0</code>. Quase nunca é preciso passar de 1.</p>
<p>Um caso curioso: o ARIMA(0,1,0) não usa dia nenhum (<code>p = 0</code>), nem erro
nenhum (<code>q = 0</code>). Ele prevê mudança zero, e repete o último valor. É a
previsão ingênua, com o mesmo MAE de R$ 121,28.</p>
<h3 id="q-corrigir-com-o-erro-de-ontem">q: corrigir com o erro de ontem<a class="ancora" href="#q-corrigir-com-o-erro-de-ontem" aria-label="Link para esta secao">#</a></h3>
<p>A terceira letra, MA, vem de <em>moving average</em>, média móvel. O nome
confunde: não é a média móvel das vendas que você viu no começo da aula.
Aqui, o modelo guarda o próprio erro de ontem e usa uma parte dele para
corrigir a previsão de hoje. O <code>q</code> diz quantos erros para trás entram.
Com <code>q = 1</code>:</p>
<div class="formula" title="\hat{y}_t = w_0 + w_1 \cdot \varepsilon_{t-1}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>t</mi></msub><mo>&#x0003D;</mo><msub><mi>w</mi><mn>0</mn></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>1</mn></msub><mo>&#x000B7;</mo><msub><mi>&#x003B5;</mi><mrow><mi>t</mi><mo>&#x02212;</mo><mn>1</mn></mrow></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>εₜ₋₁</code></td>
  <td>o erro de ontem: o que vendeu menos o que o modelo tinha previsto</td>
</tr>
<tr>
  <td><code>w₁</code></td>
  <td>quanto desse erro vira correção hoje</td>
</tr>
<tr>
  <td><code>w₀</code></td>
  <td>o nível da previsão antes da correção</td>
</tr>
</tbody>
</table></div>
<p>Exemplo, com pesos ilustrativos: ontem o modelo previu R$ 1.100 e a
cafeteria vendeu R$ 1.150. O erro foi <code>ε = +50</code>. Com <code>w₀ = 1.100</code> e
<code>w₁ = 0,4</code>, a previsão de hoje é <code>1.100 + 0,4 × 50 = 1.120</code> reais. O
modelo sobe um pouco, sem acreditar totalmente num dia só.</p>
<p>Na prática, corrigir com os erros faz o modelo tirar uma média ponderada
dos últimos dias, em vez de copiar o último. O ARIMA(0,1,1) desta série
erra R$ 115,93, o mesmo que a média dos últimos 7 dias.</p>
<h3 id="os-tres-numeros-juntos">Os três números juntos<a class="ancora" href="#os-tres-numeros-juntos" aria-label="Link para esta secao">#</a></h3>
<p>O ARIMA(1,1,1) usa as três ideias ao mesmo tempo: ele prevê a mudança de
hoje (<code>d = 1</code>) a partir da mudança de ontem (<code>p = 1</code>) e do erro de ontem
(<code>q = 1</code>).</p>
<div class="formula" title="\Delta \hat{y}_t = w_0 + w_1 \cdot \Delta y_{t-1} + w_2 \cdot \varepsilon_{t-1}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>&#x00394;</mi><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>t</mi></msub><mo>&#x0003D;</mo><msub><mi>w</mi><mn>0</mn></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>1</mn></msub><mo>&#x000B7;</mo><mi>&#x00394;</mi><msub><mi>y</mi><mrow><mi>t</mi><mo>&#x02212;</mo><mn>1</mn></mrow></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>2</mn></msub><mo>&#x000B7;</mo><msub><mi>&#x003B5;</mi><mrow><mi>t</mi><mo>&#x02212;</mo><mn>1</mn></mrow></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>Δŷₜ</code></td>
  <td>a mudança prevista de ontem para hoje</td>
</tr>
<tr>
  <td><code>Δyₜ₋₁</code></td>
  <td>a mudança que aconteceu de anteontem para ontem</td>
</tr>
<tr>
  <td><code>εₜ₋₁</code></td>
  <td>o erro do modelo ontem</td>
</tr>
<tr>
  <td><code>w₀</code>, <code>w₁</code>, <code>w₂</code></td>
  <td>os pesos, aprendidos no treino</td>
</tr>
</tbody>
</table></div>
<p>Exemplo, com pesos ilustrativos <code>w₀ = 0</code>, <code>w₁ = 0,3</code> e <code>w₂ = 0,5</code>.
Anteontem a cafeteria vendeu R$ 1.150 e ontem R$ 1.200, então a mudança
foi +50. O erro do modelo ontem foi +30. A mudança prevista é
<code>0,3 × 50 + 0,5 × 30 = 30</code>, e a previsão de hoje é <code>1.200 + 30 = 1.230</code>
reais.</p>
<p>No Python, com a biblioteca <code>statsmodels</code>, o <code>order</code> recebe os três
números nesta ordem:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">modelo</span> <span class="o">=</span> <span class="n">ARIMA</span><span class="p">(</span><span class="n">treino</span><span class="p">[</span><span class="s2">"vendas"</span><span class="p">],</span> <span class="n">order</span><span class="o">=</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="mi">1</span><span class="p">,</span> <span class="mi">1</span><span class="p">))</span><span class="o">.</span><span class="n">fit</span><span class="p">()</span>
<span class="n">previsao</span> <span class="o">=</span> <span class="n">modelo</span><span class="o">.</span><span class="n">forecast</span><span class="p">(</span><span class="mi">28</span><span class="p">)</span>
</code></pre></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>ARIMA</th>
  <th>O que faz</th>
  <th>MAE</th>
</tr>
</thead>
<tbody>
<tr>
  <td>(0,1,0)</td>
  <td>repete o último dia: é a previsão ingênua</td>
  <td>R$ 121,28</td>
</tr>
<tr>
  <td>(1,0,0)</td>
  <td>olha ontem, mas volta para a média dos três anos</td>
  <td>R$ 166,82</td>
</tr>
<tr>
  <td>(1,1,1)</td>
  <td>prevê a mudança, com ontem e com o erro de ontem</td>
  <td>R$ 116,45</td>
</tr>
</tbody>
</table></div>
<p>Nenhum deles passa perto da régua. Todos olham só os últimos dias, e por
isso nenhum enxerga a semana.</p>
<h3 id="a-versao-sazonal">A versão sazonal<a class="ancora" href="#a-versao-sazonal" aria-label="Link para esta secao">#</a></h3>
<p>A solução é a <strong>versão sazonal</strong>. Ela faz as mesmas três perguntas, só
que com um passo do tamanho do ciclo: em vez de comparar hoje com ontem,
compara hoje com o mesmo dia da semana passada. No código, é um segundo
grupo de quatro números, o <code>seasonal_order=(P, D, Q, s)</code>.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Número</th>
  <th>Igual a</th>
  <th>Mas olhando para</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>P</code></td>
  <td><code>p</code></td>
  <td>o mesmo dia da semana, 1, 2... semanas atrás</td>
</tr>
<tr>
  <td><code>D</code></td>
  <td><code>d</code></td>
  <td>a mudança contra 7 dias atrás, e não contra ontem</td>
</tr>
<tr>
  <td><code>Q</code></td>
  <td><code>q</code></td>
  <td>o erro do mesmo dia da semana passada</td>
</tr>
<tr>
  <td><code>s</code></td>
  <td>(novo)</td>
  <td>o tamanho do ciclo: 7 dias</td>
</tr>
</tbody>
</table></div>
<p>A diferença sazonal (<code>D = 1</code>) é a peça mais importante:</p>
<div class="formula" title="\Delta_7 y_t = y_t - y_{t-7}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>&#x00394;</mi><mn>7</mn></msub><msub><mi>y</mi><mi>t</mi></msub><mo>&#x0003D;</mo><msub><mi>y</mi><mi>t</mi></msub><mo>&#x02212;</mo><msub><mi>y</mi><mrow><mi>t</mi><mo>&#x02212;</mo><mn>7</mn></mrow></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>Δ₇yₜ</code></td>
  <td>a mudança de hoje em relação ao mesmo dia da semana passada</td>
</tr>
<tr>
  <td><code>yₜ₋₇</code></td>
  <td>a venda de 7 dias atrás</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: no sábado passado a cafeteria vendeu R$ 1.400; neste sábado,
R$ 1.450. A diferença sazonal é R$ 50. O salto de sexta para sábado some
da conta, porque o modelo compara sábado com sábado.</p>
<p>Montando o modelo peça por peça:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>ARIMA</th>
  <th>O que faz</th>
  <th>MAE</th>
</tr>
</thead>
<tbody>
<tr>
  <td>(0,0,0)(0,1,0,7)</td>
  <td>repete a semana passada: é a sazonal ingênua</td>
  <td>R$ 63,78</td>
</tr>
<tr>
  <td>(0,0,0)(0,1,1,7)</td>
  <td>repete a semana passada e corrige com o erro dela</td>
  <td>R$ 61,12</td>
</tr>
<tr>
  <td>(1,1,1)(0,1,1,7)</td>
  <td>junta tudo: ontem, a semana passada e os erros</td>
  <td>R$ 57,57</td>
</tr>
</tbody>
</table></div>
<p>A régua era, o tempo todo, um ARIMA sazonal sem nenhum peso. Cada número a
mais corrige um pouco dela.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">modelo</span> <span class="o">=</span> <span class="n">ARIMA</span><span class="p">(</span><span class="n">treino</span><span class="p">[</span><span class="s2">"vendas"</span><span class="p">],</span> <span class="n">order</span><span class="o">=</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="mi">1</span><span class="p">,</span> <span class="mi">1</span><span class="p">),</span>
               <span class="n">seasonal_order</span><span class="o">=</span><span class="p">(</span><span class="mi">0</span><span class="p">,</span> <span class="mi">1</span><span class="p">,</span> <span class="mi">1</span><span class="p">,</span> <span class="mi">7</span><span class="p">))</span><span class="o">.</span><span class="n">fit</span><span class="p">()</span>
</code></pre></div>
<figure><img src="docs/assets/aula-04/arima.png" alt="Gráfico do período de teste com as vendas reais, uma previsão reta do ARIMA simples e uma previsão em zigue-zague do ARIMA sazonal, que acompanha a semana mas não mergulha no Natal"><figcaption>O ARIMA simples vira uma reta. O sazonal acompanha a semana, mas não tem como saber do Natal.</figcaption></figure>

<p>Com o ciclo de 7 dias, o ARIMA vence a régua. Mas repare no Natal: o
ARIMA sazonal passa reto por ele. O modelo só conhece o passado da série,
e o passado recente não avisa que o dia 25 é feriado.</p>
<h3 id="como-escolher-os-numeros">Como escolher os números<a class="ancora" href="#como-escolher-os-numeros" aria-label="Link para esta secao">#</a></h3>
<p>Não existe fórmula mágica, mas existe um roteiro:</p>
<ol>
<li><strong><code>d</code> e <code>D</code> saem do gráfico.</strong> A série sobe ou desce? <code>d = 1</code>. Tem um
ciclo que se repete? <code>D = 1</code> e <code>s</code> igual ao tamanho do ciclo.</li>
<li><strong><code>p</code>, <code>q</code>, <code>P</code> e <code>Q</code> começam em 0 ou 1.</strong> Números grandes raramente
ajudam: o ARIMA(2,1,1) erra R$ 118,61, mais que o (1,1,1).</li>
<li><strong>Compare poucas combinações contra a régua</strong>, numa janela de
validação: as últimas semanas do treino, nunca o teste.</li>
</ol>
<h2 id="o-placar">O placar<a class="ancora" href="#o-placar" aria-label="Link para esta secao">#</a></h2>
<p>Oito previsões, os mesmos 28 dias de teste:</p>
<figure><img src="docs/assets/aula-04/placar.png" alt="Gráfico de barras horizontais com o MAE de oito previsões e uma linha tracejada na sazonal ingênua; a regressão com mês, a regressão com feriado e o ARIMA sazonal ficam abaixo da linha"><figcaption>Três modelos batem a régua. Dois modelos de verdade perdem dela.</figcaption></figure>

<div class="tabela-rolavel"><table><thead>
<tr>

<h2 id="para-que-serve">Para que serve<a class="ancora" href="#para-que-serve" aria-label="Link para esta secao">#</a></h2>
<p>Na aula passada, a cafeteria ganhou uma régua e dois modelos. A régua

<p>Montar essas colunas deu trabalho. Você precisou decidir que o mês
importava, criar as variáveis indicadoras e lembrar da coluna de feriado.
Esta aula testa dois atalhos:</p>
<ul>
<li>O <strong>Prophet</strong>, uma biblioteca que monta a regressão com calendário por

<li>O <strong>TimesFM</strong>, um modelo que já viu milhões de séries e prevê esta sem
