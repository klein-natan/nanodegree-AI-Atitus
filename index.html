<h2 id="a-regra-de-ouro-o-corte-e-no-tempo">A regra de ouro: o corte é no tempo<a class="ancora" href="#a-regra-de-ouro-o-corte-e-no-tempo" aria-label="Link para esta secao">#</a></h2>
<p>Aqui mora o erro mais caro do assunto inteiro.</p>
<p>Nas aulas anteriores, separar treino e teste era sorteio: pegue 80% das
linhas ao acaso para treinar e 20% para testar. Em série temporal isso
está <strong>errado</strong>. Sortear linhas significa treinar com dados de dezembro
para prever novembro, e ninguém prevê o passado.</p>
<p>O corte é sempre no tempo. O treino é tudo até uma data, e o teste é o que
vem depois.</p>
<figure><img src="docs/assets/aula-04/treino_teste.png" alt="Série temporal com uma linha vertical separando o período de treino, à esquerda, do período de teste, à direita"><figcaption>Treino de um lado, teste do outro. Nunca embaralhado.</figcaption></figure>

<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Usar <code>train_test_split</code> do scikit-learn numa série temporal, com o
<code>shuffle</code> no valor padrão. O código roda, as métricas saem ótimas, e o
resultado não vale nada: o modelo viu o futuro durante o treino. Isso se
chama <strong>vazamento de dados</strong> (<em>data leakage</em>), e o sintoma é sempre o
mesmo. Um desempenho excelente no teste que não se repete na vida real.</p>
</div></div>
<h2 id="tres-previsoes-sem-modelo-nenhum">Três previsões sem modelo nenhum<a class="ancora" href="#tres-previsoes-sem-modelo-nenhum" aria-label="Link para esta secao">#</a></h2>
<p>Antes de treinar qualquer coisa, faça as previsões mais burras possíveis.
Elas são a régua: um modelo que não vence essas três não está pagando o
próprio trabalho.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Previsão de referência</th>
  <th>Regra</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Ingênua (<em>naïve</em>)</td>
  <td>amanhã vai ser igual a hoje</td>
</tr>
<tr>
  <td>Média móvel</td>
  <td>amanhã vai ser a média dos últimos 7 dias</td>
</tr>
<tr>
  <td>Sazonal ingênua</td>
  <td>amanhã vai ser igual ao mesmo dia da semana passada</td>
</tr>
</tbody>
</table></div>
<p>As três, escritas como fórmula:</p>
<div class="formula" title="\hat{y}_{t+1} = y_t \qquad \hat{y}_{t+1} = \frac{1}{7}\sum_{i=0}^{6} y_{t-i} \qquad \hat{y}_{t+1} = y_{t-6}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mrow><mi>t</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msub><mo>&#x0003D;</mo><msub><mi>y</mi><mi>t</mi></msub><mspace width="2em" /><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mrow><mi>t</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msub><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>7</mn></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>0</mn></mrow><mrow><mn>6</mn></mrow></msubsup><msub><mi>y</mi><mrow><mi>t</mi><mo>&#x02212;</mo><mi>i</mi></mrow></msub><mspace width="2em" /><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mrow><mi>t</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msub><mo>&#x0003D;</mo><msub><mi>y</mi><mrow><mi>t</mi><mo>&#x02212;</mo><mn>6</mn></mrow></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>ŷₜ₊₁</code></td>
  <td>a previsão para o dia seguinte</td>
</tr>
<tr>
  <td><code>yₜ</code></td>
  <td>o valor observado hoje</td>
</tr>
<tr>
  <td><code>yₜ₋₆</code></td>
  <td>o valor de seis dias atrás, o mesmo dia da semana passada</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: no sábado a cafeteria vendeu R$ 1.300. Para o domingo, a ingênua
prevê os mesmos R$ 1.300. A sazonal ingênua prevê o que o domingo passado
vendeu.</p>
<figure><img src="docs/assets/aula-04/baselines.png" alt="Gráfico com o período de teste e três linhas de previsão: uma reta horizontal da previsão ingênua, outra da média, e uma linha em zigue-zague da sazonal ingênua"><figcaption>Só a sazonal ingênua acompanha o sobe e desce da semana.</figcaption></figure>

<p>Nos últimos 28 dias, guardados como teste:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Previsão</th>
  <th>MAE</th>
  <th>RMSE</th>
  <th>MAPE</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Ingênua</td>
  <td>R$ 121,28</td>
  <td>R$ 156,45</td>
  <td>10,3%</td>
</tr>
<tr>
  <td>Média de 7 dias</td>
  <td>R$ 115,93</td>
  <td>R$ 154,73</td>
  <td>10,4%</td>
</tr>
<tr>
  <td>Sazonal ingênua</td>
  <td>R$ 63,78</td>
  <td>R$ 110,80</td>
  <td>6,0%</td>
</tr>
</tbody>
</table></div>
<p>A sazonal ingênua erra quase metade das outras duas, e não usa modelo
nenhum: ela só repete a última semana. Qualquer modelo desta série tem que
começar batendo R$ 63,78 de MAE.</p>
<h2 id="mape-o-erro-em-porcentagem">MAPE: o erro em porcentagem<a class="ancora" href="#mape-o-erro-em-porcentagem" aria-label="Link para esta secao">#</a></h2>
<p>MAE, RMSE e MAPE você já conhece da Aula 1. Aqui o MAPE ganha uma
importância extra, e vale relembrar por quê: ele mede o erro como fração
do valor real, e por isso compara períodos de movimento diferente.</p>
<div class="formula" title="\text{MAPE} = \frac{100}{n}\sum_{t=1}^{n}\left|\frac{y_t - \hat{y}_t}{y_t}\right|"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>MAPE</mtext><mo>&#x0003D;</mo><mfrac><mrow><mn>100</mn></mrow><mrow><mi>n</mi></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>t</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mrow><mo stretchy="true" fence="true" form="prefix">&#x0007C;</mo><mfrac><mrow><msub><mi>y</mi><mi>t</mi></msub><mo>&#x02212;</mo><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>t</mi></msub></mrow><mrow><msub><mi>y</mi><mi>t</mi></msub></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">&#x0007C;</mo></mrow></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>yₜ</code></td>
  <td>o valor real no dia <code>t</code></td>
</tr>
<tr>
  <td><code>ŷₜ</code></td>
  <td>o valor previsto para o dia <code>t</code></td>
</tr>
<tr>
  <td>barras verticais</td>
  <td>valor absoluto: o erro sempre conta positivo</td>
</tr>
<tr>
  <td>resultado</td>
  <td>o erro médio em porcentagem do valor real</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: um erro de R$ 60 num dia de R$ 1.200 é 5%. O mesmo erro de R$ 60
num dia de R$ 600 é 10%. O MAPE conta o segundo como pior, e é isso que o
torna útil para comparar períodos de movimento diferente.</p>
<p>O cuidado com o MAPE: ele explode quando o valor real chega perto de zero.
Numa série que passa por zero, use MAE.</p>

<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>

<h2 id="para-que-serve">Para que serve<a class="ancora" href="#para-que-serve" aria-label="Link para esta secao">#</a></h2>
<p>Na aula passada, a melhor previsão para a cafeteria era repetir a semana
anterior. Ela erra R$ 63,78 por dia, em média, e não custa nada. É a
régua.</p>
<p>O problema é que ela não sabe nada. Não sabe que o negócio cresce, que
julho vende mais que janeiro, nem que no Natal a rua fica vazia. Ela só
copia.</p>
<p>Esta aula troca a cópia por um modelo que estima cada uma dessas peças
separadamente. O <strong>Prophet</strong> é uma biblioteca feita para isso, criada por
uma equipe da Meta, e pensada para séries de negócio: vendas, acessos,
pedidos. É a ferramenta que resolve a maior parte dos casos reais sem
exigir doutorado em estatística.</p>
<h2 id="o-que-o-prophet-faz">O que o Prophet faz<a class="ancora" href="#o-que-o-prophet-faz" aria-label="Link para esta secao">#</a></h2>
<p>A ideia é a mesma da Aula 4, agora escrita como modelo.</p>
<div class="formula" title="y(t) = g(t) + s(t) + h(t) + \varepsilon_t"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>y</mi><mo stretchy="false">&#x00028;</mo><mi>t</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0003D;</mo><mi>g</mi><mo stretchy="false">&#x00028;</mo><mi>t</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0002B;</mo><mi>s</mi><mo stretchy="false">&#x00028;</mo><mi>t</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0002B;</mo><mi>h</mi><mo stretchy="false">&#x00028;</mo><mi>t</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0002B;</mo><msub><mi>&#x003B5;</mi><mi>t</mi></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>y(t)</code></td>
  <td>o valor da série no dia <code>t</code></td>
</tr>
<tr>
  <td><code>g(t)</code></td>
  <td>a tendência: para onde o negócio caminha</td>
</tr>
<tr>
  <td><code>s(t)</code></td>
  <td>as sazonalidades: o padrão da semana e o do ano</td>
</tr>
<tr>
  <td><code>h(t)</code></td>
  <td>os feriados e eventos especiais</td>
</tr>
<tr>
  <td><code>εₜ</code></td>
  <td>o resto, o que nenhuma das peças explica</td>
</tr>
</tbody>
</table></div>
<p>Exemplo, para uma quarta-feira de julho de 2025: a tendência dá R$ 1.320,
a sazonalidade semanal tira R$ 15, a anual soma R$ 110 e não há feriado. A
previsão é <code>1.320 − 15 + 110 = 1.415</code> reais.</p>
<p>Repare que é uma soma, como todos os modelos do curso. A diferença é que
cada parcela agora é uma função do tempo, e não um peso vezes uma coluna.</p>
<h2 id="o-formato-que-ele-exige">O formato que ele exige<a class="ancora" href="#o-formato-que-ele-exige" aria-label="Link para esta secao">#</a></h2>
<p>O Prophet só aceita a tabela com duas colunas, e com estes nomes exatos:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Coluna</th>
  <th>O que é</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>ds</code></td>
  <td>a data (<em>datestamp</em>)</td>
</tr>
<tr>
  <td><code>y</code></td>
  <td>o valor que você quer prever</td>
</tr>
</tbody>
</table></div>
<p>Renomear as colunas é o primeiro passo de qualquer projeto com Prophet, e
é onde mais gente trava na primeira vez.</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">serie</span> <span class="o">=</span> <span class="n">dados</span><span class="o">.</span><span class="n">rename</span><span class="p">(</span><span class="n">columns</span><span class="o">=</span><span class="p">{</span><span class="s2">"data"</span><span class="p">:</span> <span class="s2">"ds"</span><span class="p">,</span> <span class="s2">"vendas"</span><span class="p">:</span> <span class="s2">"y"</span><span class="p">})</span>
</code></pre></div>
<h2 id="tres-linhas-para-treinar-e-prever">Três linhas para treinar e prever<a class="ancora" href="#tres-linhas-para-treinar-e-prever" aria-label="Link para esta secao">#</a></h2>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">modelo</span> <span class="o">=</span> <span class="n">Prophet</span><span class="p">()</span>
<span class="n">modelo</span><span class="o">.</span><span class="n">fit</span><span class="p">(</span><span class="n">treino</span><span class="p">)</span>
<span class="n">futuro</span> <span class="o">=</span> <span class="n">modelo</span><span class="o">.</span><span class="n">make_future_dataframe</span><span class="p">(</span><span class="n">periods</span><span class="o">=</span><span class="mi">28</span><span class="p">)</span>
<span class="n">previsao</span> <span class="o">=</span> <span class="n">modelo</span><span class="o">.</span><span class="n">predict</span><span class="p">(</span><span class="n">futuro</span><span class="p">)</span>
</code></pre></div>
<p><code>make_future_dataframe</code> cria a tabela de datas que você quer prever,
incluindo o histórico. <code>predict</code> devolve uma tabela com uma linha por dia
e várias colunas, das quais três importam agora: <code>yhat</code> (a previsão),
<code>yhat_lower</code> e <code>yhat_upper</code> (as bordas do intervalo de incerteza).</p>
<figure><img src="docs/assets/aula-05/previsao_prophet.png" alt="Gráfico com as vendas observadas, a linha de previsão do Prophet e uma faixa sombreada de incerteza em torno dela, com uma linha vertical marcando o início do teste"><figcaption>À direita da linha amarela, o modelo está prevendo dias que nunca viu.</figcaption></figure>

<h2 id="as-pecas-que-ele-estimou-sozinho">As peças que ele estimou sozinho<a class="ancora" href="#as-pecas-que-ele-estimou-sozinho" aria-label="Link para esta secao">#</a></h2>
<p>A parte mais útil do Prophet não é a previsão: é poder abrir o modelo e
olhar cada peça separada.</p>
<figure><img src="docs/assets/aula-05/componentes_prophet.png" alt="Quatro painéis mostrando a tendência crescente, os tombos dos feriados, o perfil semanal em barras e a onda anual estimados pelo Prophet"><figcaption>As mesmas três peças da Aula 4, agora estimadas por conta própria.</figcaption></figure>

<p>Compare com o que você já sabia da aula passada. A tendência sobe. O
sábado é o melhor dia e a segunda é o pior. O meio do ano vende mais que o
começo. O modelo chegou nisso sozinho, sem ninguém contar.</p>
<p>Esse quadro é o que você leva para uma reunião. Ele responde perguntas de
negócio (&quot;o crescimento continua?&quot;, &quot;vale abrir aos domingos?&quot;) melhor do
que qualquer número único de previsão.</p>
<h2 id="feriados-o-que-o-modelo-nao-adivinha">Feriados: o que o modelo não adivinha<a class="ancora" href="#feriados-o-que-o-modelo-nao-adivinha" aria-label="Link para esta secao">#</a></h2>
<p>Uma coisa o Prophet não descobre sozinho: o calendário. Ele não sabe que
25 de dezembro é diferente dos outros dias.</p>
<figure><img src="docs/assets/aula-05/com_sem_feriados.png" alt="Gráfico de dezembro comparando as vendas reais com duas previsões, uma que ignora o Natal e outra que mergulha junto com as vendas no dia 25"><figcaption>A linha cinza segue reto no Natal. A vermelha sabe que o escritório fecha.</figcaption></figure>

<p>Para ensinar o calendário, você entrega uma tabela de feriados:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">feriados</span> <span class="o">=</span> <span class="n">pd</span><span class="o">.</span><span class="n">DataFrame</span><span class="p">({</span>
    <span class="s2">"holiday"</span><span class="p">:</span> <span class="s2">"feriado_nacional"</span><span class="p">,</span>
    <span class="s2">"ds"</span><span class="p">:</span> <span class="n">datas_dos_feriados</span><span class="p">,</span>
<span class="p">})</span>
<span class="n">modelo</span> <span class="o">=</span> <span class="n">Prophet</span><span class="p">(</span><span class="n">holidays</span><span class="o">=</span><span class="n">feriados</span><span class="p">)</span>
</code></pre></div>
<p>Essa lista pode ir além do calendário oficial. Promoções, greves, jogos
importantes, qualquer data que a sua série &quot;sente&quot; entra ali.</p>

  <td>Prophet, com feriados</td>
  <td>R$ 43,73</td>
  <td>R$ 60,22</td>
  <td>3,5%</td>
</tr>
</tbody>
</table></div>
<figure><img src="docs/assets/aula-05/regua.png" alt="Gráfico de barras com o erro médio de cada previsão, mostrando o Prophet sem feriados empatado com a sazonal ingênua e o Prophet com feriados bem abaixo"><figcaption>Sem o calendário, o Prophet empata com a cópia da semana passada.</figcaption></figure>

<p>Leia a tabela com atenção, porque ela guarda a lição da aula. O Prophet
recém-instalado, sem nenhum ajuste, <strong>empata</strong> com a previsão que só copia
a semana anterior. O que faz ele ganhar é a lista de feriados, que não vem
do modelo: vem de você, que conhece o negócio.</p>
<p>O RMSE conta uma parte adicional da história. Mesmo empatado no MAE, o
Prophet sem feriados já tem RMSE bem menor (R$ 92,91 contra R$ 110,80).
Ele erra parecido na média, mas erra menos nos dias ruins.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Rodar o Prophet, ver um gráfico bonito com faixa de incerteza e concluir
que o modelo é bom, sem nunca comparar com a régua. Um gráfico de previsão
sempre parece convincente. A régua é o que separa um modelo útil de um
enfeite caro.</p>
</div></div>
<h2 id="o-intervalo-de-incerteza">O intervalo de incerteza<a class="ancora" href="#o-intervalo-de-incerteza" aria-label="Link para esta secao">#</a></h2>
<p>Toda linha de <code>yhat</code> vem acompanhada de <code>yhat_lower</code> e <code>yhat_upper</code>. Eles
formam a faixa em torno da previsão, e por padrão cobrem 80% dos casos.</p>
<p>É o mesmo intervalo de predição da Aula 1, com dois ajustes. Lá a faixa
era <code>ŷ ± 2s</code>, com uma largura só para toda a reta; aqui ela muda de dia
para dia, e a promessa é 80% em vez de 95%. A pergunta que ela responde
continua sendo a mesma: onde cai <strong>um</strong> dia, e não a média de muitos.</p>
<figure><img src="docs/assets/aula-05/incerteza.png" alt="Previsão de seis meses à frente com a faixa de incerteza em torno dela, e um segundo painel mostrando que a largura da faixa quase não muda ao longo do horizonte"><figcaption>Seis meses de previsão. A largura da faixa fica em torno de R$ 150 o tempo todo.</figcaption></figure>

<p>A faixa soma duas incertezas. Uma é o barulho do dia a dia, que não some
nunca: dois sábados de julho não vendem exatamente o mesmo. A outra é a
dúvida sobre para onde a tendência vai, e essa cresce com o horizonte.</p>
<p>Nesta série, a primeira domina. A tendência é tão regular que a dúvida
sobre ela pesa pouco, e por isso a faixa quase não abre, mesmo prevendo
seis meses à frente. Em uma série com tendência instável, a faixa abriria
bem mais.</p>
<p>Duas leituras práticas. A primeira: a faixa não é garantia. No nosso
teste, 75% dos dias caíram dentro dela, com a faixa prometendo 80%. É o
esperado, e serve de aviso: um dia em cada cinco fica de fora.</p>
<p>A segunda, mais importante: a faixa só conhece o que já aconteceu. Ela não
tem como prever um concorrente novo na esquina, uma greve de ônibus ou uma
obra na rua. O risco de prever seis meses à frente vem desses eventos,
não da largura da faixa.</p>
<p>Use a faixa para conversar sobre risco. &quot;A previsão é R$ 1.200, mas pode
ficar entre R$ 1.130 e R$ 1.280&quot; é uma frase muito mais útil para quem vai
comprar leite do que um número solto.</p>
<h2 id="quando-a-tendencia-dobra">Quando a tendência dobra<a class="ancora" href="#quando-a-tendencia-dobra" aria-label="Link para esta secao">#</a></h2>
<p>O Prophet não obriga a tendência a ser uma reta. Ele permite que ela mude
de inclinação em alguns pontos, chamados <strong>pontos de mudança</strong>
(<em>changepoints</em>).</p>
<figure><img src="docs/assets/aula-05/changepoints.png" alt="Série completa com a linha de tendência estimada por cima e linhas verticais pontilhadas marcando os pontos onde a tendência pode mudar de inclinação"><figcaption>Por padrão, 25 pontos candidatos nos primeiros 80% da série.</figcaption></figure>

<p>Esse é o motivo de o Prophet lidar bem com negócios que mudam de patamar.
Uma loja que abriu uma filial, um site que ganhou tráfego depois de uma
campanha: a tendência dobra, e o modelo acompanha.</p>
<p>O cuidado é o oposto. Se você deixar o modelo dobrar demais, ele começa a
seguir o ruído e a previsão fica instável. O parâmetro
<code>changepoint_prior_scale</code> controla essa liberdade: quanto maior, mais o
modelo aceita dobrar.</p>
<h2 id="quando-o-prophet-nao-e-a-resposta">Quando o Prophet não é a resposta<a class="ancora" href="#quando-o-prophet-nao-e-a-resposta" aria-label="Link para esta secao">#</a></h2>
<p>Ele resolve a maioria dos casos de negócio, mas não todos.</p>

<p>Nada aqui é novo. É o mesmo código das Aulas 3 e 5, agora com nome, guardado

<p>Uma linha merece atenção, porque ela resolve um problema clássico:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">tabela</span> <span class="o">=</span> <span class="n">tabela</span><span class="o">.</span><span class="n">reindex</span><span class="p">(</span><span class="n">columns</span><span class="o">=</span><span class="n">modelo</span><span class="o">.</span><span class="n">feature_names_in_</span><span class="p">,</span> <span class="n">fill_value</span><span class="o">=</span><span class="mi">0</span><span class="p">)</span>
</code></pre></div>
<p>Quando a tela manda um cliente só, o <code>get_dummies</code> cria colunas para o
plano daquele cliente, e só. O <code>reindex</code> põe as colunas na mesma ordem do
treino e preenche com zero o que faltar. Sem essa linha, o modelo recebe as
colunas trocadas e devolve um número sem sentido.</p>
<h2 id="o-limiar-e-uma-decisao-de-operacao">O limiar é uma decisão de operação<a class="ancora" href="#o-limiar-e-uma-decisao-de-operacao" aria-label="Link para esta secao">#</a></h2>
<p>O classificador devolve uma probabilidade. Quem transforma probabilidade em
lista de ligações é o limiar, e no painel ele é um controle deslizante.</p>
<figure><img src="docs/assets/aula-06/limiar_operacao.png" alt="Dois gráficos: à esquerda o tamanho da lista de risco caindo conforme o limiar sobe, à direita a porcentagem da lista que cancelou de fato subindo"><figcaption>Mexer no limiar muda quantas pessoas a equipe liga, e quão certeira é a lista.</figcaption></figure>

<p>Com os 400 assinantes do Clube do Café:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Limiar</th>
  <th>Clientes na lista</th>
  <th>Receita mensal em risco</th>
  <th>Da lista, cancelaram de fato</th>
</tr>
</thead>
<tbody>
<tr>
  <td>0,40</td>
  <td>168</td>
  <td>R$ 13.265</td>
  <td>61%</td>
</tr>
<tr>
  <td>0,50</td>
  <td>119</td>
  <td>R$ 9.748</td>
  <td>67%</td>
</tr>
</tbody>
</table></div>
<p>Suba o limiar e a lista encolhe, mas fica mais certeira. Desça e você
alcança mais gente que ia cancelar, ao custo de ligar para quem ia ficar.</p>
<p>Por isso o limiar mora na tela, e não escondido no código. Quem decide o
tamanho da operação é a pessoa que vai fazer as ligações, não o modelo.</p>
<h2 id="a-previsao-que-o-painel-mostra">A previsão que o painel mostra<a class="ancora" href="#a-previsao-que-o-painel-mostra" aria-label="Link para esta secao">#</a></h2>
<p>O segundo modelo é o Prophet da Aula 5, treinado nos 731 dias de receita do
clube, com a lista de feriados.</p>
<figure><img src="docs/assets/aula-06/previsao_receita.png" alt="Gráfico com os últimos 90 dias de receita e a previsão dos próximos 30 dias, com a faixa de incerteza"><figcaption>Trinta dias à frente, com a faixa de incerteza que a Aula 5 ensinou a ler.</figcaption></figure>

<p>O painel resume isso em três números: R$ 89.853 previstos para os próximos

<tbody>
<tr>
  <td><code>st.title</code> e <code>st.subheader</code></td>
  <td>escrevem títulos</td>
</tr>
<tr>
  <td><code>st.tabs</code></td>
  <td>cria as abas</td>
</tr>
<tr>
  <td><code>st.slider</code> e <code>st.selectbox</code></td>
  <td>pedem um número e uma opção</td>
</tr>
<tr>
  <td><code>st.metric</code></td>
  <td>mostra um número grande, com rótulo</td>
</tr>
<tr>
  <td><code>st.dataframe</code></td>
  <td>mostra uma tabela</td>
</tr>
<tr>
  <td><code>st.line_chart</code></td>
  <td>desenha um gráfico de linha</td>
</tr>
</tbody>
</table></div>
<p>O Streamlit funciona de um jeito diferente do que você talvez espere: toda
vez que alguém mexe num controle, ele <strong>roda o arquivo inteiro de novo</strong>,
de cima para baixo. É isso que faz a tela reagir sem você escrever nada de
interface.</p>
<p>Isso traz um problema óbvio: treinar os dois modelos a cada clique deixaria
o painel lento. A solução é uma linha:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="nd">@st</span><span class="o">.</span><span class="n">cache_resource</span>
<span class="k">def</span><span class="w"> </span><span class="nf">preparar_sistema</span><span class="p">():</span>
    <span class="o">...</span>
</code></pre></div>
<p>Com ela, o Streamlit guarda o resultado e só executa a função na primeira
vez. Os cliques seguintes reaproveitam os modelos já treinados.</p>
<figure><img src="docs/assets/aula-06/tela_risco.png" alt="Captura de tela do painel na aba de risco, com o controle de limiar, três números grandes e a tabela dos clientes de maior risco"><figcaption>A primeira aba: a lista de risco de hoje, e um simulador logo abaixo.</figcaption></figure>

<figure><img src="docs/assets/aula-06/tela_previsao.png" alt="Captura de tela do painel na aba de previsão, com o controle de dias, três números grandes e o gráfico do histórico com a previsão"><figcaption>A segunda aba: quanto o clube fatura nos próximos dias.</figcaption></figure>

<p>O painel funciona, mas ele não está pronto para uma empresa depender dele.

<template class="pagina" data-id="redes-neurais/aula-07-redes-neurais-densas" data-titulo="Aula 7 — Fundamentos de Redes Neurais" data-descricao="Neurônio, ativação, camadas e treino, com Keras">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>
<p>Você vai entender o que é um neurônio (spoiler: é a soma da Aula 2 com uma
dobra em cima), por que empilhar neurônios resolve problemas que uma reta
não resolve, e como treinar uma rede em cinco linhas de Keras.</p>
</div></div>
<h2 id="para-que-serve">Para que serve<a class="ancora" href="#para-que-serve" aria-label="Link para esta secao">#</a></h2>
<p>O Clube do Café torra os próprios grãos. Cada torra tem dois botões: a
temperatura do tambor e o tempo. Errar qualquer um dos dois estraga o lote.</p>
<p>Quente demais queima. Frio demais deixa o grão verde. Rápido demais não
desenvolve o açúcar. Devagar demais amarga. O ponto bom fica numa faixa no
meio, e é isso que o gráfico mostra:</p>
<figure><img src="docs/assets/aula-07/torras.png" alt="Gráfico de dispersão com temperatura no eixo x e tempo no eixo y, com as torras boas formando uma ilha no centro e as ruins espalhadas em volta"><figcaption>600 torras. As boas formam uma ilha, não uma metade.</figcaption></figure>

<p>Olhe para essa figura e tente traçar uma reta que separe os triângulos dos
círculos. Não existe. É essa impossibilidade que abre o assunto de hoje.</p>
<h2 id="por-que-a-reta-nao-basta">Por que a reta não basta<a class="ancora" href="#por-que-a-reta-nao-basta" aria-label="Link para esta secao">#</a></h2>
<p>Vamos provar. Treine uma regressão logística nesses dados, do jeito da
Aula 3, e olhe o que ela decide.</p>
<figure><img src="docs/assets/aula-07/fronteiras.png" alt="Dois painéis lado a lado: à esquerda a regressão logística pintando tudo de uma cor só, à direita a rede neural desenhando uma fronteira fechada em volta das torras boas"><figcaption>A logística desiste e chuta "ruim" para todo mundo. A rede fecha a ilha.</figcaption></figure>

<p>A regressão logística acertou 71,8% das torras. Parece razoável até você
comparar com o modelo preguiçoso da Aula 3: como 71,8% das torras são
ruins, responder &quot;ruim&quot; para todo mundo dá exatamente os mesmos 71,8%.</p>
<p>Ela não aprendeu nada. E não é culpa dela: a fronteira que ela sabe
desenhar é uma reta, e nenhuma reta separa o dentro do fora de uma ilha.</p>
<p>A rede neural da direita, com duas camadas de 16 neurônios, chega a 91,8%.
A diferença não está no esforço nem nos dados. Está no formato da
fronteira que cada modelo consegue desenhar.</p>
<h2 id="o-que-e-um-neuronio">O que é um neurônio<a class="ancora" href="#o-que-e-um-neuronio" aria-label="Link para esta secao">#</a></h2>
<p>Aqui está a boa notícia: você já sabe o que é.</p>
<figure><img src="docs/assets/aula-07/neuronio.png" alt="Diagrama de um neurônio: duas entradas multiplicadas por pesos, somadas com um viés, passando por uma função de ativação e virando a saída"><figcaption>Entrada vezes peso, soma, e uma dobra no fim.</figcaption></figure>

<div class="formula" title="a = f(w_0 + w_1 x_1 + w_2 x_2)"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>a</mi><mo>&#x0003D;</mo><mi>f</mi><mo stretchy="false">&#x00028;</mo><msub><mi>w</mi><mn>0</mn></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>1</mn></msub><msub><mi>x</mi><mn>1</mn></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>2</mn></msub><msub><mi>x</mi><mn>2</mn></msub><mo stretchy="false">&#x00029;</mo></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>x₁</code>, <code>x₂</code></td>
  <td>as entradas: temperatura e tempo</td>
</tr>
<tr>
  <td><code>w₁</code>, <code>w₂</code></td>
  <td>os pesos, iguais aos das aulas de regressão</td>
</tr>
<tr>
  <td><code>w₀</code></td>
  <td>o viés (<em>bias</em>), o mesmo termo independente de sempre</td>
</tr>
<tr>
  <td><code>f</code></td>
  <td>a função de ativação: a dobra</td>
</tr>
<tr>
  <td><code>a</code></td>
  <td>a saída do neurônio, que vira entrada do próximo</td>
</tr>
</tbody>
</table></div>
<p>Compare com a regressão logística da Aula 3: <code>P = σ(w₀ + w₁x₁ + w₂x₂)</code>. É a
mesma conta. <strong>Um neurônio com ativação sigmoide é uma regressão
logística.</strong> Uma rede neural é um monte deles, empilhados.</p>
<p>Exemplo com números: se <code>w₀ = −3</code>, <code>w₁ = 0,02</code>, <code>w₂ = 0,1</code>, uma torra de
205 °C e 11 minutos dá <code>−3 + 4,10 + 1,10 = 2,20</code> antes da ativação.</p>
<h2 id="a-dobra-funcoes-de-ativacao">A dobra: funções de ativação<a class="ancora" href="#a-dobra-funcoes-de-ativacao" aria-label="Link para esta secao">#</a></h2>
<p>Se a ativação não existisse, empilhar camadas não adiantaria nada. Somar
retas dá reta, e você voltaria ao problema do começo.</p>
<figure><img src="docs/assets/aula-07/ativacoes.png" alt="Dois gráficos: à esquerda a ReLU, uma linha que fica em zero e depois sobe reto, à direita a sigmoide em formato de S"><figcaption>A ReLU é a dobra mais usada hoje. A sigmoide você já conhece.</figcaption></figure>

<div class="formula" title="\text{ReLU}(z) = \max(0, z)"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>ReLU</mtext><mo stretchy="false">&#x00028;</mo><mi>z</mi><mo stretchy="false">&#x00029;</mo><mo>&#x0003D;</mo><mo>max</mo><mo stretchy="false">&#x00028;</mo><mn>0</mn><mo>&#x0002C;</mo><mi>z</mi><mo stretchy="false">&#x00029;</mo></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>z</code></td>
  <td>o resultado da soma, antes da ativação</td>
</tr>
<tr>
  <td><code>max(0, z)</code></td>
  <td>devolve <code>z</code> se ele é positivo, e 0 se é negativo</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: <code>ReLU(2,20) = 2,20</code>. <code>ReLU(−1,4) = 0</code>.</p>
<p>Não parece grande coisa, mas é o suficiente. Cada neurônio com ReLU
introduz uma dobra na fronteira. Com dobras suficientes, a fronteira
contorna qualquer formato. Repare no salto entre 2 e 8 neurônios: é ali
que a fronteira deixa de ser uma reta.</p>
<figure><img src="docs/assets/aula-07/capacidade.png" alt="Quatro painéis mostrando a fronteira aprendida com 1, 2, 8 e 32 neurônios, cada vez mais próxima de contornar a ilha"><figcaption>Com 1 ou 2 neurônios, nada muda. Com 8 aparece uma ilha pequena demais; com 32, o contorno certo.</figcaption></figure>

<p>Onde usar cada uma, na prática:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Onde</th>
  <th>Ativação</th>
  <th>Por quê</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Camadas do meio</td>
  <td>ReLU</td>
  <td>rápida, e é a dobra que cria o formato</td>
</tr>
<tr>
  <td>Saída, para sim ou não</td>
  <td>sigmoide</td>
  <td>devolve probabilidade entre 0 e 1</td>
</tr>
<tr>
  <td>Saída, para um número</td>
  <td>nenhuma</td>
  <td>o valor sai como está</td>
</tr>
</tbody>
</table></div>
<h2 id="a-rede-inteira-em-cinco-linhas">A rede inteira, em cinco linhas<a class="ancora" href="#a-rede-inteira-em-cinco-linhas" aria-label="Link para esta secao">#</a></h2>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">modelo</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">Sequential</span><span class="p">([</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Input</span><span class="p">(</span><span class="n">shape</span><span class="o">=</span><span class="p">(</span><span class="mi">2</span><span class="p">,)),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">16</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"relu"</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">16</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"relu"</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"sigmoid"</span><span class="p">),</span>
<span class="p">])</span>
</code></pre></div>
<p>Lendo de cima para baixo: entram 2 números, viram 16, viram 16 de novo, e
saem como 1 probabilidade. <code>Dense</code> quer dizer que <strong>todo</strong> neurônio da
camada recebe <strong>todas</strong> as saídas da camada anterior.</p>
<p>Essa rede tem 337 pesos. Você pode contar: 2×16+16 na primeira camada,
16×16+16 na segunda, 16×1+1 na saída. Cada um deles é um número que o
treino vai ajustar, exatamente como ajustava os dois pesos da Aula 1.</p>
<h2 id="como-ela-aprende-e-a-aula-1-de-novo">Como ela aprende (é a Aula 1 de novo)<a class="ancora" href="#como-ela-aprende-e-a-aula-1-de-novo" aria-label="Link para esta secao">#</a></h2>
<p>Nada de novo aqui, e vale dizer isso em voz alta:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Peça</th>
  <th>Na Aula 1</th>
  <th>Agora</th>
</tr>
</thead>
<tbody>
<tr>
  <td>O que ajusta</td>
  <td>2 pesos</td>
  <td>337 pesos</td>
</tr>
<tr>
  <td>Função de perda</td>
  <td>MSE</td>
  <td>log loss (a da Aula 3)</td>
</tr>
<tr>
  <td>Como ajusta</td>
  <td>gradiente descendente</td>
  <td>gradiente descendente</td>
</tr>
<tr>
  <td>A regra</td>
  <td><code>w ← w − α · inclinação</code></td>
  <td>a mesma, para cada peso</td>
</tr>
</tbody>
</table></div>
<p>A perda usada para sim ou não é a <strong>entropia cruzada binária</strong>, que a Aula
3 já usava com outro nome:</p>
<div class="formula" title="\text{perda} = -\frac{1}{n}\sum_{i=1}^{n}\left[y_i \log(\hat{y}_i) + (1 - y_i)\log(1 - \hat{y}_i)\right]"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>perda</mtext><mo>&#x0003D;</mo><mo>&#x02212;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mrow><mo stretchy="true" fence="true" form="prefix">[</mo><msub><mi>y</mi><mi>i</mi></msub><mi>log</mi><mo stretchy="false">&#x00028;</mo><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>i</mi></msub><mo stretchy="false">&#x00029;</mo><mo>&#x0002B;</mo><mo stretchy="false">&#x00028;</mo><mn>1</mn><mo>&#x02212;</mo><msub><mi>y</mi><mi>i</mi></msub><mo stretchy="false">&#x00029;</mo><mi>log</mi><mo stretchy="false">&#x00028;</mo><mn>1</mn><mo>&#x02212;</mo><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>i</mi></msub><mo stretchy="false">&#x00029;</mo><mo stretchy="true" fence="true" form="postfix">]</mo></mrow></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>yᵢ</code></td>
  <td>o rótulo real da torra <code>i</code>: 1 para boa, 0 para ruim</td>
</tr>
<tr>
  <td><code>ŷᵢ</code></td>
  <td>a probabilidade que a rede deu</td>
</tr>
<tr>
  <td><code>log</code></td>
  <td>o logaritmo, que castiga com força quem erra com confiança</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: se a rede diz 0,9 para uma torra boa, a parcela dela é
<code>−log(0,9) = 0,105</code>. Se ela diz 0,1 para a mesma torra boa, a parcela vira
<code>−log(0,1) = 2,303</code>. Vinte e duas vezes pior.</p>
<p>A única novidade técnica é o nome do cálculo que distribui a culpa entre as
camadas: <strong>retropropagação</strong> (<em>backpropagation</em>). Ela responde &quot;o quanto
cada um dos 337 pesos contribuiu para o erro&quot; aplicando a regra da cadeia
de trás para frente. O Keras faz isso sozinho, e neste curso você não vai
implementá-la à mão.</p>
<h2 id="epoca-lote-e-a-curva-de-treino">Época, lote e a curva de treino<a class="ancora" href="#epoca-lote-e-a-curva-de-treino" aria-label="Link para esta secao">#</a></h2>
<p>Três palavras que aparecem em toda saída de treino:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Palavra</th>
  <th>O que é</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Lote (<em>batch</em>)</td>
  <td>quantos exemplos entram por vez antes de ajustar os pesos</td>
</tr>
<tr>
  <td>Época (<em>epoch</em>)</td>
  <td>uma passada completa por todos os exemplos</td>
</tr>
<tr>
  <td>Passo</td>
  <td>um ajuste dos pesos, feito uma vez por lote</td>
</tr>
</tbody>
</table></div>
<p>Com 600 torras e lote de 32, uma época tem 19 passos. Em 120 épocas, são
2.280 ajustes.</p>
<figure><img src="docs/assets/aula-07/curva_treino.png" alt="Dois gráficos mostrando a perda caindo e a acurácia subindo ao longo das épocas, com as linhas de treino e validação juntas"><figcaption>A curva de treino é o painel de instrumentos: você olha para ela antes de olhar qualquer outra coisa.</figcaption></figure>

<p>Repare que existem duas linhas em cada gráfico. A de treino usa as torras
que a rede viu; a de validação usa 25% que ela nunca viu. Enquanto as duas
caem juntas, está tudo bem.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Treinar sem normalizar as entradas. Aqui a temperatura vai a 235 e o tempo
a 17: uma escala é catorze vezes a outra. A rede até aprende, mas devagar e
mal, porque o gradiente fica dominado pela variável de número maior. A
correção é uma linha, antes do treino: subtraia a média e divida pelo
desvio padrão de cada coluna. Faça isso <strong>sempre</strong> em rede neural.</p>
</div></div>
<h2 id="quando-a-rede-nao-e-a-resposta">Quando a rede não é a resposta<a class="ancora" href="#quando-a-rede-nao-e-a-resposta" aria-label="Link para esta secao">#</a></h2>
<p>A rede venceu por 20 pontos aqui, mas isso não é regra.</p>

<template class="pagina" data-id="redes-neurais/aula-08-redes-convolucionais" data-titulo="Aula 8 — Redes Convolucionais" data-descricao="Convolução, filtros e pooling, com Keras">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>
<p>Você vai entender por que a rede da Aula 7 é ruim para olhar fotos, o que
um filtro 3×3 faz (com a conta na mão), e como montar uma rede
convolucional que etiqueta roupa melhor usando quase metade dos pesos.</p>
</div></div>
<h2 id="para-que-serve">Para que serve<a class="ancora" href="#para-que-serve" aria-label="Link para esta secao">#</a></h2>
<p>Um brechó online recebe milhares de fotos por semana. Alguém precisa
etiquetar cada peça: isso é camiseta, isso é bota, isso é bolsa. Uma
pessoa leva três segundos por foto e erra pouco. O problema é a escala.</p>
<p>Vamos construir o etiquetador. As fotos são as do Fashion-MNIST, um
conjunto público de 70.000 fotos de roupa em dez categorias:</p>
<figure><img src="docs/assets/aula-08/exemplos.png" alt="Dez fotos em tons de cinza, uma de cada categoria: camiseta, calça, pulôver, vestido, casaco, sandália, camisa, tênis, bolsa e bota"><figcaption>Dez categorias, 28 por 28 pixels, em tons de cinza.</figcaption></figure>

<h2 id="a-foto-por-dentro">A foto por dentro<a class="ancora" href="#a-foto-por-dentro" aria-label="Link para esta secao">#</a></h2>
<p>Antes de qualquer modelo, olhe o que existe ali de verdade.</p>
<figure><img src="docs/assets/aula-08/pixels.png" alt="À esquerda a foto de um tênis com um quadrado vermelho marcando um pedaço; à direita esse pedaço mostrado como uma grade de números entre 0 e 1"><figcaption>Cada quadradinho da foto é um número. Preto é 1, branco é 0.</figcaption></figure>

<p>Uma foto de 28 por 28 é uma tabela de 784 números. Nada além disso. O que
você chama de &quot;bico do tênis&quot; é uma região onde alguns números vizinhos
são altos ao mesmo tempo.</p>
<p>Guarde a palavra <strong>vizinhos</strong>. É nela que a aula inteira se apoia.</p>
<h2 id="por-que-a-rede-da-aula-7-e-ruim-nisso">Por que a rede da Aula 7 é ruim nisso<a class="ancora" href="#por-que-a-rede-da-aula-7-e-ruim-nisso" aria-label="Link para esta secao">#</a></h2>
<p>A rede densa espera uma linha de números, não uma tabela. Para alimentá-la,
você achata (<em>flatten</em>) a foto: pega as 28 linhas e emenda uma na outra,
formando uma fila de 784 entradas.</p>
<p>Aí está o problema. Depois de achatar, o pixel que ficava logo acima de
outro vai parar 28 casas adiante na fila. Para a rede, os dois viraram
entradas quaisquer, tão relacionadas quanto duas colunas de uma planilha.
A vizinhança sumiu.</p>
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O teste do embaralhamento</strong></p>
<p>Escolha uma ordem aleatória e embaralhe os 784 pixels de todas as fotos,
sempre com a mesma ordem. Uma pessoa não reconhece mais nada. A rede densa
aprende exatamente igual, porque para ela a ordem nunca significou nada.</p>
</div></div>
<p>Essa rede não é inútil. Treinada nas 60.000 fotos, ela acerta 87,6%. Mas
gasta 101.770 pesos para chegar lá, quase todos na primeira camada, que
liga cada um dos 784 pixels a cada um dos 128 neurônios.</p>
<h2 id="a-janela-que-passeia">A janela que passeia<a class="ancora" href="#a-janela-que-passeia" aria-label="Link para esta secao">#</a></h2>
<p>A convolução resolve o problema de um jeito quase bobo. Em vez de olhar a
foto inteira de uma vez, você olha um quadradinho de 3 por 3 por vez, e
faz sempre a mesma conta.</p>
<p>Esse quadradinho de nove pesos é o <strong>filtro</strong> (<em>kernel</em>). Cada resultado é
a soma de nove multiplicações:</p>
<div class="formula" title="s_{i,j} = \sum_{a=0}^{2}\sum_{b=0}^{2} k_{a,b} \cdot x_{i+a,\,j+b}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>s</mi><mrow><mi>i</mi><mo>&#x0002C;</mo><mi>j</mi></mrow></msub><mo>&#x0003D;</mo><msubsup><mo>&#x02211;</mo><mrow><mi>a</mi><mo>&#x0003D;</mo><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><msubsup><mo>&#x02211;</mo><mrow><mi>b</mi><mo>&#x0003D;</mo><mn>0</mn></mrow><mrow><mn>2</mn></mrow></msubsup><msub><mi>k</mi><mrow><mi>a</mi><mo>&#x0002C;</mo><mi>b</mi></mrow></msub><mo>&#x000B7;</mo><msub><mi>x</mi><mrow><mi>i</mi><mo>&#x0002B;</mo><mi>a</mi><mo>&#x0002C;</mo><mspace width="0.167em" /><mi>j</mi><mo>&#x0002B;</mo><mi>b</mi></mrow></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>x</code></td>
  <td>a foto, com <code>xᵢⱼ</code> sendo o pixel da linha <code>i</code>, coluna <code>j</code></td>
</tr>
<tr>
  <td><code>k</code></td>
  <td>o filtro, com os nove pesos <code>k₀₀</code> até <code>k₂₂</code></td>
</tr>
<tr>
  <td><code>sᵢⱼ</code></td>
  <td>o número que sai quando a janela para na posição <code>i</code>, <code>j</code></td>
</tr>
<tr>
  <td><code>a</code>, <code>b</code></td>
  <td>percorrem as três linhas e as três colunas do filtro</td>
</tr>
</tbody>
</table></div>
<p>Exemplo, com a janela parada em cima de uma borda:</p>
<figure><img src="docs/assets/aula-08/janela.png" alt="Três painéis: a imagem 6 por 6 com metade preenchida de 1, o filtro 3 por 3 com colunas menos um, zero e mais um, e o resultado 4 por 4"><figcaption>Multiplica casa com casa, soma tudo, escreve um número. Depois desliza uma casa e repete.</figcaption></figure>

<p>A imagem da esquerda é escura de um lado e clara do outro. O filtro tem
uma coluna de <code>−1</code>, uma de <code>0</code> e uma de <code>+1</code>. Na janela em destaque, cada
linha contribui com <code>(−1×0) + (0×0) + (1×1) = 1</code>, e as três linhas somam
3. Nas janelas que ficam inteiras dentro do lado escuro, tudo dá zero.</p>
<p>Esse filtro só reage onde a imagem muda. Ele encontra bordas verticais.</p>
<p>Agora rode o mesmo filtro numa foto de verdade, uma janela por vez, até
cobrir tudo:</p>
<figure><img src="docs/assets/aula-08/convolucao.png" alt="Uma camiseta e duas versões filtradas: uma realçando as laterais verticais, outra realçando a gola e a barra"><figcaption>Mesma camiseta, dois filtros. À esquerda ele achou as laterais; à direita, a gola e a barra.</figcaption></figure>

<p>O resultado é uma imagem nova, chamada <strong>mapa de ativação</strong>: um mapa de
onde aquele detalhe aparece.</p>
<h2 id="tres-ideias-em-uma">Três ideias em uma<a class="ancora" href="#tres-ideias-em-uma" aria-label="Link para esta secao">#</a></h2>
<p>A convolução parece um detalhe técnico, mas ela muda três coisas de uma
vez:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Ideia</th>
  <th>O que significa</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Vizinhança</td>
  <td>cada conta usa só pixels que estão juntos, então &quot;estar perto&quot; volta a valer</td>
</tr>
<tr>
  <td>Peso compartilhado</td>
  <td>os mesmos 9 pesos servem para a foto toda, em vez de 9 pesos por posição</td>
</tr>
<tr>
  <td>Mesmo detalhe em qualquer lugar</td>
  <td>se a peça sair do centro, o filtro a encontra do mesmo jeito</td>
</tr>
</tbody>
</table></div>
<p>O peso compartilhado é o que deixa a rede pequena. Uma camada com 16
filtros de 3×3 tem 160 pesos ao todo, e olha 784 pixels. A primeira camada
da rede densa tinha 100.480 para o mesmo trabalho.</p>
<h2 id="pooling-encolher-sem-perder-o-que-importa">Pooling: encolher sem perder o que importa<a class="ancora" href="#pooling-encolher-sem-perder-o-que-importa" aria-label="Link para esta secao">#</a></h2>
<p>Depois de cada convolução, a rede encolhe a imagem. O jeito mais comum é o
<strong>pooling máximo</strong> (<em>max pooling</em>): divida em quadrados de 2 por 2 e
guarde só o maior número de cada um.</p>
<figure><img src="docs/assets/aula-08/pooling.png" alt="Uma grade 4 por 4 de números dividida em quatro quadrados coloridos, e ao lado uma grade 2 por 2 com o maior número de cada quadrado"><figcaption>Quatro números viram um. O detalhe forte sobrevive, a posição exata dele não.</figcaption></figure>

<p>Duas coisas acontecem. A imagem fica com um quarto do tamanho, o que
deixa tudo mais rápido. E a resposta passa a ser &quot;achei essa borda por
aqui&quot;, em vez de &quot;achei essa borda no pixel 14&quot;. Essa imprecisão é
proposital, e é ela que faz a rede aguentar a peça sair do lugar.</p>
<h2 id="os-filtros-que-ela-aprende-sozinha">Os filtros que ela aprende sozinha<a class="ancora" href="#os-filtros-que-ela-aprende-sozinha" aria-label="Link para esta secao">#</a></h2>
<p>Você não escolhe os nove pesos de cada filtro. Eles são pesos como
quaisquer outros, e o gradiente descendente da Aula 1 os ajusta durante o
treino. A rede decide sozinha quais detalhes vale a pena procurar.</p>
<figure><img src="docs/assets/aula-08/filtros_aprendidos.png" alt="Em cima os nove pesos de cinco filtros aprendidos; embaixo os mapas de ativação de cada um sobre a foto de uma bolsa"><figcaption>Cinco dos 16 filtros da primeira camada, e onde cada um reagiu na mesma bolsa.</figcaption></figure>

<p>Repare que eles não fazem a mesma coisa. Uns reagem no corpo da bolsa,
outros só na borda de cima. Ninguém programou isso.</p>
<h2 id="a-rede-convolucional-inteira">A rede convolucional inteira<a class="ancora" href="#a-rede-convolucional-inteira" aria-label="Link para esta secao">#</a></h2>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">modelo</span> <span class="o">=</span> <span class="n">keras</span><span class="o">.</span><span class="n">Sequential</span><span class="p">([</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Input</span><span class="p">(</span><span class="n">shape</span><span class="o">=</span><span class="p">(</span><span class="mi">28</span><span class="p">,</span> <span class="mi">28</span><span class="p">,</span> <span class="mi">1</span><span class="p">)),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Conv2D</span><span class="p">(</span><span class="mi">16</span><span class="p">,</span> <span class="mi">3</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"relu"</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">MaxPooling2D</span><span class="p">(</span><span class="mi">2</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Conv2D</span><span class="p">(</span><span class="mi">32</span><span class="p">,</span> <span class="mi">3</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"relu"</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">MaxPooling2D</span><span class="p">(</span><span class="mi">2</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Flatten</span><span class="p">(),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">64</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"relu"</span><span class="p">),</span>
    <span class="n">keras</span><span class="o">.</span><span class="n">layers</span><span class="o">.</span><span class="n">Dense</span><span class="p">(</span><span class="mi">10</span><span class="p">,</span> <span class="n">activation</span><span class="o">=</span><span class="s2">"softmax"</span><span class="p">),</span>
<span class="p">])</span>
</code></pre></div>
<p>O <code>1</code> no final de <code>shape=(28, 28, 1)</code> é o <strong>canal</strong>: quantos números tem
cada pixel. Foto em tons de cinza tem um. Foto colorida tem três, um para
vermelho, um para verde e um para azul.</p>

</thead>

  <td>160</td>

<p>São 56.714 pesos, contra 101.770 da densa. E olhe onde eles estão: as duas
camadas de convolução, que fazem o trabalho de enxergar, usam 4.800. Todo
o resto está na parte densa do final, que só junta as pistas e vota.</p>
<p>Ler a tabela de cima para baixo conta a história: a imagem vai encolhendo
e o número de mapas vai crescendo. No começo a rede procura bordas. No
fim, ela procura combinações de bordas.</p>
<h2 id="a-saida-dez-probabilidades">A saída: dez probabilidades<a class="ancora" href="#a-saida-dez-probabilidades" aria-label="Link para esta secao">#</a></h2>
<p>Nas aulas anteriores a resposta era sim ou não, e a sigmoide dava conta.
Aqui são dez categorias. A função que resolve isso é a <strong>softmax</strong>: ela
recebe dez números soltos e devolve dez probabilidades que somam 1.</p>
<div class="formula" title="P_j = \frac{e^{z_j}}{\sum_{k=1}^{10} e^{z_k}}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>P</mi><mi>j</mi></msub><mo>&#x0003D;</mo><mfrac><mrow><msup><mi>e</mi><mrow><msub><mi>z</mi><mi>j</mi></msub></mrow></msup></mrow><mrow><msubsup><mo>&#x02211;</mo><mrow><mi>k</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mn>10</mn></mrow></msubsup><msup><mi>e</mi><mrow><msub><mi>z</mi><mi>k</mi></msub></mrow></msup></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>zⱼ</code></td>
  <td>o número cru que a última camada produziu para a categoria <code>j</code></td>
</tr>
<tr>
  <td><code>e</code></td>
  <td>o número de Euler, 2,718</td>
</tr>
<tr>
  <td><code>Pⱼ</code></td>
  <td>a probabilidade final da categoria <code>j</code></td>
</tr>
<tr>
  <td>o denominador</td>
  <td>a soma de todas as dez parcelas, que força o total a dar 1</td>
</tr>
</tbody>
</table></div>
<p>Exemplo com três categorias, para caber na conta. Os números crus foram 2,
1 e 0. Elevando <code>e</code> a cada um: 7,39, 2,72 e 1,00. A soma é 11,11. As
probabilidades ficam 0,67, 0,24 e 0,09. A maior ganha, e a resposta é a
primeira categoria.</p>
<h2 id="o-resultado">O resultado<a class="ancora" href="#o-resultado" aria-label="Link para esta secao">#</a></h2>
<p>Mesmas 60.000 fotos, mesmas 8 épocas de treino, mesmo otimizador:</p>
<figure><img src="docs/assets/aula-08/densa_vs_cnn.png" alt="Dois gráficos de barras: à esquerda o acerto de 87,6% da densa contra 90,2% da convolucional, à direita 101.770 pesos contra 56.714"><figcaption>A convolucional acerta 2,6 pontos a mais usando quase metade dos pesos.</figcaption></figure>

<p>Dois pontos e meio parece pouco. Em 10.000 fotos, são 260 peças
etiquetadas certo que antes iam erradas.</p>
<h2 id="por-que-ela-ganha-o-teste-do-deslocamento">Por que ela ganha: o teste do deslocamento<a class="ancora" href="#por-que-ela-ganha-o-teste-do-deslocamento" aria-label="Link para esta secao">#</a></h2>
<p>O número de acerto não explica nada sozinho. Aqui está o teste que
explica. Pegue as mesmas fotos de teste e empurre cada uma alguns pixels
para o lado. A peça é a mesma, só mudou de lugar.</p>
<figure><img src="docs/assets/aula-08/deslocamento.png" alt="À esquerda a mesma bolsa antes e depois de ser deslocada quatro pixels; à direita um gráfico com o acerto das duas redes caindo conforme o deslocamento aumenta, com a densa caindo muito mais rápido"><figcaption>Com dois pixels de deslocamento, a densa desaba para 51,5% e a convolucional segura 76,0%.</figcaption></figure>

<p>A densa aprendeu &quot;o pixel 350 costuma ser escuro em foto de calça&quot;. Mude a
peça de lugar e essa regra morre. A convolucional aprendeu &quot;existe uma
borda vertical em algum canto&quot;, e a regra sobrevive.</p>
<p>As duas pioram, e isso também é honesto: nenhuma das duas viu foto
deslocada durante o treino. A diferença está na velocidade da queda.</p>
<h2 id="onde-ela-erra">Onde ela erra<a class="ancora" href="#onde-ela-erra" aria-label="Link para esta secao">#</a></h2>
<p>Acerto médio esconde tudo. A matriz de confusão mostra o que aconteceu com
cada categoria:</p>
<figure><img src="docs/assets/aula-08/matriz_confusao.png" alt="Matriz 10 por 10 com as categorias reais nas linhas e as respostas do modelo nas colunas, com números altos na diagonal e um bloco de erros entre camisa, camiseta, pulôver e casaco"><figcaption>Linha é o que a peça era; coluna é o que o modelo respondeu. Fora da diagonal, é erro.</figcaption></figure>

<p>Todo o erro se concentra num canto só: camisa, camiseta, pulôver e casaco.

<p>Isso muda a conversa com o cliente. Em vez de &quot;o modelo tem 90%&quot;, você diz
&quot;o modelo é confiável em oito categorias e precisa de revisão humana em
quatro&quot;. A segunda frase é útil, e só a matriz de confusão te dá ela.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Esquecer o canal. A <code>Conv2D</code> espera um bloco de formato <code>(n, 28, 28, 1)</code>,
e o Keras entrega as fotos como <code>(n, 28, 28)</code>. O erro que aparece fala de
dimensões incompatíveis e assusta. A correção é uma linha:
<code>x_treino.reshape(-1, 28, 28, 1)</code>. O <code>-1</code> quer dizer &quot;descubra quantas
fotos são&quot;.</p>
</div></div>

<h2 id="onde-estamos">Onde estamos<a class="ancora" href="#onde-estamos" aria-label="Link para esta secao">#</a></h2>
<figure><img src="docs/assets/aula-09/mapa.png" alt="Quatro quadros lado a lado, um por aula: do texto para números, para onde olhar, montar e treinar, gerar e duvidar. O primeiro está aceso"><figcaption>Quatro aulas para construir a máquina inteira. Esta é a primeira peça.</figcaption></figure>

<h2 id="o-que-um-llm-faz">O que um LLM faz<a class="ancora" href="#o-que-um-llm-faz" aria-label="Link para esta secao">#</a></h2>
<p>Um modelo de linguagem grande faz <strong>uma</strong> coisa: recebe um pedaço de texto
e devolve as probabilidades do que vem em seguida. Só isso. Conversar,
resumir, traduzir e programar são tudo consequência de repetir essa
resposta muitas vezes.</p>
<p>Comece pelo que é fácil de conferir. Aqui estão as continuações de
&quot;minha mãe&quot; nas 90 vezes em que a expressão aparece nos livros de Machado
de Assis:</p>
<figure><img src="docs/assets/aula-09/proxima_palavra.png" alt="Gráfico de barras com as continuações mais comuns da expressão minha mãe: que e era com 9% cada, depois me, ficou, lhe, e, a e fez, e uma barra grande para as outras 55 continuações"><figcaption>Nenhuma continuação passa de 9%. A resposta certa não é uma palavra, é uma distribuição.</figcaption></figure>

<p>Repare que não existe resposta certa. Existem 63 continuações diferentes, e
a mais provável aparece em menos de uma vez a cada dez. É por isso que a
saída do modelo é uma <strong>distribuição de probabilidade</strong>, exatamente como a
softmax da Aula 8 produzia para as dez categorias de roupa. Só que aqui as
categorias são todas as continuações possíveis.</p>
<h2 id="o-material-da-obra">O material da obra<a class="ancora" href="#o-material-da-obra" aria-label="Link para esta secao">#</a></h2>

ser pequeno (787.584 pesos, contra centenas de bilhões dos modelos
comerciais) e vai treinar no processador do seu computador, sem placa de
vídeo.</p>
<p>O texto que ele vai ler é toda a prosa de Machado de Assis: onze obras,
3.676.878 caracteres, 623.120 palavras. Está em domínio público, e o
arquivo mora em <code>data/machado.txt</code>.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>O detalhe que vai voltar em todas as aulas</strong></p>
<p>Esses livros são de 1880 a 1908, com a grafia da época: &quot;elle&quot;, &quot;cousa&quot;,

<h2 id="a-unidade-errada-duas-vezes">A unidade errada, duas vezes<a class="ancora" href="#a-unidade-errada-duas-vezes" aria-label="Link para esta secao">#</a></h2>
<p>Antes de qualquer conta, uma decisão: qual é a peça mínima que o modelo
manipula?</p>
<figure><img src="docs/assets/aula-09/tres_unidades.png" alt="A frase O menino era pai do homem cortada de três formas: em 26 letras, em 10 tokens e em 7 palavras"><figcaption>A mesma frase, cortada de três jeitos. O ponto médio marca um espaço dentro da peça.</figcaption></figure>

<p><strong>Palavra inteira</strong> parece o óbvio, e não funciona. O corpus tem 50.390
palavras diferentes, e essa é só a contagem de Machado. Pior: na primeira
palavra que o modelo nunca viu, ele não tem entrada nenhuma para usar.
Nomes próprios, erros de digitação e palavras novas quebram tudo.</p>
<p><strong>Letra</strong> resolve o vocabulário: são 118 caracteres diferentes, e nada
fica de fora. Mas a frase acima vira 26 peças em vez de 7. Como o custo do
modelo cresce com o número de peças, você paga quase quatro vezes mais
para dizer a mesma coisa.</p>
<h2 id="o-meio-termo-bpe">O meio-termo: BPE<a class="ancora" href="#o-meio-termo-bpe" aria-label="Link para esta secao">#</a></h2>
<p>A solução usada por todos os modelos modernos se chama <strong>codificação por
pares de bytes</strong> (<em>byte pair encoding</em>, ou BPE). A regra cabe em uma frase:</p>
<blockquote>
<p>Encontre o par de peças vizinhas mais comum no texto, junte as duas numa
peça nova, e repita.</p>
</blockquote>
<p>Faça à mão, com o texto <code>banana banana banana</code>:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Passo</th>
  <th>Par mais comum</th>
  <th>Como cada <code>banana</code> fica</th>
</tr>
</thead>
<tbody>
<tr>
  <td>0</td>
  <td></td>
  <td><code>b</code> <code>a</code> <code>n</code> <code>a</code> <code>n</code> <code>a</code></td>
</tr>
<tr>
  <td>1</td>
  <td><code>a</code>+<code>n</code>, 6 vezes</td>
  <td><code>b</code> <code>an</code> <code>an</code> <code>a</code></td>
</tr>
<tr>
  <td>2</td>
  <td><code>b</code>+<code>an</code>, 3 vezes</td>
  <td><code>ban</code> <code>an</code> <code>a</code></td>
</tr>
<tr>
  <td>3</td>
  <td><code>ban</code>+<code>an</code>, 3 vezes</td>
  <td><code>banan</code> <code>a</code></td>
</tr>
</tbody>
</table></div>
<p>Em três passos, <code>banana</code> saiu de seis peças para duas. Nenhum linguista
escolheu essas peças: elas saíram da contagem.</p>
<p>Num texto minúsculo como esse, vários pares empatam (<code>na</code> também aparece 6
vezes no passo 1) e o programa desempata por uma regra fixa. Em texto de
verdade o empate no topo quase nunca acontece.</p>
<p>Rodando isso no corpus inteiro até chegar a 1.024 peças, é isto o que sai:</p>
<figure><img src="docs/assets/aula-09/fusoes.png" alt="Três colunas com os tokens aprendidos: as primeiras fusões são pedaços curtos como espaço-d e ra, no meio aparecem casa e algum, e no fim palavras inteiras como fazer, sei e filha"><figcaption>As primeiras fusões são pedaços de duas letras. As últimas já são palavras inteiras.</figcaption></figure>

<p>Leia as três colunas na ordem. No começo o algoritmo junta o que é comum
em qualquer texto em português (<code>ra</code>, <code>os</code>, <code>qu</code>). No fim, já sobrou
espaço para palavras inteiras que Machado usa muito (<code>fazer</code>, <code>sei</code>,
<code>filha</code>). O vocabulário é um retrato do corpus.</p>
<h2 id="bytes-para-nada-ficar-de-fora">Bytes, para nada ficar de fora<a class="ancora" href="#bytes-para-nada-ficar-de-fora" aria-label="Link para esta secao">#</a></h2>
<p>Um detalhe que parece técnico e não é. O BPE não começa das letras: começa
dos <strong>bytes</strong>. Todo texto do mundo, em qualquer língua, é uma sequência de
bytes, e existem exatamente 256 valores possíveis.</p>
<p>A consequência: o vocabulário inicial tem 256 peças e cobre tudo. O
modelo nunca encontra um caractere que ele não saiba representar. Um
emoji, um ideograma chinês ou um nome próprio esquisito viram vários
bytes, e o modelo processa sem reclamar.</p>
<p>Um efeito colateral divertido: <code>ã</code> ocupa dois bytes em UTF-8, então no
começo do treino ele é duas peças. A fusão número 268 junta os dois. O
algoritmo aprendeu a letra <code>ã</code> sozinho, contando.</p>
<div class="formula" title="\text{vocabulário} = 256 \text{ bytes} + 768 \text{ fusões} = 1024"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>vocabulário</mtext><mo>&#x0003D;</mo><mn>256</mn><mtext>&#x000A0;bytes</mtext><mo>&#x0002B;</mo><mn>768</mn><mtext>&#x000A0;fusões</mtext><mo>&#x0003D;</mo><mn>1024</mn></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td>256</td>
  <td>os valores possíveis de um byte, a base de tudo</td>
</tr>
<tr>
  <td>768</td>
  <td>quantas vezes você mandou juntar o par mais comum</td>
</tr>
<tr>
  <td>1024</td>
  <td>o tamanho final da tabela, escolhido por você</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: com 768 fusões, o corpus de 3.676.878 caracteres vira 1.484.827
tokens. São 2,48 caracteres por token.</p>
<h2 id="codificar-e-decodificar">Codificar e decodificar<a class="ancora" href="#codificar-e-decodificar" aria-label="Link para esta secao">#</a></h2>
<p>Com a tabela pronta, converter texto em números é mecânico:</p>
<div class="bloco-codigo" data-lingua="python"><button class="copiar" type="button">copiar</button><pre class="realce"><code><span class="n">tokens</span> <span class="o">=</span> <span class="n">tokenizador</span><span class="o">.</span><span class="n">codificar</span><span class="p">(</span><span class="s2">"O menino era pai do homem."</span><span class="p">)</span>
<span class="c1"># [79, 600, 281, 111, 354, 405, 105, 319, 724, 46]</span>

<span class="n">tokenizador</span><span class="o">.</span><span class="n">decodificar</span><span class="p">(</span><span class="n">tokens</span><span class="p">)</span>
<span class="c1"># 'O menino era pai do homem.'</span>
</code></pre></div>
<p>Uma regra que não tem exceção: <strong>codificar e decodificar têm que usar a
mesma tabela de fusões</strong>. Se você treinar o modelo com uma tabela e usar
outra na hora de conversar com ele, os números vão significar outra coisa,
e a saída vira lixo.</p>
<figure><img src="docs/assets/aula-09/compressao.png" alt="Dois gráficos de barras comparando letra, token e palavra: à esquerda quantas peças o corpus tem em cada esquema, à direita o tamanho do vocabulário de cada um"><figcaption>O BPE fica no meio de propósito: poucas peças e vocabulário pequeno, ao mesmo tempo.</figcaption></figure>

<p>Os dois gráficos contam a mesma escolha por dois lados. Por letra, o
vocabulário é minúsculo mas o texto fica longo. Por palavra, o texto fica
curto mas o vocabulário explode. O BPE não vence em nenhum dos dois, e é
aceitável nos dois.</p>
<h2 id="do-texto-para-o-lote-de-treino">Do texto para o lote de treino<a class="ancora" href="#do-texto-para-o-lote-de-treino" aria-label="Link para esta secao">#</a></h2>
<p>Falta uma peça: como esses números viram exemplos de treino.</p>
<p>A tarefa é prever o próximo token. Então o exemplo é simplesmente a mesma
sequência, andada uma casa:</p>
<figure><img src="docs/assets/aula-09/janela.png" alt="Duas fileiras de tokens: em cima a entrada, embaixo o alvo, que é a mesma sequência deslocada uma posição para a esquerda, com setas ligando cada par"><figcaption>Entrada e alvo são o mesmo texto, com uma casa de diferença.</figcaption></figure>

<p>Repare no detalhe que faz a coisa toda ser barata: uma janela de 8 tokens
não dá <strong>um</strong> exemplo de treino. Dá 7. O modelo prevê o token 2 olhando o
1, prevê o 3 olhando o 1 e o 2, e assim por diante, tudo na mesma passada.</p>
<p>Com janelas de 128 tokens e lotes de 32, cada passo de treino corrige os
pesos usando 4.096 previsões de uma vez.</p>
<p>O tamanho da janela tem nome: <strong>janela de contexto</strong>. É o quanto o modelo
consegue olhar para trás. A sua vai ser de 128 tokens, uns 300 caracteres.
Os modelos comerciais estão na casa das centenas de milhares.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Treinar o tokenizador de novo antes de usar o modelo. Cada treino de BPE
sorteia empates de um jeito, e a tabela sai diferente. O tokenizador é
parte do modelo: salve os dois juntos, sempre. Nesta aula, o arquivo é
<code>data/machado_bpe.json</code>.</p>
</div></div>
