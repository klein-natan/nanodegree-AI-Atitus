<template class="pagina" data-id="modelos-lineares/aula-01-regressao-linear-simples" data-titulo="Aula 1 — Regressão Linear Simples" data-descricao="Reta de previsão, gradiente descendente e métricas de regressão">
<div class="destaque destaque-info" role="note"><div class="destaque-icone" aria-hidden="true">i</div><div class="destaque-corpo"><p class="destaque-rotulo">Nota</p><p><strong>O que você leva desta aula</strong></p>
<p>Você vai aprender a desenhar uma reta que prevê um preço a partir de uma
distância, a medir o quanto essa reta erra, e a usar o gradiente
descendente, a técnica que todo modelo de IA usa para aprender, para
melhorar essa reta sozinho, sem chute.</p>
</div></div>
<h2 id="para-que-serve">Para que serve<a class="ancora" href="#para-que-serve" aria-label="Link para esta secao">#</a></h2>
<p>Você chama um carro por aplicativo. Antes de aceitar a corrida, o app já
mostra o preço. Como ele sabe isso antes mesmo de você sair de casa?</p>
<p>Ele não sabe o futuro. Ele olha para o passado: milhares de corridas
anteriores, cada uma com sua distância e seu preço final. Nesses dados
existe um padrão. Corridas mais longas custam mais. O aplicativo usa esse
padrão para prever o preço da sua corrida antes de ela acontecer.</p>
<p>Regressão linear é a ferramenta mais simples para encontrar esse padrão.
Ela desenha uma reta no meio dos seus dados e usa essa reta para prever.
Esta aula usa exatamente esse exemplo, o preço de uma corrida, para
ensinar a matemática por trás de qualquer modelo de previsão.</p>
<p>Veja como fica quando você coloca a distância e o preço de 200 corridas
num gráfico:</p>
<figure><img src="docs/assets/aula-01/dispersao.png" alt="Gráfico de dispersão mostrando distância no eixo x e preço no eixo y, com pontos formando uma tendência crescente"><figcaption>Cada ponto é uma corrida real.</figcaption></figure>

<p>Os pontos não formam uma reta perfeita. O trânsito, o horário e outros
fatores empurram cada corrida um pouco para cima ou para baixo. Mas dá
para ver uma tendência clara: quanto maior a distância, maior o preço. É
essa tendência que a regressão linear captura.</p>
<h2 id="a-reta-que-preve-o-preco">A reta que prevê o preço<a class="ancora" href="#a-reta-que-preve-o-preco" aria-label="Link para esta secao">#</a></h2>
<p>Uma reta de regressão é uma regra simples: você entra com a distância, ela
devolve o preço previsto.</p>
<p>O preço previsto é a taxa fixa (o valor cobrado mesmo numa corrida de 0
km) mais o preço por quilômetro, multiplicado pela distância.</p>
<div class="formula" title="\text{preço} = w_0 + w_1 \cdot \text{distância}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>preço</mtext><mo>&#x0003D;</mo><msub><mi>w</mi><mn>0</mn></msub><mo>&#x0002B;</mo><msub><mi>w</mi><mn>1</mn></msub><mo>&#x000B7;</mo><mtext>distância</mtext></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>preço</code></td>
  <td>o preço previsto pela reta, em reais</td>
</tr>
<tr>
  <td><code>distância</code></td>
  <td>a distância da corrida, em km</td>
</tr>
<tr>
  <td><code>w₀</code></td>
  <td>a taxa fixa: o preço previsto para uma corrida de 0 km</td>
</tr>
<tr>
  <td><code>w₁</code></td>
  <td>o preço por km: quanto o preço sobe para cada km a mais</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: se <code>w₀ = 5</code> e <code>w₁ = 2,20</code>, uma corrida de 8 km custa <code>5 + 2,20 × 8 = 22,60</code> reais.</p>
<p>Repare que <code>w₁</code> é o único número que decide o quanto o preço reage à
distância. Se <code>w₁</code> dobrasse, cada km rodado custaria o dobro. A reta
ficaria bem mais inclinada, e corridas longas ficariam
desproporcionalmente mais caras.</p>
<p><code>w₀</code> e <code>w₁</code> (lê-se &quot;peso zero&quot; e &quot;peso um&quot;) se chamam <strong>coeficientes</strong> ou
<strong>pesos</strong> do modelo. Encontrar a melhor reta é, na prática, encontrar os
melhores valores para esses dois números. O nome &quot;peso&quot; (do inglês
<em>weight</em>) é o mesmo usado em modelos bem maiores: cada conexão de uma
rede neural tem um peso, e a ideia continua sendo esta.</p>
<h2 id="o-erro-de-cada-previsao">O erro de cada previsão<a class="ancora" href="#o-erro-de-cada-previsao" aria-label="Link para esta secao">#</a></h2>
<p>Nenhuma reta acerta todas as 200 corridas. Os pontos não estão exatamente
alinhados. A diferença entre o preço real de uma corrida e o preço que a
reta previu para ela se chama <strong>resíduo</strong> (também chamado de <em>erro</em>).</p>
<div class="formula" title="\text{resíduo} = \text{preço real} - \text{preço previsto}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>resíduo</mtext><mo>&#x0003D;</mo><mtext>preço&#x000A0;real</mtext><mo>&#x02212;</mo><mtext>preço&#x000A0;previsto</mtext></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>preço real</code></td>
  <td>o preço que a corrida realmente teve</td>
</tr>
<tr>
  <td><code>preço previsto</code></td>
  <td>o preço que a reta calculou para essa mesma corrida</td>
</tr>
</tbody>
</table></div>
<p>Exemplo: uma corrida de 8 km custou R$ 25,00, e a reta previu R$ 22,60.
O resíduo dessa corrida é 25,00 − 22,60 = R$ 2,40.</p>
<p>A mesma conta, escrita com símbolos:</p>
<div class="formula" title="arepsilon_i = y_i - \hat{y}_i"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>a</mi><mi>r</mi><mi>e</mi><mi>p</mi><mi>s</mi><mi>i</mi><mi>l</mi><mi>o</mi><msub><mi>n</mi><mi>i</mi></msub><mo>&#x0003D;</mo><msub><mi>y</mi><mi>i</mi></msub><mo>&#x02212;</mo><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>i</mi></msub></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>i</code></td>
  <td>o número da corrida: 1 para a primeira, 2 para a segunda...</td>
</tr>
<tr>
  <td><code>εᵢ</code></td>
  <td>o resíduo da corrida <code>i</code> (lê-se &quot;épsilon i&quot;)</td>
</tr>
<tr>
  <td><code>yᵢ</code></td>
  <td>o preço real da corrida <code>i</code></td>
</tr>
<tr>
  <td><code>ŷᵢ</code></td>
  <td>o preço previsto para a corrida <code>i</code> (lê-se &quot;y chapéu&quot;)</td>
</tr>
</tbody>
</table></div>
<p>No exemplo acima, <code>y₁ = 25,00</code>, <code>ŷ₁ = 22,60</code> e <code>ε₁ = 2,40</code>. Esses três
símbolos voltam em todas as fórmulas de erro desta página.</p>
<p>Um resíduo positivo significa que a reta previu um preço menor que o
real. Um resíduo negativo significa que ela previu um preço maior.
Visualmente, o resíduo é a distância vertical entre o ponto e a reta:</p>
<figure><img src="docs/assets/aula-01/residuos.png" alt="Gráfico mostrando uma reta de regressão com segmentos verticais amarelos conectando cada ponto real à reta, representando o resíduo"><figcaption>O resíduo é a distância vertical até a reta. Quanto mais perto de zero, melhor a previsão daquela corrida.</figcaption></figure>

<p>Uma reta boa não é a que acerta uma corrida perfeitamente. É a que erra
pouco, na média, em todas as corridas ao mesmo tempo.</p>
<h2 id="encontrando-a-melhor-reta-o-erro-quadratico-medio">Encontrando a melhor reta: o erro quadrático médio<a class="ancora" href="#encontrando-a-melhor-reta-o-erro-quadratico-medio" aria-label="Link para esta secao">#</a></h2>
<p>Para comparar retas diferentes, você precisa de um único número que
resuma o quanto uma reta erra. O mais usado é o <strong>erro quadrático médio</strong>
(<em>mean squared error</em>, ou MSE): a média dos resíduos, cada um elevado ao
quadrado.</p>
<div class="formula" title="\text{MSE} = \frac{1}{n}\sum_{i=1}^{n}(y_i - \hat{y}_i)^2"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>MSE</mtext><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mo stretchy="false">&#x00028;</mo><msub><mi>y</mi><mi>i</mi></msub><mo>&#x02212;</mo><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>i</mi></msub><msup><mo stretchy="false">&#x00029;</mo><mn>2</mn></msup></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>n</code></td>
  <td>o número de corridas</td>
</tr>
<tr>
  <td><code>yᵢ</code></td>
  <td>o preço real da corrida <code>i</code></td>
</tr>
<tr>
  <td><code>ŷᵢ</code></td>
  <td>o preço que a reta previu para a corrida <code>i</code> (lê-se &quot;y chapéu&quot;)</td>
</tr>
</tbody>
</table></div>
<p>Por que elevar ao quadrado, e não só somar os erros? Por dois motivos.
Primeiro, um resíduo pode ser negativo (a reta previu preço maior que o
real) ou positivo (previu menor). Se você só somasse, um erro positivo
cancelaria um negativo, e a soma poderia dar zero mesmo com a reta
errando bastante. Elevar ao quadrado remove esse problema, porque todo
número ao quadrado é positivo. Segundo, o quadrado penaliza mais os erros
grandes: errar R$ 2 em uma corrida conta 4; errar R$ 10 conta 100. Vinte
e cinco vezes mais, não só cinco.</p>
<p>Exemplo com 3 corridas, cujos resíduos foram R$ 1, R$ -2 e R$ 3: elevando
cada um ao quadrado, você tem 1, 4 e 9. A média é (1+4+9)/3 = 4,67. O MSE
dessas três corridas é 4,67, em reais ao quadrado. Uma unidade estranha,
que é justamente o motivo de existirem as outras métricas desta página.</p>
<p>Quanto menor o MSE, melhor a reta. Veja três retas candidatas para os
mesmos dados, cada uma com seu MSE:</p>
<figure><img src="docs/assets/aula-01/tres_retas.png" alt="Gráfico de dispersão com três retas candidatas de inclinações diferentes, cada uma com seu MSE indicado na legenda"><figcaption>A reta do meio tem o menor MSE. É a que melhor acompanha os pontos.</figcaption></figure>

<h2 id="existe-um-atalho-minimos-quadrados">Existe um atalho: mínimos quadrados<a class="ancora" href="#existe-um-atalho-minimos-quadrados" aria-label="Link para esta secao">#</a></h2>
<p>Para uma reta simples como esta, existe uma fórmula que calcula os
melhores <code>w₀</code> e <code>w₁</code> direto, sem precisar tentar valor por valor. Ela se
chama <strong>mínimos quadrados</strong> (<em>ordinary least squares</em>).</p>
<div class="formula" title="w_1 = \frac{\sum_{i=1}^{n}(x_i - \bar{x})(y_i - \bar{y})}{\sum_{i=1}^{n}(x_i - \bar{x})^2} \qquad w_0 = \bar{y} - w_1 \bar{x}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>w</mi><mn>1</mn></msub><mo>&#x0003D;</mo><mfrac><mrow><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mo stretchy="false">&#x00028;</mo><msub><mi>x</mi><mi>i</mi></msub><mo>&#x02212;</mo><mover><mrow><mi>x</mi></mrow><mo stretchy="true">&#x000AF;</mo></mover><mo stretchy="false">&#x00029;</mo><mo stretchy="false">&#x00028;</mo><msub><mi>y</mi><mi>i</mi></msub><mo>&#x02212;</mo><mover><mrow><mi>y</mi></mrow><mo stretchy="true">&#x000AF;</mo></mover><mo stretchy="false">&#x00029;</mo></mrow><mrow><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mo stretchy="false">&#x00028;</mo><msub><mi>x</mi><mi>i</mi></msub><mo>&#x02212;</mo><mover><mrow><mi>x</mi></mrow><mo stretchy="true">&#x000AF;</mo></mover><msup><mo stretchy="false">&#x00029;</mo><mn>2</mn></msup></mrow></mfrac><mspace width="2em" /><msub><mi>w</mi><mn>0</mn></msub><mo>&#x0003D;</mo><mover><mrow><mi>y</mi></mrow><mo stretchy="true">&#x000AF;</mo></mover><mo>&#x02212;</mo><msub><mi>w</mi><mn>1</mn></msub><mover><mrow><mi>x</mi></mrow><mo stretchy="true">&#x000AF;</mo></mover></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>xᵢ</code>, <code>yᵢ</code></td>
  <td>a distância e o preço da corrida <code>i</code></td>
</tr>
<tr>
  <td><code>x̄</code></td>
  <td>a média de todas as distâncias</td>
</tr>
<tr>
  <td><code>ȳ</code></td>
  <td>a média de todos os preços</td>
</tr>
</tbody>
</table></div>
<p>Este guia não deduz de onde essa fórmula vem. O importante aqui é saber
que ela existe e o que ela calcula, não como alguém a inventou.</p>
<p>Exemplo com 3 corridas de brinquedo, com distâncias 1, 2 e 3 km e preços
R$ 6, R$ 9 e R$ 15: a distância média é <code>x̄ = 2</code> e o preço médio é
<code>ȳ = 10</code>. Aplicando a fórmula, <code>w₁ = 4,5</code> e <code>w₀ = 1</code>. A melhor reta para
este mini-exemplo é <code>preço = 1 + 4,5 × distância</code>.</p>
<div class="destaque destaque-success" role="note"><div class="destaque-icone" aria-hidden="true">✓</div><div class="destaque-corpo"><p class="destaque-rotulo">Dica</p><p>Repare que os resíduos dessa reta (0,50, -1,00 e 0,50) somam zero. Isso
não é coincidência: a reta de mínimos quadrados sempre produz resíduos
que somam exatamente zero. É uma boa forma de conferir uma conta feita à
mão.</p>
</div></div>
<p>Se essa fórmula resolve o problema direto, por que aprender outro jeito
de chegar à mesma resposta? Porque ela é a exceção, não a regra. A
próxima seção mostra o método que funciona quando ela não existe, que é
quase sempre.</p>
<h2 id="gradiente-descendente-descendo-a-serra-na-neblina">Gradiente descendente: descendo a serra na neblina<a class="ancora" href="#gradiente-descendente-descendo-a-serra-na-neblina" aria-label="Link para esta secao">#</a></h2>
<p>Imagine que você está numa serra, de noite, com neblina fechada. Você não
enxerga o vale lá embaixo, mas consegue sentir com os pés se o chão desce
para a esquerda ou para a direita. A estratégia mais simples para chegar
ao fundo do vale é: sinta a inclinação do chão onde você está, dê um
passo na direção que desce, e repita.</p>
<p>O <strong>gradiente descendente</strong> faz exatamente isso, mas em vez de um vale de
terra, o &quot;terreno&quot; é o MSE. Em vez de posição geográfica, você está
&quot;andando&quot; sobre os valores possíveis de <code>w₀</code> e <code>w₁</code>. A inclinação do
terreno em cada ponto tem um nome técnico: <strong>gradiente</strong>. Ele aponta para
onde o erro cresce mais rápido, e por isso você anda na direção
contrária a ele.</p>
<h3 id="por-que-nao-usar-sempre-o-atalho">Por que não usar sempre o atalho<a class="ancora" href="#por-que-nao-usar-sempre-o-atalho" aria-label="Link para esta secao">#</a></h3>
<p>A fórmula dos mínimos quadrados dá a resposta exata de primeira, sem
passo nenhum. Parece sempre melhor que descer a serra tateando no
escuro. E é, para uma reta com dois pesos.</p>
<p>O problema é que ela não escala. Aquela fórmula existe porque alguém
conseguiu resolver a conta no papel, e isso só dá certo em modelos
pequenos. Uma rede neural tem milhões de pesos amarrados uns nos outros,
e ninguém nunca resolveu essa conta no papel. Para ela não existe fórmula
fechada, e provavelmente nunca vai existir.</p>
<p>O gradiente descendente não precisa resolver conta nenhuma. Ele precisa
saber uma coisa só: de onde estou, para que lado o erro diminui? Essa
pergunta tem resposta em qualquer modelo, de qualquer tamanho.</p>
<p>É por isso que esta seção é a mais importante da aula. O mesmo método que
ajusta a reta das corridas treina a rede que reconhece imagens na Aula 8
e o modelo de linguagem que você constrói na Aula 11. Muda o tamanho do
modelo. A ideia é esta.</p>
<h3 id="o-terreno-existe-e-da-para-desenha-lo">O terreno existe, e dá para desenhá-lo<a class="ancora" href="#o-terreno-existe-e-da-para-desenha-lo" aria-label="Link para esta secao">#</a></h3>
<p>Essa serra não é só uma figura de linguagem. Para enxergá-la, congele
<code>w₀</code> no valor que os mínimos quadrados dão (4,63) e mexa só em <code>w₁</code>. Cada
valor de <code>w₁</code> dá uma reta diferente, e cada reta tem o seu MSE. Marque
<code>w₁</code> no eixo horizontal e o MSE no eixo vertical, e o terreno aparece:</p>
<figure><img src="docs/assets/aula-01/perda_1d.png" alt="Curva em forma de U mostrando o MSE para cada valor de w1, com retas tangentes desenhadas em dois pontos e o mínimo marcado no meio"><figcaption>Cada ponto desta curva é uma reta diferente, com o erro que ela comete. O fundo do U é o melhor preço por km.</figcaption></figure>

<p>Repare em três coisas. A curva tem um fundo, e é ali que mora o melhor
<code>w₁</code>. À esquerda do fundo ela desce, à direita ela sobe. E a inclinação
do chão em cada ponto já diz para que lado andar: onde a curva desce,
aumentar <code>w₁</code> diminui o erro.</p>
<h3 id="a-inclinacao-tem-nome-derivada">A inclinação tem nome: derivada<a class="ancora" href="#a-inclinacao-tem-nome-derivada" aria-label="Link para esta secao">#</a></h3>
<p>Você está parado num ponto da curva e precisa decidir uma coisa só: para
que lado andar. A <strong>derivada</strong> responde exatamente isso. Ela olha o peso
onde você está e diz o que acontece com o erro se você aumentar esse peso
um tiquinho.</p>
<p>Pense numa placa de estrada avisando &quot;10% de inclinação&quot;: a cada 100
metros andados para a frente, a estrada sobe 10 metros. Aqui, &quot;andar para
a frente&quot; é aumentar o peso, e &quot;subir&quot; é o erro aumentar.</p>
<p>A conta é a mesma da placa. Ande um tiquinho para a frente e veja o
quanto o erro subiu.</p>
<div class="formula" title="\text{inclinação} \approx \frac{\text{MSE}(w_1 + h) - \text{MSE}(w_1)}{h}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>inclinação</mtext><mo>&#x02248;</mo><mfrac><mrow><mtext>MSE</mtext><mo stretchy="false">&#x00028;</mo><msub><mi>w</mi><mn>1</mn></msub><mo>&#x0002B;</mo><mi>h</mi><mo stretchy="false">&#x00029;</mo><mo>&#x02212;</mo><mtext>MSE</mtext><mo stretchy="false">&#x00028;</mo><msub><mi>w</mi><mn>1</mn></msub><mo stretchy="false">&#x00029;</mo></mrow><mrow><mi>h</mi></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>h</code></td>
  <td>o tiquinho andado: um avanço pequeno no valor de <code>w₁</code></td>
</tr>
<tr>
  <td><code>MSE(w₁)</code></td>
  <td>o erro com o <code>w₁</code> de agora</td>
</tr>
<tr>
  <td><code>MSE(w₁ + h)</code></td>
  <td>o erro depois de andar esse tiquinho</td>
</tr>
<tr>
  <td><code>≈</code></td>
  <td>&quot;quase igual&quot;: a conta fica exata quando <code>h</code> encolhe até quase zero</td>
</tr>
</tbody>
</table></div>
<p>Exemplo, partindo de <code>w₁ = 3,20</code> com um avanço de <code>h = 0,05</code>: o erro sai
de 56,75 para 62,38. A subida foi 5,63, e 5,63 ÷ 0,05 = 112,7. A
inclinação naquele ponto é 112,7. Ela é positiva, então aumentar <code>w₁</code>
aumenta o erro, e o caminho para baixo é o contrário.</p>
<p><strong>Como ler o número que sai.</strong> Ele carrega duas informações ao mesmo
tempo, e o modelo usa as duas:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>O que a derivada diz</th>
  <th>O que o modelo faz com isso</th>
</tr>
</thead>
<tbody>
<tr>
  <td><strong>Sinal positivo</strong>: aumentar o peso aumenta o erro</td>
  <td>anda para o outro lado, diminuindo o peso</td>
</tr>
<tr>
  <td><strong>Sinal negativo</strong>: aumentar o peso diminui o erro</td>
  <td>anda para a frente, aumentando o peso</td>
</tr>
<tr>
  <td><strong>Número grande</strong>: ladeira íngreme, o erro muda rápido ali</td>
  <td>dá um passo maior</td>
</tr>
<tr>
  <td><strong>Número perto de zero</strong>: chão plano, o erro quase não muda</td>
  <td>dá um passo curto: o fundo está perto</td>
</tr>
</tbody>
</table></div>
<p>É por isso que a derivada é a peça que faltava. Sem ela, você saberia o
erro do lugar onde está e mais nada, e teria que testar valores no
escuro, um por um. Com ela, você sabe para onde ir antes de dar o passo.</p>
<p>A animação mostra o que acontece quando o avanço encolhe. A reta amarela
liga dois pontos da curva, e tem nome: <strong>secante</strong>. Quanto menor o
avanço, mais ela cola na reta tracejada, aquela que toca a curva em um
ponto só: a <strong>tangente</strong>. A derivada é a inclinação dessa tangente.</p>
<figure><img src="docs/assets/aula-01/derivada_secante.gif" alt="Animação de uma reta secante ligando dois pontos da curva de erro; conforme o segundo ponto se aproxima do primeiro, a secante vira a reta tangente"><figcaption>Encolha o avanço e a secante vira a tangente. A inclinação dela é a derivada.</figcaption></figure>

<p>Ninguém precisa calcular derivada à mão neste curso. Quem faz essa conta
é o computador. O que você precisa levar é o significado do número: para
que lado o erro cresce, e o quão rápido.</p>
<h3 id="o-gradiente-uma-inclinacao-para-cada-peso">O gradiente: uma inclinação para cada peso<a class="ancora" href="#o-gradiente-uma-inclinacao-para-cada-peso" aria-label="Link para esta secao">#</a></h3>
<p>A curva de antes tinha um peso só, porque <code>w₀</code> ficou congelado. No treino
de verdade os dois pesos se mexem, e aí não existe uma inclinação só.
Existe uma para cada peso: o quanto o erro muda se você mexer só em <code>w₀</code>,
e o quanto ele muda se você mexer só em <code>w₁</code>. Essa lista de inclinações é
o <strong>gradiente</strong>.</p>
<div class="formula" title="\nabla \text{MSE} = \left( \frac{\partial \text{MSE}}{\partial w_0} \; , \; \frac{\partial \text{MSE}}{\partial w_1} \right)"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mo>&#x02207;</mo><mtext>MSE</mtext><mo>&#x0003D;</mo><mrow><mo stretchy="true" fence="true" form="prefix">&#x00028;</mo><mfrac><mrow><mo>&#x02202;</mo><mtext>MSE</mtext></mrow><mrow><mo>&#x02202;</mo><msub><mi>w</mi><mn>0</mn></msub></mrow></mfrac><mspace width="0.278em" /><mo>&#x0002C;</mo><mspace width="0.278em" /><mfrac><mrow><mo>&#x02202;</mo><mtext>MSE</mtext></mrow><mrow><mo>&#x02202;</mo><msub><mi>w</mi><mn>1</mn></msub></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">&#x00029;</mo></mrow></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>∇</code></td>
  <td>nabla: o símbolo do gradiente, a lista de todas as inclinações</td>
</tr>
<tr>
  <td><code>∂MSE/∂w₀</code></td>
  <td>a inclinação do erro quando só <code>w₀</code> se mexe</td>
</tr>
<tr>
  <td><code>∂MSE/∂w₁</code></td>
  <td>a inclinação do erro quando só <code>w₁</code> se mexe</td>
</tr>
</tbody>
</table></div>
<p>O símbolo <code>∂</code> é a derivada quando existe mais de um peso. Ele quer dizer:
mexa só neste peso aqui e segure os outros parados. A conta continua sendo
a mesma de antes, subida dividida por avanço, feita uma vez por peso.</p>
<p>Volte para a serra. Andar só para o norte tem uma inclinação, andar só
para o leste tem outra, e o gradiente é esse par. Ele aponta para onde o
erro cresce mais rápido, e é por isso que o modelo anda no sentido
contrário.</p>
<p>Exemplo com duas corridas de brinquedo (2 km por R$ 9 e 5 km por R$ 15) e
o chute <code>w₀ = 0</code>, <code>w₁ = 2</code>. As previsões são R$ 4 e R$ 10, então os dois
resíduos valem R$ 5. O gradiente nesse ponto é <code>(−10 ; −35)</code>. Os dois
números são negativos, o que significa que subir os dois pesos reduz o
erro.</p>
<h3 id="a-regra-de-atualizacao">A regra de atualização<a class="ancora" href="#a-regra-de-atualizacao" aria-label="Link para esta secao">#</a></h3>
<div class="formula" title="w_{t+1} = w_t - \alpha \cdot \frac{\partial \text{MSE}}{\partial w}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mi>w</mi><mrow><mi>t</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msub><mo>&#x0003D;</mo><msub><mi>w</mi><mi>t</mi></msub><mo>&#x02212;</mo><mi>&#x003B1;</mi><mo>&#x000B7;</mo><mfrac><mrow><mo>&#x02202;</mo><mtext>MSE</mtext></mrow><mrow><mo>&#x02202;</mo><mi>w</mi></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>t</code></td>
  <td>o número do passo: <code>t = 0</code> é o chute inicial</td>
</tr>
<tr>
  <td><code>wₜ</code></td>
  <td>o valor do peso no passo <code>t</code></td>
</tr>
<tr>
  <td><code>wₜ₊₁</code></td>
  <td>o valor que esse peso passa a ter no passo seguinte</td>
</tr>
<tr>
  <td><code>α</code></td>
  <td>a taxa de aprendizado (<em>learning rate</em>): o tamanho do passo</td>
</tr>
<tr>
  <td><code>∂MSE/∂w</code></td>
  <td>a inclinação do erro naquele ponto, para aquele peso</td>
</tr>
</tbody>
</table></div>
<p>O sinal de menos é o coração da fórmula. Se a inclinação é positiva, o
erro cresce para a frente, então o peso anda para trás. Se é negativa, o
peso anda para a frente.</p>
<p>O <code>t</code> é só um contador de passos. A fórmula é uma receita para repetir:
você calcula o peso do passo seguinte a partir do peso de agora, e usa
esse resultado como ponto de partida da próxima volta. Cada peso tem a sua
própria linha, com a sua própria inclinação.</p>
<p>Veja dois passos calculados à mão, com as mesmas duas corridas de
brinquedo, taxa de aprendizado <code>α = 0,01</code>, e o chute inicial <code>w₀ = 0</code>,
<code>w₁ = 2</code>:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Passo</th>
  <th><code>w₀</code></th>
  <th><code>w₁</code></th>
  <th>MSE</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>t = 0</code> (chute inicial)</td>
  <td>0,00</td>
  <td>2,00</td>
  <td>25,00</td>
</tr>
<tr>
  <td><code>t = 1</code></td>
  <td>0,10</td>
  <td>2,35</td>
  <td>13,78</td>
</tr>
<tr>
  <td><code>t = 2</code></td>
  <td>0,17</td>
  <td>2,59</td>
  <td>8,43</td>
</tr>
</tbody>
</table></div>
<p>A cada passo, o MSE cai. A reta está melhorando sozinha, sem que ninguém
diga qual deveria ser o próximo chute. Rodando esse mesmo processo
dezenas de vezes, ele se aproxima cada vez mais da resposta que a fórmula
de mínimos quadrados dá direto.</p>
<p>Na curva do erro, esse processo vira uma bolinha escorregando para o
fundo. Repare que os passos encolhem sozinhos: perto do fundo o chão fica
plano, a inclinação diminui, e o passo diminui junto.</p>
<figure><img src="docs/assets/aula-01/descida_1d.gif" alt="Animação de um ponto descendo a curva de erro; a cada passo aparece a reta tangente e os valores de w1, da inclinação e do erro"><figcaption>Cada passo anda contra a inclinação. Perto do fundo, os passos ficam curtos.</figcaption></figure>

<h3 id="o-algoritmo-do-comeco-ao-fim">O algoritmo, do começo ao fim<a class="ancora" href="#o-algoritmo-do-comeco-ao-fim" aria-label="Link para esta secao">#</a></h3>
<p>Junte as peças e o gradiente descendente inteiro cabe em cinco passos:</p>
<ol>
<li><strong>Chute qualquer valor</strong> para <code>w₀</code> e <code>w₁</code>. Zero serve. O chute não
precisa ser bom, e quase nunca é.</li>
<li><strong>Calcule o erro</strong> (o MSE) com os pesos que você tem agora.</li>
<li><strong>Calcule a inclinação</strong> do erro para cada peso. É a conta da seção
anterior, feita uma vez por peso.</li>
<li><strong>Ande contra a inclinação</strong>: aplique a regra de atualização, uma vez
para cada peso.</li>
<li><strong>Volte ao passo 2</strong> e repita.</li>
</ol>
<p>Quando parar? Quando o erro parar de cair de forma perceptível. Perto do
fundo a inclinação chega perto de zero, os passos encolhem sozinhos, e
mais uma volta quase não muda nada. Na prática você também define um
número máximo de voltas, para o programa não rodar para sempre.</p>
<p>Repare no que o algoritmo <strong>não</strong> faz. Ele nunca testa todos os valores
possíveis de <code>w₀</code> e <code>w₁</code>. Ele nunca precisa enxergar o terreno inteiro.
Ele olha só para o chão embaixo dos próprios pés, e essa modéstia é o que
faz o método funcionar tanto num modelo de dois pesos quanto num de
bilhões.</p>
<h3 id="com-os-dois-pesos-ao-mesmo-tempo">Com os dois pesos ao mesmo tempo<a class="ancora" href="#com-os-dois-pesos-ao-mesmo-tempo" aria-label="Link para esta secao">#</a></h3>
<p>Congelar <code>w₀</code> foi só para caber num desenho. No treino de verdade os dois
pesos mudam juntos, e o terreno deixa de ser uma curva. Com dois pesos
ele vira uma superfície, uma bacia de verdade:</p>
<figure><img src="docs/assets/aula-01/bacia_3d.png" alt="Superfície em três dimensões com formato de bacia: w0 e w1 na base, o MSE na altura, e uma linha vermelha descendo a parede da bacia até o fundo"><figcaption>A curva de antes é uma fatia desta bacia. O gradiente descendente escorrega pela parede até o fundo.</figcaption></figure>

<p>A regra de atualização não muda quando os dois pesos andam juntos. Você a
aplica duas vezes por passo, uma para cada peso, cada uma com a sua
inclinação.</p>
<p>Essa mesma bacia, vista de cima, vira um mapa. Cada tom de cinza é um
valor de MSE, e a linha vermelha é o caminho que o gradiente descendente
percorre, passo a passo, até chegar perto do fundo, a região mais clara,
onde o erro é menor.</p>
<figure><img src="docs/assets/aula-01/bacia_perda.png" alt="Mapa de contorno mostrando os valores de MSE para diferentes combinações de w0 e w1, com uma linha vermelha mostrando o caminho do gradiente descendente até a região de menor erro"><figcaption>Cada ponto do mapa é uma reta diferente. O gradiente descendente caminha até a região de menor erro.</figcaption></figure>

<h3 id="a-taxa-de-aprendizado">A taxa de aprendizado<a class="ancora" href="#a-taxa-de-aprendizado" aria-label="Link para esta secao">#</a></h3>
<p>O tamanho do passo, <code>α</code>, decide se o gradiente descendente funciona bem,
devagar, ou nem funciona:</p>
<figure><img src="docs/assets/aula-01/curvas_perda_alpha.png" alt="Gráfico com três curvas de erro ao longo dos passos do gradiente descendente: uma decrescendo devagar, uma decrescendo rápido e uma crescendo exponencialmente"><figcaption>Taxa pequena demais: aprende, mas devagar. Taxa boa: converge rápido. Taxa grande demais: o erro explode.</figcaption></figure>

<ul>
<li><strong>Taxa pequena demais.</strong> Cada passo é curto. O modelo até melhora, mas
leva muito mais tempo, e muito mais passos, para chegar perto da
melhor reta.</li>
<li><strong>Taxa boa.</strong> Os passos são grandes o suficiente para andar rápido, mas
pequenos o suficiente para não passar do ponto certo.</li>
<li><strong>Taxa grande demais.</strong> Cada passo é tão largo que ultrapassa o fundo
da bacia e cai do outro lado, cada vez mais alto. O erro, em vez de
cair, cresce sem parar.</li>
</ul>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>É comum, na primeira vez que se usa gradiente descendente, escolher uma
taxa de aprendizado grande demais para &quot;o modelo aprender mais rápido&quot;,
e ver o erro, em vez de diminuir, virar um número gigante ou <code>nan</code> (&quot;não
é um número&quot;, o jeito do Python de dizer que a conta explodiu). Se isso
acontecer, a correção quase sempre é a mesma: diminua a taxa de
aprendizado, muitas vezes por um fator de 10, e rode de novo.</p>
</div></div>
<h2 id="metricas-de-regressao">Métricas de regressão<a class="ancora" href="#metricas-de-regressao" aria-label="Link para esta secao">#</a></h2>
<p>Depois de treinar um modelo, você precisa de números que digam, em
linguagem simples, o quanto ele erra. Cada métrica conta uma parte da
história. Vamos calcular as quatro para o mesmo mini-exemplo de antes (as
3 corridas de brinquedo, com resíduos 0,50, -1,00 e 0,50).</p>
<h3 id="mae-o-erro-medio-em-reais">MAE: o erro médio, em reais<a class="ancora" href="#mae-o-erro-medio-em-reais" aria-label="Link para esta secao">#</a></h3>
<p>O <strong>erro absoluto médio</strong> (<em>mean absolute error</em>) é a média do tamanho
dos erros, ignorando se cada um é para cima ou para baixo.</p>
<div class="formula" title="\text{MAE} = \frac{1}{n}\sum_{i=1}^{n}|y_i - \hat{y}_i|"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>MAE</mtext><mo>&#x0003D;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mo stretchy="false">&#x0007C;</mo><msub><mi>y</mi><mi>i</mi></msub><mo>&#x02212;</mo><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>i</mi></msub><mo stretchy="false">&#x0007C;</mo></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td>barras verticais</td>
  <td>valor absoluto: transforma um número negativo em positivo</td>
</tr>
<tr>
  <td><code>n</code>, <code>yᵢ</code>, <code>ŷᵢ</code></td>
  <td>os mesmos símbolos do MSE (número de corridas, preço real, preço previsto)</td>
</tr>
</tbody>
</table></div>
<p>As barras verticais em torno de <code>yᵢ - ŷᵢ</code> deixam um número já positivo
como está, e transformam um número negativo em positivo.</p>
<p>No mini-exemplo: (0,50 + 1,00 + 0,50)/3 = 0,67. Em média, a reta erra
R$ 0,67 por corrida, na mesma unidade do preço, fácil de explicar para
qualquer pessoa.</p>
<h3 id="mse-e-rmse-penalizando-os-erros-grandes">MSE e RMSE: penalizando os erros grandes<a class="ancora" href="#mse-e-rmse-penalizando-os-erros-grandes" aria-label="Link para esta secao">#</a></h3>
<p>Você já viu o MSE (a média dos erros ao quadrado). No mini-exemplo:
(0,25 + 1,00 + 0,25)/3 = 0,50. O problema do MSE é a unidade: &quot;reais ao
quadrado&quot; não significa nada no mundo real.</p>
<p>A <strong>raiz do erro quadrático médio</strong> (<em>root mean squared error</em>, RMSE)
resolve isso. É só a raiz quadrada do MSE, o que devolve a métrica para
a unidade original.</p>
<div class="formula" title="\text{RMSE} = \sqrt{\text{MSE}}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>RMSE</mtext><mo>&#x0003D;</mo><msqrt><mrow><mtext>MSE</mtext></mrow></msqrt></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td>raiz quadrada</td>
  <td>devolve o MSE para a unidade original (reais)</td>
</tr>
</tbody>
</table></div>
<p>No mini-exemplo: a raiz quadrada de 0,50 é 0,71. O RMSE fica bem perto do
MAE neste caso. Isso muda quando existe um erro muito fora do padrão.</p>
<h3 id="mape-o-erro-em-porcentagem">MAPE: o erro em porcentagem<a class="ancora" href="#mape-o-erro-em-porcentagem" aria-label="Link para esta secao">#</a></h3>
<p>Nas 200 corridas, o MAE do modelo dá R$ 1,61. Agora responda: isso é
muito?</p>
<p>Depende da corrida. Errar R$ 1,61 numa corrida de R$ 8 é errar um quinto
do preço, e o cliente percebe na hora. Errar os mesmos R$ 1,61 numa
corrida de R$ 50 é errar pouco mais de 3%, e ninguém reclama. O mesmo
erro em reais não vale a mesma coisa nas duas.</p>
<p>O <strong>erro percentual absoluto médio</strong> (<em>mean absolute percentage error</em>,
MAPE) resolve isso com uma ideia só: antes de tirar a média, transforme o
erro de cada corrida em porcentagem do preço daquela corrida.</p>
<p>Faça isso corrida por corrida, no mini-exemplo de três:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Corrida</th>
  <th>Preço real</th>
  <th>Previsto</th>
  <th>Resíduo</th>
  <th>Em % do preço real</th>
</tr>
</thead>
<tbody>
<tr>
  <td>1</td>
  <td>R$ 6,00</td>
  <td>R$ 5,50</td>
  <td>+R$ 0,50</td>
  <td>0,50 ÷ 6,00 = 8,3%</td>
</tr>
<tr>
  <td>2</td>
  <td>R$ 9,00</td>
  <td>R$ 10,00</td>
  <td>−R$ 1,00</td>
  <td>1,00 ÷ 9,00 = 11,1%</td>
</tr>
<tr>
  <td>3</td>
  <td>R$ 15,00</td>
  <td>R$ 14,50</td>
  <td>+R$ 0,50</td>
  <td>0,50 ÷ 15,00 = 3,3%</td>
</tr>
</tbody>
</table></div>
<p>A última coluna joga fora o sinal: errar R$ 1 para cima ou para baixo
conta igual. A média dessas três porcentagens é
(8,3 + 11,1 + 3,3) ÷ 3 = <strong>7,6%</strong>. Esse é o MAPE.</p>
<p>A fórmula diz isso mesmo, em símbolos:</p>
<div class="formula" title="\text{MAPE} = \frac{100}{n}\sum_{i=1}^{n}\left|\frac{y_i - \hat{y}_i}{y_i}\right|"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>MAPE</mtext><mo>&#x0003D;</mo><mfrac><mrow><mn>100</mn></mrow><mrow><mi>n</mi></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mrow><mo stretchy="true" fence="true" form="prefix">&#x0007C;</mo><mfrac><mrow><msub><mi>y</mi><mi>i</mi></msub><mo>&#x02212;</mo><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>i</mi></msub></mrow><mrow><msub><mi>y</mi><mi>i</mi></msub></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">&#x0007C;</mo></mrow></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>yᵢ - ŷᵢ</code></td>
  <td>o resíduo da corrida <code>i</code>: quanto o modelo errou, em reais</td>
</tr>
<tr>
  <td>dividido por <code>yᵢ</code></td>
  <td>o resíduo vira uma fração do preço daquela corrida</td>
</tr>
<tr>
  <td>as barras verticais</td>
  <td>valor absoluto: jogam fora o sinal do resíduo</td>
</tr>
<tr>
  <td><code>100</code></td>
  <td>transforma a fração em porcentagem</td>
</tr>
<tr>
  <td><code>n</code></td>
  <td>o número de corridas</td>
</tr>
</tbody>
</table></div>
<p>Leia a fórmula de dentro para fora e ela vira a tabela: pegue o resíduo,
divida pelo preço real, tire o sinal, some em todas as corridas, divida
pelo número de corridas e multiplique por 100.</p>
<p>Nas 200 corridas, o MAPE do modelo dá <strong>11,2%</strong>. Repare que ele conta uma
história bem diferente do <code>R²</code> de 0,96 da próxima seção. As duas estão
certas: elas respondem perguntas diferentes.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>O cuidado com o MAPE</strong></p>
<p>Ele divide pelo valor real, então explode quando esse valor chega perto de
zero, e nem existe quando ele é zero. Numa série que passa por zero, ou em
dados que podem ser negativos, use MAE.</p>
</div></div>
<h3 id="r-quanto-da-bagunca-a-reta-explica">R²: quanto da bagunça a reta explica<a class="ancora" href="#r-quanto-da-bagunca-a-reta-explica" aria-label="Link para esta secao">#</a></h3>
<p>O <strong>R²</strong> (lê-se &quot;r ao quadrado&quot;, também chamado de coeficiente de
determinação) responde a uma pergunta diferente: de toda a variação que
existe nos preços, quanto a reta consegue explicar?</p>
<div class="formula" title="R^2 = 1 - \frac{\sum_{i=1}^{n}(y_i - \hat{y}_i)^2}{\sum_{i=1}^{n}(y_i - \bar{y})^2}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msup><mi>R</mi><mn>2</mn></msup><mo>&#x0003D;</mo><mn>1</mn><mo>&#x02212;</mo><mfrac><mrow><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mo stretchy="false">&#x00028;</mo><msub><mi>y</mi><mi>i</mi></msub><mo>&#x02212;</mo><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>i</mi></msub><msup><mo stretchy="false">&#x00029;</mo><mn>2</mn></msup></mrow><mrow><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mo stretchy="false">&#x00028;</mo><msub><mi>y</mi><mi>i</mi></msub><mo>&#x02212;</mo><mover><mrow><mi>y</mi></mrow><mo stretchy="true">&#x000AF;</mo></mover><msup><mo stretchy="false">&#x00029;</mo><mn>2</mn></msup></mrow></mfrac></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>ȳ</code></td>
  <td>o preço médio, sem usar a reta</td>
</tr>
<tr>
  <td>numerador</td>
  <td>soma dos erros da reta ao quadrado</td>
</tr>
<tr>
  <td>denominador</td>
  <td>soma dos desvios em torno de <code>ȳ</code></td>
</tr>
</tbody>
</table></div>
<p>O numerador é a soma dos erros da reta ao quadrado: o tanto que a reta
erra. O denominador é a soma dos desvios em torno da média <code>ȳ</code>, sem usar
a reta: o tanto que os preços variam sozinhos.</p>
<p><code>R²</code> varia de 0 a 1 (às vezes pode ficar negativo, para uma reta muito
ruim). Perto de 1 significa que a reta explica quase toda a variação.
Perto de 0 significa que ela não ajuda muito mais do que simplesmente
chutar a média para todo mundo.</p>
<p>No mini-exemplo, a soma dos erros ao quadrado é 0,25 + 1,00 + 0,25 = 1,5,
e a soma dos desvios em torno da média (10) é
(6-10)² + (9-10)² + (15-10)² = 16 + 1 + 25 = 42. Então
<code>R² = 1 - 1,5/42 = 0,96</code>. Essa reta explica 96% da variação dos preços
nesse mini-exemplo, um ajuste muito bom.</p>
<h3 id="quando-uma-metrica-engana">Quando uma métrica engana<a class="ancora" href="#quando-uma-metrica-engana" aria-label="Link para esta secao">#</a></h3>
<p>MAE e RMSE quase sempre andam juntos, até aparecer uma corrida fora do
padrão. Uma única corrida com um preço muito estranho (uma tarifa
dinâmica disparada, por exemplo) pesa pouco no MAE, mas pesa muito no
RMSE, porque a conta eleva esse erro ao quadrado antes de somá-lo à
média.</p>
<figure><img src="docs/assets/aula-01/mae_vs_rmse_outlier.png" alt="Gráfico de barras comparando MAE e RMSE com e sem uma corrida fora do padrão, mostrando que o RMSE cresce muito mais"><figcaption>Uma única corrida fora do padrão quase não muda o MAE, mas quase quadruplica o RMSE.</figcaption></figure>

<p>Por isso, quando o RMSE de um modelo está bem mais alto que o MAE, isso é
um sinal de que existem alguns erros grandes escondidos na média. Vale a
pena investigar quais corridas eles são.</p>
<p>O MAPE engana de outro jeito, e este é mais sutil. Separe as 200 corridas
por distância e olhe as duas métricas lado a lado:</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Faixa</th>
  <th>Corridas</th>
  <th>Preço médio</th>
  <th>MAE</th>
  <th>MAPE</th>
</tr>
</thead>
<tbody>
<tr>
  <td>até 5 km</td>
  <td>89</td>
  <td>R$ 11,32</td>
  <td>R$ 1,54</td>
  <td>15,8%</td>
</tr>
<tr>
  <td>5 a 10 km</td>
  <td>86</td>
  <td>R$ 20,37</td>
  <td>R$ 1,55</td>
  <td>8,2%</td>
</tr>
<tr>
  <td>10 a 15 km</td>
  <td>14</td>
  <td>R$ 30,92</td>
  <td>R$ 2,01</td>
  <td>6,6%</td>
</tr>
<tr>
  <td>acima de 15 km</td>
  <td>11</td>
  <td>R$ 47,45</td>
  <td>R$ 2,08</td>
  <td>4,4%</td>
</tr>
</tbody>
</table></div>
<p>Leia a coluna do MAE: o modelo erra quase o mesmo em toda faixa, entre
R$ 1,54 e R$ 2,08. Agora leia a do MAPE: ele vai de 15,8% a 4,4%, quase
quatro vezes.</p>
<p>Nenhuma das duas está mentindo. O modelo erra o mesmo tanto em reais, e
esse mesmo tanto é uma fatia bem maior de uma corrida barata. Se o seu
problema é comprar combustível, o MAE responde. Se é a percepção do
cliente sobre o preço estar certo, o MAPE responde.</p>
<h2 id="o-intervalo-de-predicao">O intervalo de predição<a class="ancora" href="#o-intervalo-de-predicao" aria-label="Link para esta secao">#</a></h2>
<p>Até aqui o modelo devolve um número: uma corrida de 8 km custa R$ 22,55. E
aí vem a pergunta honesta: a sua corrida de 8 km vai custar isso?</p>
<p>Não. Vai custar em volta disso. Olhe de novo a nuvem de pontos: para 8 km
existem corridas de R$ 19 e de R$ 26, todas de verdade. <strong>A reta acerta a
média das corridas de 8 km, e nenhuma corrida sozinha é a média.</strong></p>
<p>Um número único esconde isso. Uma faixa mostra.</p>
<h3 id="quanto-uma-corrida-se-afasta-da-reta">Quanto uma corrida se afasta da reta<a class="ancora" href="#quanto-uma-corrida-se-afasta-da-reta" aria-label="Link para esta secao">#</a></h3>
<p>Comece medindo o tamanho típico de um resíduo. Esse número se chama <strong>erro
padrão residual</strong> e costuma aparecer como <code>s</code>:</p>
<div class="formula" title="s = \sqrt{\frac{1}{n-2}\sum_{i=1}^{n}(y_i - \hat{y}_i)^2}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mi>s</mi><mo>&#x0003D;</mo><msqrt><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi><mo>&#x02212;</mo><mn>2</mn></mrow></mfrac><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mo stretchy="false">&#x00028;</mo><msub><mi>y</mi><mi>i</mi></msub><mo>&#x02212;</mo><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>i</mi></msub><msup><mo stretchy="false">&#x00029;</mo><mn>2</mn></msup></mrow></msqrt></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td>a soma</td>
  <td>os resíduos ao quadrado, os mesmos do MSE</td>
</tr>
<tr>
  <td><code>n - 2</code></td>
  <td>em vez de <code>n</code>: dois números (<code>w₀</code> e <code>w₁</code>) já foram gastos para ajustar a reta</td>
</tr>
<tr>
  <td><code>s</code></td>
  <td>o resíduo típico, em reais</td>
</tr>
</tbody>
</table></div>
<p>Nas 200 corridas, <code>s = R$ 2,02</code>. É quase o RMSE (R$ 2,01), e a diferença é
só esse <code>n - 2</code> no lugar do <code>n</code>.</p>
<h3 id="a-regra-pratica-dois-desvios-para-cada-lado">A regra prática: dois desvios para cada lado<a class="ancora" href="#a-regra-pratica-dois-desvios-para-cada-lado" aria-label="Link para esta secao">#</a></h3>
<p>Os resíduos se espalham em torno da reta, e a maioria fica a menos de dois
<code>s</code> de distância. Daí a regra:</p>
<div class="formula" title="\text{faixa} = \hat{y} \pm 2s"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mtext>faixa</mtext><mo>&#x0003D;</mo><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mi>&#x000B1;</mi><mn>2</mn><mi>s</mi></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>ŷ</code></td>
  <td>o preço que a reta previu para aquela distância</td>
</tr>
<tr>
  <td><code>2s</code></td>
  <td>R$ 4,04 nestes dados: a margem para cada lado</td>
</tr>
</tbody>
</table></div>
<p>Exemplo, para a corrida de 8 km: <code>22,55 ± 4,04</code>, ou seja, <strong>de R$ 18,51 a
R$ 26,59</strong>. Essa frase é muito mais útil que &quot;vai custar R$ 22,55&quot;, porque
ela é verdadeira.</p>
<h3 id="ela-funciona-da-para-conferir">Ela funciona? Dá para conferir<a class="ancora" href="#ela-funciona-da-para-conferir" aria-label="Link para esta secao">#</a></h3>
<p>Uma faixa que promete 95% e entrega 60% não serve para nada. Conte:</p>
<figure><img src="docs/assets/aula-01/intervalo_predicao.png" alt="À esquerda, a dispersão das 200 corridas com a reta e uma faixa em volta dela, com nove pontos em vermelho caindo fora; à direita, um zoom entre 4 e 12 km mostrando duas faixas sobrepostas, uma larga e uma bem estreita"><figcaption>191 das 200 corridas caem dentro da faixa, ou 95,5%. Era o prometido.</figcaption></figure>

<p>Nove corridas ficaram de fora, de 200. São 4,5%, e a faixa prometia deixar
5% de fora. Isso é o que se espera de uma faixa honesta, e é assim que se
confere qualquer intervalo: conte quantos ficaram dentro.</p>
<h3 id="as-duas-faixas-do-painel-da-direita">As duas faixas do painel da direita<a class="ancora" href="#as-duas-faixas-do-painel-da-direita" aria-label="Link para esta secao">#</a></h3>
<p>O painel da direita mostra duas faixas, e a diferença entre elas é o ponto
mais confundido do assunto inteiro.</p>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Pergunta</th>
  <th>Faixa</th>
  <th>Largura em 8 km</th>
</tr>
</thead>
<tbody>
<tr>
  <td>Quanto custa <strong>a sua</strong> corrida de 8 km?</td>
  <td>intervalo de <strong>predição</strong></td>
  <td>± R$ 4,00</td>
</tr>
<tr>
  <td>Quanto custa <strong>em média</strong> uma corrida de 8 km?</td>
  <td>intervalo de <strong>confiança</strong></td>
  <td>± R$ 0,31</td>
</tr>
</tbody>
</table></div>
<p>A segunda faixa é treze vezes mais estreita, e a razão é direta. Com 200
corridas, a reta já conhece bem a média: a dúvida sobre ela é pequena, e
encolhe conforme você coleta mais dados. Mas a variação entre corridas
individuais (trânsito, horário, tarifa) <strong>não encolhe nunca</strong>, por mais
dados que você junte. Ela é do mundo, não do modelo.</p>
<div class="destaque destaque-warning" role="note"><div class="destaque-icone" aria-hidden="true">!</div><div class="destaque-corpo"><p class="destaque-rotulo">Atenção</p><p><strong>Erro do dia</strong></p>
<p>Entregar a faixa estreita quando a pergunta pedia a larga. É fácil de
fazer, e o resultado é um sistema que promete R$ 22,55 ± R$ 0,31 e erra
quase toda corrida. Antes de escolher a faixa, pergunte: estou falando de
<strong>uma</strong> corrida ou da <strong>média</strong> de muitas?</p>
</div></div>
<h3 id="a-formula-completa-para-constar">A fórmula completa, para constar<a class="ancora" href="#a-formula-completa-para-constar" aria-label="Link para esta secao">#</a></h3>
<p>A regra do <code>± 2s</code> é uma simplificação boa, e vale a pena saber de onde ela
vem. A fórmula exata do intervalo de predição é:</p>
<div class="formula" title="\hat{y}_0 \pm t \cdot s \sqrt{1 + \frac{1}{n} + \frac{(x_0 - \bar{x})^2}{\sum_{i=1}^{n}(x_i - \bar{x})^2}}"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><msub><mover accent="true"><mrow><mi>y</mi></mrow><mo>&#x0005E;</mo></mover><mn>0</mn></msub><mi>&#x000B1;</mi><mi>t</mi><mo>&#x000B7;</mo><mi>s</mi><msqrt><mrow><mn>1</mn><mo>&#x0002B;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac><mo>&#x0002B;</mo><mfrac><mrow><mo stretchy="false">&#x00028;</mo><msub><mi>x</mi><mn>0</mn></msub><mo>&#x02212;</mo><mover><mrow><mi>x</mi></mrow><mo stretchy="true">&#x000AF;</mo></mover><msup><mo stretchy="false">&#x00029;</mo><mn>2</mn></msup></mrow><mrow><msubsup><mo>&#x02211;</mo><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></msubsup><mo stretchy="false">&#x00028;</mo><msub><mi>x</mi><mi>i</mi></msub><mo>&#x02212;</mo><mover><mrow><mi>x</mi></mrow><mo stretchy="true">&#x000AF;</mo></mover><msup><mo stretchy="false">&#x00029;</mo><mn>2</mn></msup></mrow></mfrac></mrow></msqrt></mrow></math></div>
<div class="tabela-rolavel"><table><thead>
<tr>
  <th>Símbolo</th>
  <th>Significado</th>
</tr>
</thead>
<tbody>
<tr>
  <td><code>x₀</code></td>
  <td>a distância da corrida que você quer prever</td>
</tr>
<tr>
  <td><code>t</code></td>
  <td>um número de tabela, perto de 2 quando há muitos dados</td>
</tr>
<tr>
  <td>a raiz</td>
  <td>quase 1 aqui, e cresce quando <code>x₀</code> foge da média das distâncias</td>
</tr>
</tbody>
</table></div>
<p>Ninguém calcula isso à mão, e você não precisa decorar. Repare só no que
ela diz: com <code>n = 200</code>, <code>t</code> vale 1,97 e a raiz vale 1,003, então o
resultado é <code>± R$ 4,00</code>. A regra prática deu <code>± R$ 4,04</code>. Quatro centavos
de diferença.</p>
<p>E repare no último termo: a faixa <strong>abre</strong> quando você prevê longe da
média das distâncias. Prever uma corrida de 60 km com dados que vão até
25 km é possível, e a fórmula avisa que a incerteza cresce. Fora da faixa
dos dados, ela deixa de avisar direito: ali não há informação nenhuma.</p>
